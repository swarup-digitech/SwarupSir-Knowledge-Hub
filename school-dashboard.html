<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087ed7"><title>School Dashboard — Swarup Sir's Knowledge Hub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;background:#2563eb;color:#fff}button.secondary{background:#e8eef8;color:#172033}button.danger{background:#dc2626}.wrap{max-width:1150px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.top h1{margin:0}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 5px 22px #0000000d;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.assignment,.school-question{border:1px solid #e3e8f0;border-radius:12px;padding:15px;margin-bottom:12px}.small{font-size:13px}.muted{color:#64748b}.tag{display:inline-block;background:#eaf1ff;color:#1d4ed8;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:600}.success{padding:12px;border-radius:10px;background:#ecfdf5;color:#166534;margin:12px 0}.notice{padding:12px;border-radius:10px;background:#fff7ed;color:#9a3412;margin:12px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.question-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.marks{font-weight:800;color:#166534;background:#ecfdf5;padding:5px 9px;border-radius:999px;font-size:13px}.upload-box{border:1px dashed #bfd0e4;border-radius:12px;padding:12px;margin-top:12px;background:#f8fafc}.upload-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.upload-item{padding:7px 9px;background:#fff;border:1px solid #dbe3ee;border-radius:9px;font-size:12px}.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:8px}.progress>div{height:100%;width:0;background:#2563eb}.hidden{display:none!important}@media(max-width:600px){.wrap{padding:12px}.top h1{font-size:21px}.grid{grid-template-columns:1fr}}

</style></head><body><div id="app"></div><script>
const SUPABASE_URL="https://jupefjdquakqsizapzbv.supabase.co",SUPABASE_KEY="sb_publishable_eUcdkv0kFJjkifHQwQBUwg_VcY_lgTP",UPLOAD_FN="upload-school-answer";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let current=null,profile=null,schoolGroupName='';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const render=x=>document.getElementById('app').innerHTML=x;
const header=title=>`<div class="top"><div><h1>${title}</h1><div class="muted small">Swarup Sir's Knowledge Hub</div></div><button class="secondary" onclick="logout()">Logout</button></div>`;
async function init(){
  try{
    if(localStorage.getItem('skh_selected_course')!=='SCHOOL'){
      location.replace('/index.html');return;
    }
    const {data:{session}}=await sb.auth.getSession();
    if(!session){location.replace('/school-login.html');return;}
    current=session.user;
    const {data:p,error}=await sb.from('profiles').select('*').eq('id',current.id).single();
    if(error||!p||p.role!=='student'||String(p.course||'').trim().toUpperCase()!=='SCHOOL'){
      await sb.auth.signOut();location.replace('/school-login.html');return;
    }
    profile=p;
    if(profile.school_group_id){
      const {data:g}=await sb.from('school_course_groups').select('name').eq('id',profile.school_group_id).maybeSingle();
      schoolGroupName=g?.name||'';
    }
    await loadStudentClasses();

    const assessmentId=new URLSearchParams(location.search).get('assessment');
    if(assessmentId){await openAssessment(assessmentId);return;}
    await schoolHome();
  }catch(e){
    render(`<div class="wrap">${header('School Dashboard')}
      <div class="card"><div class="notice"><b>Unable to open School Dashboard.</b><br>${esc(e.message||String(e))}</div>
      <div class="actions" style="margin-top:10px"><button class="secondary" onclick="location.replace('/main.html?mode=student')">← Back</button><button class="secondary" onclick="location.replace('/main.html?mode=student')">🏠 Home</button></div>
      </div></div>`);
  }
}
async function schoolHome(){
 const assessmentOnly=new URLSearchParams(location.search).get('view')==='assessments';
 const {data:assessments,error}=await sb.from('school_assessments').select('*').order('created_at',{ascending:false});
 if(error)return render(`${header('School Dashboard')}<div class="card"><div class="notice">${esc(error.message)}</div></div>`);
 const allowed=(assessments||[]).filter(a=>a.class_id&&a.school_group_id?(a.school_group_id===profile.school_group_id):a.class_id&&studentClassIds.has(a.class_id));

  // Get the actual number of questions in each assessment.
  const assessmentIds=allowed.map(a=>a.id);
  const questionCountMap=new Map();
  if(assessmentIds.length){
    const {data:questionRows,error:questionCountError}=await sb
      .from('school_questions')
      .select('assessment_id')
      .in('assessment_id',assessmentIds);
    if(questionCountError)return render(`${header('School Dashboard')}<div class="card"><div class="notice">${esc(questionCountError.message)}</div></div>`);
    for(const row of (questionRows||[])){
      questionCountMap.set(
        row.assessment_id,
        (questionCountMap.get(row.assessment_id)||0)+1
      );
    }
  }
 const cards=allowed.map(a=>`<div class="assignment"><div class="question-head"><div><h3 style="margin:0 0 5px">${esc(a.title)} <span class="tag" style="margin-left:7px;background:#ecfdf5;color:#166534">${questionCountMap.get(a.id)||0} Questions</span></h3><div class="muted">${esc(a.subject||'')}</div></div><span class="tag">${a.school_group_id?'Sub-division':'Entire class'}</span></div>${a.deadline?`<p class="small"><b>Deadline:</b> ${new Date(a.deadline).toLocaleString()}</p>`:''}<button onclick="openAssessment('${a.id}')">Open Assessment</button></div>`).join('');

 if(assessmentOnly){
   render(`<div class="wrap">${header('📝 My Assessments')}
     <div class="card"><h2>Welcome, ${esc(profile.full_name||'Student')}</h2><p class="muted">Roll No: <b>${esc(profile.roll_no||'')}</b> &nbsp; | &nbsp; School Course</p></div>
     <div class="notice">📌 ${allowed.length} assessment${allowed.length===1?'':'s'} available.</div>
     <section class="card"><h2>📝 My Assessments</h2><p class="muted">Teacher-created questions, marks, handwritten answer uploads and feedback.</p>${cards||'<div class="success"><b>No assessments available.</b></div>'}</section>
     <div class="actions"><button class="secondary" onclick="location.replace('/main.html?mode=student')">← Back</button><button class="secondary" onclick="location.replace('/main.html?mode=student')">🏠 Home</button></div>
   </div>`);
   return;
 }

 const {data:subs}=allowed.length?await sb.from('school_answer_submissions').select('assessment_id,question_id,status').eq('student_id',current.id).eq('is_current',true).in('assessment_id',allowed.map(a=>a.id)):{data:[]};
 const answered=new Set((subs||[]).map(x=>x.assessment_id));
 render(`<div class="wrap">${header('🏫 School Dashboard')}
   <div class="card"><h2>Welcome, ${esc(profile.full_name||'Student')}</h2><p class="muted">Roll No: <b>${esc(profile.roll_no||'')}</b> &nbsp; | &nbsp; School Course${schoolGroupName?` &nbsp; | &nbsp; Sub-division: <b>${esc(schoolGroupName)}</b>`:''}</p></div>
   <div class="grid"><section class="card"><h2>📚 Assignments</h2><p class="muted">Your regular MCQ/video assignments remain in the familiar student format.</p><button onclick="location.href='/main.html?mode=student&portal=SCHOOL_ASSIGNMENTS'">Open Assignments</button></section>
   <section class="card"><h2>📝 School Assessments</h2><p class="muted">Teacher-created questions, marks and answer uploads.</p>${cards||'<div class="success"><b>No assessments available.</b></div>'}</section></div>
 </div>`);
}
let studentClassIds=new Set();
async function loadStudentClasses(){
 const {data:m,error}=await sb.from('class_students').select('class_id').eq('student_id',current.id);
 if(error)throw error;
 studentClassIds=new Set((m||[]).map(x=>x.class_id));
}
async function openAssessment(id){
 const {data:a,error:ae}=await sb.from('school_assessments').select('*').eq('id',id).single();
 if(ae||!a)return alert(ae?.message||'Assessment not found.');
 if(a.school_group_id&&a.school_group_id!==profile.school_group_id)return alert('This assessment is assigned to another subdivision.');
 if(!studentClassIds.has(a.class_id))return alert('This assessment is not assigned to your class.');
 currentAssessmentId=id;currentAssessmentTitle=a.title;
 const [{data:q,error:qe},{data:subs,error:se}]=await Promise.all([
   sb.from('school_questions').select('*').eq('assessment_id',id).order('question_order'),
   sb.from('school_answer_submissions').select('id,question_id,status,awarded_marks,teacher_comment,submitted_at').eq('assessment_id',id).eq('student_id',current.id).eq('is_current',true)
 ]);
 if(qe)return alert(qe.message);if(se)return alert(se.message);
 const assessmentReviewed=(subs||[]).some(x=>x.status==='reviewed');
 const {data:files,error:fe}=subs?.length?await sb.from('school_answer_files').select('submission_id,page_no,file_name,drive_url,mime_type,file_size_bytes').in('submission_id',subs.map(x=>x.id)).order('page_no'):{data:[],error:null};
 if(fe)return alert(fe.message);
 const subMap=new Map((subs||[]).map(x=>[x.question_id,x]));
 const fileMap=new Map();
 for(const f of(files||[])){if(!fileMap.has(f.submission_id))fileMap.set(f.submission_id,[]);fileMap.get(f.submission_id).push(f)}
 render(`<div class="wrap">${header('📝 '+esc(a.title))}
   <div class="card"><div class="question-head"><div><h2 style="margin:0">${esc(a.title)}</h2><div class="muted">${esc(a.subject||'')}</div></div>
   <div class="actions"><button class="secondary" onclick="location.replace('/main.html?mode=student&portal=SCHOOL_ASSESSMENTS')">← Assessments</button><button class="secondary" onclick="location.replace('/main.html?mode=student')">🏠 Home</button></div></div>
   ${a.deadline?`<div class="notice small">Deadline: ${new Date(a.deadline).toLocaleString()}</div>`:''}
   ${assessmentReviewed?`<div class="notice"><b>🔒 Assessment reviewed.</b> Uploading is locked until the teacher reassigns this assessment.</div>`:''}</div>
   ${(q||[]).map(x=>renderQuestion(x,subMap.get(x.id),fileMap.get(subMap.get(x.id)?.id)||[],assessmentReviewed)).join('')||'<div class="card"><div class="notice">No questions have been added yet.</div></div>'}
 </div>`)
}
function renderQuestion(q,sub,files,assessmentReviewed=false){
  const key='q_'+q.id,reviewed=assessmentReviewed||sub?.status==='reviewed';

  const questionContent=q.question_image_url
    ? `<div class="question-image-wrap">
         <img class="question-image"
              src="${esc(q.question_image_url)}"
              alt="Question ${q.question_order}"
              loading="lazy"
              onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
         <div class="question-image-error" style="display:none">
           Question image could not be loaded. Please contact your teacher.
         </div>
       </div>`
    : `<div style="margin-top:8px;white-space:pre-wrap">${esc(q.question_text||'')}</div>`;

  return `<div class="card school-question">
    <div class="question-head">
      <div style="flex:1;min-width:0">
        <h3 style="margin:0">Question ${q.question_order}</h3>
        ${questionContent}
      </div>
      <span class="marks">${q.marks} Marks</span>
    </div>

    <div class="upload-box">
      <div><b>Your Answer</b> ${sub?.status==='reviewed'
        ? '<span class="tag">Reviewed</span>'
        : sub
          ? '<span class="tag">Submitted</span>'
          : '<span class="tag" style="background:#fff7ed;color:#9a3412">Not submitted</span>'}</div>

      ${files.length?`<div class="upload-list">${files.map(f=>`<a class="upload-item" target="_blank" rel="noopener" href="${esc(f.drive_url||'#')}">📄 ${esc(f.file_name)} (${formatBytes(f.file_size_bytes)})</a>`).join('')}</div>`:''}

      ${sub?.teacher_comment?`<div class="success small" style="margin-top:9px"><b>Teacher comment:</b> ${esc(sub.teacher_comment)}${sub.awarded_marks!==null?`<br><b>Marks:</b> ${sub.awarded_marks}/${q.marks}`:''}</div>`:''}

      ${reviewed
        ? `<div class="notice small" style="margin-top:10px"><b>🔒 Upload locked.</b> Your teacher must reassign the assessment before you can upload again.</div>`
        : `<input id="${key}_camera" class="hidden" type="file" accept="image/*" capture="environment" onchange="addCameraPhoto('${q.id}',event)">
           <input id="${key}_images" class="hidden" type="file" accept="image/*" multiple onchange="addGalleryImages('${q.id}',event)">
           <input id="${key}_pdf" class="hidden" type="file" accept="application/pdf,.pdf" onchange="addPdf('${q.id}',event)">
           <div class="actions" style="margin-top:10px">
             <button onclick="document.getElementById('${key}_camera').click()">📷 Take Photo</button>
             <button class="secondary" onclick="document.getElementById('${key}_images').click()">🖼️ Choose Images</button>
             <button class="secondary" onclick="document.getElementById('${key}_pdf').click()">📄 Upload PDF</button>
           </div>
           <div id="${key}_queue" class="upload-list"></div>
           <div class="actions" style="margin-top:9px">
             <button id="${key}_upload" onclick="uploadQueued('${q.id}','${esc(q.question_order)}',${Number(q.marks)||0})" disabled>⬆ Upload All</button>
             <button class="secondary" onclick="clearQueue('${q.id}')">Clear</button>
           </div>
           <div id="${key}_status" class="small muted" style="margin-top:7px"></div>
           <div id="${key}_progress" class="progress hidden"><div></div></div>`}
    </div>
  </div>`;
}
function formatBytes(n){n=Number(n||0);if(!n)return'0 B';if(n<1024)return n+' B';if(n<1024*1024)return(n/1024).toFixed(0)+' KB';return(n/1024/1024).toFixed(2)+' MB'}
const queues={};
function qstate(id){return queues[id]||(queues[id]=[])}

async function fileToCompressedJpeg(file){
 const bmp=await createImageBitmap(file,{imageOrientation:'from-image'}).catch(()=>null);
 let canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
 let w,h,img=null;
 if(bmp){w=bmp.width;h=bmp.height}else{const url=URL.createObjectURL(file);img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});w=img.naturalWidth;h=img.naturalHeight;URL.revokeObjectURL(url)}
 const maxDim=1800,scale=Math.min(1,maxDim/Math.max(w,h));
 canvas.width=Math.max(1,Math.round(w*scale));canvas.height=Math.max(1,Math.round(h*scale));
 ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
 if(bmp)ctx.drawImage(bmp,0,0,canvas.width,canvas.height);else ctx.drawImage(img,0,0,canvas.width,canvas.height);
 // Trim large white borders while keeping a small safety margin around handwriting.
 const pix=ctx.getImageData(0,0,canvas.width,canvas.height).data;const W=canvas.width,H=canvas.height;let minX=W,minY=H,maxX=-1,maxY=-1;
 const step=Math.max(1,Math.floor(Math.max(W,H)/900));
 for(let y=0;y<H;y+=step){for(let x=0;x<W;x+=step){const i=(y*W+x)*4;const r=pix[i],g=pix[i+1],b=pix[i+2];if(Math.min(r,g,b)<244 || Math.max(r,g,b)-Math.min(r,g,b)>12){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}}}
 if(maxX>=0&&maxY>=0){const pad=Math.max(20,Math.round(Math.min(W,H)*0.025));minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);maxX=Math.min(W-1,maxX+pad);maxY=Math.min(H-1,maxY+pad);const cw=maxX-minX+1,ch=maxY-minY+1;if(cw<W*.95||ch<H*.95){const crop=document.createElement('canvas');crop.width=cw;crop.height=ch;const cctx=crop.getContext('2d');cctx.fillStyle='#fff';cctx.fillRect(0,0,cw,ch);cctx.drawImage(canvas,minX,minY,cw,ch,0,0,cw,ch);canvas=crop;ctx=cctx}}
 let quality=.82,blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',quality));
 while(blob&&blob.size>950*1024&&quality>.45){quality-=.08;blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',quality))}
 while(blob&&blob.size>950*1024&&canvas.width>1000){const prev=document.createElement('canvas');prev.width=canvas.width;prev.height=canvas.height;prev.getContext('2d').drawImage(canvas,0,0);canvas.width=Math.round(prev.width*.85);canvas.height=Math.round(prev.height*.85);const cc=canvas.getContext('2d');cc.fillStyle='#fff';cc.fillRect(0,0,canvas.width,canvas.height);cc.drawImage(prev,0,0,canvas.width,canvas.height);blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.45))}
 if(blob&&blob.size>950*1024)blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.38));
 if(bmp)bmp.close();
 if(!blob)throw Error('Could not create a compressed image.');
 return new File([blob],file.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg',lastModified:Date.now()})
}
async function addCameraPhoto(id,e){const f=e.target.files?.[0];e.target.value='';if(!f)return;try{const out=await fileToCompressedJpeg(f);qstate(id).push(out);renderQueue(id)}catch(err){alert('Could not process photo: '+(err.message||err))}}
async function addGalleryImages(id,e){const fs=[...(e.target.files||[])];e.target.value='';for(const f of fs){try{qstate(id).push(await fileToCompressedJpeg(f))}catch(err){alert('Could not process '+f.name)}}renderQueue(id)}
function addPdf(id,e){const f=e.target.files?.[0];e.target.value='';if(!f)return;if(f.size>10*1024*1024)return alert('PDF is larger than 10 MB. Please reduce the PDF size and try again.');qstate(id).push(f);renderQueue(id)}
function renderQueue(id){const box=document.getElementById('q_'+id+'_queue'),btn=document.getElementById('q_'+id+'_upload');const arr=qstate(id);box.innerHTML=arr.map((f,i)=>`<span class="upload-item">${f.type==='application/pdf'?'📄':'📷'} ${esc(f.name)} · ${formatBytes(f.size)} <button type="button" style="padding:2px 6px;margin-left:4px;background:#e8eef8;color:#172033" onclick="removeQueued('${id}',${i})">×</button></span>`).join('');btn.disabled=!arr.length}
function removeQueued(id,i){qstate(id).splice(i,1);renderQueue(id)}function clearQueue(id){queues[id]=[];renderQueue(id)}
async function uploadQueued(questionId,questionOrder,maxMarks){const arr=qstate(questionId).slice();if(!arr.length)return;
 const {data:lockCheck}=await sb.from('school_answer_submissions').select('status').eq('assessment_id',currentAssessmentId).eq('student_id',current.id).eq('is_current',true);
 if((lockCheck||[]).some(x=>x.status==='reviewed')){alert('This assessment has been reviewed. Uploading is locked until your teacher reassigns it.');return;}const status=document.getElementById('q_'+questionId+'_status'),bar=document.getElementById('q_'+questionId+'_progress'),inner=bar.querySelector('div'),btn=document.getElementById('q_'+questionId+'_upload');status.textContent='Uploading…';btn.disabled=true;bar.classList.remove('hidden');inner.style.width='0%';try{for(let i=0;i<arr.length;i++){const f=arr[i];const b64=await fileToBase64(f);const nameBase=`${profile.roll_no}_${sanitizeFilePart(currentAssessmentTitle)}_Q${questionOrder}`;const ext=f.type==='application/pdf'?'.pdf':'.jpg';const fileName=arr.length===1&&ext==='.pdf'?nameBase+ext:nameBase+`_${String(i+1).padStart(2,'0')}`+ext;await callUpload({action:'uploadSchoolAnswer',assessment_id:currentAssessmentId,question_id:questionId,file_name:fileName,mime_type:f.type,base64:b64,page_no:i+1});inner.style.width=Math.round((i+1)*100/arr.length)+'%'}status.innerHTML='<span style="color:#166534"><b>Uploaded successfully.</b></span>';queues[questionId]=[];setTimeout(()=>openAssessment(currentAssessmentId),700)}catch(e){status.textContent='Upload failed: '+(e.message||String(e));btn.disabled=false}}
let currentAssessmentId='',currentAssessmentTitle='';
async function callUpload(body){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('Please login again.');const r=await fetch(`${SUPABASE_URL}/functions/v1/${UPLOAD_FN}`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`,'apikey':SUPABASE_KEY},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw Error(j.error||'Upload failed');return j}
async function fileToBase64(file){return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const s=String(r.result||'');resolve(s.includes(',')?s.split(',')[1]:s)};r.onerror=reject;r.readAsDataURL(file)})}
function sanitizeFilePart(s){return String(s||'Assessment').replace(/[\\/:*?"<>|#%{}~&]/g,'_').replace(/\s+/g,' ').trim().slice(0,90)||'Assessment'}

async function logout(){await sb.auth.signOut();localStorage.removeItem('skh_school_student');localStorage.removeItem('skh_school_roll');location.replace('/school-login.html')}
init();
</script></body></html>
