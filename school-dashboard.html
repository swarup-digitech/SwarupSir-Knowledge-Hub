<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087ed7"><title>School Dashboard — Swarup Sir's Knowledge Hub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;background:#2563eb;color:#fff}button.secondary{background:#e8eef8;color:#172033}.wrap{max-width:1150px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.top h1{margin:0}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 5px 22px #0000000d;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.assignment{border:1px solid #e3e8f0;border-radius:12px;padding:15px;margin-bottom:12px}.small{font-size:13px}.muted{color:#64748b}.tag{display:inline-block;background:#eaf1ff;color:#1d4ed8;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:600}.success{padding:12px;border-radius:10px;background:#ecfdf5;color:#166534;margin:12px 0}.notice{padding:12px;border-radius:10px;background:#fff7ed;color:#9a3412;margin:12px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button.secondary{background:#e8eef8}.school-question{border:1px solid #dbe3ee;border-radius:14px;padding:16px;margin:12px 0;background:#fff}.question-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.marks{font-weight:800;color:#166534;background:#ecfdf5;padding:5px 9px;border-radius:999px;font-size:13px}@media(max-width:600px){.wrap{padding:12px}.top h1{font-size:21px}.grid{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><script>
const SUPABASE_URL="https://jupefjdquakqsizapzbv.supabase.co",SUPABASE_KEY="sb_publishable_eUcdkv0kFJjkifHQwQBUwg_VcY_lgTP";const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let current=null,profile=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const render=x=>document.getElementById('app').innerHTML=x;const header=()=>`<div class="top"><div><h1>🏫 School Dashboard</h1><div class="muted small">Swarup Sir's Knowledge Hub</div></div><button class="secondary" onclick="logout()">Logout</button></div>`;
async function init(){if(localStorage.getItem('skh_selected_course')!=='SCHOOL'){location.replace('/index.html');return}const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('/school-login.html');return}current=session.user;const {data:p,error}=await sb.from('profiles').select('*').eq('id',current.id).single();if(error||!p||p.role!=='student'||p.course!=='SCHOOL'){await sb.auth.signOut();location.replace('/school-login.html');return}profile=p;await schoolHome()}
async function schoolHome(){const {data:links,error:le}=await sb.from('assignment_students').select('assignment_id').eq('student_id',current.id);if(le)return render(header()+`<div class="card"><div class="notice">${esc(le.message)}</div></div>`);const ids=(links||[]).map(x=>x.assignment_id);let assignments=[],attempts=[];if(ids.length){const {data:a,error:ae}=await sb.from('assignments').select('*').in('id',ids).order('created_at',{ascending:false});if(ae)return render(header()+`<div class="card"><div class="notice">${esc(ae.message)}</div></div>`);assignments=(a||[]).filter(x=>x.assignment_type!=='MOCK'&&x.assignment_type!=='mock');const {data:at,error:ate}=await sb.from('attempts').select('*').eq('student_id',current.id).in('assignment_id',ids).order('submitted_at',{ascending:false});if(ate)return render(header()+`<div class="card"><div class="notice">${esc(ate.message)}</div></div>`);attempts=at||[]}
const completedIds=new Set(attempts.map(x=>x.assignment_id));const pending=assignments.filter(a=>!completedIds.has(a.id));const completed=assignments.filter(a=>completedIds.has(a.id));const assignmentCard=(a,done)=>{const x=done?attempts.find(t=>t.assignment_id===a.id):null;const pct=x&&Number(x.total_questions)?Math.round(Number(x.score||0)*100/Number(x.total_questions)):0;const isVideo=a.assignment_type==='VIDEO'||(!a.assignment_type&&!!a.video_url);return `<div class="assignment"><div class="question-head"><div><h3 style="margin:0 0 5px">${esc(a.title)}</h3><div class="muted">${esc(a.subject||'')}</div><div style="margin-top:7px"><span class="tag">${isVideo?'MCQ + Video':'MCQ'}</span></div></div>${done?`<div class="marks">${x.score}/${x.total_questions} (${pct}%)</div>`:`<span class="tag" style="background:#ecfdf5;color:#166534">NEW</span>`}</div>${a.deadline&&!done?`<p class="small"><b>Deadline:</b> ${new Date(a.deadline).toLocaleString()}</p>`:''}${done?`<p><b>Submitted:</b> ${x.submitted_at?new Date(x.submitted_at).toLocaleString():'—'}</p><button onclick="openAssignment('${a.id}')">View My Answers</button>`:`<button onclick="openAssignment('${a.id}')">Start Assignment</button>`}</div>`};
render(`<div class="wrap">${header()}<div class="card"><h2>Welcome, ${esc(profile.full_name||'Student')}</h2><p class="muted">Roll No: <b>${esc(profile.roll_no||profile.username||'')}</b> &nbsp; | &nbsp; School Course</p></div><div class="grid"><section class="card"><h2>📚 Assignments</h2><p class="muted">Your assignments are shown here in the same familiar format used in the student area.</p><div class="tabs"><button id="tabNew" onclick="showAssignmentTab('new')">New Assignments (${pending.length})</button><button id="tabDone" class="secondary" onclick="showAssignmentTab('done')">Completed Assignments (${completed.length})</button></div><div id="newPanel">${pending.length?pending.map(a=>assignmentCard(a,false)).join(''):`<div class="success"><b>No New Assignments</b><br><span class="small">You have no pending assignments.</span></div>`}</div><div id="donePanel" style="display:none">${completed.length?completed.map(a=>assignmentCard(a,true)).join(''):`<p class="muted">No completed assignments.</p>`}</div></section><section class="card"><h2>📝 Questions</h2><p class="muted">Assessment questions and marks will appear here. The answer-upload system will be connected in the next stage.</p><div class="school-question"><div class="question-head"><div><h3 style="margin:0">Question / Assessment Area</h3><p class="muted small">Teacher-created school questions will appear here.</p></div><span class="marks">Marks</span></div><button class="secondary" disabled>📷 Upload Answer</button></div><div class="notice small"><b>Next stage:</b> camera/PDF upload, automatic image compression below 1 MB, multiple-photo upload, and Google Drive storage.</div></section></div></div>`)}
function showAssignmentTab(t){const n=document.getElementById('newPanel'),d=document.getElementById('donePanel'),nt=document.getElementById('tabNew'),dt=document.getElementById('tabDone');if(t==='done'){n.style.display='none';d.style.display='block';nt.classList.add('secondary');dt.classList.remove('secondary')}else{n.style.display='block';d.style.display='none';nt.classList.remove('secondary');dt.classList.add('secondary')}}
function openAssignment(id){localStorage.setItem('skh_selected_course','SCHOOL');location.href='/main.html?mode=student&school=1&assignment='+encodeURIComponent(id)}
async function logout(){await sb.auth.signOut();localStorage.removeItem('skh_school_student');localStorage.removeItem('skh_school_roll');location.replace('/school-login.html')}
init();
</script></body></html>
