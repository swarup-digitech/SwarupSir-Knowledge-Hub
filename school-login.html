<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087ed7"><title>School Login — Swarup Sir's Knowledge Hub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}body{min-height:100vh;background:linear-gradient(180deg,#eef8ff,#f8fcff 55%,#edf7ff);color:#0b2f57;display:flex;justify-content:center;overflow-x:hidden;position:relative}body:before{content:"";position:fixed;left:-8%;right:-8%;top:-78px;height:120px;background:#1679c9;border-radius:0 0 50% 50%;z-index:0}body:after{content:"";position:fixed;left:-8%;right:-8%;bottom:-72px;height:110px;background:#1268ad;border-radius:50% 50% 0 0;z-index:0}.page{width:min(620px,100%);min-height:100vh;padding:28px 16px 80px;position:relative;z-index:1;display:flex;align-items:center}.card{width:100%;background:#fff;border-radius:28px;padding:32px 22px 26px;box-shadow:0 14px 40px rgba(19,67,105,.15)}.brand{text-align:center;color:#07508d;font-size:29px;font-weight:800;margin:0}.welcome{text-align:center;margin:8px 0 24px}.welcome h1{margin:0 0 8px;font-size:25px}.welcome p{margin:0;color:#55728c;line-height:1.45}.selected{background:#eff6ff;border:1px solid #bfdbfe;border-radius:14px;padding:12px 14px;margin-bottom:20px}.selected b{color:#1d4ed8}.form-group{margin-bottom:15px}.form-group label{display:block;font-weight:700;margin-bottom:7px}.form-group input{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:11px;font-size:16px;outline:none}.form-group input:focus{border-color:#087ed7;box-shadow:0 0 0 3px #dbeafe}.input-wrap{position:relative}.input-wrap input{padding-right:48px}.toggle{position:absolute;right:7px;top:6px;width:38px;height:38px;border:0;background:transparent;color:#475569;cursor:pointer}.login-btn{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#087ed7,#1268ad);color:#fff;font-weight:800;font-size:17px;cursor:pointer}.change{display:inline-block;margin-top:16px;background:#e8f2fb;color:#07508d;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.msg{margin-top:14px}.notice,.success{padding:12px;border-radius:10px;font-size:14px}.notice{background:#fff7ed;color:#9a3412}.success{background:#ecfdf5;color:#166534}.footer{text-align:center;margin-top:20px;color:#55728c;font-size:13px}.footer small{display:block;margin-top:5px}@media(max-width:480px){.page{padding:20px 14px 70px}.card{padding:27px 17px 22px}.brand{font-size:25px}}
.remember{display:flex;align-items:center;gap:9px;margin:8px 0 0;font-size:14px;color:#426787}.remember input{width:18px;height:18px;flex:0 0 auto}

</head><body><main class="page"><section class="card"><h1 class="brand">Swarup Sir's Knowledge Hub</h1><div class="welcome"><h1>🏫 School Course Login</h1><p>Login with your Roll No and Password to access your school assignments and questions.</p></div><div class="selected">Selected Course: <b>School Course</b></div><form id="loginForm"><div class="form-group"><label for="rollNo">Roll No</label><input id="rollNo" type="text" inputmode="numeric" autocomplete="username" placeholder="Enter your Roll No" required></div><div class="form-group"><label for="password">Password</label><div class="input-wrap"><input id="password" type="password" autocomplete="current-password" placeholder="Enter your Password" required><button class="toggle" type="button" id="toggle">◉</button></div></div><button class="login-btn" id="loginBtn" type="submit">🔒 &nbsp; Login</button></form><label class="remember"><input id="rememberDevice" type="checkbox" checked> Remember my Roll No and Password on this device</label><div id="msg" class="msg"></div><button class="change" type="button" onclick="location.href='/index.html'">← Change Course</button><div class="footer">🛡️ Your learning. Your progress. Your success.<small>© 2026 Swarup Sir's Knowledge Hub</small></div></section></main><script>
const SUPABASE_URL="https://jupefjdquakqsizapzbv.supabase.co",SUPABASE_KEY="sb_publishable_eUcdkv0kFJjkifHQwQBUwg_VcY_lgTP",CREATE_STUDENT_FN="create-students";const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);function show(t,ok=false){$('msg').innerHTML='<div class="'+(ok?'success':'notice')+'">'+String(t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))+'</div>'}
if(localStorage.getItem('skh_selected_course')!=='SCHOOL')location.replace('/index.html');
(async()=>{try{const {data:{session}}=await sb.auth.getSession();if(!session)return;const {data:p}=await sb.from('profiles').select('role,course').eq('id',session.user.id).single();if(p?.role==='student'&&String(p.course||'').toUpperCase()==='SCHOOL'){location.replace('/main.html?mode=student&portal=SCHOOL');return}await sb.auth.signOut()}catch(_){}})();
$('toggle').onclick=()=>{const p=$('password');p.type=p.type==='password'?'text':'password'};
try{const saved=JSON.parse(localStorage.getItem('skh_saved_student_login_SCHOOL')||'null');if(saved?.roll)$('rollNo').value=saved.roll;if(saved?.password)$('password').value=saved.password;}catch{}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const roll=$('rollNo').value.trim(),password=$('password').value;if(!roll||!password)return show('Enter Roll No and Password.');$('loginBtn').disabled=true;$('loginBtn').textContent='Signing in...';try{const r=await fetch(`${SUPABASE_URL}/functions/v1/${CREATE_STUDENT_FN}`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify({action:'studentLogin',roll_no:roll,password})});const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error||'Invalid Roll No or Password.');const {error}=await sb.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token});if(error)throw error;const {data:{user}}=await sb.auth.getUser();if(!user)throw new Error('Student session could not be created.');const {data:profile}=await sb.from('profiles').select('id,full_name,roll_no,username,role,course').eq('id',user.id).single();if(!profile||profile.role!=='student')throw new Error('This account is not a student account.');
if(profile.course!=='SCHOOL')throw new Error(`This Roll No is registered for ${profile.course||'another course'}. Please choose the correct course.`);if($('rememberDevice')?.checked)localStorage.setItem('skh_saved_student_login_SCHOOL',JSON.stringify({roll:String(profile.roll_no||roll),password:password,saved_at:new Date().toISOString()}));localStorage.setItem('skh_school_student','1');localStorage.setItem('skh_school_roll',String(profile.roll_no||roll));show('Login successful. Opening School Dashboard...',true);setTimeout(()=>location.replace('/main.html?mode=student&portal=SCHOOL'),250)}catch(err){show(err.message||String(err));$('loginBtn').disabled=false;$('loginBtn').textContent='🔒  Login'}});
</script></body></html>
