<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Login — Swarup Sir's Knowledge Hub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eaf6ff,#f7fbff);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#172033}.card{background:#fff;width:min(450px,92vw);padding:30px;border-radius:20px;box-shadow:0 10px 35px #0001}.brand{color:#087ed7;font-weight:700}.muted{color:#64748b}label{display:block;font-weight:600;margin-top:15px}input,select{width:100%;padding:13px;border:1px solid #ccd5e2;border-radius:10px;margin-top:7px;font-size:16px}button{width:100%;border:0;border-radius:10px;padding:13px;background:#2563eb;color:#fff;font-size:16px;cursor:pointer;margin-top:18px}.secondary{background:#e8eef8;color:#172033}.notice{padding:11px;border-radius:10px;background:#fef2f2;color:#991b1b;margin-top:14px}</style></head><body><div class="card"><div class="brand">👨‍🏫 TEACHER PORTAL</div><h1>Teacher Login</h1><p class="muted">Choose the portal you want to open.</p><label>Teacher Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><label>Portal</label><select id="portal"><option value="JNVST-6">JNVST / Existing Dashboard</option><option value="SCHOOL">School Course Teacher Dashboard</option></select><button id="btn" onclick="login()">Login</button><button class="secondary" onclick="location.href='index.html'">Back to Course Selection</button><div id="msg"></div></div><script>const SUPABASE_URL='https://jupefjdquakqsizapzbv.supabase.co',SUPABASE_KEY='sb_publishable_eUcdkv0kFJjkifHQwQBUwg_VcY_lgTP';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);function show(t){msg.innerHTML='<div class="notice">'+t+'</div>'}async function login(){btn.disabled=true;btn.textContent='Signing in...';const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){show(error.message);btn.disabled=false;btn.textContent='Login';return}const {data:p,error:pe}=await sb.from('profiles').select('role,course').eq('id',data.user.id).single();if(pe||p?.role!=='teacher'){await sb.auth.signOut();show('This account is not a teacher account.');btn.disabled=false;btn.textContent='Login';return}const selected=portal.value;const actual=p.course||'JNVST-6';if(actual!==selected){await sb.auth.signOut();show('This teacher account is registered for '+actual+'. Please choose the correct portal.');btn.disabled=false;btn.textContent='Login';return}location.replace(selected==='SCHOOL'?'teacher-dashboard.html':'main.html')}</script></body></html>
