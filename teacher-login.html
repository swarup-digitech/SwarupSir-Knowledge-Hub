<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Login — Swarup Sir's Knowledge Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033;min-height:100vh;display:flex;align-items:center;justify-content:center}.card{background:#fff;border-radius:18px;padding:30px;box-shadow:0 8px 30px #00000012;width:min(430px,92vw)}h1{margin-top:0;font-size:32px}.muted{color:#64748b}label{display:block;margin-top:16px}input{width:100%;padding:13px;border:1px solid #ccd5e2;border-radius:10px;margin:7px 0 14px;font-size:16px}button{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;background:#2563eb;color:#fff;font-size:16px;width:100%}.secondary{background:#e8eef8;color:#172033;margin-top:10px}.notice{padding:12px;border-radius:10px;background:#fff7ed;color:#9a3412;margin:12px 0}.brand{font-weight:700;color:#2563eb}
</style>
</head>
<body>
<div class="card">
  <div class="brand">👨‍🏫 TEACHER PORTAL</div>
  <h1>Teacher Login</h1>
  <p class="muted">Teacher account login.</p>
  <form id="loginForm">
    <label for="email">Email Address</label>
    <input id="email" type="email" autocomplete="username" placeholder="Teacher email" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
    <button id="loginBtn" type="submit">Login</button>
  </form>
  <div id="msg"></div>
  <button class="secondary" type="button" onclick="location.href='student-login.html'">Student Login</button>
</div>
<script>
const SUPABASE_URL="https://jupefjdquakqsizapzbv.supabase.co";
const SUPABASE_KEY="sb_publishable_eUcdkv0kFJjkifHQwQBUwg_VcY_lgTP";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const msg=document.getElementById('msg'),btn=document.getElementById('loginBtn');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function show(t){msg.innerHTML='<div class="notice">'+esc(t)+'</div>'}
sb.auth.getSession().then(({data:{session}})=>{if(session)location.replace('index.html')});
document.getElementById('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();btn.disabled=true;btn.textContent='Signing in...';
 const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});
 if(error){show(error.message);btn.disabled=false;btn.textContent='Login';return}
 const {data:p,error:pe}=await sb.from('profiles').select('role').eq('id',data.user.id).single();
 if(pe||p?.role!=='teacher'){await sb.auth.signOut();show('This account is not a teacher account.');btn.disabled=false;btn.textContent='Login';return}
 location.replace('index.html');
});
</script>
</body></html>
