<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Login — Swarup Sir's Knowledge Hub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eaf6ff,#f7fbff);min-height:100vh;color:#172033}.page{width:min(760px,94vw);margin:auto;padding:28px 0}.card{background:#fff;padding:28px;border-radius:20px;box-shadow:0 10px 35px #0001}.brand{color:#087ed7;font-weight:800}.muted{color:#64748b}.portal-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}.portal{border:2px solid #dbe7f3;border-radius:16px;padding:20px;background:#fbfdff}.portal h2{margin:0 0 8px;color:#07508d}.portal p{color:#64748b;line-height:1.45;min-height:48px}.portal button,.login-btn{width:100%;border:0;border-radius:10px;padding:13px;background:#2563eb;color:#fff;font-size:16px;cursor:pointer;margin-top:8px}.portal.school button{background:#334155}.selected{padding:12px;border-radius:10px;background:#eff6ff;color:#174d78;margin:18px 0;font-weight:700}label{display:block;font-weight:600;margin-top:15px}input{width:100%;padding:13px;border:1px solid #ccd5e2;border-radius:10px;margin-top:7px;font-size:16px}.secondary{background:#e8eef8!important;color:#172033!important}.notice{padding:11px;border-radius:10px;background:#fef2f2;color:#991b1b;margin-top:14px}@media(max-width:650px){.portal-grid{grid-template-columns:1fr}.page{padding:14px 0}}
</style></head><body><main class="page"><div class="card"><div class="brand">👨‍🏫 TEACHER PORTAL</div><h1>Teacher Login</h1><p class="muted">Select your teacher portal.</p><div class="portal-grid"><div class="portal"><h2>📚 JNVST</h2><p>Teacher dashboard for JNVST Class VI & Class IX.</p><button onclick="selectPortal('JNVST')">Continue to JNVST</button></div><div class="portal school"><h2>🏫 School Course</h2><p>Teacher dashboard for School Course.</p><button onclick="selectPortal('SCHOOL')">Continue to School Course</button></div></div><div id="loginBox" hidden><div class="selected">Selected Portal: <span id="selectedPortal"></span></div><label for="email">Teacher Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button class="login-btn" id="btn" onclick="login()">🔒 Login</button><button class="portal button secondary" style="width:100%;border:0;border-radius:10px;padding:13px;font-size:16px;cursor:pointer;margin-top:10px" onclick="resetPortal()">← Change Portal</button><div id="msg"></div></div><button id="backBtn" class="portal button secondary" style="width:100%;border:0;border-radius:10px;padding:13px;font-size:16px;cursor:pointer;margin-top:18px" onclick="location.href='/index.html'">← Back to Course Selection</button></div></main><script>
const SUPABASE_URL='https://jupefjdquakqsizapzbv.supabase.co',SUPABASE_KEY='sb_publishable_eUcdkv0kFJjkifHQwQBUwg_VcY_lgTP';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let selectedPortal=new URLSearchParams(location.search).get('portal')==='SCHOOL'?'SCHOOL':'JNVST';const $=id=>document.getElementById(id);function show(t){$('msg').innerHTML='<div class="notice">'+String(t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))+'</div>'}function selectPortal(p){selectedPortal=p;$('selectedPortal').textContent=p==='SCHOOL'?'School Course':'JNVST';$('loginBox').hidden=false;$('backBtn').style.display='none';$('email').focus()}function resetPortal(){location.replace('/teacher-login.html')}selectPortal(selectedPortal);
async function login(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return show('Enter Teacher Email and Password.');$('btn').disabled=true;$('btn').textContent='Signing in...';try{const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;const {data:p,error:pe}=await sb.from('profiles').select('role,course').eq('id',data.user.id).single();if(pe||!p||p.role!=='teacher'){await sb.auth.signOut();throw new Error('This account is not a teacher account. Student accounts cannot access the Teacher Portal.')}localStorage.setItem('skh_teacher_portal',selectedPortal);location.replace(selectedPortal==='SCHOOL'?'/teacher-dashboard.html':'/main.html?mode=teacher&portal=JNVST')}catch(e){show(e.message||String(e));$('btn').disabled=false;$('btn').textContent='🔒 Login'}}
</script></body></html>
