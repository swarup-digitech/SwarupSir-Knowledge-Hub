<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Login — Swarup Sir's Knowledge Hub</title>
<link rel="manifest" href="/student-app.webmanifest">
<link rel="apple-touch-icon" href="/skh-icon.png">
<meta name="theme-color" content="#087ed7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SKH">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{
  min-height:100vh;
  background:linear-gradient(180deg,#eef8ff 0%,#f7fbff 55%,#edf7ff 100%);
  color:#0b2f57;
  display:flex;
  justify-content:center;
  overflow-x:hidden;
  position:relative;
}
body::before{
  content:"";
  position:fixed;left:-8%;right:-8%;top:-78px;height:120px;
  background:#1679c9;
  border-radius:0 0 50% 50%;
  z-index:0;
}
body::after{
  content:"";
  position:fixed;left:-8%;right:-8%;bottom:-72px;height:110px;
  background:#1268ad;
  border-radius:50% 50% 0 0;
  z-index:0;
}
.login-page{
  width:min(560px,100%);
  min-height:100vh;
  padding:20px 16px 72px;
  position:relative;
  z-index:1;
}
.logo-wrap{
  width:min(405px,90vw);
  height:205px;
  margin:0 auto 10px;
  border-radius:0 0 26px 26px;
  overflow:hidden;
  background:#f3fbff;
  box-shadow:0 10px 28px rgba(18,70,110,.12);
}
.logo-wrap img{
  width:100%;height:100%;object-fit:cover;display:block;
}
.welcome{text-align:center;margin:8px 0 18px}
.welcome h1{
  margin:0;
  font-size:31px;
  line-height:1.15;
  color:#07508d;
  font-weight:800;
}
.welcome p{
  margin:10px auto 0;
  max-width:440px;
  font-size:17px;
  line-height:1.45;
  color:#41688f;
}
.card{
  background:rgba(255,255,255,.97);
  border-radius:26px;
  padding:30px 20px 22px;
  box-shadow:0 12px 35px rgba(19,67,105,.14);
}
.login-title{
  margin:0 0 24px;
  text-align:center;
  font-size:26px;
  color:#07508d;
  font-weight:800;
}
.form-group{margin-bottom:16px}
label{
  display:block;
  margin:0 0 7px 2px;
  font-size:16px;
  font-weight:700;
  color:#164d7d;
}
.input-wrap{position:relative}
input{
  width:100%;
  height:59px;
  padding:0 16px;
  border:1.5px solid #b9d3ea;
  border-radius:16px;
  background:#fbfdff;
  color:#102d4b;
  font-size:17px;
  outline:none;
  transition:.2s;
}
input:focus{
  border-color:#1686df;
  box-shadow:0 0 0 4px rgba(22,134,223,.12);
}
.password-input{padding-right:52px}
.toggle-password{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  width:38px;height:38px;padding:0;border:0;background:transparent;
  color:#255b86;font-size:18px;cursor:pointer;
}
button{
  border:0;border-radius:16px;cursor:pointer;
  font-size:18px;font-weight:800;
  transition:transform .12s,box-shadow .12s,opacity .12s;
}
.login-btn{
  width:100%;height:60px;margin-top:7px;
  background:linear-gradient(135deg,#087ed7,#2b91ee);
  color:#fff;
  box-shadow:0 8px 18px rgba(20,119,205,.24);
}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(20,119,205,.28)}
.login-btn:disabled{opacity:.7;cursor:wait;transform:none}
.notice,.success{
  padding:12px 14px;border-radius:12px;margin-top:14px;
  font-size:14px;line-height:1.4;
}
.notice{background:#fff4e8;color:#a33b0b}
.success{background:#e9fbf1;color:#176b3b}
.footer{
  text-align:center;margin-top:72px;color:#fff;
  font-weight:700;font-size:15px;
  text-shadow:0 1px 2px rgba(0,0,0,.18);
}
.remember-row{display:flex;align-items:center;gap:9px;margin:2px 0 14px;color:#52718f;font-size:14px;cursor:pointer}
.remember-row input{accent-color:#087ed7}
.footer small{display:block;margin-top:8px;font-weight:400;font-size:13px}
.install-card{display:none;margin-top:16px;padding:16px;border-radius:18px;background:#eef8ff;border:1px solid #b9dff8;text-align:center;color:#164d7d}
.install-card.show{display:block}
.install-btn{width:100%;height:52px;margin-top:10px;background:#07508d;color:#fff}
.install-note{font-size:13px;line-height:1.45;margin:9px 0 0;color:#52718f}
@media(max-width:600px){
  .login-page{padding:18px 16px 65px}
  .logo-wrap{height:190px;width:min(405px,92vw)}
  .welcome h1{font-size:29px}
  .welcome p{font-size:16px}
  .card{padding:28px 20px 21px}
}
@media(max-width:390px){
  .logo-wrap{height:175px}
  .welcome h1{font-size:27px}
  .login-title{font-size:24px}
  input{height:56px}
  .login-btn{height:58px}
}
</style>
</head>

  <div class="welcome">

  <div class="card">
    <h2 class="login-title">🎓 Student Login</h2>

               name="username" name="username" autocomplete="username" placeholder="Enter your Roll No" required>
      </div>

        <label for="password">Password</label>

<script>
const SUPABASE_URL="https://jupefjdquakqsizapzbv.supabase.co";
const SUPABASE_KEY="sb_publishable_eUcdkv0kFJjkifHQwQBUwg_VcY_lgTP";
const CREATE_STUDENT_FN="create-students";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const msg=document.getElementById('msg'),btn=document.getElementById('loginBtn');
const rememberRoll=document.getElementById('rememberRoll');

try{
  const savedRoll=localStorage.getItem('skh_saved_roll');
  if(savedRoll){ rollNo.value=savedRoll; rememberRoll.checked=true; }
}catch(e){}
let deferredInstallPrompt=null;
const installCard=document.getElementById('installCard');
const installBtn=document.getElementById('installBtn');

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('/student-sw.js?v=3').catch(()=>{}));
}

window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  if(localStorage.getItem('skh_student_device_seen')==='1' && !window.matchMedia('(display-mode: standalone)').matches){
    installCard.classList.add('show');
  }
});

window.addEventListener('appinstalled',()=>{
  deferredInstallPrompt=null;
  installCard.classList.remove('show');
});

installBtn.addEventListener('click',async()=>{
  if(!deferredInstallPrompt){
    installCard.classList.add('show');
    document.querySelector('.install-note').textContent='Use your browser menu and choose “Add to Home screen” or “Install app”. The shortcut will be named SKH.';
    return;
  }
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt=null;
  installCard.classList.remove('show');
});
document.getElementById('togglePassword').addEventListener('click',()=>{
  const p=document.getElementById('password');
  const t=document.getElementById('togglePassword');
  p.type=p.type==='password'?'text':'password';
  t.textContent=p.type==='password'?'◉':'◉';
  t.setAttribute('aria-label',p.type==='password'?'Show password':'Hide password');
});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function show(t,ok=false){msg.innerHTML='<div class="'+(ok?'success':'notice')+'">'+esc(t)+'</div>'}
// STUDENT-ONLY entry point.
// A student session may continue to the application.
// A teacher session is signed out and remains on this page.
sb.auth.getSession().then(async ({data:{session}})=>{
  if(!session) return;
  const {data:p}=await sb.from("profiles").select("role").eq("id",session.user.id).single();
  if(p?.role==="student"){
    location.replace("/index.html");
  }else{
    await sb.auth.signOut();
  }
});
document.getElementById('loginForm').addEventListener('submit',async e=>{
 e.preventDefault(); const roll=rollNo.value.trim(),pw=password.value;
 if(!roll||!pw)return show('Enter Roll No and Password.');
 btn.disabled=true;btn.textContent='Signing in...';
 try{
   const res=await fetch(`${SUPABASE_URL}/functions/v1/${CREATE_STUDENT_FN}`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify({action:'studentLogin',roll_no:roll,password:pw})});
   const j=await res.json().catch(()=>({}));
   if(!res.ok||j.error)throw new Error(j.error||'Invalid Roll No or Password.');
   const {error}=await sb.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token});
   if(error)throw error;
   const {data:{user}}=await sb.auth.getUser();
   if(!user)throw new Error('Student session could not be created.');
    const firstLoginOnThisDevice=localStorage.getItem('skh_student_device_seen')!=='1';
    localStorage.setItem('skh_student_device_seen','1');
   show('Login successful. Opening Student Dashboard...',true);
    if(firstLoginOnThisDevice && deferredInstallPrompt && !window.matchMedia('(display-mode: standalone)').matches){
      installCard.classList.add('show');
      installBtn.textContent='📱 Add SKH to Home Screen';
      setTimeout(async()=>{
        if(!deferredInstallPrompt)return;
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt=null;
        installCard.classList.remove('show');
        setTimeout(()=>location.replace('/index.html'),250);
      },300);
    }else{
      setTimeout(()=>location.replace('/index.html'),250);
    }
 }catch(err){show(err.message||String(err));btn.disabled=false;btn.textContent='Login'}
});
</script>
