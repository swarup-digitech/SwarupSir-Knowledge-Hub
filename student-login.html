<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon-192.png" type="image/png">
<title>Student Login — Swarup Sir's Knowledge Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">let deferredInstallPrompt=null;const INSTALL_KEY="sskh_student_install_prompt_v1";function standalone(){return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;}function ios(){return /iphone|ipad|ipod/i.test(navigator.userAgent);}if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e;});window.addEventListener("appinstalled",()=>localStorage.setItem(INSTALL_KEY,"installed"));function maybeShowInstall(){if(standalone()||localStorage.getItem(INSTALL_KEY))return;const box=document.getElementById("installBox");if(box)box.style.display="block";const b=document.getElementById("installBtn");if(b)b.onclick=async()=>{if(deferredInstallPrompt){deferredInstallPrompt.prompt();const c=await deferredInstallPrompt.userChoice.catch(()=>null);deferredInstallPrompt=null;if(c?.outcome==="accepted")localStorage.setItem(INSTALL_KEY,"installed");}else if(ios())alert("Tap Share, then choose “Add to Home Screen”.");else alert("Use your browser menu or address-bar install icon and choose “Install” or “Add to Home Screen”.");};}</script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033;min-height:100vh;display:flex;align-items:center;justify-content:center}.card{background:#fff;border-radius:18px;padding:30px;box-shadow:0 8px 30px #00000012;width:min(430px,92vw)}h1{margin-top:0;font-size:32px}.muted{color:#64748b}label{display:block;margin-top:16px}input{width:100%;padding:13px;border:1px solid #ccd5e2;border-radius:10px;margin:7px 0 14px;font-size:16px}button{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;background:#2563eb;color:#fff;font-size:16px;width:100%}.secondary{background:#e8eef8;color:#172033;margin-top:10px}.notice{padding:12px;border-radius:10px;background:#fff7ed;color:#9a3412;margin:12px 0}.success{padding:12px;border-radius:10px;background:#ecfdf5;color:#166534;margin:12px 0}.brand{font-weight:700;color:#2563eb}
</style>
</head>
<body>
<div class="card">
  <div class="brand">🎓 STUDENT PORTAL</div>
  <h1>Student Login</h1>
  <p class="muted">Login using your Roll No and Password.</p>
  <form id="loginForm">
    <label for="rollNo">Roll No</label>
    <input id="rollNo" type="text" inputmode="numeric" autocomplete="username" placeholder="Enter your Roll No" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Enter your Password" required>
    <button id="loginBtn" type="submit">Login</button>
  </form>
  <div id="msg"></div><div id="installBox" style="display:none;margin-top:14px" class="success"><b>Add Knowledge Hub to your home screen</b><p class="small" style="margin:6px 0">Install the student portal for quick access.</p><button id="installBtn" type="button">＋ Add to Home Screen</button></div>
  <button class="secondary" type="button" onclick="location.href='teacher-login.html'">Teacher Login</button>
</div>
<script>
const SUPABASE_URL="https://jupefjdquakqsizapzbv.supabase.co";
const SUPABASE_KEY="sb_publishable_eUcdkv0kFJjkifHQwQBUwg_VcY_lgTP";
const CREATE_STUDENT_FN="create-students";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const msg=document.getElementById('msg'),btn=document.getElementById('loginBtn');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function show(t,ok=false){msg.innerHTML='<div class="'+(ok?'success':'notice')+'">'+esc(t)+'</div>'}
// If already signed in, go straight to the main application.
sb.auth.getSession().then(({data:{session}})=>{if(session)maybeShowInstall(); setTimeout(()=>location.replace('index.html'),1200)});
document.getElementById('loginForm').addEventListener('submit',async e=>{
 e.preventDefault(); const roll=rollNo.value.trim(),pw=password.value;
 if(!roll||!pw)return show('Enter Roll No and Password.');
 btn.disabled=true;btn.textContent='Signing in...';
 try{
   const res=await fetch(`${SUPABASE_URL}/functions/v1/${CREATE_STUDENT_FN}`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify({action:'studentLogin',roll_no:roll,password:pw})});
   const j=await res.json().catch(()=>({}));
   if(!res.ok||j.error)throw new Error(j.error||'Invalid Roll No or Password.');
   const {error}=await sb.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token});
   if(error)throw error;
   const {data:{user}}=await sb.auth.getUser();
   if(!user)throw new Error('Student session could not be created.');
   show('Login successful. Opening Student Dashboard...',true);
   setTimeout(()=>location.replace('index.html'),250);
 }catch(err){show(err.message||String(err));btn.disabled=false;btn.textContent='Login'}
});
</script>
</body></html>
