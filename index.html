<body><div id="app"></div>
<script>
const SUPABASE_URL="https://jupefjdquakqsizapzbv.supabase.co";
const SUPABASE_KEY="sb_publishable_eUcdkv0kFJjkifHQwQBUwg_VcY_lgTP";
const CREATE_STUDENT_FN="create-students";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let current=null,profile=null,active=null,answers=[],videoDone=false;
let bulkStudents=[], importedQuestions=[], importedAnswers={};

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const render=x=>document.getElementById("app").innerHTML=x;
const header=t=>`<div class="top"><h1>${t}</h1><button class="secondary" onclick="logout()">Logout</button></div>`;
const message=(t,ok=false)=>`<div class="${ok?'success':'notice'}">${esc(t)}</div>`;
function embed(v){if(v.includes("youtube.com/embed/"))return v;let m=v.match(/[?&]v=([^&]+)/)||v.match(/youtu\.be\/([^?]+)/);return m?"https://www.youtube.com/embed/"+m[1]:v}

async function init(){
  const mode=new URLSearchParams(location.search).get("mode");
  window.loginMode=mode==="student"?"student":mode==="teacher"?"teacher":"chooser";
  const {data:{session}}=await sb.auth.getSession();
  if(!session){
    if(window.loginMode==="student") return studentLoginPage();
    if(window.loginMode==="teacher") return teacherLoginPage();
    return login();
  }
  current=session.user;
  const {data:p,error}=await sb.from("profiles").select("*").eq("id",current.id).single();
  if(error||!p){
    await sb.auth.signOut();
    if(window.loginMode==="student") return studentLoginPage();
    if(window.loginMode==="teacher") return teacherLoginPage();
    return login();
  }
  profile=p;
  if(p.role==="teacher") return teacherHome();
  if(p.role==="student") return studentHome();
  return login();
}
function login(){
  window.loginMode="chooser";
  render(`<div class="wrap"><div class="card login" style="text-align:center"><h1>Swarup Sir's Knowledge Hub</h1><p class="muted">Choose your login</p><div class="actions" style="display:grid;gap:12px"><button onclick="studentLoginPage()" style="width:100%;font-size:17px;padding:14px">🎓 Student Login</button><button class="secondary" onclick="teacherLoginPage()" style="width:100%;font-size:17px;padding:14px">👨‍🏫 Teacher Login</button></div></div></div>`);
}
function studentLoginPage(){
  window.loginMode="student";
  render(`<div class="wrap"><div class="card login"><h1>🎓 Student Login</h1><p class="muted">Login using your Roll No and Password.</p><label>Roll No</label><input id="rollNo" type="text" inputmode="numeric" autocomplete="username" placeholder="Enter Roll No"><label>Password</label><input id="studentPassword" type="password" autocomplete="current-password" placeholder="Enter Password"><button onclick="doStudentLogin()">Login</button><div id="msg"></div></div></div>`);
}
function teacherLoginPage(){
  window.loginMode="teacher";
  render(`<div class="wrap"><div class="card login"><h1>👨‍🏫 Teacher Login</h1><p class="muted">Teacher account login.</p><label>Email address</label><input id="email" type="email" autocomplete="username" placeholder="Teacher email"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button onclick="doTeacherLogin()">Login</button><div id="msg"></div><div class="actions"><button class="secondary" onclick="login()">← Login Choice</button></div></div></div>`);
}
async function doStudentLogin(){
  const roll=rollNo.value.trim(),pw=studentPassword.value;
  if(!roll||!pw){msg.innerHTML=message("Enter Roll No and Password.");return}
  try{
    const res=await fetch(`${SUPABASE_URL}/functions/v1/${CREATE_STUDENT_FN}`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY},body:JSON.stringify({action:"studentLogin",roll_no:roll,password:pw})});
    const j=await res.json().catch(()=>({}));
    if(!res.ok||j.error){msg.innerHTML=message(j.error||"Invalid Roll No or Password.");return}
    const {error:e}=await sb.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token});
    if(e){msg.innerHTML=message(e.message);return}
    current=(await sb.auth.getUser()).data.user;
    const {data:p,error:pe}=await sb.from("profiles").select("*").eq("id",current.id).single();
    if(pe||!p||p.role!=="student"){await sb.auth.signOut();msg.innerHTML=message("This is not a student account.");return}
    profile=p;window.loginMode="student";studentHome();
  }catch(e){msg.innerHTML=message(e.message||String(e))}
}
async function doTeacherLogin(){
  const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});
  if(error){msg.innerHTML=message(error.message);return}
  current=data.user;
  const {data:p,error:e}=await sb.from("profiles").select("*").eq("id",current.id).single();
  if(e||!p){await sb.auth.signOut();msg.innerHTML=message("Login worked, but no profile exists for this user.");return}
  profile=p;
  if(p.role!=="teacher"){await sb.auth.signOut();msg.innerHTML=message("This account is not a teacher account.");return}
  window.loginMode="teacher";teacherHome();
}
async function doLogin(){return doTeacherLogin()}
async function logout(){
  const wasStudent = profile?.role === "student" || window.loginMode === "student";
  const wasTeacher = profile?.role === "teacher" || window.loginMode === "teacher";

  await sb.auth.signOut();

  current = null;
  profile = null;
  active = null;
  answers = [];
  videoDone = false;

  // Students always return to the standalone student login page.
  if (wasStudent) {
    window.location.replace("/student-login.html");
    return;
  }

  // Teachers return to the teacher login page.
  if (wasTeacher) {
    window.location.replace("/teacher-login.html");
    return;
  }

  window.location.replace("/teacher-login.html");
}


async function teacherHome(){
 const [{data:classes,error:ce},{data:assignments,error:ae},{data:students,error:se}]=await Promise.all([
   sb.from("classes").select("*").eq("teacher_id",current.id).order("created_at",{ascending:false}),
   sb.from("assignments").select("*").eq("created_by",current.id).order("created_at",{ascending:false}),
   sb.from("profiles").select("*").eq("role","student").order("full_name")
 ]);
 if(ce||ae||se)return render(`<div class="wrap">${header("Teacher Dashboard")}<div class="card">${message((ce||ae||se).message)}</div></div>`);
 render(`<div class="wrap">${header("Teacher Dashboard")}
 <div class="grid"><div class="card"><div class="muted">Classes</div><div class="stat">${classes?.length||0}</div></div><div class="card"><div class="muted">Students</div><div class="stat">${students?.length||0}</div></div><div class="card"><div class="muted">Assignments</div><div class="stat">${assignments?.length||0}</div></div></div>
 <div class="card"><div class="actions"><button onclick="newClass()">+ New Class</button><button onclick="addStudent()">+ Add Student</button><button onclick="bulkImportStudents()">↑ Bulk Students (Excel)</button><button onclick="newAssignment()">+ New Video Assignment</button><button onclick="downloadAllResultsExcel()">⬇ All Results (Excel)</button><button onclick="bulkImportMCQs()">↑ Import MCQs (PDF / Image)</button><button onclick="manageStudentAccounts()">👥 Student Accounts</button></div></div>
 <div class="card"><h2>Students</h2>${(students||[]).map(s=>`<div class="assignment"><b>${esc(s.full_name)}</b><div class="muted small">${esc(s.username||"")}</div></div>`).join("")||"<p class='muted'>No students yet.</p>"}</div>
 <div class="card"><h2>Classes</h2>${(classes||[]).map(c=>`<div class="assignment"><h3>${esc(c.name)}</h3><p>${esc(c.description||"")}</p></div>`).join("")||"<p class='muted'>No classes yet.</p>"}</div>
 <div class="card"><h2>Assignments</h2>${(assignments||[]).map(a=>`<div class="assignment"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap"><div><h3>${esc(a.title)}</h3><p class="muted">${esc(a.subject||"")}</p></div><span class="tag">${a.deadline?`Deadline: ${new Date(a.deadline).toLocaleDateString()}`:"Active"}</span></div><div class="actions"><button onclick="viewAssignment('${a.id}')">View</button><button onclick="reassignAssignment('${a.id}')">Assign / Reassign</button><button onclick="reassignFresh('${a.id}')">↻ Reassign Fresh</button><button class="secondary" onclick="results('${a.id}')">Results</button><button class="danger" onclick="deleteAssignment('${a.id}')">Delete</button></div></div>`).join("")||"<p class='muted'>No assignments yet.</p>"}</div></div>`);
}
async function deleteAssignment(assignmentId){
 const {data:a,error}=await sb.from("assignments").select("id,title").eq("id",assignmentId).eq("created_by",current.id).single();
 if(error||!a)return alert(error?.message||"Assignment not found.");
 if(!confirm(`Delete "${a.title}"?\\n\\nThis will permanently remove the assignment, questions, student assignments, attempts and submitted answers.`))return;
 try{
   const {data:ats,error:ae}=await sb.from("attempts").select("id").eq("assignment_id",assignmentId);if(ae)throw ae;
   const attemptIds=(ats||[]).map(x=>x.id);
   if(attemptIds.length){
     const {error:e}=await sb.from("answers").delete().in("attempt_id",attemptIds);if(e)throw e;
     const {error:e2}=await sb.from("attempts").delete().eq("assignment_id",assignmentId);if(e2)throw e2;
   }
   const {error:e3}=await sb.from("assignment_students").delete().eq("assignment_id",assignmentId);if(e3)throw e3;
   const {error:e4}=await sb.from("questions").delete().eq("assignment_id",assignmentId);if(e4)throw e4;
   const {error:e5}=await sb.from("assignments").delete().eq("id",assignmentId).eq("created_by",current.id);if(e5)throw e5;
   alert("Assignment deleted successfully.");teacherHome();
 }catch(e){alert("Could not delete assignment.\\n\\n"+(e.message||e)+"\\n\\nIf this is an RLS policy error, run teacher_management.sql in Supabase.")}
}
async function reassignFresh(assignmentId){
 const {data:a,error}=await sb.from("assignments").select("id,title").eq("id",assignmentId).eq("created_by",current.id).single();
 if(error||!a)return alert(error?.message||"Assignment not found.");
 if(!confirm(`Reassign "${a.title}" as a FRESH assignment?\\n\\nPrevious attempts and answers will be deleted, and students can take it again as a new attempt.`))return;
 try{
   const {data:ats,error:ae}=await sb.from("attempts").select("id").eq("assignment_id",assignmentId);if(ae)throw ae;
   const ids=(ats||[]).map(x=>x.id);
   if(ids.length){
     const {error:e}=await sb.from("answers").delete().in("attempt_id",ids);if(e)throw e;
     const {error:e2}=await sb.from("attempts").delete().eq("assignment_id",assignmentId);if(e2)throw e2;
   }
   alert("Previous attempts cleared. Now choose the class/students for the fresh assignment.");
   reassignAssignment(assignmentId);
 }catch(e){alert("Could not clear previous attempts.\\n\\n"+(e.message||e)+"\\n\\nIf this is an RLS policy error, run teacher_management.sql in Supabase.")}
}

async function reassignAssignment(assignmentId){
 const [{data:a,error:ae},{data:classes,error:ce}]=await Promise.all([
   sb.from("assignments").select("*").eq("id",assignmentId).eq("created_by",current.id).single(),
   sb.from("classes").select("id,name").eq("teacher_id",current.id).order("name")
 ]);
 if(ae)return alert(ae.message); if(ce)return alert(ce.message);
 if(!classes?.length)return alert("Create a class first.");
 const {data:existing,error:ee}=await sb.from("assignment_students").select("student_id").eq("assignment_id",assignmentId);
 if(ee)return alert(ee.message);
 const existingIds=new Set((existing||[]).map(x=>x.student_id));
 const initialClass=a.class_id && classes.some(c=>c.id===a.class_id)?a.class_id:classes[0].id;
 render(`<div class="wrap">${header("Assign / Reassign Assignment")}<div class="card">
   <h2>${esc(a.title)}</h2><p class="muted">Assign an existing video/MCQ assignment to a whole class or selected students. Existing recipients will be replaced.</p>
   <label>Class / Group</label><select id="rac" onchange="loadReassignStudents('${assignmentId}',this.value)">${classes.map(c=>`<option value="${c.id}" ${c.id===initialClass?'selected':''}>${esc(c.name)}</option>`).join("")}</select>
   <div class="card" style="background:#f8fafc"><h3>Assign To</h3>
    <label><input type="radio" name="reassignMode" value="class" checked onchange="toggleReassignStudents('${assignmentId}')" style="width:auto;margin-right:8px">Entire class</label>
    <label><input type="radio" name="reassignMode" value="students" onchange="toggleReassignStudents('${assignmentId}')" style="width:auto;margin-right:8px">Selected students</label>
    <div id="reassignStudentPicker" class="small muted">All students in the selected class will receive this assignment.</div>
   </div>
   <div class="actions"><button onclick="saveReassignment('${assignmentId}')">Save Assignment</button><button class="secondary" onclick="teacherHome()">Cancel</button></div>
 </div></div>`);
 window._reassignExistingIds=existingIds;
}
async function loadReassignStudents(assignmentId,classId){
 const box=document.getElementById("reassignStudentPicker"); if(!box)return;
 if(document.querySelector('input[name="reassignMode"]:checked')?.value!=="students"){
   box.innerHTML='<div class="small muted">All students in the selected class will receive this assignment.</div>'; return;
 }
 box.innerHTML='<div class="small muted">Loading students...</div>';
 const {data:members,error}=await sb.from("class_students").select("student_id").eq("class_id",classId);
 if(error){box.innerHTML=message(error.message);return;}
 const ids=(members||[]).map(x=>x.student_id); if(!ids.length){box.innerHTML='<div class="notice">No students are in this class.</div>';return;}
 const {data:students,error:e}=await sb.from("profiles").select("id,full_name,username").in("id",ids).order("full_name");
 if(e){box.innerHTML=message(e.message);return;}
 const oldIds=window._reassignExistingIds||new Set();
 box.innerHTML=`<div class="actions" style="margin-bottom:8px"><button type="button" class="secondary" onclick="document.querySelectorAll('.reassign-student').forEach(x=>x.checked=true)">Select all</button><button type="button" class="secondary" onclick="document.querySelectorAll('.reassign-student').forEach(x=>x.checked=false)">Clear all</button></div>`+
 (students||[]).map(s=>`<label style="display:block;padding:6px 0"><input class="reassign-student" type="checkbox" value="${s.id}" ${oldIds.has(s.id)?'checked':''} style="width:auto;margin-right:8px"><b>${esc(s.full_name)}</b> <span class="muted small">${esc(s.username||'')}</span></label>`).join("");
}
async function toggleReassignStudents(assignmentId){loadReassignStudents(assignmentId,document.getElementById("rac")?.value);}
async function saveReassignment(assignmentId){
 const classId=document.getElementById("rac")?.value;if(!classId)return alert("Select a class.");
 try{
   const mode=document.querySelector('input[name="reassignMode"]:checked')?.value||"class";
   let studentIds=[];
   if(mode==="class"){
     const {data:members,error}=await sb.from("class_students").select("student_id").eq("class_id",classId);if(error)throw error;
     studentIds=(members||[]).map(x=>x.student_id);
   }else{
     studentIds=[...document.querySelectorAll(".reassign-student:checked")].map(x=>x.value);
   }
   studentIds=[...new Set(studentIds)];if(!studentIds.length)return alert("Select at least one student or choose Entire class.");
   const {error:de}=await sb.from("assignment_students").delete().eq("assignment_id",assignmentId);if(de)throw de;
   const rows=studentIds.map(student_id=>({assignment_id:assignmentId,student_id}));
   const {error:ins}=await sb.from("assignment_students").insert(rows);if(ins)throw ins;
   const {error:up}=await sb.from("assignments").update({class_id:classId}).eq("id",assignmentId).eq("created_by",current.id);if(up)throw up;

function cropWhiteMargins(sourceCanvas){
 const ctx=sourceCanvas.getContext("2d",{willReadFrequently:true}); const w=sourceCanvas.width,h=sourceCanvas.height;
 const data=ctx.getImageData(0,0,w,h).data; const threshold=248; let minX=w,minY=h,maxX=-1,maxY=-1;
 for(let y=0;y<h;y++){ for(let x=0;x<w;x++){ const i=(y*w+x)*4,r=data[i],g=data[i+1],b=data[i+2],a=data[i+3]; if(a>10&&(r<threshold||g<threshold||b<threshold)){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;} } }
 if(maxX<0)return sourceCanvas; const pad=Math.max(12,Math.round(Math.min(w,h)*.018)); minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);maxX=Math.min(w-1,maxX+pad);maxY=Math.min(h-1,maxY+pad);
 const out=document.createElement("canvas");out.width=maxX-minX+1;out.height=maxY-minY+1;out.getContext("2d").drawImage(sourceCanvas,minX,minY,out.width,out.height,0,0,out.width,out.height);return out;
}

function parseQuestionText(text,pageNo){
 const clean=text.replace(/\s+/g," ").trim();
 const qmatch=clean.match(/^(?:Question\s*\d+\s*[:.)-]?\s*)?(.*?)(?=\s+A[.)]\s)/i);
 const q=qmatch?qmatch[1].trim():clean;
 const parts=clean.split(/\s+(?=[A-D][.)]\s)/i),opts={A:"",B:"",C:"",D:""};
 parts.forEach(part=>{const m=part.match(/^([A-D])[.)]\s*(.*)$/i);if(m)opts[m[1].toUpperCase()]=m[2].trim()});
 return {page:pageNo,question:q,A:opts.A,B:opts.B,C:opts.C,D:opts.D,image_mode:false}
}

  rows.forEach(x=>{const n=Number(x["Question No"]??x["Question Number"]??x.No),a=String(x["Correct Option"]??x.Answer??"").trim().toUpperCase();if(n&&["A","B","C","D"].includes(a))importedAnswers[n]=a});
  document.getElementById("mcqPreview").innerHTML=message(`Loaded ${Object.keys(importedAnswers).length} answer keys.`,true)
 }catch(err){document.getElementById("mcqPreview").innerHTML=message("Could not read answer Excel: "+err.message)}};r.readAsArrayBuffer(file)
}

async function results(id){

  if(te)throw te;

  if(ids.length){const {data:p,error}=await sb.from("profiles").select("id,full_name,roll_no").in("id",ids);if(error)throw error;profiles=p||[]}
  if(attemptIds.length){const {data:ar,error}=await sb.from("answers").select("attempt_id,question_id,selected_option,is_correct").in("attempt_id",attemptIds);if(error)throw error;answerRows=ar||[]}
  window._resultData={assignment:a,questions:qs||[],attempts:ats||[],profiles:new Map(profiles.map(p=>[p.id,p])),answers:new Map(answerRows.map(x=>[`${x.attempt_id}:${x.question_id}`,x])),sortBy:"submitted",sortDir:"desc"};

 }catch(e){alert("Could not load results: "+(e.message||e))}

function renderResultsPage(){
 const d=window._resultData;if(!d)return;
 const sorted=[...d.attempts].sort((x,y)=>{
  let a,b;
  if(d.sortBy==="student"){a=(d.profiles.get(x.student_id)?.full_name||"").toLowerCase();b=(d.profiles.get(y.student_id)?.full_name||"").toLowerCase()}
  else if(d.sortBy==="score"){a=Number(x.score||0)/Math.max(1,Number(x.total_questions||d.questions.length));b=Number(y.score||0)/Math.max(1,Number(y.total_questions||d.questions.length))}
  else if(d.sortBy==="attempt"){a=Number(x.attempt_number||1);b=Number(y.attempt_number||1)}
  else {a=x.submitted_at?new Date(x.submitted_at).getTime():0;b=y.submitted_at?new Date(y.submitted_at).getTime():0}
  return (a===b?0:a<b?-1:1)*(d.sortDir==="asc"?1:-1);
 });
 const avg=sorted.length?Math.round(sorted.reduce((n,x)=>n+Number(x.score||0)*100/Math.max(1,Number(x.total_questions||d.questions.length)),0)/sorted.length):0;
 render(`<div class="wrap">${header("Results")}<div class="card">
 <div style="display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap"><div><h2>${esc(d.assignment.title)}</h2><div class="muted">${esc(d.assignment.subject||"")}</div></div><div class="tag">${sorted.length} submission${sorted.length===1?"":"s"} • Average ${avg}%</div></div>
 <div class="result-controls actions"><b>Sort:</b><select id="resultSortBy"><option value="submitted" ${d.sortBy==="submitted"?"selected":""}>Submission time</option><option value="student" ${d.sortBy==="student"?"selected":""}>Student name</option><option value="score" ${d.sortBy==="score"?"selected":""}>Score</option><option value="attempt" ${d.sortBy==="attempt"?"selected":""}>Attempt number</option></select><select id="resultSortDir"><option value="desc" ${d.sortDir==="desc"?"selected":""}>Descending</option><option value="asc" ${d.sortDir==="asc"?"selected":""}>Ascending</option></select><button onclick="applyResultSort()">Apply</button><button onclick="downloadAssignmentResultsExcel('${d.assignment.id}')">⬇ Download Results Excel</button><button class="secondary" onclick="teacherHome()">← Back</button></div>
 ${sorted.length?sorted.map(at=>{const p=d.profiles.get(at.student_id)||{},total=Number(at.total_questions||d.questions.length),score=Number(at.score||0),wrong=Math.max(0,total-score);return `<div class="result-student"><div class="result-student-head"><div><h3>${esc(p.full_name||"Student")}</h3><div class="muted small">Roll No: ${esc(p.roll_no||"—")} • Attempt ${esc(at.attempt_number||1)} • ${at.submitted_at?new Date(at.submitted_at).toLocaleString():"—"}</div></div><div class="result-score"><b>${score}/${total}</b><span>${total?Math.round(score*100/total):0}%</span></div></div><div class="result-questions">${d.questions.map((q,i)=>{const ans=d.answers.get(`${at.id}:${q.id}`),selected=ans?.selected_option||"—",correct=q.correct_option||"—",ok=ans?.is_correct===true||(selected!=="—"&&selected===correct);return `<div class="result-question"><div class="result-qno">Q${q.question_order||i+1}</div><div class="result-answer"><span>Your: <b>${esc(selected)}</b></span><span>Key: <b>${esc(correct)}</b></span></div><div class="${ok?"result-correct":"result-wrong"}">${ok?"✓":"✗"}</div></div>`}).join("")}</div><div class="result-summary"><span>Total: <b>${total}</b></span><span class="result-correct">✓ Correct: <b>${score}</b></span><span class="result-wrong">✗ Wrong: <b>${wrong}</b></span><span>Video: <b>${at.video_completed?"Yes":"No"}</b></span><button class="danger" onclick="deleteStudentAttempt('${at.id}','${esc(p.full_name||"Student")}')">Delete This Attempt</button></div></div>`}).join(""):`<div class="success"><b>No submissions yet.</b></div>`}
 </div></div>`);
}

function applyResultSort(){

async function deleteStudentAttempt(attemptId,studentName){

async function downloadAssignmentResultsExcel(assignmentId){
  try{
    const {data:a,error:ae}=await sb.from("assignments").select("id,title").eq("id",assignmentId).single();
    if(ae||!a) throw new Error(ae?.message||"Assignment not found.");

    const {data:qs,error:qe}=await sb.from("questions")
      .select("id,question_order,correct_option")
      .eq("assignment_id",assignmentId).order("question_order");
    if(qe) throw new Error(qe.message);

    const {data:ats,error:te}=await sb.from("attempts")
      .select("id,student_id,score,total_questions,submitted_at,attempt_number")
      .eq("assignment_id",assignmentId).order("submitted_at",{ascending:true});
    if(te) throw new Error(te.message);

    const ids=[...new Set((ats||[]).map(x=>x.student_id))];
    let profiles=[];
    if(ids.length){
      const {data:p,error:pe}=await sb.from("profiles")
        .select("id,full_name,roll_no").in("id",ids);
      if(pe) throw new Error(pe.message);
      profiles=p||[];
    }

    const attemptIds=(ats||[]).map(x=>x.id);
    let answerRows=[];
    if(attemptIds.length){
      const {data:ar,error:are}=await sb.from("answers")
        .select("attempt_id,question_id,selected_option").in("attempt_id",attemptIds);
      if(are) throw new Error(are.message);
      answerRows=ar||[];
    }

    const pm=new Map(profiles.map(p=>[p.id,p]));
    const am=new Map(answerRows.map(x=>[`${x.attempt_id}:${x.question_id}`,x]));

    const rows=(ats||[]).map(at=>{
      const p=pm.get(at.student_id)||{};
      const row={
        "Student Name":p.full_name||at.student_id,
        "Roll No":p.roll_no||"",
        "Assignment Name":a.title,
        "Score":at.score,
        "Total Questions":at.total_questions,
        "Submitted":at.submitted_at?new Date(at.submitted_at).toLocaleString():"",
        "Attempt No":at.attempt_number||1
      };
      (qs||[]).forEach((q,i)=>{
        const n=q.question_order||i+1;
        const ans=am.get(`${at.id}:${q.id}`);
        row[`Q${n} Option`]=ans?.selected_option||"";
        row[`Q${n} Answer Key`]=q.correct_option||"";
      });
      row["Total Marks"]=at.score;
      return row;
    });

    if(!rows.length){ alert("No student submissions are available for this assignment yet."); return; }

    const ws=XLSX.utils.json_to_sheet(rows);
    ws["!cols"]=Object.keys(rows[0]).map(k=>({wch:Math.max(12,Math.min(28,k.length+3))}));
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Results");
    const safe=(a.title||"Assignment Results").replace(/[\\/:*?"<>|]+/g,"_").slice(0,80);
    XLSX.writeFile(wb,`${safe}_Results.xlsx`);
  }catch(e){ alert("Could not download results: "+(e.message||e)); }
}

async function watchCompletedVideo(assignmentId){
  try{
    const {data:a,error}=await sb.from("assignments").select("*").eq("id",assignmentId).single();
    if(error||!a)throw new Error(error?.message||"Assignment not found.");
    render(`<div class="wrap">${header("Watch Video")}
      <div class="card">
        <h2>${esc(a.title)}</h2>
        ${a.subject?`<p class="muted">${esc(a.subject)}</p>`:""}
        ${a.video_url?`<iframe class="video" src="${esc(embed(a.video_url))}" allowfullscreen></iframe>`:`<div class="notice">No video is available for this assignment.</div>`}
        <div class="actions" style="margin-top:15px">
          <button class="secondary" onclick="studentHome()">← Back to My Assignments</button>
        </div>
      </div>
    </div>`)
  }catch(e){
    alert("Could not load video: "+(e.message||e));
  }
}

async function viewPreviousWork(assignmentId,attemptId){
 const {data:a,error:ae}=await sb.from("assignments").select("*").eq("id",assignmentId).single();if(ae||!a)return alert(ae?.message||"Assignment not found.");
 const {data:at,error:te}=await sb.from("attempts").select("*").eq("id",attemptId).eq("student_id",current.id).single();if(te||!at)return alert(te?.message||"Submission not found.");
 const {data:ans,error:anErr}=await sb.from("answers").select("*").eq("attempt_id",attemptId);if(anErr)return alert(anErr.message);
 const qids=(ans||[]).map(x=>x.question_id);let qs=[];if(qids.length){const {data:q,error:qe}=await sb.from("questions").select("*").in("id",qids);if(qe)return alert(qe.message);qs=q||[]}
 const qm=new Map(qs.map(q=>[q.id,q]));const ordered=(ans||[]).map(x=>({x,q:qm.get(x.question_id)})).sort((a,b)=>(a.q?.question_order??999999)-(b.q?.question_order??999999));
 render(`<div class="wrap">${header("Previous Work")}<div class="card"><h2>${esc(a.title)}</h2><p><b>Score:</b> ${at.score}/${at.total_questions}</p><p><b>Submitted:</b> ${at.submitted_at?new Date(at.submitted_at).toLocaleString():"—"}</p></div><div class="card"><h2>My Answers</h2>${ordered.map(({x,q},i)=>{const opts={A:q?.option_a,B:q?.option_b,C:q?.option_c,D:q?.option_d};const selectedText=opts[x.selected_option]??x.selected_option??"—";const correctText=opts[q?.correct_option]??q?.correct_option??"—";return `<div class="assignment"><h3>Question ${i+1}</h3>${q?.image_url?`<div class="question-image-wrap"><img class="question-image" src="${esc(q.image_url)}" alt="Question ${i+1}"></div>`:`<p><b>${esc(q?.question_text||"Question unavailable")}</b></p>`}<p><b>Your answer:</b> ${esc(x.selected_option||"—")}${q?.image_url?"":". "+esc(selectedText)}</p>${x.is_correct?`<div class="success"><b>Correct answer ✓</b></div>`:`<div class="notice"><b>Wrong answer ✗</b><br>Correct answer: <b>${esc(q?.correct_option||"—")}${q?.image_url?"":". "+esc(correctText)}</b></div>`}</div>`}).join("")||"<p class='muted'>No answer details found.</p>"}</div><button class="secondary" onclick="studentHome()">← Back to Assignments</button></div>`)
}
async function startLesson(id){
  const {data:a,error}=await sb.from("assignments").select("*").eq("id",id).single();
  if(error)return alert(error.message);

  const {data:existing,error:ae}=await sb.from("attempts")
    .select("id").eq("assignment_id",id).eq("student_id",current.id).limit(1);

  if(ae)return alert("Could not check submission status: "+ae.message);

  if(existing?.length){
    alert("Already Submitted. You have already submitted this assignment.\n\nYour teacher can reassign it as a fresh assignment if you need to take it again.");
    return studentHome();
  }

  active=a;
  videoDone=false;
  answers=[];
  window.quizIndex=0;
  lesson();
}
function lesson(){render(`<div class="wrap">${header(esc(active.title))}<div class="card"><p class="muted">${esc(active.subject||"")}</p>${active.video_url?`<iframe class="video" src="${esc(embed(active.video_url))}" allowfullscreen></iframe>`:""}<div class="notice">Watch the lesson, then continue to the questions.</div><button onclick="videoWatched()">${active.video_url?"Video watched — Continue to Questions":"Continue to Questions"}</button></div></div>`)}
async function videoWatched(){videoDone=true;const {data:qs,error}=await sb.from("questions").select("*").eq("assignment_id",active.id).order("question_order");if(error)return alert(error.message);active.questions=qs||[];quiz()}
function quiz(){
 if(!active.questions?.length)return alert("No questions are available for this assignment.");
 const total=active.questions.length,currentIndex=window.quizIndex||0,q=active.questions[currentIndex],image=q.image_url;
 render(`<div class="exam-shell"><div class="exam-top"><button class="secondary" onclick="studentHome()">← Back</button><h2>Question ${currentIndex+1} of ${total}</h2><span class="tag">${answers.filter(Boolean).length}/${total} Answered</span></div><div class="exam-grid"><main class="exam-main"><div class="card question-card"><div class="question-number">Question ${currentIndex+1}</div>${image?`<div class="question-image-wrap"><img class="question-image" src="${esc(image)}" alt="Question ${currentIndex+1}"></div>`:`<div class="question-text">${esc(q.question_text)}</div>`}<div class="answer-heading">Choose Your Answer</div><div class="circle-choice-row" role="radiogroup" aria-label="Choose your answer">${["A","B","C","D"].map(o=>`<button type="button" class="circle-choice ${answers[currentIndex]===o?"selected":""}" aria-label="Option ${o}" aria-pressed="${answers[currentIndex]===o}" onclick="choose(${currentIndex},'${o}')">${o}</button>`).join("")}</div></div><div class="exam-nav"><button class="secondary" ${currentIndex===0?"disabled":""} onclick="goQuestion(${currentIndex-1})">← Previous</button>${currentIndex<total-1?`<button onclick="goQuestion(${currentIndex+1})">Next →</button>`:`<button onclick="submitQuiz()">✓ Submit Test</button>`}</div></main><aside class="palette card"><h3>Question Palette</h3><div class="palette-grid">${active.questions.map((_,i)=>`<button class="palette-btn ${i===currentIndex?"current":""} ${answers[i]?"answered":""}" onclick="goQuestion(${i})">${i+1}</button>`).join("")}</div><div class="small muted" style="margin-top:16px"><div>🟩 Answered</div><div>🔵 Current</div><div>⬜ Not Answered</div></div></aside></div></div>`);
}
function goQuestion(i){window.quizIndex=Math.max(0,Math.min(i,active.questions.length-1));quiz()}
function choose(i,v){answers[i]=v;quiz()}
async function submitQuiz(){
  if(answers.length<active.questions.length)return alert("Please answer every question.");

  const {data:existing,error:checkError}=await sb.from("attempts")
    .select("id").eq("assignment_id",active.id).eq("student_id",current.id).limit(1);

  if(checkError)return alert("Could not check submission status: "+checkError.message);

  if(existing?.length){
    alert("Already Submitted. This assignment can only be submitted once.");
    return studentHome();
  }

  const score=active.questions.reduce((n,q,i)=>n+(answers[i]===q.correct_option?1:0),0);

  const {data:attempt,error}=await sb.from("attempts").insert({
    assignment_id:active.id,
    student_id:current.id,
    score,
    total_questions:active.questions.length,
    video_completed:videoDone,
    submitted_at:new Date().toISOString(),
    attempt_number:1
  }).select().single();

  if(error){
    if(error.code==="23505"){
      alert("Already Submitted. This assignment can only be submitted once.");
      return studentHome();
    }
    return alert(error.message);
  }

  const rows=active.questions.map((q,i)=>({
    attempt_id:attempt.id,
    question_id:q.id,
    selected_option:answers[i],
    is_correct:answers[i]===q.correct_option
  }));

  const {error:e}=await sb.from("answers").insert(rows);

  if(e){
    await sb.from("attempts").delete().eq("id",attempt.id);
    return alert(e.message);
  }

  render(`<div class="wrap">${header("Assignment Completed")}<div class="card" style="text-align:center">
    <div class="stat">${score} / ${active.questions.length}</div>
    <h2>${score===active.questions.length?"Excellent!":"Well done!"}</h2>
    <div class="success"><b>Submitted</b><br>Your assignment has been submitted successfully. You cannot submit it again unless your teacher reassigns it as a fresh assignment.</div>
    <div class="actions" style="justify-content:center;margin-top:12px">
      <button onclick="viewPreviousWork('${active.id}','${attempt.id}')">View My Answers</button>
      <button class="secondary" onclick="studentHome()">Back to Assignments</button>
    </div>
  </div></div>`)
}
init().catch(e=>render(`<div class="wrap"><div class="card"><h2>Unable to start</h2><p>${esc(e.message||e)}</p></div></div>`));
</script></body></html>
