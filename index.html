<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose Course — Swarup Sir's Knowledge Hub</title>
<meta name="theme-color" content="#087ed7">
<link rel="manifest" href="/student-app.webmanifest">
<link rel="apple-touch-icon" href="/skh-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SKH">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}body{min-height:100vh;background:linear-gradient(180deg,#eef8ff 0%,#f8fcff 55%,#edf7ff 100%);color:#0b2f57;display:flex;justify-content:center;overflow-x:hidden;position:relative}body:before{content:"";position:fixed;left:-8%;right:-8%;top:-78px;height:120px;background:#1679c9;border-radius:0 0 50% 50%;z-index:0}body:after{content:"";position:fixed;left:-8%;right:-8%;bottom:-72px;height:110px;background:#1268ad;border-radius:50% 50% 0 0;z-index:0}.page{width:min(620px,100%);min-height:100vh;padding:28px 16px 80px;position:relative;z-index:1;display:flex;align-items:center}.card{width:100%;background:rgba(255,255,255,.98);border-radius:28px;padding:32px 22px 26px;box-shadow:0 14px 40px rgba(19,67,105,.15)}.brand{text-align:center;color:#07508d;font-size:29px;font-weight:800;margin:0}.subtitle{text-align:center;color:#41688f;font-size:17px;line-height:1.45;margin:10px auto 26px}.course{display:block;width:100%;text-align:left;background:#fff;border:2px solid #d9eaf7;border-radius:18px;padding:18px 18px;margin:12px 0;cursor:pointer;color:#0b2f57;transition:.15s;box-shadow:0 5px 14px rgba(18,70,110,.06)}.course:hover{border-color:#087ed7;transform:translateY(-1px)}.course .num{display:inline-flex;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;background:#087ed7;color:#fff;font-weight:800;margin-right:10px}.course .title{font-size:18px;font-weight:800;color:#07508d}.course .desc{display:block;margin:8px 0 0 44px;color:#55728c;font-size:14px;line-height:1.4}.footer{text-align:center;margin-top:20px;color:#55728c;font-size:13px}.footer small{display:block;margin-top:5px}@media(max-width:480px){.page{padding:20px 14px 70px}.card{padding:27px 17px 22px}.brand{font-size:25px}.subtitle{font-size:16px}.course{padding:16px}.course .title{font-size:17px}}
.install-card{display:none;margin-top:16px;padding:16px;border-radius:18px;background:#eef8ff;border:1px solid #b9dff8;text-align:center;color:#164d7d}.install-card.show{display:block}.install-btn{width:100%;height:52px;margin-top:10px;background:#07508d;color:#fff}.install-note{font-size:13px;line-height:1.45;margin:9px 0 0;color:#52718f}.remember{display:flex;align-items:center;gap:9px;margin:4px 0 15px;font-size:14px;color:#426787}.remember input{width:18px;height:18px;flex:0 0 auto}
</style>
</head>
<body><main class="page"><section class="card">
<h1 class="brand">Swarup Sir's Knowledge Hub</h1>
<p class="subtitle">Choose your course to continue</p>
<button class="course" onclick="choose('JNVST-6')"><span class="num">1</span><span class="title">JNVST-6</span><span class="desc">Navodaya Selection Test for Class VI</span></button>
<button class="course" onclick="choose('JNVST-9')"><span class="num">2</span><span class="title">JNVST-9</span><span class="desc">Navodaya Selection Test for Class IX</span></button>
<button class="course" onclick="choose('SCHOOL')"><span class="num">3</span><span class="title">School Course</span><span class="desc">School-based learning and assessments</span></button>
<div id="installCard" class="install-card">
  <b>📱 Add SKH to your Home Screen</b>
  <div class="install-note">Install the app for quicker access. On iPhone/iPad use Share → Add to Home Screen.</div>
  <button id="installBtn" class="install-btn" type="button">Add to Home Screen</button>
</div>
<div class="footer">🛡️ Your learning. Your progress. Your success.<small>© 2026 Swarup Sir's Knowledge Hub</small></div>
</section></main>
<script>
let deferredInstallPrompt=null;
const installCard=document.getElementById('installCard'),installBtn=document.getElementById('installBtn');
const standalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/student-sw.js').catch(()=>{}));}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;if(!standalone()&&localStorage.getItem('skh_student_pwa_seen')!=='1'){installCard?.classList.add('show');}});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;localStorage.setItem('skh_student_pwa_seen','1');installCard?.classList.remove('show');});
window.addEventListener('DOMContentLoaded',()=>{const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);if((ios||!('BeforeInstallPromptEvent' in window))&&!standalone()&&localStorage.getItem('skh_student_pwa_seen')!=='1'){installCard?.classList.add('show');}});
installBtn?.addEventListener('click',async()=>{
  if(deferredInstallPrompt){deferredInstallPrompt.prompt();const choice=await deferredInstallPrompt.userChoice.catch(()=>null);deferredInstallPrompt=null;if(choice?.outcome==='accepted')localStorage.setItem('skh_student_pwa_seen','1');installCard?.classList.remove('show');}
  else {installCard?.classList.add('show');if(installCard?.querySelector('.install-note')) installCard.querySelector('.install-note').textContent='Use your browser menu and choose “Add to Home screen” or “Install app”. On iPhone/iPad use Share → Add to Home Screen.';}
});
function choose(course){localStorage.setItem('skh_selected_course',course);if(course==='SCHOOL'){location.href='/school-login.html';return}location.href='/student-login.html?course='+encodeURIComponent(course)}
</script>
</body></html>
