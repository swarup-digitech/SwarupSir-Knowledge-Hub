<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">async function bulkStudents(){
  const file=document.getElementById("studentExcel")?.files?.[0];
  if(!file){alert("Please select an Excel file.");return;}
  try{
    const data=await file.arrayBuffer();
    const wb=XLSX.read(data,{type:"array"});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
    if(!raw.length) throw new Error("The Excel file is empty.");

    const norm=v=>String(v??"").trim();
    const headers=raw[0].map(x=>norm(x).toLowerCase().replace(/\s+/g," "));
    const findHeader=(...names)=>{
      for(const n of names){const i=headers.indexOf(n);if(i>=0)return i;}
      return -1;
    };
    const nameCol=findHeader("name","student name");
    const rollCol=findHeader("roll no","roll number","roll_no");
    const classCol=findHeader("class","class name");
    const passCol=findHeader("password");

    if([nameCol,rollCol,classCol,passCol].some(i=>i<0))
      throw new Error("Excel must contain: Name, Roll No, Class, Password.");

    const rows=raw.slice(1).map((r,idx)=>({
      excelRow:idx+2,name:norm(r[nameCol]),roll_no:norm(r[rollCol]),
      class_name:norm(r[classCol]),password:norm(r[passCol])
    })).filter(r=>r.name||r.roll_no||r.class_name||r.password);

    if(!rows.length)throw new Error("No student rows were found.");

    const seen=new Set(), problems=[];
    rows.forEach(r=>{
      const key=`${r.class_name.toLowerCase()}|${r.roll_no.toLowerCase()}`;
      if(!r.name)problems.push(`Row ${r.excelRow}: Name is missing.`);
      if(!r.roll_no)problems.push(`Row ${r.excelRow}: Roll No is missing.`);
      if(!r.class_name)problems.push(`Row ${r.excelRow}: Class is missing.`);
      if(!r.password)problems.push(`Row ${r.excelRow}: Password is missing.`);
      if(r.password&&r.password.length<6)problems.push(`Row ${r.excelRow}: Password must be at least 6 characters.`);
      if(r.roll_no&&r.class_name&&seen.has(key))problems.push(`Row ${r.excelRow}: Duplicate Roll No ${r.roll_no} in class ${r.class_name}.`);
      if(r.roll_no&&r.class_name)seen.add(key);
    });
    if(problems.length){
      document.getElementById("bulkPreview").innerHTML=`<div class="error"><b>Please correct these errors:</b><br>${problems.map(x=>esc(x)).join("<br>")}</div>`;
      return;
    }

    const {data:classes,error:ce}=await sb.from("classes").select("id,name").eq("teacher_id",profile.id);
    if(ce)throw new Error(ce.message);
    const cm=new Map((classes||[]).map(c=>[String(c.name).trim().toLowerCase(),c]));
    const missing=[...new Set(rows.map(r=>r.class_name))].filter(n=>!cm.has(n.toLowerCase()));
    if(missing.length){
      document.getElementById("bulkPreview").innerHTML=`<div class="error">These classes were not found:<br>${missing.map(esc).join("<br>")}</div>`;
      return;
    }
    rows.forEach(r=>r.class_id=cm.get(r.class_name.toLowerCase()).id);
    window.pendingBulkStudents=rows;

    let table=`<div class="success">Loaded ${rows.length} student rows.</div><div style="overflow:auto;margin-top:12px"><table><thead><tr><th>#</th><th>Name</th><th>Roll No</th><th>Class</th><th>Password</th></tr></thead><tbody>`;
    rows.forEach((r,i)=>table+=`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${esc(r.roll_no)}</td><td>${esc(r.class_name)}</td><td>${esc(r.password)}</td></tr>`);
    table+=`</tbody></table></div><div class="actions" style="margin-top:14px"><button onclick="createBulkStudents()">Create All Students</button><button class="secondary" onclick="teacherHome()">← Home</button><button class="secondary" onclick="history.back()">← Back</button></div>`;
    document.getElementById("bulkPreview").innerHTML=table;
  }catch(e){alert("Excel reading failed: "+(e.message||e));}
}

async function createBulkStudents(){
  const rows=window.pendingBulkStudents||[];
  if(!rows.length){alert("Please load an Excel file first.");return;}
  if(!confirm(`Create ${rows.length} student account(s)?`))return;
  try{
    const result=await callTeacherFn({action:"createStudents",students:rows.map(r=>({name:r.name,roll_no:r.roll_no,class_id:r.class_id,password:r.password}))});
    const ok=result.results?.filter(x=>x.success).length??0;
    const failed=result.results?.filter(x=>!x.success).length??0;
    document.getElementById("bulkPreview").innerHTML=`<div class="success">${ok} student(s) created successfully.</div>${failed?`<div class="error" style="margin-top:10px">${failed} row(s) failed.</div>`:""}<div class="actions" style="margin-top:14px"><button onclick="manageStudentAccounts()">Student Accounts</button><button class="secondary" onclick="teacherHome()">← Home</button></div>`;
    window.pendingBulkStudents=[];
  }catch(e){alert("Could not create students: "+(e.message||e));}
}

</script>

 <div class="card"><h2>Students</h2>${(students||[]).map(s=>`<div class="assignment"><b>${esc(s.full_name)}</b><div class="muted small">${esc(s.username||"")}</div></div>`).join("")||"<p class='muted'>No students yet.</p>"}</div>

async function reassignAssignment(assignmentId){
 const [{data:a,error:ae},{data:classes,error:ce}]=await Promise.all([
   sb.from("assignments").select("*").eq("id",assignmentId).eq("created_by",current.id).single(),
   sb.from("classes").select("id,name").eq("teacher_id",current.id).order("name")
 ]);
 if(ae)return alert(ae.message); if(ce)return alert(ce.message);
 if(!classes?.length)return alert("Create a class first.");
 const {data:existing,error:ee}=await sb.from("assignment_students").select("student_id").eq("assignment_id",assignmentId);
 if(ee)return alert(ee.message);
 const existingIds=new Set((existing||[]).map(x=>x.student_id));
 const initialClass=a.class_id && classes.some(c=>c.id===a.class_id)?a.class_id:classes[0].id;
 render(`<div class="wrap">${header("Assign / Reassign Assignment")}<div class="card">
   <h2>${esc(a.title)}</h2><p class="muted">Assign an existing video/MCQ assignment to a whole class or selected students. Existing recipients will be replaced.</p>
   <label>Class / Group</label><select id="rac" onchange="loadReassignStudents('${assignmentId}',this.value)">${classes.map(c=>`<option value="${c.id}" ${c.id===initialClass?'selected':''}>${esc(c.name)}</option>`).join("")}</select>
   <div class="card" style="background:#f8fafc"><h3>Assign To</h3>
    <label><input type="radio" name="reassignMode" value="class" checked onchange="toggleReassignStudents('${assignmentId}')" style="width:auto;margin-right:8px">Entire class</label>
    <label><input type="radio" name="reassignMode" value="students" onchange="toggleReassignStudents('${assignmentId}')" style="width:auto;margin-right:8px">Selected students</label>
    <div id="reassignStudentPicker" class="small muted">All students in the selected class will receive this assignment.</div>
   </div>
   <div class="actions"><button onclick="saveReassignment('${assignmentId}')">Save Assignment</button><button class="secondary" onclick="teacherHome()">Cancel</button></div>
 </div></div>`);
 window._reassignExistingIds=existingIds;
}
async function loadReassignStudents(assignmentId,classId){
 const box=document.getElementById("reassignStudentPicker"); if(!box)return;
 if(document.querySelector('input[name="reassignMode"]:checked')?.value!=="students"){
   box.innerHTML='<div class="small muted">All students in the selected class will receive this assignment.</div>'; return;
 }
 box.innerHTML='<div class="small muted">Loading students...</div>';
 const {data:members,error}=await sb.from("class_students").select("student_id").eq("class_id",classId);
 if(error){box.innerHTML=message(error.message);return;}
 const ids=(members||[]).map(x=>x.student_id); if(!ids.length){box.innerHTML='<div class="notice">No students are in this class.</div>';return;}
 const {data:students,error:e}=await sb.from("profiles").select("id,full_name,username").in("id",ids).order("full_name");
 if(e){box.innerHTML=message(e.message);return;}
 const oldIds=window._reassignExistingIds||new Set();
 box.innerHTML=`<div class="actions" style="margin-bottom:8px"><button type="button" class="secondary" onclick="document.querySelectorAll('.reassign-student').forEach(x=>x.checked=true)">Select all</button><button type="button" class="secondary" onclick="document.querySelectorAll('.reassign-student').forEach(x=>x.checked=false)">Clear all</button></div>`+
 (students||[]).map(s=>`<label style="display:block;padding:6px 0"><input class="reassign-student" type="checkbox" value="${s.id}" ${oldIds.has(s.id)?'checked':''} style="width:auto;margin-right:8px"><b>${esc(s.full_name)}</b> <span class="muted small">${esc(s.username||'')}</span></label>`).join("");
}
async function toggleReassignStudents(assignmentId){loadReassignStudents(assignmentId,document.getElementById("rac")?.value);}
async function saveReassignment(assignmentId){
 const classId=document.getElementById("rac")?.value; if(!classId)return alert("Select a class.");
 let studentIds=[];
 try{
   const mode=document.querySelector('input[name="reassignMode"]:checked')?.value||"class";
   if(mode==="class"){
     const {data:members,error}=await sb.from("class_students").select("student_id").eq("class_id",classId);
     if(error)throw error; studentIds=(members||[]).map(x=>x.student_id);
   }else{
     studentIds=[...document.querySelectorAll(".reassign-student:checked")].map(x=>x.value);
   }
   studentIds=[...new Set(studentIds)]; if(!studentIds.length)return alert("Select at least one student or choose Entire class.");
   const {error:de}=await sb.from("assignment_students").delete().eq("assignment_id",assignmentId); if(de)throw de;
   const rows=studentIds.map(student_id=>({assignment_id:assignmentId,student_id}));
   const {error:ins}=await sb.from("assignment_students").insert(rows); if(ins)throw ins;
   const {error:up}=await sb.from("assignments").update({class_id:classId}).eq("id",assignmentId).eq("created_by",current.id); if(up)throw up;
   alert(`Assignment assigned to ${rows.length} student${rows.length===1?'':'s'}.`); teacherHome();
 }catch(e){alert("Could not update assignment: "+(e.message||e));}
}

 if(!session) throw new Error("Teacher session expired. Please log in again.");
 const res=await fetch(`${SUPABASE_URL}/functions/v1/${CREATE_STUDENT_FN}`,{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${session.access_token}`,"apikey":SUPABASE_KEY},body:JSON.stringify(body)});
 const j=await res.json().catch(()=>({}));
 if(!res.ok) throw new Error(j.error||"Request failed");
 return j;
}

async function deleteStudentAccount(studentId,name){
  if(!confirm(`Delete student account for ${name}?\n\nThis permanently removes the student's login account and classroom membership. This cannot be undone.`)) return;
  const confirmation=prompt(`Type DELETE to permanently delete ${name}:`);
  if(confirmation!=="DELETE") return;
  try{
    await callTeacherFn({action:"deleteStudent",student_id:studentId});
    alert(`Student account deleted: ${name}`);
    manageStudentAccounts();
  }catch(e){ alert("Could not delete student: "+(e.message||e)); }
}

async function readMCQPdf(ev){
 const file=ev.target.files[0];if(!file)return;const buf=await file.arrayBuffer();
 const pdfjs=window.pdfjsLib; // module may not expose; fallback dynamic import below
 try{
   const mod=await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs");
   const pdf=await mod.getDocument({data:buf}).promise;let arr=[];
   for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p),content=await page.getTextContent();const text=content.items.map(i=>i.str).join(" ");arr.push(parseQuestionText(text,p))}
   importedQuestions=arr;document.getElementById("mcqPreview").innerHTML=message(`Read ${arr.length} question pages.`,true)
 }catch(e){document.getElementById("mcqPreview").innerHTML=message("PDF reading failed: "+e.message)}
}
function parseQuestionText(text,pageNo){
 const clean=text.replace(/\s+/g," ").trim();
 const qmatch=clean.match(/^(?:Question\s*\d+\s*[:.)-]?\s*)?(.*?)(?=\s+A[.)]\s)/i);
 const q=qmatch?qmatch[1].trim():clean;
 const parts=clean.split(/\s+(?=[A-D][.)]\s)/i);
 const opts={A:"",B:"",C:"",D:""};parts.forEach(part=>{const m=part.match(/^([A-D])[.)]\s*(.*)$/i);if(m)opts[m[1].toUpperCase()]=m[2].trim()});
 return {page:pageNo,question:q, A:opts.A,B:opts.B,C:opts.C,D:opts.D}
}

}

async function downloadAssignmentResultsExcel(assignmentId){
  try{
    const {data:a,error:ae}=await sb.from("assignments").select("id,title").eq("id",assignmentId).single();
    if(ae||!a) throw new Error(ae?.message||"Assignment not found.");

    const {data:qs,error:qe}=await sb.from("questions")
      .select("id,question_order,correct_option")
      .eq("assignment_id",assignmentId).order("question_order");
    if(qe) throw new Error(qe.message);

    const {data:ats,error:te}=await sb.from("attempts")
      .select("id,student_id,score,total_questions,submitted_at,attempt_number")
      .eq("assignment_id",assignmentId).order("submitted_at",{ascending:true});
    if(te) throw new Error(te.message);

    const ids=[...new Set((ats||[]).map(x=>x.student_id))];
    let profiles=[];
    if(ids.length){
      const {data:p,error:pe}=await sb.from("profiles")
        .select("id,full_name,roll_no").in("id",ids);
      if(pe) throw new Error(pe.message);
      profiles=p||[];
    }

    const attemptIds=(ats||[]).map(x=>x.id);
    let answerRows=[];
    if(attemptIds.length){
      const {data:ar,error:are}=await sb.from("answers")
        .select("attempt_id,question_id,selected_option").in("attempt_id",attemptIds);
      if(are) throw new Error(are.message);
      answerRows=ar||[];
    }

    const pm=new Map(profiles.map(p=>[p.id,p]));
    const am=new Map(answerRows.map(x=>[`${x.attempt_id}:${x.question_id}`,x]));

    const rows=(ats||[]).map(at=>{
      const p=pm.get(at.student_id)||{};
      const row={
        "Student Name":p.full_name||at.student_id,
        "Roll No":p.roll_no||"",
        "Assignment Name":a.title,
        "Score":at.score,
        "Total Questions":at.total_questions,
        "Submitted":at.submitted_at?new Date(at.submitted_at).toLocaleString():"",
        "Attempt No":at.attempt_number||1
      };
      (qs||[]).forEach((q,i)=>{
        const n=q.question_order||i+1;
        const ans=am.get(`${at.id}:${q.id}`);
        row[`Q${n} Option`]=ans?.selected_option||"";
        row[`Q${n} Answer Key`]=q.correct_option||"";
      });
      row["Total Marks"]=at.score;
      return row;
    });

    if(!rows.length){ alert("No student submissions are available for this assignment yet."); return; }

    const ws=XLSX.utils.json_to_sheet(rows);
    ws["!cols"]=Object.keys(rows[0]).map(k=>({wch:Math.max(12,Math.min(28,k.length+3))}));
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Results");
    const safe=(a.title||"Assignment Results").replace(/[\\/:*?"<>|]+/g,"_").slice(0,80);
    XLSX.writeFile(wb,`${safe}_Results.xlsx`);
  }catch(e){ alert("Could not download results: "+(e.message||e)); }
}

    if(studentIds.length){
      const {data:p,error:pe}=await sb.from("profiles")
        .select("id,full_name,roll_no").in("id",studentIds);
      if(pe) throw new Error(pe.message);
      profiles=p||[];
    }

    const attemptIds=(ats||[]).map(x=>x.id);
    let answerRows=[];
    if(attemptIds.length){
      const {data:ar,error:are}=await sb.from("answers")
        .select("attempt_id,question_id,selected_option").in("attempt_id",attemptIds);
      if(are) throw new Error(are.message);
      answerRows=ar||[];
    }

    const pm=new Map(profiles.map(p=>[p.id,p]));
    const am=new Map(answerRows.map(x=>[`${x.attempt_id}:${x.question_id}`,x]));
    const asm=new Map(as.map(a=>[a.id,a]));

    const rows=(ats||[]).map(at=>{
      const p=pm.get(at.student_id)||{}, a=asm.get(at.assignment_id)||{};
      const row={
        "Student Name":p.full_name||at.student_id,
        "Roll No":p.roll_no||"",
        "Assignment Name":a.title||"",
        "Score":at.score,
        "Total Questions":at.total_questions,
        "Submitted":at.submitted_at?new Date(at.submitted_at).toLocaleString():"",
        "Attempt No":at.attempt_number||1
      };
      (qs||[]).filter(q=>q.assignment_id===at.assignment_id).forEach((q,i)=>{
        const n=q.question_order||i+1, ans=am.get(`${at.id}:${q.id}`);
        row[`Q${n} Option`]=ans?.selected_option||"";
        row[`Q${n} Answer Key`]=q.correct_option||"";
      });
      row["Total Marks"]=at.score;
      return row;
    });

    if(!rows.length){ alert("No student submissions are available yet."); return; }

    const ws=XLSX.utils.json_to_sheet(rows);
    ws["!cols"]=Object.keys(rows[0]).map(k=>({wch:Math.max(12,Math.min(28,k.length+3))}));
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"All Results");
    XLSX.writeFile(wb,"SwarupSir_All_Assignment_Results.xlsx");
  }catch(e){ alert("Could not download results: "+(e.message||e)); }
}

async function studentHome(){
  const {data:links,error:le}=await sb.from("assignment_students").select("assignment_id").eq("student_id",current.id);
  if(le)return render(`<div class="wrap">${header("My Assignments")}<div class="card">${message(le.message)}</div></div>`);
  const ids=(links||[]).map(x=>x.assignment_id);
  let assignments=[],attempts=[];
  if(ids.length){
    const {data:a,error:ae}=await sb.from("assignments").select("*").in("id",ids).order("created_at",{ascending:false});
    if(ae)return render(`<div class="wrap">${header("My Assignments")}<div class="card">${message(ae.message)}</div></div>`);
    assignments=a||[];
    const {data:at,error:ate}=await sb.from("attempts").select("*").eq("student_id",current.id).in("assignment_id",ids).order("submitted_at",{ascending:false});
    if(ate)return render(`<div class="wrap">${header("My Assignments")}<div class="card">${message(ate.message)}</div></div>`);
    attempts=at||[];
  }
  const completedIds=new Set(attempts.map(t=>t.assignment_id));
  const pending=assignments.filter(a=>!completedIds.has(a.id));
  const completed=assignments.filter(a=>completedIds.has(a.id));
  render(`<div class="wrap">${header("My Assignments")}
    <div class="card"><h2>Welcome, ${esc(profile.full_name)}</h2><p class="muted">Complete your new assignments and review your previous work here.</p></div>
    <div class="card"><h2>New Assignments</h2>
      ${pending.length?pending.map(a=>`<div class="assignment"><h3>${esc(a.title)}</h3><p class="muted">${esc(a.subject||"")}</p>${a.deadline?`<p class="small">Deadline: ${new Date(a.deadline).toLocaleString()}</p>`:""}<span class="small" style="color:#2563eb"><b>Not Completed</b></span><div class="actions" style="margin-top:10px"><button onclick="startLesson('${a.id}')">Start Assignment</button></div></div>`).join(""):"<div class='success'><b>No New Assignments</b><br><span class='small'>You have completed all assignments currently assigned to you.</span></div>"}
    </div>
    <div class="card"><h2>Previous Work</h2>
      ${completed.length?completed.map(a=>{const x=attempts.find(t=>t.assignment_id===a.id);return `<div class="assignment"><h3>${esc(a.title)}</h3><p class="muted">${esc(a.subject||"")}</p><p><b>Completed:</b> ${x.score}/${x.total_questions} &nbsp; <span class="small">${x.submitted_at?new Date(x.submitted_at).toLocaleString():""}</span></p><div class="actions"><button onclick="viewPreviousWork('${a.id}','${x.id}')">View My Answers</button></div></div>`}).join(""):"<p class='muted'>No previous submissions yet.</p>"}
    </div>
  </div>`)
}
async function viewPreviousWork(assignmentId,attemptId){
  const {data:a,error:ae}=await sb.from("assignments").select("*").eq("id",assignmentId).single();
  if(ae||!a)return alert(ae?.message||"Assignment not found.");
  const {data:at,error:te}=await sb.from("attempts").select("*").eq("id",attemptId).eq("student_id",current.id).single();
  if(te||!at)return alert(te?.message||"Submission not found.");
  const {data:ans,error:anErr}=await sb.from("answers").select("*").eq("attempt_id",attemptId);
  if(anErr)return alert(anErr.message);
  const qids=(ans||[]).map(x=>x.question_id);
  let qs=[];
  if(qids.length){const {data:q,error:qe}=await sb.from("questions").select("*").in("id",qids);if(qe)return alert(qe.message);qs=q||[];}
  const qm=new Map(qs.map(q=>[q.id,q]));
  const ordered=(ans||[]).map((x,i)=>({x,q:qm.get(x.question_id),i})).sort((a,b)=>{const ao=a.q?.question_order??999999,bo=b.q?.question_order??999999;return ao-bo});
  render(`<div class="wrap">${header("Previous Work")}<div class="card"><h2>${esc(a.title)}</h2><p><b>Score:</b> ${at.score}/${at.total_questions}</p><p><b>Submitted:</b> ${at.submitted_at?new Date(at.submitted_at).toLocaleString():"—"}</p><p><b>Video completed:</b> ${at.video_completed?"Yes":"No"}</p></div><div class="card"><h2>My Answers</h2>${ordered.map(({x,q,i})=>{const opts={A:q?.option_a,B:q?.option_b,C:q?.option_c,D:q?.option_d};const selectedText=opts[x.selected_option]??x.selected_option??"—";const correctText=opts[q?.correct_option]??q?.correct_option??"—";return `<div class="assignment"><h3>${i+1}. ${esc(q?.question_text||"Question unavailable")}</h3><p><b>Your answer:</b> ${esc(x.selected_option||"—")}. ${esc(selectedText)}</p>${x.is_correct?`<div class="success"><b>Correct answer</b></div>`:`<div class="notice"><b>Wrong answer</b><br>Correct answer: <b>${esc(q?.correct_option||"—")}. ${esc(correctText)}</b></div>`}</div>`}).join("")||"<p class='muted'>No answer details found.</p>"}</div><button class="secondary" onclick="studentHome()">Back to Assignments</button></div>`)
}
async function startLesson(id){const {data:a}=await sb.from("assignments").select("*").eq("id",id).single();active=a;videoDone=false;answers=[];lesson()}
function lesson(){render(`<div class="wrap">${header(esc(active.title))}<div class="card"><p class="muted">${esc(active.subject||"")}</p><iframe class="video" src="${esc(embed(active.video_url))}" allowfullscreen></iframe><div class="notice">After watching the video, click the button to continue.</div><button onclick="videoWatched()">Video watched — Continue to MCQs</button></div></div>`)}
async function videoWatched(){videoDone=true;const {data:qs}=await sb.from("questions").select("*").eq("assignment_id",active.id).order("question_order");active.questions=qs||[];quiz()}
function quiz(){render(`<div class="wrap">${header("MCQ Test")}<div class="card"><p class="muted">Answer all questions.</p>${active.questions.map((q,i)=>`<div class="card" style="background:#f8fafc"><h3>${i+1}. ${esc(q.question_text)}</h3>${[['A',q.option_a],['B',q.option_b],['C',q.option_c],['D',q.option_d]].map(o=>`<button class="option ${answers[i]===o[0]?'selected':''}" onclick="choose(${i},'${o[0]}')">${o[0]}. ${esc(o[1])}</button>`).join("")}</div>`).join("")}<button onclick="submitQuiz()">Submit Test</button></div></div>`)}
function choose(i,v){answers[i]=v;quiz()}
async function submitQuiz(){if(answers.length<active.questions.length)return alert("Please answer every question.");const score=active.questions.reduce((n,q,i)=>n+(answers[i]===q.correct_option?1:0),0);const {data:old}=await sb.from("attempts").select("attempt_number").eq("assignment_id",active.id).eq("student_id",current.id).order("attempt_number",{ascending:false}).limit(1);const num=(old?.[0]?.attempt_number||0)+1;const {data:attempt,error}=await sb.from("attempts").insert({assignment_id:active.id,student_id:current.id,score,total_questions:active.questions.length,video_completed:videoDone,submitted_at:new Date().toISOString(),attempt_number:num}).select().single();if(error)return alert(error.message);const rows=active.questions.map((q,i)=>({attempt_id:attempt.id,question_id:q.id,selected_option:answers[i],is_correct:answers[i]===q.correct_option}));const {error:e}=await sb.from("answers").insert(rows);if(e)return alert(e.message);render(`<div class="wrap">${header("Assignment Completed")}<div class="card" style="text-align:center"><div class="stat">${score} / ${active.questions.length}</div><h2>${score===active.questions.length?"Excellent!":"Well done!"}</h2><div class="success"><b>Completed</b><br>Your assignment has been submitted successfully.</div><div class="actions" style="justify-content:center;margin-top:12px"><button onclick="viewPreviousWork('${active.id}','${attempt.id}')">View My Answers</button><button class="secondary" onclick="studentHome()">Back to Assignments</button></div></div></div>`)}
init().catch(e=>render(`<div class="wrap"><div class="card"><h2>Unable to start</h2><p>${esc(e.message||e)}</p></div></div>`));
</script></body></html>
