<body><div id="app"></div>
<div id="installBanner" class="install-banner" role="dialog" aria-live="polite"><div class="install-banner-row"><img class="install-icon" src="/skh-icon-192.png" alt="Knowledge Hub icon"><div><h3>Install Knowledge Hub</h3><p class="muted small">Add a shortcut to this device for quick student access.</p></div></div><div id="installHelp" class="small muted" style="margin-top:8px"></div><div class="install-actions"><button id="installAppBtn" type="button">＋ Add to Home Screen</button><button class="secondary" id="installLaterBtn" type="button">Not now</button></div></div>
<script>
const SUPABASE_URL="https://jupefjdquakqsizapzbv.supabase.co";
const SUPABASE_KEY="sb_publishable_eUcdkv0kFJjkifHQwQBUwg_VcY_lgTP";
const CREATE_STUDENT_FN="create-students";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let schoolTeacherMode=false;
let current=null,profile=null,active=null,answers=[],videoDone=false;
let studentRefreshTimer=null, studentDashboardSnapshot=null;
let bulkStudents=[], importedQuestions=[], importedAnswers={}, importedExplanations={}, importedSingleExcel=false, importedForNewAssignment=false;
let newAssignmentDraft=null;
let deferredInstallPrompt=null;
const PWA_INSTALL_KEY="sskh_student_install_prompt_v1";
function isStandalone(){return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone===true;}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent);}
function setupPWAInstall(){if("serviceWorker" in navigator)navigator.serviceWorker.register("/student-sw.js").catch(()=>{});window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e;});window.addEventListener("appinstalled",()=>{deferredInstallPrompt=null;localStorage.setItem(PWA_INSTALL_KEY,"installed");hideInstallBanner();});}
function hideInstallBanner(){document.getElementById("installBanner")?.classList.remove("show");}
function showStudentInstallPrompt(){if(!profile||profile.role!=="student"||isStandalone()||localStorage.getItem(PWA_INSTALL_KEY))return;const b=document.getElementById("installBanner"),help=document.getElementById("installHelp"),btn=document.getElementById("installAppBtn");if(!b||!btn)return;help.textContent=isIOS()&&!deferredInstallPrompt?"On iPhone/iPad: tap Share, then choose “Add to Home Screen”.":"Tap Add to Home Screen and confirm the installation.";b.classList.add("show");btn.onclick=async()=>{if(deferredInstallPrompt){deferredInstallPrompt.prompt();const choice=await deferredInstallPrompt.userChoice.catch(()=>null);deferredInstallPrompt=null;if(choice?.outcome==="accepted")localStorage.setItem(PWA_INSTALL_KEY,"installed");hideInstallBanner();}else if(isIOS()){alert("To add Knowledge Hub: tap Share, then choose “Add to Home Screen”.");}else{alert("If your browser shows an install icon in the address bar or menu, choose “Install” or “Add to Home Screen”.");}};document.getElementById("installLaterBtn").onclick=()=>{localStorage.setItem(PWA_INSTALL_KEY,"later");hideInstallBanner();};}
setupPWAInstall();

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const render=x=>document.getElementById("app").innerHTML=x;
const header=t=>`<div class="top"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><button class="secondary" onclick="history.length>1?history.back():location.replace('/index.html')">← Back</button><h1 style="margin:0">${t}</h1></div><div class="actions"><button class="secondary" onclick="location.replace('/index.html')">🏠 Home</button><button class="secondary" onclick="logout()">Logout</button></div></div>`;
const message=(t,ok=false)=>`<div class="${ok?'success':'notice'}">${esc(t)}</div>`;
const STUDENT_PROFILE_CACHE_PREFIX="skh_student_profile_v1_";
function getCachedStudentProfile(userId){
  try{
    const raw=localStorage.getItem(STUDENT_PROFILE_CACHE_PREFIX+userId);
    if(!raw)return null;
    const x=JSON.parse(raw);
    if(!x||!x.profile||Date.now()-Number(x.savedAt||0)>10*60*1000)return null;
    return x.profile;
  }catch{return null}
}
function cacheStudentProfile(p){
  try{
    if(p?.id)localStorage.setItem(STUDENT_PROFILE_CACHE_PREFIX+p.id,JSON.stringify({profile:p,savedAt:Date.now()}));
  }catch{}
}
function renderStudentDashboardLoading(){
  render(`<div class="wrap">${header("Student Dashboard")}
    <div class="card">
      <h2>Welcome, ${esc(profile?.full_name||"Student")}</h2>
      <p class="muted">Loading your assignments and results…</p>
      <div class="success small" style="margin-top:12px">Your dashboard will appear as soon as your latest data is ready.</div>
    </div>
  </div>`);
}

const MAIN_GROUPS=["JNV Eng","JNV Ass"];
const SUB_GROUPS=["EVS","Mental Ability","Arithmetic","Language"];
const groupLabel=a=>a?.main_group&&a?.sub_group?`${esc(a.main_group)} · ${esc(a.sub_group)}`:"Not grouped";
const groupBadge=a=>a?.main_group&&a?.sub_group?`<span class="tag">${groupLabel(a)}</span>`:`<span class="tag" style="background:#f1f5f9;color:#64748b">Not grouped</span>`;
function embed(v){if(v.includes("youtube.com/embed/"))return v;let m=v.match(/[?&]v=([^&]+)/)||v.match(/youtu\.be\/([^?]+)/);return m?"https://www.youtube.com/embed/"+m[1]:v}

async function init(){
  const mode=new URLSearchParams(location.search).get("mode");
  const portal=new URLSearchParams(location.search).get("portal");
  window.loginMode=mode==="student"?"student":mode==="teacher"?"teacher":"chooser";

  const {data:{session}}=await sb.auth.getSession();
  if(!session){
    if(window.loginMode==="student") return studentLoginPage();
    if(window.loginMode==="teacher") return teacherLoginPage();
    return login();
  }

  current=session.user;

  // Student path: always use the authoritative profile.course for routing.
  if(window.loginMode==="student"){
    const cached=getCachedStudentProfile(current.id);
    if(cached?.role==="student"){
      profile=cached;
      if(String(profile.course||"").toUpperCase()==="SCHOOL"){
        if(portal==="SCHOOL_ASSIGNMENTS") return studentHome();
        if(portal==="SCHOOL_MOCK") return studentMockTests();
        if(portal==="SCHOOL_ASSESSMENTS") return schoolStudentAssessments();
        return schoolStudentHome();
      }
      if(["JNVST-6","JNVST-9"].includes(String(profile.course||"").toUpperCase())) return studentHome();
    }

    const {data:p,error}=await sb.from("profiles").select("*").eq("id",current.id).single();
    if(error||!p||p.role!=="student"){
      await sb.auth.signOut();
      return window.location.replace("/index.html");
    }

    profile=p;
    cacheStudentProfile(p);

    const course=String(p.course||"").trim().toUpperCase();
    if(course==="SCHOOL"){
      if(portal==="SCHOOL_ASSIGNMENTS") return studentHome();
      if(portal==="SCHOOL_MOCK") return studentMockTests();
      if(portal==="SCHOOL_ASSESSMENTS") return schoolStudentAssessments();
      return schoolStudentHome();
    }

    if(course==="JNVST-6" || course==="JNVST-9") return studentHome();

    await sb.auth.signOut();
    localStorage.removeItem("skh_selected_course");
    return window.location.replace("/index.html");
  }

  // Teacher path.
  const {data:p,error}=await sb.from("profiles").select("*").eq("id",current.id).single();
  if(error||!p){
    await sb.auth.signOut();
    if(window.loginMode==="teacher") return teacherLoginPage();
    return login();
  }
  profile=p;
  if(p.role==="teacher"){
    const selectedPortal=portal==="SCHOOL"?"SCHOOL":"JNVST";
    schoolTeacherMode=selectedPortal==="SCHOOL";
    const action=new URLSearchParams(location.search).get("action");

    if(schoolTeacherMode){
      if(action==="newAssignment") return newAssignment();
      if(action==="mockTestManagement") return mockTestManagement();
      if(action==="teacherResultsDashboard") return teacherResultsDashboard();
      if(action==="manageStudentAccounts") return manageStudentAccounts();
      if(action==="bulkImportStudents") return bulkImportStudents();
      if(action==="addStudent") return addStudent();
      if(action==="newClass") return newClass();
      if(action==="downloadAllResultsExcel") return downloadAllResultsExcel();
      // Keep the School Course dashboard separate.
      if(!action) return window.location.replace("/teacher-dashboard.html");
    }

    return teacherHome();
  }

  await sb.auth.signOut();
  return window.location.replace("/index.html");
}
function login(){
  window.loginMode="chooser";
  render(`<div class="wrap"><div class="card login" style="text-align:center"><h1>Swarup Sir's Knowledge Hub</h1><p class="muted">Choose your login</p><div class="actions" style="display:grid;gap:12px"><button onclick="studentLoginPage()" style="width:100%;font-size:17px;padding:14px">🎓 Student Login</button><button class="secondary" onclick="teacherLoginPage()" style="width:100%;font-size:17px;padding:14px">👨‍🏫 Teacher Login</button></div></div></div>`);
}
function studentLoginPage(){
  window.loginMode="student";
  render(`<div class="wrap"><div class="card login"><h1>🎓 Student Login</h1><p class="muted">Login using your Roll No and Password.</p><label>Roll No</label><input id="rollNo" type="text" inputmode="numeric" autocomplete="username" placeholder="Enter Roll No"><label>Password</label><input id="studentPassword" type="password" autocomplete="current-password" placeholder="Enter Password"><button onclick="doStudentLogin()">Login</button><div id="msg"></div></div></div>`);
}
function teacherLoginPage(){
  window.loginMode="teacher";
  render(`<div class="wrap"><div class="card login"><h1>👨‍🏫 Teacher Login</h1><p class="muted">Teacher account login.</p><label>Email address</label><input id="email" type="email" autocomplete="username" placeholder="Teacher email"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button onclick="doTeacherLogin()">Login</button><div id="msg"></div><div class="actions"><button class="secondary" onclick="login()">← Login Choice</button></div></div></div>`);
}
async function doStudentLogin(){
  const roll=rollNo.value.trim(),pw=studentPassword.value;
  if(!roll||!pw){msg.innerHTML=message("Enter Roll No and Password.");return}
  try{
    const res=await fetch(`${SUPABASE_URL}/functions/v1/${CREATE_STUDENT_FN}`,{
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY},
      body:JSON.stringify({action:"studentLogin",roll_no:roll,password:pw})
    });
    const j=await res.json().catch(()=>({}));
    if(!res.ok||j.error)throw new Error(j.error||"Invalid Roll No or Password.");
    const {error:e}=await sb.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token});
    if(e)throw e;
    current=(await sb.auth.getUser()).data.user;
    const {data:p,error:pe}=await sb.from("profiles").select("*").eq("id",current.id).single();
    if(pe||!p||p.role!=="student")throw new Error("This is not a student account.");
    profile=p;cacheStudentProfile(p);
    const chosen=String(localStorage.getItem("skh_selected_course")||"").toUpperCase();
    const actual=String(p.course||"").toUpperCase();
    if(!chosen || chosen!==actual)throw new Error(`This Roll No is registered for ${p.course||"another course"}. Please choose the correct course.`);
    if(actual==="SCHOOL")return schoolStudentHome();
    if(actual==="JNVST-6"||actual==="JNVST-9")return studentHome();
    throw new Error("This student account has no valid course.");
  }catch(e){msg.innerHTML=message(e.message||String(e))}
}
async function doTeacherLogin(){
  const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});
  if(error){msg.innerHTML=message(error.message);return}
  current=data.user;
  const {data:p,error:e}=await sb.from("profiles").select("*").eq("id",current.id).single();
  if(e||!p){await sb.auth.signOut();msg.innerHTML=message("Login worked, but no profile exists for this user.");return}
  profile=p;
  if(p.role!=="teacher"){await sb.auth.signOut();msg.innerHTML=message("This account is not a teacher account.");return}
  window.loginMode="teacher";teacherHome();
}
async function doLogin(){return doTeacherLogin()}
async function logout(){
  if(studentRefreshTimer){clearInterval(studentRefreshTimer);studentRefreshTimer=null;}
  const wasStudent = profile?.role === "student" || window.loginMode === "student";
  const wasTeacher = profile?.role === "teacher" || window.loginMode === "teacher";

  await sb.auth.signOut();

  current = null;
  profile = null;
  active = null;
  answers = [];
  videoDone = false;

  // Students always return to the standalone student login page.
  if (wasStudent) {
    window.location.replace("/student-login.html");
    return;
  }

  // Teachers return to the teacher login page.
  if (wasTeacher) {
    window.location.replace("/teacher-login.html");
    return;
  }

  window.location.replace("/teacher-login.html");
}

function mockSortQuestions(a,b){
 const ad=Date.parse(a.created_at||'')||0,bd=Date.parse(b.created_at||'')||0;
 if(ad!==bd)return ad-bd;
 const ao=Number(a.question_order??a.source_question_no??999999),bo=Number(b.question_order??b.source_question_no??999999);
 if(ao!==bo)return ao-bo;
 return String(a.id||'').localeCompare(String(b.id||''));
}
function mockBuildSets(qs,plan){
 if(plan.unit==='passage'){
  const groups=new Map();
  (qs||[]).forEach(q=>{const pid=String(q.passage_id||'').trim();if(!pid)return;if(!groups.has(pid))groups.set(pid,[]);groups.get(pid).push(q)});
  return [...groups.entries()].filter(([,g])=>g.length===plan.count).sort((a,b)=>String(a[0]).localeCompare(String(b[0]))).map(([pid,g],i)=>({number:i+1,label:`Passage Group ${i+1} — ${pid}`,questions:[...g].sort(mockSortQuestions)}));
 }
 const sorted=[...(qs||[])].sort(mockSortQuestions);
 const sets=[];
 for(let i=0;i<sorted.length;i+=plan.count){
  const group=sorted.slice(i,i+plan.count);
  if(group.length===plan.count)sets.push({number:sets.length+1,label:`Set ${sets.length+1}`,questions:group});
 }
 return sets;
}

  </div>

  <div class="actions" style="margin-bottom:10px"><button type="button" class="secondary" onclick="document.querySelectorAll('.mock-class').forEach(x=>x.checked=true);loadMockAssignStudents()">Select all classes</button><button type="button" class="secondary" onclick="document.querySelectorAll('.mock-class').forEach(x=>x.checked=false);loadMockAssignStudents()">Clear all</button></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px">${classes.map(c=>`<label style="padding:9px;border:1px solid #dbe3ee;border-radius:10px;background:#fff"><input class="mock-class" type="checkbox" value="${c.id}" onchange="loadMockAssignStudents()" style="width:auto;margin-right:8px"><b>${esc(c.name)}</b></label>`).join('')}</div>

async function loadMockAssignStudents(){const box=document.getElementById('mockAssignPicker');if(!box)return;const ids=[...document.querySelectorAll('.mock-class:checked')].map(x=>x.value);if(!ids.length){box.innerHTML='<span class="muted">Select classes above.</span>';return}box.innerHTML='Loading students…';const {data:m,error}=await sb.from('class_students').select('class_id,student_id').in('class_id',ids);if(error){box.innerHTML=message(error.message);return}const sids=[...new Set((m||[]).map(x=>x.student_id))];const {data:students,error:e}=await sb.from('profiles').select('id,full_name,username').in('id',sids).order('full_name');if(e){box.innerHTML=message(e.message);return}const by=new Map();(m||[]).forEach(x=>{if(!by.has(x.class_id))by.set(x.class_id,[]);by.get(x.class_id).push(x.student_id)});box.innerHTML=ids.map(cid=>{const name=document.querySelector(`.mock-class[value="${cid}"]`)?.parentElement.querySelector('b')?.textContent||cid;const list=(by.get(cid)||[]).map(id=>students.find(s=>s.id===id)).filter(Boolean);return `<div class="assignment"><h3>${esc(name)}</h3><label><input type="radio" name="mockMode_${cid}" value="class" checked onchange="document.getElementById('mockStudents_${cid}').style.display='none'" style="width:auto;margin-right:6px">Entire class</label> <label><input type="radio" name="mockMode_${cid}" value="students" onchange="document.getElementById('mockStudents_${cid}').style.display='block'" style="width:auto;margin-right:6px">Selected students</label><div id="mockStudents_${cid}" style="display:none;margin-top:8px">${list.map(s=>`<label style="display:block;padding:5px"><input class="mock-student" data-class-id="${cid}" type="checkbox" value="${s.id}" style="width:auto;margin-right:6px">${esc(s.full_name)} <span class="muted small">${esc(s.username||'')}</span></label>`).join('')||'<span class="muted">No students.</span>'}</div></div>`}).join('')}
async function createMockTest(){
 const title=document.getElementById('mtTitle').value.trim();
 if(!title)return alert('Enter a test title.');
 const selected=[...document.querySelectorAll('.mock-class:checked')].map(x=>x.value);
 if(!selected.length)return alert('Select at least one class.');
 let studentIds=[];
 for(const cid of selected){
  const mode=document.querySelector(`input[name="mockMode_${cid}"]:checked`)?.value||'class';
  if(mode==='class'){
   const {data:m,error}=await sb.from('class_students').select('student_id').eq('class_id',cid);
   if(error)throw error;studentIds.push(...(m||[]).map(x=>x.student_id));
  }else studentIds.push(...[...document.querySelectorAll(`.mock-student[data-class-id="${cid}"]:checked`)].map(x=>x.value));
 }
 studentIds=[...new Set(studentIds)];
 if(!studentIds.length)return alert('No students were selected.');
 try{
  const {data:bank,error:be}=await sb.from('mock_question_bank').select('*').eq('teacher_id',current.id).eq('active',true);
  if(be)throw be;
  const byPart={};(bank||[]).forEach(q=>{(byPart[q.part_code]||=[]).push(q)});
  const chosenSets={};
  for(const plan of MOCK_PLAN){
   const sets=mockBuildSets(byPart[plan.part]||[],plan);
   if(!sets.length)throw new Error(`${plan.label} has no complete set available.`);
   const value=document.getElementById(`mockSet_${plan.part}`)?.value||'random';
   const set=value==='random'?sets[Math.floor(Math.random()*sets.length)]:sets.find(x=>String(x.number)===String(value));
   if(!set)throw new Error(`${plan.label}: selected set is no longer available.`);
   chosenSets[plan.part]=set;
  }
  const {data:test,error:te}=await sb.from('mock_tests').insert({teacher_id:current.id,title,time_limit_seconds:7200,status:'published'}).select().single();
  if(te)throw te;
  let qrows=[];
  for(const plan of MOCK_PLAN){
   const selectedQs=chosenSets[plan.part].questions;
   if(selectedQs.length!==plan.count)throw new Error(`${plan.label}: selected set must contain exactly ${plan.count} questions.`);
   qrows.push(...selectedQs.map(q=>({mock_test_id:test.id,bank_question_id:q.id,question_number:0,section_code:q.section_code,part_code:q.part_code,question_text:q.question_text,option_a:q.option_a,option_b:q.option_b,option_c:q.option_c,option_d:q.option_d,correct_option:q.correct_option,passage_text:q.passage_text,image_url:q.image_url,marks:1.25})));
  }
  qrows.forEach((q,i)=>q.question_number=i+1);
  const {error:qe}=await sb.from('mock_test_questions').insert(qrows);if(qe)throw qe;
  const recipients=studentIds.map(student_id=>({mock_test_id:test.id,student_id}));
  const {error:re}=await sb.from('mock_test_students').insert(recipients);if(re)throw re;
  const summary=MOCK_PLAN.map(x=>`${x.label}: ${chosenSets[x.part].label}`).join('\n');
  alert(`Mock Test generated successfully.\n\n80 questions\n100 marks\n2 hours\nAssigned to ${recipients.length} student(s).\n\nSelected sets:\n${summary}`);
  mockTestManagement();
 }catch(e){alert('Could not generate Mock Test: '+(e.message||e))}
}
async function studentMockTests(){const {data:links,error}=await sb.from('mock_test_students').select('mock_test_id').eq('student_id',current.id);if(error)return render(`<div class="wrap">${header('Mock Tests')}<div class="card">${message(error.message)}</div></div>`);const ids=(links||[]).map(x=>x.mock_test_id);let tests=[];if(ids.length){const {data,error:e}=await sb.from('mock_tests').select('*').in('id',ids).order('created_at',{ascending:false});if(e)return alert(e.message);tests=tests||[];tests=data||[]}const {data:attempts,error:ae}=await sb.from('mock_test_attempts').select('*').eq('student_id',current.id).in('mock_test_id',ids.length?ids:['00000000-0000-0000-0000-000000000000']).order('created_at',{ascending:false});if(ae)return alert(ae.message);const latest=new Map();(attempts||[]).forEach(a=>{if(!latest.has(a.mock_test_id))latest.set(a.mock_test_id,a)});render(`<div class="wrap">${header('Mock Tests')}<div class="card"><h2>🎯 Mock Test</h2><p class="muted">80 questions • 100 marks • 2 hours • 1.25 marks per question.</p></div><div class="card"><h2>Available Tests</h2>${tests.length?tests.map(t=>{const a=latest.get(t.id);return `<div class="assignment"><h3>${esc(t.title)}</h3><p class="muted">80 Questions · 100 Marks · 2 Hours</p>${a?.status==='submitted'?`<div class="success"><b>Completed:</b> ${Number(a.score||0).toFixed(2)}/100 (${Number(a.percentage||0).toFixed(2)}%)</div><button class="secondary" onclick="viewMockResult('${a.id}')">View Result</button>`:`<button onclick="startMockTest('${t.id}')">${a?.status==='in_progress'?'Resume Mock Test':'Start Mock Test'}</button>`}</div>`}).join(''):'<p class="muted">No mock tests have been assigned to you.</p>'}</div><button class="secondary" onclick="studentHome()">← Back to Dashboard</button></div>`)}
async function startMockTest(testId){try{const {data:test,error:te}=await sb.from('mock_tests').select('*').eq('id',testId).single();if(te)throw te;let {data:attempt}=await sb.from('mock_test_attempts').select('*').eq('mock_test_id',testId).eq('student_id',current.id).eq('status','in_progress').order('created_at',{ascending:false}).limit(1).maybeSingle();const now=Date.now();if(attempt&&new Date(attempt.end_at).getTime()<=now){await submitMockAttempt(attempt.id,true);attempt=null}if(!attempt){const start=new Date().toISOString(),end=new Date(now+Number(test.time_limit_seconds||7200)*1000).toISOString();const {data:a,error}=await sb.from('mock_test_attempts').insert({mock_test_id:testId,student_id:current.id,start_at:start,end_at:end,status:'in_progress',total_questions:80,total_marks:100}).select().single();if(error)throw error;attempt=a}const {data:qs,error:qe}=await sb.from('mock_test_questions').select('*').eq('mock_test_id',testId).order('question_number');if(qe)throw qe;const {data:ans}=await sb.from('mock_test_answers').select('question_id,selected_option').eq('attempt_id',attempt.id);const amap=Object.fromEntries((ans||[]).map(x=>[x.question_id,x.selected_option]));window.mockExam={test,attempt,qs:qs||[],answers:amap,index:0};renderMockExam();startMockTimer()}catch(e){alert('Could not start Mock Test: '+(e.message||e))}}
let mockTimerHandle=null;function startMockTimer(){clearInterval(mockTimerHandle);mockTimerHandle=setInterval(()=>{const el=document.getElementById('mockTimer');if(!el||!window.mockExam)return clearInterval(mockTimerHandle);const left=Math.max(0,new Date(window.mockExam.attempt.end_at).getTime()-Date.now());el.textContent=formatDuration(left);if(left<=0){clearInterval(mockTimerHandle);submitMockAttempt(window.mockExam.attempt.id,true)}},500);}
function formatDuration(ms){const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
function renderMockExam(){const e=window.mockExam,q=e.qs[e.index];if(!q)return;const selected=e.answers[q.id]||'';const optionText={A:q.option_a||'',B:q.option_b||'',C:q.option_c||'',D:q.option_d||''};render(`<div class="exam-shell"><div class="exam-top"><button class="secondary" onclick="confirmExitMockTest()">Exit</button><h2>${esc(e.test.title)}</h2><div><b id="mockTimer">${formatDuration(Math.max(0,new Date(e.attempt.end_at).getTime()-Date.now()))}</b></div></div><div class="exam-grid"><div class="card question-card"><p class="question-number">Question ${q.question_number} of 80 · ${esc(q.section_code)} · ${esc(q.part_code)}</p>${q.passage_text?`<div class="card" style="background:#f8fafc"><b>Passage</b><div style="white-space:pre-wrap;margin-top:8px">${esc(q.passage_text)}</div></div>`:''}${q.image_url?`<div class="question-image-wrap"><img class="question-image" src="${esc(q.image_url)}"></div>`:''}${q.question_text?`<div class="question-text">${esc(q.question_text)}</div>`:''}<div class="answer-heading">Select your answer</div><div class="circle-choice-row">${['A','B','C','D'].map(o=>`<button type="button" class="circle-choice ${selected===o?'selected':''}" aria-label="Option ${o}: ${esc(optionText[o])}" aria-pressed="${selected===o}" onclick="setMockAnswer('${q.id}','${o}')"><span class="option-letter">${o}.</span><span class="option-text">${esc(optionText[o]||'Option '+o)}</span></button>`).join('')}</div><div class="exam-nav"><button class="secondary" onclick="mockMove(-1)" ${e.index===0?'disabled':''}>← Previous</button><button onclick="mockMove(1)">${e.index===e.qs.length-1?'Finish & Submit':'Next →'}</button></div></div><div class="card palette"><h3>Questions</h3><div class="palette-grid">${e.qs.map((x,i)=>`<button class="palette-btn ${i===e.index?'current':''} ${e.answers[x.id]?'answered':''}" onclick="mockJump(${i})">${x.question_number}</button>`).join('')}</div><div class="notice small">Answered: ${Object.keys(e.answers).length}/80<br>Time remaining is based on the saved server deadline.</div><button class="danger" style="width:100%" onclick="submitMockAttempt('${e.attempt.id}',false)">Submit Test</button></div></div></div>`)}
function setMockAnswer(id,opt){window.mockExam.answers[id]=opt;renderMockExam();persistMockAnswer(id,opt)}

async function submitMockAttempt(attemptId,auto=false){try{clearInterval(mockTimerHandle);const {data:attempt,error:ae}=await sb.from('mock_test_attempts').select('*').eq('id',attemptId).eq('student_id',current.id).single();if(ae)throw ae;if(attempt.status==='submitted')return viewMockResult(attemptId);const {data:qs,error:qe}=await sb.from('mock_test_questions').select('id,question_number,section_code,part_code,correct_option,marks').eq('mock_test_id',attempt.mock_test_id).order('question_number');if(qe)throw qe;const {data:ans,error:ane}=await sb.from('mock_test_answers').select('*').eq('attempt_id',attemptId);if(ane)throw ane;const amap=new Map((ans||[]).map(x=>[x.question_id,x.selected_option]));let score=0;const section={};(qs||[]).forEach(q=>{const ok=amap.get(q.id)===q.correct_option;if(ok)score+=Number(q.marks||1.25);if(!section[q.section_code])section[q.section_code]={correct:0,questions:0,marks:0};section[q.section_code].questions++;if(ok){section[q.section_code].correct++;section[q.section_code].marks+=Number(q.marks||1.25)}});const percentage=score;const {error}=await sb.from('mock_test_attempts').update({status:'submitted',submitted_at:new Date().toISOString(),score,percentage,section_results:section}).eq('id',attemptId);if(error)throw error;window.mockExam=null;if(auto)alert('Time is over. Your Mock Test was submitted automatically.');return viewMockResult(attemptId)}catch(e){alert('Could not submit test: '+(e.message||e))}}

function filterTeacherAssignments(){

async function editAssignmentDetails(assignmentId){
 const {data:a,error}=await sb.from("assignments").select("id,title,description").eq("id",assignmentId).eq("created_by",current.id).single();
 if(error||!a)return alert(error?.message||"Assignment not found.");
 const title=prompt("Edit assignment name:",a.title||"");
 if(title===null)return;
 const trimmedTitle=title.trim();
 if(!trimmedTitle)return alert("Assignment name cannot be empty.");
 const description=prompt("Edit assignment description:\n\n(Leave blank if you do not want a description.)",a.description||"");
 if(description===null)return;
 const {error:upError}=await sb.from("assignments").update({title:trimmedTitle,description:description.trim()||null}).eq("id",assignmentId).eq("created_by",current.id);
 if(upError)return alert("Could not update assignment details.\n\n"+(upError.message||upError));
 alert("Assignment name and description updated successfully.");
 await teacherHome();
}
async function editAssignmentGroup(assignmentId){
 const {data:a,error}=await sb.from("assignments").select("id,title,main_group,sub_group").eq("id",assignmentId).eq("created_by",current.id).single();
 if(error||!a)return alert(error?.message||"Assignment not found.");
 const main=prompt(`Main Group for "${a.title}":\n\n1. JNV Eng\n2. JNV Ass`,a.main_group||"JNV Eng");

 if(!MAIN_GROUPS.includes(mainTrim))return alert("Please enter exactly: JNV Eng or JNV Ass.");
 const sub=prompt(`Sub-Group for "${a.title}":\n\n1. EVS\n2. Mental Ability\n3. Arithmetic\n4. Language`,a.sub_group||"EVS");
 if(sub===null)return;

 if(!SUB_GROUPS.includes(subTrim))return alert("Please enter one of: EVS, Mental Ability, Arithmetic, Language.");
 const {error:upError}=await sb.from("assignments").update({main_group:mainTrim,sub_group:subTrim}).eq("id",assignmentId).eq("created_by",current.id);
 if(upError)return alert("Could not update assignment group.\n\n"+(upError.message||upError));
 alert("Assignment group updated successfully.");
 await teacherHome();
}
async function teacherResultsDashboard(){

function updateTeacherResultsSubGroupOptions(){
  const d=window._teacherResults;if(!d)return;
  const main=document.getElementById("trMainGroup")?.value||"all";
  const sub=document.getElementById("trSubGroup");if(!sub)return;
  const available=[...new Set(d.assignments.filter(a=>main==="all"||a.main_group===main).map(a=>a.sub_group).filter(Boolean))];
  const current=sub.value;
  sub.innerHTML=`<option value="all">All Sub-Groups</option>${SUB_GROUPS.filter(g=>available.includes(g)).map(g=>`<option value="${g}">${g}</option>`).join("")}`;
  sub.value=available.includes(current)?current:"all";
  updateTeacherResultsAssignmentOptions();
}
function updateTeacherResultsAssignmentOptions(){
  const d=window._teacherResults;if(!d)return;
  const main=document.getElementById("trMainGroup")?.value||"all";
  const sub=document.getElementById("trSubGroup")?.value||"all";
  const sel=document.getElementById("trAssignment");if(!sel)return;
  const current=sel.value;
  const filtered=d.assignments.filter(a=>
    (main==="all"||a.main_group===main) &&
    (sub==="all"||a.sub_group===sub)
  );
  sel.innerHTML=`<option value="all">All Assignments</option>${filtered.map(a=>`<option value="${a.id}">${esc(a.title)}</option>`).join("")}`;
  sel.value=filtered.some(a=>a.id===current)?current:"all";
}
function teacherResultsMainGroupChanged(){
  updateTeacherResultsSubGroupOptions();
}
function teacherResultsSubGroupChanged(){
  updateTeacherResultsAssignmentOptions();
}

function renderTeacherResultsDashboard(){
  const d=window._teacherResults;if(!d)return;
  const f=d.filters||{assignment:"all",mainGroup:"all",subGroup:"all",classId:"all",student:"all",status:"all",minScore:"",maxScore:"",sort:"submitted_desc"};d.filters=f;
  const classMap=new Map(d.classes.map(c=>[c.id,c.name])),studentMap=new Map(d.students.map(s=>[s.id,s]));
  const assignmentMap=new Map(d.assignments.map(a=>[a.id,a]));
  const assignedKey=new Set(d.links.map(x=>`${x.assignment_id}:${x.student_id}`));
  let rows=d.attempts.map(at=>({type:"submitted",at,a:assignmentMap.get(at.assignment_id),p:studentMap.get(at.student_id)||{},className:classMap.get(assignmentMap.get(at.assignment_id)?.class_id)||""}));
  if(f.status==="pending"){
    const submitted=new Set(d.attempts.map(x=>`${x.assignment_id}:${x.student_id}`));
    rows=d.links.filter(x=>!submitted.has(`${x.assignment_id}:${x.student_id}`)).map(x=>({type:"pending",at:null,a:assignmentMap.get(x.assignment_id),p:studentMap.get(x.student_id)||{},className:classMap.get(assignmentMap.get(x.assignment_id)?.class_id)||""}));
  }else if(f.status==="all"){
    /* Keep submitted rows only in the main results table; pending assignments are summarized separately. */
  }
  rows=rows.filter(r=>r.a&&(!f.assignment||f.assignment==="all"||r.a.id===f.assignment)&&(!f.mainGroup||f.mainGroup==="all"||r.a.main_group===f.mainGroup)&&(!f.subGroup||f.subGroup==="all"||r.a.sub_group===f.subGroup)&&(!f.classId||f.classId==="all"||r.a.class_id===f.classId)&&(!f.student||f.student==="all"||r.p.id===f.student));
  if(f.minScore!=="")rows=rows.filter(r=>r.type==="pending"||Number(r.at.score)*100/Math.max(1,Number(r.at.total_questions))>=Number(f.minScore));
  if(f.maxScore!=="")rows=rows.filter(r=>r.type==="pending"||Number(r.at.score)*100/Math.max(1,Number(r.at.total_questions))<=Number(f.maxScore));
  rows.sort((x,y)=>{
    let a,b;
    if(f.sort==="student_asc"||f.sort==="student_desc"){a=(x.p.full_name||"").toLowerCase();b=(y.p.full_name||"").toLowerCase()}
    else if(f.sort==="assignment_asc"||f.sort==="assignment_desc"){a=(x.a.title||"").toLowerCase();b=(y.a.title||"").toLowerCase()}
    else if(f.sort==="score_asc"||f.sort==="score_desc"){a=x.type==="pending"?-1:Number(x.at.score)*100/Math.max(1,Number(x.at.total_questions));b=y.type==="pending"?-1:Number(y.at.score)*100/Math.max(1,Number(y.at.total_questions))}
    else {a=x.at?.submitted_at?new Date(x.at.submitted_at).getTime():0;b=y.at?.submitted_at?new Date(y.at.submitted_at).getTime():0}
    const dir=f.sort.endsWith("_asc")?1:-1;return a===b?0:a<b?-1*dir:1*dir;
  });
  const submitted=d.attempts.length,avg=submitted?Math.round(d.attempts.reduce((n,x)=>n+Number(x.score||0)*100/Math.max(1,Number(x.total_questions||1)),0)/submitted):0;
  const pendingCount=d.links.filter(x=>!d.attempts.some(a=>a.assignment_id===x.assignment_id&&a.student_id===x.student_id)).length;
  render(`<div class="wrap">${header("Assignment Results")}
    <div class="card">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><h2 style="margin-bottom:4px">📊 Assignment Results</h2><p class="muted">Filter, sort and review student submissions across all assignments.</p></div><div class="actions"><button onclick="downloadFilteredTeacherResultsExcel()">⬇ Download Filtered Results (Excel)</button><button class="secondary" onclick="teacherHome()">← Dashboard</button></div></div>
      <div class="grid" style="margin-top:15px">

        <div><label>Class</label><select id="trClass"><option value="all">All Classes</option>${d.classes.map(c=>`<option value="${c.id}" ${f.classId===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div>

async function downloadFilteredTeacherResultsExcel(){
  try{
    const d=window._teacherResults;
    if(!d){ alert("Assessment Results are not loaded. Please open Assignment Results first."); return; }
    if(typeof XLSX==="undefined"){ alert("Excel library is not loaded. Please refresh the page and try again."); return; }

    const f=d.filters||{assignment:"all",mainGroup:"all",subGroup:"all",classId:"all",student:"all",status:"all",minScore:"",maxScore:"",sort:"submitted_desc"};
    const classMap=new Map((d.classes||[]).map(c=>[c.id,c.name]));
    const studentMap=new Map((d.students||[]).map(s=>[s.id,s]));
    const assignmentMap=new Map((d.assignments||[]).map(a=>[a.id,a]));

    // Build exactly the same dataset used by the visible filtered table.
    let rows=(d.attempts||[]).map(at=>({
      type:"submitted",at:at,a:assignmentMap.get(at.assignment_id),
      p:studentMap.get(at.student_id)||{},
      className:classMap.get(assignmentMap.get(at.assignment_id)?.class_id)||""
    }));

    if(f.status==="pending"){
      const submitted=new Set((d.attempts||[]).map(x=>`${x.assignment_id}:${x.student_id}`));
      rows=(d.links||[]).filter(x=>!submitted.has(`${x.assignment_id}:${x.student_id}`)).map(x=>({
        type:"pending",at:null,a:assignmentMap.get(x.assignment_id),
        p:studentMap.get(x.student_id)||{},
        className:classMap.get(assignmentMap.get(x.assignment_id)?.class_id)||""
      }));
    }

    rows=rows.filter(r=>r.a&&
      (!f.assignment||f.assignment==="all"||r.a.id===f.assignment)&&
      (!f.mainGroup||f.mainGroup==="all"||r.a.main_group===f.mainGroup)&&
      (!f.subGroup||f.subGroup==="all"||r.a.sub_group===f.subGroup)&&
      (!f.classId||f.classId==="all"||r.a.class_id===f.classId)&&
      (!f.student||f.student==="all"||r.p.id===f.student)
    );
    if(f.minScore!=="") rows=rows.filter(r=>r.type==="pending"||Number(r.at.score)*100/Math.max(1,Number(r.at.total_questions))>=Number(f.minScore));
    if(f.maxScore!=="") rows=rows.filter(r=>r.type==="pending"||Number(r.at.score)*100/Math.max(1,Number(r.at.total_questions))<=Number(f.maxScore));

    rows.sort((x,y)=>{
      let a,b;
      if(f.sort==="student_asc"||f.sort==="student_desc"){
        a=(x.p.full_name||"").toLowerCase(); b=(y.p.full_name||"").toLowerCase();
      }else if(f.sort==="assignment_asc"||f.sort==="assignment_desc"){
        a=(x.a.title||"").toLowerCase(); b=(y.a.title||"").toLowerCase();
      }else if(f.sort==="score_asc"||f.sort==="score_desc"){
        a=x.type==="pending"?-1:Number(x.at.score)*100/Math.max(1,Number(x.at.total_questions));
        b=y.type==="pending"?-1:Number(y.at.score)*100/Math.max(1,Number(y.at.total_questions));
      }else{
        a=x.at?.submitted_at?new Date(x.at.submitted_at).getTime():0;
        b=y.at?.submitted_at?new Date(y.at.submitted_at).getTime():0;
      }
      const dir=f.sort.endsWith("_asc")?1:-1;
      return a===b?0:a<b?-1*dir:1*dir;
    });

    if(!rows.length){ alert("No results match the selected filters."); return; }

    // First create the Excel from the filtered rows immediately.
    // This guarantees that download does not depend on another Supabase query.
    const exportRows=rows.map(r=>({
      "Student Name":r.p.full_name||"",
      "Roll No":r.p.roll_no||"",
      "Assignment Name":r.a.title||"",
      "Main Group":r.a.main_group||"",
      "Sub-Group":r.a.sub_group||"",
      "Class":r.className||"",
      "Score":r.type==="pending"?"":r.at.score,
      "Total Questions":r.type==="pending"?"":r.at.total_questions,
      "Score %":r.type==="pending"?"":Math.round(Number(r.at.score||0)*100/Math.max(1,Number(r.at.total_questions||1))),
      "Status":r.type==="pending"?"Not Submitted":"Submitted",
      "Submitted":r.at?.submitted_at?new Date(r.at.submitted_at).toLocaleString():"",
      "Attempt No":r.at?.attempt_number||""
    }));

    const ws=XLSX.utils.json_to_sheet(exportRows);
    ws["!cols"]=Object.keys(exportRows[0]).map(k=>({wch:Math.max(12,Math.min(30,k.length+3))}));
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Filtered Results");

    const parts=[];
    if(f.mainGroup&&f.mainGroup!=="all")parts.push(String(f.mainGroup));
    if(f.subGroup&&f.subGroup!=="all")parts.push(String(f.subGroup));
    if(f.assignment&&f.assignment!=="all"){
      const a=assignmentMap.get(f.assignment); if(a?.title)parts.push(String(a.title));
    }
    if(f.classId&&f.classId!=="all"){
      const c=classMap.get(f.classId); if(c)parts.push(String(c));
    }
    if(f.student&&f.student!=="all"){
      const st=studentMap.get(f.student); if(st?.full_name)parts.push(String(st.full_name));
    }
    if(f.status&&f.status!=="all")parts.push(f.status==="pending"?"Pending":"Submitted");

    const clean=x=>String(x||"").replace(/[\\/:*?"<>|]+/g,"_").replace(/\s+/g,"_").slice(0,40);
    const suffix=parts.length?"_"+parts.map(clean).filter(Boolean).join("_").slice(0,120):"";
    const filename=`JNVST_Assessment_Filtered_Results${suffix}.xlsx`;

    // Use XLSX.write + Blob as the primary download method; it is more reliable
    // in hosted/PWA environments than relying only on XLSX.writeFile().
    const out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
    const blob=new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=filename; a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);

    alert(`Excel downloaded successfully.\n\n${rows.length} filtered record(s) exported.`);
  }catch(e){
    console.error("Filtered Excel download error:",e);
    alert("Could not download filtered results:\n\n"+(e.message||e));
  }
}

function readStudentExcel(ev){
 const file=ev.target.files?.[0];if(!file)return;const r=new FileReader();r.onload=e=>{try{
  const wb=XLSX.read(e.target.result,{type:"array"}),ws=wb.Sheets[wb.SheetNames[0]],raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
  if(!raw.length)throw new Error("The Excel file is empty."); const norm=v=>String(v??"").trim();
  const headers=raw[0].map(v=>norm(v).toLowerCase().replace(/[_\s]+/g," ")); const col=(...names)=>{for(const x of names){const i=headers.indexOf(x);if(i>=0)return i}return -1};
  const ni=col("name","student name"),ri=col("roll no","roll number"),ci=col("class","class name"),pi=col("password");
  if([ni,ri,ci,pi].some(x=>x<0))throw new Error("Required columns: Name, Roll No, Class, Password.");
  bulkStudents=raw.slice(1).map((row,i)=>({row:i+2,name:norm(row[ni]),roll_no:norm(row[ri]),className:norm(row[ci]),password:norm(row[pi])})).filter(x=>x.name||x.roll_no||x.className||x.password);
  if(!bulkStudents.length)throw new Error("No student rows found."); const errors=[],seen=new Set();
  bulkStudents.forEach(x=>{const k=x.className.toLowerCase()+"|"+x.roll_no.toLowerCase();if(!x.name)errors.push(`Row ${x.row}: Name missing`);if(!x.roll_no)errors.push(`Row ${x.row}: Roll No missing`);if(!x.className)errors.push(`Row ${x.row}: Class missing`);if(!x.password)errors.push(`Row ${x.row}: Password missing`);if(x.password&&x.password.length<6)errors.push(`Row ${x.row}: Password must be at least 6 characters`);if(seen.has(k))errors.push(`Row ${x.row}: duplicate Roll No ${x.roll_no} in ${x.className}`);seen.add(k)});
  if(errors.length){document.getElementById("bulkPreview").innerHTML=message(errors.join(" | "));return;}
  document.getElementById("bulkPreview").innerHTML=`<div class="success">Loaded ${bulkStudents.length} student rows.</div><div style="overflow:auto"><table><thead><tr><th>#</th><th>Name</th><th>Roll No</th><th>Class</th><th>Password</th></tr></thead><tbody>${bulkStudents.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.roll_no)}</td><td>${esc(x.className)}</td><td>${esc(x.password)}</td></tr>`).join("")}</tbody></table></div>`;
 }catch(err){document.getElementById("bulkPreview").innerHTML=message("Could not read Excel: "+err.message)}};r.readAsArrayBuffer(file)

function cropWhiteMargins(sourceCanvas){
 const ctx=sourceCanvas.getContext("2d",{willReadFrequently:true}); const w=sourceCanvas.width,h=sourceCanvas.height;

  if(qe)throw qe;

  if(te)throw te;

  window._resultData={assignment:a,questions:qs||[],attempts:ats||[],profiles:new Map(profiles.map(p=>[p.id,p])),answers:new Map(answerRows.map(x=>[`${x.attempt_id}:${x.question_id}`,x])),sortBy:"submitted",sortDir:"desc"};

function renderResultsPage(){
 const d=window._resultData;if(!d)return;
 const sorted=[...d.attempts].sort((x,y)=>{
  let a,b;
  if(d.sortBy==="student"){a=(d.profiles.get(x.student_id)?.full_name||"").toLowerCase();b=(d.profiles.get(y.student_id)?.full_name||"").toLowerCase()}
  else if(d.sortBy==="score"){a=Number(x.score||0)/Math.max(1,Number(x.total_questions||d.questions.length));b=Number(y.score||0)/Math.max(1,Number(y.total_questions||d.questions.length))}
  else if(d.sortBy==="attempt"){a=Number(x.attempt_number||1);b=Number(y.attempt_number||1)}
  else {a=x.submitted_at?new Date(x.submitted_at).getTime():0;b=y.submitted_at?new Date(y.submitted_at).getTime():0}
  return (a===b?0:a<b?-1:1)*(d.sortDir==="asc"?1:-1);
 });
 const avg=sorted.length?Math.round(sorted.reduce((n,x)=>n+Number(x.score||0)*100/Math.max(1,Number(x.total_questions||d.questions.length)),0)/sorted.length):0;
 render(`<div class="wrap">${header("Results")}<div class="card">
 <div style="display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap"><div><h2>${esc(d.assignment.title)}</h2><div class="muted">${esc(d.assignment.subject||"")}</div></div><div class="tag">${sorted.length} submission${sorted.length===1?"":"s"} • Average ${avg}%</div></div>
 <div class="result-controls actions"><b>Sort:</b><select id="resultSortBy"><option value="submitted" ${d.sortBy==="submitted"?"selected":""}>Submission time</option><option value="student" ${d.sortBy==="student"?"selected":""}>Student name</option><option value="score" ${d.sortBy==="score"?"selected":""}>Score</option><option value="attempt" ${d.sortBy==="attempt"?"selected":""}>Attempt number</option></select><select id="resultSortDir"><option value="desc" ${d.sortDir==="desc"?"selected":""}>Descending</option><option value="asc" ${d.sortDir==="asc"?"selected":""}>Ascending</option></select><button onclick="applyResultSort()">Apply</button><button onclick="downloadAssignmentResultsExcel('${d.assignment.id}')">⬇ Download Results Excel</button><button class="secondary" onclick="teacherHome()">← Back</button></div>
 ${sorted.length?sorted.map(at=>{const p=d.profiles.get(at.student_id)||{},total=Number(at.total_questions||d.questions.length),score=Number(at.score||0),wrong=Math.max(0,total-score),pct=total?Math.round(score*100/total):0;return `<div class="result-student">
  <div class="result-student-head"><div><h3>${esc(p.full_name||"Student")}</h3><div class="muted small">Roll No: ${esc(p.roll_no||"—")} • Attempt ${esc(at.attempt_number||1)} • ${at.submitted_at?new Date(at.submitted_at).toLocaleString():"—"}</div></div><div class="result-score"><b>${score}/${total}</b><span>${pct}%</span></div></div>
  <div class="result-summary"><span>Total: <b>${total}</b></span><span class="result-correct">✓ Correct: <b>${score}</b></span><span class="result-wrong">✗ Wrong: <b>${wrong}</b></span><span>Video: <b>${at.video_completed?"Yes":"No"}</b></span><button class="danger" onclick="deleteStudentAttempt('${at.id}','${esc(p.full_name||"Student")}')">Delete This Attempt</button></div>
  <div class="result-tabs" style="display:flex;gap:8px;margin-top:14px"><button class="secondary" onclick="toggleResultDetails('${at.id}','correct')">✓ Correct Answers (${score})</button><button class="secondary" onclick="toggleResultDetails('${at.id}','wrong')">✗ Wrong Answers (${wrong})</button></div>
  <div id="result-details-${at.id}" class="result-details" style="display:none;margin-top:12px"></div>
 </div>`}).join(""):`<div class="success"><b>No submissions yet.</b></div>`}
 </div></div>`);
}

function toggleResultDetails(attemptId,type){
 const d=window._resultData;if(!d)return;
 const box=document.getElementById(`result-details-${attemptId}`);if(!box)return;
 if(box.dataset.open===type){box.style.display="none";box.innerHTML="";box.dataset.open="";return;}
 const at=d.attempts.find(x=>x.id===attemptId);if(!at)return;
 const items=d.questions.map((q,i)=>{
  const ans=d.answers.get(`${attemptId}:${q.id}`),selected=ans?.selected_option||"—",correct=q.correct_option||"—";
  const ok=ans?.is_correct===true||(selected!=="—"&&selected===correct);
  return {q,ans,selected,correct,ok,index:i};
 }).filter(x=>type==="correct"?x.ok:!x.ok);
 box.dataset.open=type;box.style.display="block";
 if(!items.length){box.innerHTML=`<div class="success"><b>No ${type} answers.</b></div>`;return;}
 box.innerHTML=items.map(({q,selected,correct,index})=>{
  const opts=[['A',q.option_a],['B',q.option_b],['C',q.option_c],['D',q.option_d]];
  return `<div class="assignment" style="margin-top:12px;border:1px solid #dbe3ee;border-radius:14px;padding:16px">
   <h3 style="margin-top:0">Q${q.question_order||index+1} — ${type==="correct"?'✓ Correct':'✗ Wrong'}</h3>
   ${q.image_url?`<img src="${esc(q.image_url)}" alt="Question ${q.question_order||index+1}" style="display:block;width:100%;max-height:650px;object-fit:contain;border:1px solid #dbe3ee;border-radius:10px;margin-bottom:12px">`:`<div style="font-weight:700;margin-bottom:10px">${esc(q.question_text||"Question unavailable")}</div>`}
   ${opts.map(o=>`<div style="padding:9px 12px;margin:6px 0;border-radius:9px;border:1px solid ${o[0]===correct?'#16a34a':o[0]===selected&&o[0]!==correct?'#dc2626':'#e5e7eb'};background:${o[0]===correct?'#f0fdf4':o[0]===selected&&o[0]!==correct?'#fef2f2':'#fff'}"><b>${o[0]}.</b> ${esc(o[1]||'')}</div>`).join('')}
   <div class="result-answer" style="margin-top:12px"><span>Student Answer: <b>${esc(selected)}</b></span><span style="color:#166534"><b>Answer Key: ${esc(correct)}</b></span></div>${q?.explanation?`<div style="margin-top:10px;padding:12px 14px;border-left:4px solid #166534;background:#f0fdf4;border-radius:8px;line-height:1.5"><b style="color:#166534">Explanation:</b><div style="margin-top:4px;white-space:pre-wrap">${esc(q.explanation)}</div></div>`:""}
   <div class="${type==="correct"?'result-correct':'result-wrong'}" style="margin-top:8px"><b>${type==="correct"?'✓ Correct':'✗ Wrong'}</b></div>
  </div>`;
 }).join('');
}

function applyResultSort(){

 d.sortBy=document.getElementById("resultSortBy")?.value||"submitted";
 d.sortDir=document.getElementById("resultSortDir")?.value||"desc";

async function deleteStudentAttempt(attemptId,studentName){

 try{
  const {error:e}=await sb.from("answers").delete().eq("attempt_id",attemptId);if(e)throw e;

async function downloadAssignmentResultsExcel(assignmentId){
  try{
    const {data:a,error:ae}=await sb.from("assignments").select("id,title").eq("id",assignmentId).single();
    if(ae||!a) throw new Error(ae?.message||"Assignment not found.");

    const {data:qs,error:qe}=await sb.from("questions")
      .select("id,question_order,correct_option")
      .eq("assignment_id",assignmentId).order("question_order");
    if(qe) throw new Error(qe.message);

    const {data:ats,error:te}=await sb.from("attempts")
      .select("id,student_id,score,total_questions,submitted_at,attempt_number")
      .eq("assignment_id",assignmentId).order("submitted_at",{ascending:true});
    if(te) throw new Error(te.message);

    const ids=[...new Set((ats||[]).map(x=>x.student_id))];
    let profiles=[];
    if(ids.length){
      const {data:p,error:pe}=await sb.from("profiles")
        .select("id,full_name,roll_no").in("id",ids);
      if(pe) throw new Error(pe.message);
      profiles=p||[];
    }

    const attemptIds=(ats||[]).map(x=>x.id);
    let answerRows=[];
    if(attemptIds.length){
      const {data:ar,error:are}=await sb.from("answers")
        .select("attempt_id,question_id,selected_option").in("attempt_id",attemptIds);
      if(are) throw new Error(are.message);
      answerRows=ar||[];
    }

    const pm=new Map(profiles.map(p=>[p.id,p]));
    const am=new Map(answerRows.map(x=>[`${x.attempt_id}:${x.question_id}`,x]));

    const rows=(ats||[]).map(at=>{
      const p=pm.get(at.student_id)||{};
      const row={
        "Student Name":p.full_name||at.student_id,
        "Roll No":p.roll_no||"",
        "Assignment Name":a.title,
        "Score":at.score,
        "Total Questions":at.total_questions,
        "Submitted":at.submitted_at?new Date(at.submitted_at).toLocaleString():"",
        "Attempt No":at.attempt_number||1
      };
      (qs||[]).forEach((q,i)=>{
        const n=q.question_order||i+1;
        const ans=am.get(`${at.id}:${q.id}`);
        row[`Q${n} Option`]=ans?.selected_option||"";
        row[`Q${n} Answer Key`]=q.correct_option||"";
      });
      row["Total Marks"]=at.score;
      return row;
    });

    if(!rows.length){ alert("No student submissions are available for this assignment yet."); return; }

    const ws=XLSX.utils.json_to_sheet(rows);
    ws["!cols"]=Object.keys(rows[0]).map(k=>({wch:Math.max(12,Math.min(28,k.length+3))}));
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Results");
    const safe=(a.title||"Assignment Results").replace(/[\\/:*?"<>|]+/g,"_").slice(0,80);
    XLSX.writeFile(wb,`${safe}_Results.xlsx`);
  }catch(e){ alert("Could not download results: "+(e.message||e)); }
}

async function schoolStudentAssessments(){
  // Dedicated in-app School Assessments view. This does not call studentHome()
  // and therefore cannot open or mix with the normal Assignments view.
  if(studentRefreshTimer){clearInterval(studentRefreshTimer);studentRefreshTimer=null;}

  render(`<div class="wrap">${header("📝 My Assessments")}
    <div class="card">
      <h2>Welcome, ${esc(profile?.full_name||"Student")}</h2>
      <p class="muted">Roll No: <b>${esc(profile?.roll_no||"")}</b> &nbsp; | &nbsp; School Course</p>
    </div>
    <div id="school-assessments-only-content">
      <div class="card"><div class="success"><b>Loading your assessments…</b></div></div>
    </div>
  </div>`);

  try{
    // Load the student's class memberships and assessments in parallel.
    const [{data:members,error:me},{data:assessments,error:ae}]=await Promise.all([
      sb.from("class_students").select("class_id").eq("student_id",current.id),
      sb.from("school_assessments")
        .select("id,title,subject,deadline,school_group_id,class_id,created_at")
        .order("created_at",{ascending:false})
    ]);
    if(me)throw me;
    if(ae)throw ae;

    const classIds=new Set((members||[]).map(x=>x.class_id));
    const allowed=(assessments||[]).filter(a=>{
      if(!a.class_id || !classIds.has(a.class_id))return false;
      return !a.school_group_id || a.school_group_id===profile.school_group_id;
    });

    const aidList=allowed.map(a=>a.id);
    let submissions=[];
    if(aidList.length){
      const {data:s,error:se}=await sb.from("school_answer_submissions")
        .select("assessment_id,question_id,status,is_current")
        .eq("student_id",current.id)
        .eq("is_current",true)
        .in("assessment_id",aidList);
      if(se)throw se;
      submissions=s||[];
    }

    // Count submitted and teacher-reviewed answers per assessment.
    // A current submission is counted once per question.
    const submittedBy=new Map();
    const reviewedBy=new Map();
    submissions.forEach(s=>{
      submittedBy.set(s.assessment_id,(submittedBy.get(s.assessment_id)||0)+1);
      if(String(s.status||"").toLowerCase()==="reviewed"){
        reviewedBy.set(s.assessment_id,(reviewedBy.get(s.assessment_id)||0)+1);
      }
    });

    // Get the actual number of questions in every assessment.
    let questionCounts=new Map();
    if(aidList.length){
      const {data:qs,error:qe}=await sb.from("school_questions")
        .select("id,assessment_id")
        .in("assessment_id",aidList);
      if(qe)throw qe;
      (qs||[]).forEach(q=>questionCounts.set(
        q.assessment_id,(questionCounts.get(q.assessment_id)||0)+1
      ));
    }

    const pending=allowed.filter(a=>{
      const total=questionCounts.get(a.id)||0;
      const submitted=submittedBy.get(a.id)||0;
      return total===0 || submitted<total;
    });

    const assessmentCards=(pending.length?pending:allowed).map(a=>{
      const total=questionCounts.get(a.id)||0;
      const submitted=Math.min(submittedBy.get(a.id)||0,total);
      const reviewed=Math.min(reviewedBy.get(a.id)||0,submitted);
      return `
      <div class="assignment">
        <div class="question-head">
          <div>
            <h3 style="margin:0 0 5px">${esc(a.title)}</h3>
            <div class="muted">${esc(a.subject||"")}</div>
          </div>
          <span class="tag">${a.school_group_id?"Sub-division":"Entire class"}</span>
        </div>

        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0">
          <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:11px 12px;text-align:center">
            <div style="font-size:23px;font-weight:800;color:#1d4ed8">${total}</div>
            <div class="small muted">📋 Total Questions</div>
          </div>
          <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:11px 12px;text-align:center">
            <div style="font-size:23px;font-weight:800;color:#15803d">${submitted}</div>
            <div class="small muted">⬆ Submitted</div>
          </div>
          <div style="background:#fefce8;border:1px solid #fde68a;border-radius:12px;padding:11px 12px;text-align:center">
            <div style="font-size:23px;font-weight:800;color:#a16207">${reviewed}</div>
            <div class="small muted">✓ Reviewed</div>
          </div>
        </div>

        ${a.deadline?`<p class="small"><b>Deadline:</b> ${new Date(a.deadline).toLocaleString()}</p>`:""}
        <button onclick="location.href='/school-dashboard.html?assessment=${encodeURIComponent(a.id)}'">Open Assessment</button>
      </div>`;
    }).join("");

    const content=document.getElementById("school-assessments-only-content");
    if(!content)return;

    content.innerHTML=`
      <div class="notice" style="font-size:16px">
        📌 <b>${pending.length}</b> pending assessment${pending.length===1?"":"s"}.
      </div>
      <section class="card" style="border:2px solid #0f766e;background:#f0fdfa">
        <h2 style="margin:0 0 8px;color:#0f766e">📝 My Assessments</h2>
        <p class="muted">Teacher-created questions, marks, handwritten answer uploads and feedback.</p>
        ${assessmentCards || '<div class="success"><b>No assessments assigned.</b></div>'}
      </section>
      <div class="actions">
        <button class="secondary" onclick="schoolStudentHome()">← Back</button>
        <button class="secondary" onclick="schoolStudentHome()">🏠 Home</button>
      </div>`;
  }catch(e){
    const content=document.getElementById("school-assessments-only-content");
    if(content)content.innerHTML=`<div class="card">${message("Could not load School Assessments: "+(e.message||String(e)))}</div>`;
  }
}

function renderStudentAnswerItems(items,type){
  if(!items.length)return `<div class="success"><b>No ${type} answers.</b></div>`;
  return items.map(({x,q},i)=>{
    const opts={A:q?.option_a,B:q?.option_b,C:q?.option_c,D:q?.option_d};
    const selected=x.selected_option||"—", correct=q?.correct_option||"—";
    const selectedText=opts[selected]??selected, correctText=opts[correct]??correct;
    const isCorrect=type==="correct";
    return `<div class="assignment" style="margin-top:12px"><h3 style="color:${isCorrect?'#166534':'#dc2626'}">Question ${q?.question_order||i+1} ${isCorrect?'— ✓ Correct':'— ✗ Wrong'}</h3>${q?.image_url?`<div class="question-image-wrap"><img class="question-image" src="${esc(q.image_url)}" alt="Question ${q?.question_order||i+1}"></div>`:`<p><b>${esc(q?.question_text||"Question unavailable")}</b></p>`}${[['A',q?.option_a],['B',q?.option_b],['C',q?.option_c],['D',q?.option_d]].map(o=>`<div style="padding:8px 10px;margin:5px 0;border:1px solid #e5e7eb;border-radius:8px"><b>${o[0]}.</b> ${esc(o[1]||"")}</div>`).join('')}<div class="result-answer" style="margin-top:10px"><div><b>Your Selection:</b> ${esc(selected)}${q?.image_url?"":`. ${esc(selectedText)}`}</div><div style="color:#166534"><b>Answer Key:</b> ${esc(correct)}${q?.image_url?"":`. ${esc(correctText)}`}</div></div>${isCorrect?`<div class="success" style="margin-top:10px"><b>Correct ✓</b></div>`:`<div class="notice" style="margin-top:10px"><b>Wrong ✗</b><br>Your selection: <b>${esc(selected)}${q?.image_url?"":`. ${esc(selectedText)}`}</b><br><span style="color:#166534">Correct answer: <b>${esc(correct)}${q?.image_url?"":`. ${esc(correctText)}`}</b></span></div>`}${q?.explanation?`<div style="margin-top:10px;padding:12px 14px;border-left:4px solid #166534;background:#f0fdf4;border-radius:8px;line-height:1.5"><b style="color:#166534">Explanation:</b><div style="margin-top:4px;white-space:pre-wrap">${esc(q.explanation)}</div></div>`:""}${q?.solution_video_url?`<div class="solution-video-box"><b class="solution-video-label">🎥 Answer / Solution Video</b><p class="small muted">Watch the explanation for this question.</p><iframe class="solution-video" src="${esc(embed(q.solution_video_url))}" allowfullscreen></iframe></div>`:""}</div>`;
  }).join('');
}

function toggleStudentAnswerTab(type){
  const d=window._studentPreviousWork;if(!d)return;
  const box=document.getElementById("student-answer-details");if(!box)return;
  const items=d.items.filter(({x,q})=>{const ok=x.is_correct===true||(x.selected_option&&q?.correct_option&&x.selected_option===q.correct_option);return type==="correct"?ok:!ok;});
  if(box.dataset.open===type){box.style.display="none";box.innerHTML="";box.dataset.open="";return;}
  box.dataset.open=type;box.style.display="block";
  box.innerHTML=renderStudentAnswerItems(items,type);
}

async function startLesson(id){
  if(studentRefreshTimer){clearInterval(studentRefreshTimer);studentRefreshTimer=null;}
  const {data:a,error}=await sb.from("assignments").select("*").eq("id",id).single();
  if(error)return alert(error.message);

  const {data:existing,error:ae}=await sb.from("attempts")
    .select("id").eq("assignment_id",id).eq("student_id",current.id).limit(1);

  if(ae)return alert("Could not check submission status: "+ae.message);

  if(existing?.length){
    alert("Already Submitted. You have already submitted this assignment.\n\nYour teacher can reassign it as a fresh assignment if you need to take it again.");
    return studentHome();
  }

  active=a;
  videoDone=!a.video_url;
  answers=[];
  window.quizIndex=0;
  window.mockTimerId=null;window.mockDeadline=null;
  const isMock=(a.assignment_type==="MOCK"||a.assignment_type==="mock");

  // Mock tests and no-video assignments go directly to questions.
  if(isMock||!a.video_url){
    const {data:qs,error:qe}=await sb.from("questions").select("*").eq("assignment_id",a.id).order("question_order");
    if(qe)return alert(qe.message);
    active.questions=qs||[];
    if(isMock){prepareMockQuestions();window.mockDeadline=Date.now()+Math.max(1,Number(a.time_limit||120))*60000;}
    return quiz();
  }

  lesson();
}

async function videoWatched(){videoDone=true;const {data:qs,error}=await sb.from("questions").select("*").eq("assignment_id",active.id).order("question_order");if(error)return alert(error.message);active.questions=qs||[];quiz()}
function shuffleArray(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prepareMockQuestions(){if(!active.questions)return;let qs=active.questions.map(q=>({...q}));if(active.shuffle_questions)qs=shuffleArray(qs);if(active.shuffle_options)qs=qs.map(q=>{const pairs=[["A",q.option_a],["B",q.option_b],["C",q.option_c],["D",q.option_d]];const correctText=pairs.find(x=>x[0]===q.correct_option)?.[1];const shuffled=shuffleArray(pairs);const nq={...q};["A","B","C","D"].forEach((k,i)=>nq["option_"+k.toLowerCase()]=shuffled[i][1]);nq.correct_option=["A","B","C","D"][shuffled.findIndex(x=>x[1]===correctText)];return nq});active.questions=qs;answers=[];window.quizIndex=0}
function mockTimeText(){if(!window.mockDeadline)return "";const sec=Math.max(0,Math.ceil((window.mockDeadline-Date.now())/1000));return `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`}
function updateMockTimer(){const el=document.getElementById("mock-timer");if(!el||!window.mockDeadline)return;const left=mockTimeText();el.textContent=`⏱ Time Remaining: ${left}`;if(left==="00:00"){clearInterval(window.mockTimerId);window.mockTimerId=null;submitQuiz(true)}}

function quiz(){
 if(!active.questions?.length)return alert("No questions are available for this assignment.");
 const total=active.questions.length,currentIndex=window.quizIndex||0,q=active.questions[currentIndex],image=q.image_url;
   const optionRows=["A","B","C","D"].map(o=>`<button type="button" class="choice-item ${answers[currentIndex]===o?"selected":""}" aria-label="Select option ${o}: ${esc(q["option_"+o.toLowerCase()]||"")}" aria-pressed="${answers[currentIndex]===o}" onclick="choose(${currentIndex},'${o}')"><span class="option-letter">${o}.</span><span class="choice-text">${esc(q["option_"+o.toLowerCase()]||"Option "+o)}</span></button>`).join("");
  render(`<div class="exam-shell">${(active.assignment_type==="MOCK"||active.assignment_type==="mock")?`<div id="mock-timer" class="mock-timer">⏱ Time Remaining: ${mockTimeText()}</div>`:""}<div class="exam-top"><button class="secondary" onclick="studentHome()">← Back</button><h2>Question ${currentIndex+1} of ${total}</h2><span class="tag">${answers.filter(Boolean).length}/${total} Answered</span></div><div class="exam-grid"><main class="exam-main"><div class="card question-card"><div class="question-number">Question ${currentIndex+1}</div>${image?`<div class="question-image-wrap"><img class="question-image" src="${esc(image)}" alt="Question ${currentIndex+1}"></div>`:`<div class="question-text">${esc(q.question_text)}</div>`}${q.hint?.trim()?`<div style="margin:0 0 10px"><button type="button" class="hint-btn" onclick="toggleHint(${currentIndex})">💡 Hints</button></div><div id="hint-${currentIndex}" class="hint-box" style="display:none"><b>Hint:</b> ${esc(q.hint)}</div>`:""}<div class="answer-heading">Choose Your Answer</div><div class="choice-list" role="radiogroup" aria-label="Choose your answer">${optionRows}</div></div><div class="exam-nav"><button class="secondary" ${currentIndex===0?"disabled":""} onclick="goQuestion(${currentIndex-1})">← Previous</button>${currentIndex<total-1?`<button onclick="goQuestion(${currentIndex+1})">Next →</button>`:`<button onclick="submitQuiz()">✓ Submit Test</button>`}</div></main><aside class="palette card"><h3>Question Palette</h3><div class="palette-grid">${active.questions.map((_,i)=>`<button class="palette-btn ${i===currentIndex?"current":""} ${answers[i]?"answered":""}" onclick="goQuestion(${i})">${i+1}</button>`).join("")}</div><div class="small muted" style="margin-top:16px"><div>🟩 Answered</div><div>🔵 Current</div><div>⬜ Not Answered</div></div></aside></div></div>`);
}
function toggleHint(i){const box=document.getElementById(`hint-${i}`);if(!box)return;box.style.display=box.style.display==="none"?"block":"none";}
function goQuestion(i){window.quizIndex=Math.max(0,Math.min(i,active.questions.length-1));quiz()}
function choose(i,v){answers[i]=v;quiz()}
async function submitQuiz(autoSubmit=false){
  if(window.mockTimerId){clearInterval(window.mockTimerId);window.mockTimerId=null;}
  if(answers.length<active.questions.length&&!autoSubmit)return alert("Please answer every question.");
  if(autoSubmit){answers=active.questions.map((q,i)=>answers[i]||"")}

  const {data:existing,error:checkError}=await sb.from("attempts")
    .select("id").eq("assignment_id",active.id).eq("student_id",current.id).limit(1);

  if(checkError)return alert("Could not check submission status: "+checkError.message);

  if(existing?.length){
    alert("Already Submitted. This assignment can only be submitted once.");
    return studentHome();
  }

  const score=active.questions.reduce((n,q,i)=>n+(answers[i]===q.correct_option?1:0),0);

  const {data:attempt,error}=await sb.from("attempts").insert({
    assignment_id:active.id,
    student_id:current.id,
    score,
    total_questions:active.questions.length,
    video_completed:videoDone,
    submitted_at:new Date().toISOString(),
    attempt_number:1
  }).select().single();

  if(error){
    if(error.code==="23505"){
      alert("Already Submitted. This assignment can only be submitted once.");
      return studentHome();
    }
    return alert(error.message);
  }

  const rows=active.questions.map((q,i)=>({
    attempt_id:attempt.id,
    question_id:q.id,
    selected_option:answers[i]||null,
    is_correct:answers[i]===q.correct_option
  }));

  const {error:e}=await sb.from("answers").insert(rows);

  if(e){
    await sb.from("attempts").delete().eq("id",attempt.id);
    return alert(e.message);
  }

  await viewPreviousWork(active.id,attempt.id);
}
init().catch(e=>render(`<div class="wrap"><div class="card"><h2>Unable to start</h2><p>${esc(e.message||e)}</p></div></div>`));
</script></body></html>
