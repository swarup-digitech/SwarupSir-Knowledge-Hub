let __teacherAppPromise=null;
function loadTeacherApp(){
  if(window.__teacherAppLoaded)return Promise.resolve();
  if(!__teacherAppPromise){
    __teacherAppPromise=new Promise((resolve,reject)=>{
      const s=document.createElement("script");
      s.src="teacher-app.js?v=16";
      s.onload=()=>{window.__teacherAppLoaded=true;resolve()};
      s.onerror=()=>{__teacherAppPromise=null;s.remove();reject(new Error("Could not load the teacher tools. Please check your internet connection and reload the page."))};
      document.head.appendChild(s);
    });
  }
  return __teacherAppPromise;
}

  return loadTeacherApp().then(()=>{

    return f.apply(self,args);

}

  const {data:{session}}=await sb.auth.getSession();
  if(!session){
    if(window.loginMode==="student") return studentLoginPage();
    if(window.loginMode==="teacher") return teacherLoginPage();
    return login();
  }

  current=session.user;

  // Student path: always use the authoritative profile.course for routing.
  if(window.loginMode==="student"){
    const cached=getCachedStudentProfile(current.id);
    if(cached?.role==="student"){
      profile=cached;
      if(portal==="PROFILE") return studentProfilePage();
      if(portal==="SUBSCRIPTION") return studentSubscription();
      if(String(profile.course||"").toUpperCase()==="SCHOOL"){
        if(portal==="SCHOOL_ASSIGNMENTS") return studentHome();
        if(portal==="SCHOOL_MOCK") return studentMockTests();
        if(portal==="SCHOOL_ASSESSMENTS") return schoolStudentAssessments();
        return schoolStudentHome();
      }
      if(["JNVST-6","JNVST-9"].includes(String(profile.course||"").toUpperCase())) return studentHome();
    }

    const {data:p,error}=await sb.from("profiles").select("*").eq("id",current.id).single();
    if(error||!p||p.role!=="student"){
      await sb.auth.signOut();
      return window.location.replace("/index.html");
    }

    profile=p;
    cacheStudentProfile(p);
    if(portal==="PROFILE") return studentProfilePage();
    if(portal==="SUBSCRIPTION") return studentSubscription();

    const course=String(p.course||"").trim().toUpperCase();
    if(course==="SCHOOL"){
      if(portal==="SCHOOL_ASSIGNMENTS") return studentHome();
      if(portal==="SCHOOL_MOCK") return studentMockTests();
      if(portal==="SCHOOL_ASSESSMENTS") return schoolStudentAssessments();
      return schoolStudentHome();
    }

    if(course==="JNVST-6" || course==="JNVST-9") return studentHome();

    await sb.auth.signOut();
    localStorage.removeItem("skh_selected_course");
    return window.location.replace("/index.html");
  }

  // Teacher path.
  const {data:p,error}=await sb.from("profiles").select("*").eq("id",current.id).single();
  if(error||!p){
    await sb.auth.signOut();
    if(window.loginMode==="teacher") return teacherLoginPage();
    return login();
  }
  profile=p;
  if(p.role==="teacher"){
    try{await loadTeacherApp()}catch(e){return render(`<div class="wrap"><div class="card"><h2>Unable to load teacher tools</h2><p>${esc(e.message||e)}</p><button onclick="location.reload()">Reload</button></div></div>`)}
    const selectedPortal=portal==="SCHOOL"?"SCHOOL":"JNVST";
    schoolTeacherMode=selectedPortal==="SCHOOL";
    const action=new URLSearchParams(location.search).get("action");

    if(schoolTeacherMode){
      if(action==="newAssignment") return newAssignment();
      if(action==="manageAssignments") return schoolAssignmentManagement();
      if(action==="mockTestManagement") return mockTestManagement();
      if(action==="teacherResultsDashboard") return teacherResultsDashboard();
      if(action==="manageStudentAccounts") return manageStudentAccounts();
      if(action==="manageFees") return manageStudentFees();
      if(action==="bulkImportStudents") return bulkImportStudents();
      if(action==="addStudent") return addStudent();
      if(action==="newClass") return newClass();
      if(action==="downloadAllResultsExcel") return downloadAllResultsExcel();
      // Keep the School Course dashboard separate.
      if(!action) return window.location.replace("/teacher-dashboard.html");
    }

    return teacherHome();
  }

  await sb.auth.signOut();
  return window.location.replace("/index.html");
}

async function doStudentLogin(){
  const roll=rollNo.value.trim(),pw=studentPassword.value;
  if(!roll||!pw){msg.innerHTML=message("Enter Roll No and Password.");return}
  try{
    const res=await fetch(`${SUPABASE_URL}/functions/v1/${CREATE_STUDENT_FN}`,{
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY},
      body:JSON.stringify({action:"studentLogin",roll_no:roll,password:pw})
    });
    const j=await res.json().catch(()=>({}));
    if(!res.ok||j.error)throw new Error(j.error||"Invalid Roll No or Password.");
    const {error:e}=await sb.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token});
    if(e)throw e;
    current=(await sb.auth.getUser()).data.user;
    const {data:p,error:pe}=await sb.from("profiles").select("*").eq("id",current.id).single();
    if(pe||!p||p.role!=="student")throw new Error("This is not a student account.");
    profile=p;cacheStudentProfile(p);
    const chosen=String(localStorage.getItem("skh_selected_course")||"").toUpperCase();
    const actual=String(p.course||"").toUpperCase();
    if(!chosen || chosen!==actual)throw new Error(`This Roll No is registered for ${p.course||"another course"}. Please choose the correct course.`);
    if(actual==="SCHOOL")return schoolStudentHome();
    if(actual==="JNVST-6"||actual==="JNVST-9")return studentHome();
    throw new Error("This student account has no valid course.");
  }catch(e){msg.innerHTML=message(e.message||String(e))}
}
async function doTeacherLogin(){
  const {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});
  if(error){msg.innerHTML=message(error.message);return}
  current=data.user;
  const {data:p,error:e}=await sb.from("profiles").select("*").eq("id",current.id).single();
  if(e||!p){await sb.auth.signOut();msg.innerHTML=message("Login worked, but no profile exists for this user.");return}
  profile=p;
  if(p.role!=="teacher"){await sb.auth.signOut();msg.innerHTML=message("This account is not a teacher account.");return}
  window.loginMode="teacher";teacherHome();
}

async function logout(){
  if(studentRefreshTimer){clearInterval(studentRefreshTimer);studentRefreshTimer=null;}
  const wasStudent = profile?.role === "student" || window.loginMode === "student";
  const wasTeacher = profile?.role === "teacher" || window.loginMode === "teacher";
  const studentCourseBeforeLogout = String(profile?.course||localStorage.getItem("skh_selected_course")||"").toUpperCase();

  await sb.auth.signOut();

  current = null;
  profile = null;
  active = null;
  answers = [];
  videoDone = false;

  // Students always return to the standalone student login page.
  if (wasStudent) {
    if(studentCourseBeforeLogout) localStorage.setItem("skh_selected_course",studentCourseBeforeLogout);
    window.location.replace(studentCourseBeforeLogout ? "/student-login.html?course="+encodeURIComponent(studentCourseBeforeLogout) : "/index.html");
    return;
  }

  // Teachers return to the teacher login page.
  if (wasTeacher) {
    window.location.replace("/teacher-login.html");
    return;
  }

  window.location.replace("/teacher-login.html");
}

function jnvstNormalizeMathText(value){
 const s=String(value??'').trim();
 if(!s)return '';
 if(/\\\(|\\\[|\$\$|\$[^$]+\$/.test(s))return s;
 const commands=['frac','dfrac','tfrac','sqrt','times','div','cdot','pi','leq','geq','neq','pm','mp','sum','prod','int','left','right','text','overline','underline','vec','angle','triangle','circ','degree','infty','approx','sim','subset','supset','in','notin'];
 const cmdRe=new RegExp('\\\\(?:'+commands.join('|')+')\\b');
 const hasMath=cmdRe.test(s)||/\^\{[^}]+\}|_[{][^}]+[}]|\^[A-Za-z0-9]|_[A-Za-z0-9]/.test(s);
 if(!hasMath)return s;
 let out='',i=0;
 const balancedEnd=(str,pos)=>{let depth=0;for(let k=pos;k<str.length;k++){if(str[k]==='{')depth++;else if(str[k]==='}'){depth--;if(depth===0)return k+1;}}return str.length};
 while(i<s.length){
   const rest=s.slice(i),m=rest.match(/\\(?:frac|dfrac|tfrac|sqrt)(?:\[[^\]]+\])?\{/);
   const cm=rest.match(/\\(?:times|div|cdot|pi|leq|geq|neq|pm|mp|sum|prod|int|left|right|text|overline|underline|vec|angle|triangle|circ|degree|infty|approx|sim|subset|supset|in|notin)\b/);
   const sup=rest.match(/(?:\^\{[^}]+\}|_\{[^}]+\}|\^[A-Za-z0-9]|_[A-Za-z0-9])/);
   let hit=null;
   [m,cm,sup].forEach(x=>{if(x&&(!hit||x.index<hit.index))hit=x});
   if(!hit){out+=s.slice(i);break;}
   out+=s.slice(i,i+hit.index);
   let expr=hit[0],pos=i+hit.index+expr.length;
   if(/\\(?:frac|dfrac|tfrac)\{/.test(expr)){
     pos=balancedEnd(s,pos-1);if(s[pos]==='{')pos=balancedEnd(s,pos);expr=s.slice(i+hit.index,pos);
     if(s[pos]==='{')pos=balancedEnd(s,pos);
   }else if(/\\sqrt/.test(expr)){
     if(s[pos-1]==='{')pos=balancedEnd(s,pos-1);expr=s.slice(i+hit.index,pos);
   }else if(/^\\/.test(expr)&&s[pos]==='{'){

   }

 }

}

    const classIds=new Set((members||[]).map(x=>x.class_id));
    const allowedAssessments=(assessments||[]).filter(a=>{
      if(!a.class_id || !classIds.has(a.class_id))return false;
      return !a.school_group_id || a.school_group_id===profile.school_group_id;
    });

    let pendingAssessments=0;
    if(allowedAssessments.length){
      const aidList=allowedAssessments.map(a=>a.id);
      const [{data:qs,error:qe},{data:subs,error:se}]=await Promise.all([
        sb.from("school_questions").select("id,assessment_id").in("assessment_id",aidList),
        sb.from("school_answer_submissions")
          .select("assessment_id,question_id,status")
          .eq("student_id",current.id).eq("is_current",true).in("assessment_id",aidList)
      ]);
      if(qe)throw qe;
      if(se)throw se;
      const totalBy=new Map(), answeredBy=new Map();
      (qs||[]).forEach(q=>totalBy.set(q.assessment_id,(totalBy.get(q.assessment_id)||0)+1));
      (subs||[]).forEach(s=>answeredBy.set(s.assessment_id,(answeredBy.get(s.assessment_id)||0)+1));
      pendingAssessments=allowedAssessments.filter(a=>{
        const total=totalBy.get(a.id)||0;
        const answered=answeredBy.get(a.id)||0;
        return total===0 || answered<total;
      }).length;
    }

    // Mock-test assigned count. Keep this lightweight and independent.
    let pendingMocks=0;
    try{
      const {data:mockStudents,error:me2}=await sb.from("mock_test_students")
        .select("mock_test_id").eq("student_id",current.id);
      if(!me2 && (mockStudents||[]).length){
        const mockIds=[...new Set(mockStudents.map(x=>x.mock_test_id).filter(Boolean))];
        const {data:mockTests}=await sb.from("mock_tests")
          .select("id,deadline").in("id",mockIds);
        const {data:mockAttempts}=await sb.from("mock_test_attempts")
          .select("mock_test_id,submitted_at").eq("student_id",current.id).in("mock_test_id",mockIds);
        const done=new Set((mockAttempts||[]).map(x=>x.mock_test_id));
        pendingMocks=(mockTests||[]).filter(x=>!done.has(x.id)).length;
      }
    }catch(_){}

    const totalPending=pendingAssignments.length+pendingAssessments+pendingMocks;
    const summary=totalPending
      ? `📌 You have <b>${pendingAssignments.length}</b> pending assignment${pendingAssignments.length===1?"":"s"}, <b>${pendingMocks}</b> pending Mock Test${pendingMocks===1?"":"s"} and <b>${pendingAssessments}</b> pending assessment${pendingAssessments===1?"":"s"}.`
      : `📌 You have no pending assignments, Mock Tests or assessments.`;

    const content=document.getElementById("school-dashboard-content");
    if(!content)return;

    const assessmentCards=allowedAssessments.length
      ? allowedAssessments.map(a=>`<div class="assignment">
          <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap">
            <div><h3 style="margin:0 0 5px">${esc(a.title)}</h3><div class="muted">${esc(a.subject||"")}</div></div>
            <span class="tag">${a.school_group_id?"Sub-division":"Entire class"}</span>
          </div>
          ${a.deadline?`<p class="small"><b>Deadline:</b> ${new Date(a.deadline).toLocaleString()}</p>`:""}
          <button onclick="location.href='/school-dashboard.html?assessment=${encodeURIComponent(a.id)}'">Open Assessment</button>
        </div>`).join("")
      : '<div class="success"><b>No assessments available.</b><br><span class="small">Your teacher has not assigned a School Assessment yet.</span></div>';

    if(assessmentOnly){
      content.innerHTML=`
        <div class="notice" style="font-size:16px">📌 You have <b>${pendingAssessments}</b> pending assessment${pendingAssessments===1?"":"s"}.</div>
        <section class="card" style="border:2px solid #0f766e;background:#f0fdfa">
          <h2 style="margin:0 0 8px;color:#0f766e">📝 My Assessments</h2>
          <p class="muted">Teacher-created questions, marks, handwritten answer uploads and feedback.</p>
          ${assessmentCards}
        </section>
        <div class="actions" style="margin-top:4px">
          <button class="secondary" onclick="location.replace('/main.html?mode=student')">← Back</button>
          <button class="secondary" onclick="location.replace('/main.html?mode=student')">🏠 Home</button>
        </div>`;
    }else{
      content.innerHTML=`
        <div class="notice" style="font-size:16px">${summary}</div>

        <section class="card" style="border:2px solid #7c3aed;background:#faf5ff">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
            <div>
              <h2 style="margin:0;color:#6d28d9">🎯 Mock Tests</h2>
              <p class="muted" style="margin:6px 0 0">Separate from assignments • 80 Questions • 100 Marks • 2 Hours</p>
              <p style="margin:10px 0 0"><b>${pendingMocks}</b> pending Mock Test${pendingMocks===1?"":"s"}</p>
            </div>
            <button onclick="location.href='/main.html?mode=student&portal=SCHOOL_MOCK'">View Mock Tests</button>
          </div>
        </section>

        <section class="card" style="border:2px solid #0f766e;background:#f0fdfa">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
            <div>
              <h2 style="margin:0;color:#0f766e">📝 School Assessments</h2>
              <p class="muted" style="margin:6px 0 0">Teacher-created questions, marks, handwritten answer uploads and feedback.</p>
              <p style="margin:10px 0 0"><b>${pendingAssessments}</b> pending assessment${pendingAssessments===1?"":"s"}</p>
            </div>
            <button onclick="schoolStudentAssessments()">Open My Assessments</button>
          </div>
        </section>

        <section class="card" style="border:2px solid #2563eb;background:#eff6ff">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
            <div>
              <h2 style="margin:0;color:#1d4ed8">📚 My Assignments</h2>
              <p class="muted" style="margin:6px 0 0">Regular MCQ and video assignments assigned to you.</p>
              <p style="margin:10px 0 0"><b>${pendingAssignments.length}</b> pending assignment${pendingAssignments.length===1?"":"s"}</p>
            </div>
            <button onclick="location.href='/main.html?mode=student&portal=SCHOOL_ASSIGNMENTS'">Open My Assignments</button>
          </div>
        </section>`;
    }
  }catch(e){
    const content=document.getElementById("school-dashboard-content");
    if(content)content.innerHTML=`<div class="card">${message("Could not load your dashboard: "+(e.message||String(e)))}</div>`;
  }
}


async function callStudentFunction(body){
  const {data:{session}}=await sb.auth.getSession();
  if(!session?.access_token) throw new Error("Your session has expired. Please log in again.");
  const res=await fetch(`${SUPABASE_URL}/functions/v1/${CREATE_STUDENT_FN}`,{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "apikey":SUPABASE_KEY,
      "Authorization":`Bearer ${session.access_token}`
    },
    body:JSON.stringify(body)
  });
  const j=await res.json().catch(()=>({}));
  if(!res.ok||j.error) throw new Error(j.error||"Request failed.");
  return j;
}

function previewStudentPhoto(ev){
  const file=ev.target.files?.[0];
  if(!file)return;
  if(file.size>2*1024*1024){
    notify("Photo must be 2 MB or smaller.");
    ev.target.value="";
    return;
  }
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)){
    notify("Please select a JPG, PNG or WEBP image.");
    ev.target.value="";
    return;
  }
  const reader=new FileReader();
  reader.onload=()=> {
    const el=document.getElementById("profilePhotoPreview");
    if(el){
      if(el.tagName==="IMG") el.src=reader.result;
      else {
        const img=document.createElement("img");
        img.id="profilePhotoPreview";
        img.className="student-profile-avatar";
        img.alt="Profile photo";
        img.src=reader.result;
        el.replaceWith(img);
      }
    }
  };
  reader.readAsDataURL(file);
}

async function uploadStudentPhoto(){
  const file=document.getElementById("profilePhotoFile")?.files?.[0];
  if(!file){notify("Please choose a photo first.");return;}
  if(file.size>2*1024*1024){notify("Photo must be 2 MB or smaller.");return;}
  try{
    const reader=new FileReader();
    const base64=await new Promise((resolve,reject)=>{
      reader.onload=()=>resolve(reader.result);
      reader.onerror=()=>reject(new Error("Could not read the image."));
      reader.readAsDataURL(file);
    });
    await callStudentFunction({action:"uploadStudentPhoto",base64,mime_type:file.type});
    const {data:p}=await sb.from("profiles").select("*").eq("id",current.id).single();
    if(p){profile=p;cacheStudentProfile(p);}
    studentProfilePage();
  }catch(e){
    notify(e.message||String(e));
  }
}

async function removeStudentPhoto(){
  if(!confirm("Remove your profile photo?"))return;
  try{
    await callStudentFunction({action:"removeStudentPhoto"});
    const {data:p}=await sb.from("profiles").select("*").eq("id",current.id).single();
    if(p){profile=p;cacheStudentProfile(p);}
    studentProfilePage();
  }catch(e){notify(e.message||String(e));}
}

async function saveStudentDisplayName(){
  const input=document.getElementById("profileDisplayName");
  const msg=document.getElementById("profileSaveMsg");
  const displayName=String(input?.value||"").trim();
  if(!displayName){msg.innerHTML=message("Display name cannot be empty.");return;}
  if(displayName.length>80){msg.innerHTML=message("Display name is too long.");return;}
  try{
    const j=await callStudentFunction({action:"updateStudentProfile",display_name:displayName});
    profile={...profile,display_name:j.display_name};
    cacheStudentProfile(profile);
    msg.innerHTML=message("Profile saved successfully.",true);
  }catch(e){msg.innerHTML=message(e.message||String(e));}
}

async function changeStudentPassword(){
  const msg=document.getElementById("passwordSaveMsg");
  const currentPassword=String(document.getElementById("profileCurrentPassword")?.value||"");
  const newPassword=String(document.getElementById("profileNewPassword")?.value||"");
  const confirmPassword=String(document.getElementById("profileConfirmPassword")?.value||"");
  if(!currentPassword||!newPassword||!confirmPassword){msg.innerHTML=message("Please fill all password fields.");return;}
  if(newPassword.length<6){msg.innerHTML=message("New password must contain at least 6 characters.");return;}
  if(newPassword!==confirmPassword){msg.innerHTML=message("New password and confirmation do not match.");return;}
  if(newPassword===currentPassword){msg.innerHTML=message("New password must be different from the current password.");return;}
  try{
    await callStudentFunction({action:"changeStudentPassword",current_password:currentPassword,new_password:newPassword});
    document.getElementById("profileCurrentPassword").value="";
    document.getElementById("profileNewPassword").value="";
    document.getElementById("profileConfirmPassword").value="";
    msg.innerHTML=message("Password changed successfully.",true);
  }catch(e){msg.innerHTML=message(e.message||String(e));}
}

async function studentHome(){
  if(studentRefreshTimer){clearInterval(studentRefreshTimer);studentRefreshTimer=null;}

  // Render a small shell immediately so navigation never looks blank.
  if(!document.getElementById("student-dash-panel-new")){
    render(`<div class="wrap">${header("My Assignments",false)}
      <div class="card"><h2>Welcome, ${esc(profile?.full_name||"Student")}</h2>
      <p class="muted">Loading your latest assignments…</p></div>
    </div>`);
  }

  const {data:links,error:le}=await sb.from("assignment_students")
    .select("assignment_id,current_attempt_number")
    .eq("student_id",current.id);
  if(le)throw le;
  const linkMap=new Map((links||[]).map(x=>[x.assignment_id,x]));

  const ids=[...new Set((links||[]).map(x=>x.assignment_id).filter(Boolean))];
  let assignments=[],attempts=[];

  if(ids.length){
    // These two queries are independent once the assignment IDs are known.
    const [{data:a,error:ae},{data:at,error:ate}]=await Promise.all([
      sb.from("assignments").select("*").in("id",ids).order("created_at",{ascending:false}),
      sb.from("attempts").select("*").eq("student_id",current.id).in("assignment_id",ids).order("submitted_at",{ascending:false})
    ]);
    if(ae)throw ae;
    if(ate)throw ate;
    assignments=(a||[]).filter(x=>x.assignment_type!=="MOCK"&&x.assignment_type!=="mock");
    attempts=at||[];
  }

  let schoolStudentClassName="",schoolStudentSubName="";
  if(String(profile?.course||"").trim().toUpperCase()==="SCHOOL"){
    const [{data:cm},{data:sg}]=await Promise.all([
      sb.from("class_students").select("class_id").eq("student_id",current.id).limit(1),
      profile.school_group_id?sb.from("school_course_groups").select("name").eq("id",profile.school_group_id).maybeSingle():Promise.resolve({data:null})
    ]);
    const classId=cm?.[0]?.class_id||"";
    if(classId){
      const {data:crow}=await sb.from("classes").select("name").eq("id",classId).maybeSingle();
      schoolStudentClassName=crow?.name||"";
    }
    schoolStudentSubName=sg?.name||"";
  }
  // A submission is final for the current assignment attempt number.
  // Historical attempts remain available to the teacher, but do not block a
  // newly reassigned attempt.
  const currentAttempts=new Map();
  for(const a of assignments){
    const link=linkMap.get(a.id);
    const n=Number(link?.current_attempt_number||1);
    const at=attempts.find(x=>x.assignment_id===a.id && Number(x.attempt_number||1)===n);
    if(at)currentAttempts.set(a.id,at);
  }
  const completedIds=new Set(currentAttempts.keys());
  const pending=assignments.filter(a=>!completedIds.has(a.id));
  const completed=assignments.filter(a=>completedIds.has(a.id));

  const assignmentCard=(a,isCompleted=false)=>{
    const x=isCompleted?currentAttempts.get(a.id):null;
    const pct=x&&Number(x.total_questions)?Math.round(Number(x.score||0)*100/Number(x.total_questions)):0;
    const isMock=(a.assignment_type==="MOCK"||a.assignment_type==="mock");
    const isVideo=!isMock&&(a.assignment_type==="VIDEO"||(!a.assignment_type&&!!a.video_url));
    return `<div class="assignment student-assignment-row ${!isCompleted?"student-new-highlight":""}">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap">
        <div><h3>${esc(a.title)}</h3><p class="muted">${esc(a.subject||"")}</p>
          <div style="margin-top:6px">${!isCompleted?`<span class="student-new-badge">NEW</span> `:""}${isMock?`<span class="mock-badge">📝 MOCK TEST</span>`:(String(profile?.course||"").trim().toUpperCase()==="SCHOOL"?`<span class="tag">${esc(schoolStudentClassName||"School Class")}${schoolStudentSubName?` · ${esc(schoolStudentSubName)}`:""}</span>`:groupBadge(a))}</div>
        </div>
        <span class="tag">${isMock?`⏱ ${Number(a.time_limit||120)} min`:isVideo?"MCQ + Video":"MCQ"}</span>
      </div>
      ${!isCompleted&&a.deadline?`<p class="small">Deadline: ${new Date(a.deadline).toLocaleString()}</p>`:""}
      ${isCompleted?`
        <p><b>Submitted:</b> ${x.score}/${x.total_questions} &nbsp; <b>(${pct}%)</b> <span class="small">${x.submitted_at?new Date(x.submitted_at).toLocaleString():""}</span></p>
        ${pct>=80
          ? `<div class="success" style="margin-top:10px"><b>✓ Assignment successfully submitted.</b></div><div style="margin-top:12px"><button onclick="viewPreviousWork('${a.id}','${x.id}')">View Result &amp; Answers</button></div>`
          : `<div class="notice" style="margin-top:10px"><b>Score below 80%.</b><br>You have to redo this assessment. You can view your result, answers and answer key during the 3-hour waiting period. The assessment will become available again automatically after 3 hours.</div><div style="margin-top:12px"><button onclick="viewPreviousWork('${a.id}','${x.id}')">View Result &amp; Answers</button></div>`}
        ${isVideo?`<div style="margin-top:10px"><button class="secondary" onclick="watchCompletedVideo('${a.id}')">▶ Watch Video Again</button></div>`:""}
      `:`
        <span class="small" style="color:#166534"><b>Not Submitted</b></span>
        <div class="actions" style="margin-top:10px"><button onclick="startLesson('${a.id}')">Start Assignment</button></div>
      `}
    </div>`;
  };

  render(`<div class="wrap">${header("My Assignments")}
    
    <div class="card" style="border:2px solid #7c3aed;background:#faf5ff">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <div><h2 style="margin:0;color:#6d28d9">🎯 Mock Tests</h2>
        <p class="muted" style="margin:6px 0 0">Separate from assignments • 80 Questions • 100 Marks • 2 Hours</p></div>
        <button onclick="studentMockTests()">View Mock Tests</button>
      </div>
    </div>
    <div class="card omr-result-card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <div>
          <h2 style="margin:0;color:#1d4ed8">📄 OMR Test Result</h2>
          <p class="muted" style="margin:6px 0 0">View and download your classroom OMR examination report.</p>
        </div>
        <button onclick="studentOmrResult()">View OMR Result</button>
      </div>
    </div>
    <div class="card"><h2>Welcome, ${esc(studentDisplayName())}</h2>
      <p class="muted">New and not-submitted assignments are highlighted automatically.</p>
      <div class="notice small"><b>Submission rule:</b> A score of 80% or more completes the assignment successfully. If your score is below 80%, you must redo the assessment; it becomes available again automatically after 3 hours. During the waiting period, you can view your result, answers and answer key. Your teacher can also re-assign it for a new attempt.</div>
    </div>
    <div class="card">
      <div class="result-tabs" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
        <button id="student-dash-tab-new" onclick="showStudentDashboardTab('new')">New Assignments (${pending.length})</button>
        <button id="student-dash-tab-completed" class="secondary" onclick="showStudentDashboardTab('completed')">Completed Assignments (${completed.length})</button>
      </div>
      <div id="student-dash-panel-new">${pending.length?pending.map(a=>assignmentCard(a,false)).join(""):"<div class='success'><b>No New Assignments</b><br><span class='small'>You have no pending assignments.</span></div>"}</div>
      <div id="student-dash-panel-completed" style="display:none">${completed.length?completed.map(a=>assignmentCard(a,true)).join(""):"<p class='muted'>No completed assignments.</p>"}</div>
    </div>
  </div>`);
  setTimeout(showStudentInstallPrompt,300);
}

function revokeStudentOmrUrl(){
  if(window._studentOmrObjectUrl){
    try{ URL.revokeObjectURL(window._studentOmrObjectUrl); }catch(_){}
    window._studentOmrObjectUrl=null;
  }
  window._studentOmrBlob=null;
}

async function studentOmrResult(){
  if(studentRefreshTimer){clearInterval(studentRefreshTimer);studentRefreshTimer=null;}
  revokeStudentOmrUrl();

  const name=studentDisplayName();
  const roll=profile?.roll_no||"";
  render(`<div class="wrap">${header("OMR Test Result")}
    <div class="card omr-result-card">

      <div id="omrResultStatus" class="notice">Please wait.</div>
    </div>
    <button class="secondary" onclick="studentHome()">← Back to Dashboard</button>
  </div>`);

  try{
    const {data,error}=await sb.functions.invoke("get-omr-result",{body:{}});
    if(error) throw error;
    if(!(data instanceof Blob)){
      throw new Error("The OMR result service returned an invalid response.");
    }
    if(!data.size) throw new Error("The OMR report is empty.");
    const type=(data.type||"").toLowerCase();
    if(type && !type.includes("pdf")){
      throw new Error("The OMR result service did not return a PDF.");

    window._studentOmrBlob=data;
    window._studentOmrObjectUrl=URL.createObjectURL(data);

    const box=document.getElementById("omrResultStatus");
    if(box) box.outerHTML=`<div class="success" style="margin-top:15px">
      <b>✓ OMR Test Report is available.</b>
      <div class="actions" style="margin-top:12px">
        <button onclick="openStudentOmrPdf()">👁 Open PDF</button>

      </div>
    </div>
    <div id="omrPdfViewerCard" class="card" style="margin-top:16px">
      <h3>OMR Test Report</h3>
      <iframe class="omr-pdf-frame" src="${window._studentOmrObjectUrl}" title="OMR Test Report PDF"></iframe>
    </div>`;
  }catch(e){
    const box=document.getElementById("omrResultStatus");
    let msg="Your OMR result has not been uploaded yet. Please check again later.";
    if(e?.name==="FunctionsFetchError"){
      msg="The OMR result service could not be reached. Please try again later.";
    }
    if(box) box.outerHTML=`<div class="notice" style="margin-top:15px"><b>OMR Result Not Available</b><br>${esc(msg)}</div>`;
    console.error("OMR result error:",e);
  }
}

function openStudentOmrPdf(){
  if(!window._studentOmrObjectUrl)return notify("Please load your OMR result first.");
  const win=window.open(window._studentOmrObjectUrl,"_blank","noopener");
  if(!win) notify("Your browser blocked the PDF window. Please allow pop-ups for this site.");
}

function downloadStudentOmrPdf(){
  if(!window._studentOmrBlob || !window._studentOmrObjectUrl)return notify("Please load your OMR result first.");
  const roll=String(profile?.roll_no||"Student").trim().replace(/[^A-Za-z0-9_-]+/g,"_");
  const a=document.createElement("a");
  a.href=window._studentOmrObjectUrl;
  a.download=`${roll}_OMR_Test_Report.pdf`;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function showStudentDashboardTab(type){const newPanel=document.getElementById("student-dash-panel-new"),donePanel=document.getElementById("student-dash-panel-completed"),newTab=document.getElementById("student-dash-tab-new"),doneTab=document.getElementById("student-dash-tab-completed");if(!newPanel||!donePanel)return;if(type==="completed"){newPanel.style.display="none";donePanel.style.display="block";newTab.classList.add("secondary");doneTab.classList.remove("secondary")}else{newPanel.style.display="block";donePanel.style.display="none";newTab.classList.remove("secondary");doneTab.classList.add("secondary")}}

async function viewPreviousWork(assignmentId,attemptId){
 if(studentRefreshTimer){clearInterval(studentRefreshTimer);studentRefreshTimer=null;}
 try{
  const {data:a,error:ae}=await sb.from("assignments").select("*").eq("id",assignmentId).single();if(ae||!a)throw new Error(ae?.message||"Assignment not found.");
  const {data:at,error:te}=await sb.from("attempts").select("*").eq("id",attemptId).eq("student_id",current.id).single();if(te||!at)throw new Error(te?.message||"Submission not found.");
  const {data:ans,error:anErr}=await sb.from("answers").select("*").eq("attempt_id",attemptId);if(anErr)throw anErr;
  const qids=new Set((ans||[]).map(x=>x.question_id));let qs=[];if(qids.size){const {data:q,error:qe}=await sb.rpc("student_attempt_review_questions",{p_attempt_id:attemptId});if(qe)throw qe;qs=(q||[]).filter(x=>qids.has(x.id))}
  const qm=new Map(qs.map(q=>[q.id,q]));
  const ordered=(ans||[]).map(x=>({x,q:qm.get(x.question_id)})).sort((a,b)=>(a.q?.question_order??999999)-(b.q?.question_order??999999));
  const isLowScore=Number(at.total_questions||0)>0 && (Number(at.score||0)*100/Number(at.total_questions))<80;
  const correctItems=ordered.filter(({x,q})=>x.is_correct===true||(x.selected_option&&q?.correct_option&&x.selected_option===q.correct_option));
  const wrongItems=ordered.filter(({x,q})=>!(x.is_correct===true||(x.selected_option&&q?.correct_option&&x.selected_option===q.correct_option)));
  window._studentPreviousWork={assignment:a,attempt:at,items:ordered};
  render(`<div class="wrap">${header("Assignment Result")}<div class="card"><h2>${esc(a.title)}</h2><p><b>Score:</b> ${at.score}/${at.total_questions} <b>(${Math.round(Number(at.score||0)*100/Math.max(1,Number(at.total_questions||1)))}%)</b></p><p><b>Submitted:</b> ${at.submitted_at?new Date(at.submitted_at).toLocaleString():"—"}</p>
    ${isLowScore
      ? `<div class="notice" style="margin-top:14px"><b>Score below 80% — Assessment must be redone.</b><br>You can review your answers and the answer key during the waiting period. This assessment will become available again automatically 3 hours after submission.</div>`
      : `<div class="success" style="margin-top:14px"><b>✓ Assignment successfully submitted.</b></div>`}
    <div class="result-tabs" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px">
      <button type="button" onclick="toggleStudentAnswerTab('correct')">✓ Correct Answers (${correctItems.length})</button>
      <button type="button" class="secondary" onclick="toggleStudentAnswerTab('wrong')">✗ Wrong Answers (${wrongItems.length})</button>
    </div>
    <div id="student-answer-details" style="display:none;margin-top:16px"></div>
  </div><button class="secondary" onclick="studentHome()">← Back to Assignments</button></div>`);
 }catch(e){notify("Could not load previous work: "+(e.message||e))}
}
function renderStudentAnswerItems(items,type){
  if(!items.length)return `<div class="success"><b>No ${type} answers.</b></div>`;
  return items.map(({x,q},i)=>{
    const opts={A:q?.option_a,B:q?.option_b,C:q?.option_c,D:q?.option_d};
    const selected=x.selected_option||"—", correct=q?.correct_option||"—", isCorrect=type==="correct", questionNo=q?.question_order||i+1;
    const optionRows=["A","B","C","D"].map(letter=>{
      const text=opts[letter]??"", isSelected=selected===letter, isAnswerKey=correct===letter;
      let cls="student-review-option", mark="";
      if(isSelected&&isAnswerKey){cls+=" student-review-selected-correct";mark="✓ Your answer / Correct";}
      else if(isSelected&&!isAnswerKey){cls+=" student-review-selected-wrong";mark="✗ Your answer";}
      else if(isAnswerKey){cls+=" student-review-correct";mark="✓ Correct answer";}
      return `<div class="${cls}"><b>${letter}.</b> <span class="student-review-math">${jnvstMathPreview(text)}</span> ${mark?`<span class="student-review-mark">${mark}</span>`:""}</div>`;
    }).join("");
    const selectedText=opts[selected]??selected, correctText=opts[correct]??correct;
    return `<div class="assignment" style="margin-top:12px"><h3 style="color:${isCorrect?'#166534':'#dc2626'}">Question ${questionNo} ${isCorrect?'— ✓ Correct':'— ✗ Wrong'}</h3>${q?.image_url?`<div class="question-image-wrap"><img class="question-image" src="${esc(q.image_url)}" alt="Question ${questionNo}"></div>`:`<div class="student-review-question-math">${jnvstMathPreview(q?.question_text||"Question unavailable")}</div>`}<div style="margin-top:10px">${optionRows}</div><div class="student-review-summary"><span class="student-review-your">Your answer: ${esc(selected)}${q?.image_url?"":` — ${jnvstMathPreview(selectedText)}`}</span><span class="student-review-key">Correct answer: ${esc(correct)}${q?.image_url?"":` — ${jnvstMathPreview(correctText)}`}</span></div>${isCorrect?`<div class="success" style="margin-top:10px"><b>Correct ✓</b></div>`:`<div class="notice" style="margin-top:10px"><b>Wrong ✗</b></div>`}${q?.explanation?`<div style="margin-top:10px;padding:12px 14px;border-left:4px solid #166534;background:#f0fdf4;border-radius:8px;line-height:1.5"><b style="color:#166534">Explanation:</b><div style="margin-top:4px">${jnvstMathPreview(q.explanation)}</div></div>`:""}${q?.solution_image_url?`<div style="margin-top:12px;padding:10px;background:#faf5ff;border:1px solid #ddd6fe;border-radius:10px"><b style="color:#6d28d9">Solution</b><img src="${esc(q.solution_image_url)}" alt="Solution" style="display:block;width:100%;max-height:700px;object-fit:contain;margin-top:8px;border-radius:8px"></div>`:""}${q?.solution_video_url?`<div class="solution-video-box"><b class="solution-video-label">🎥 Answer / Solution Video</b><p class="small muted">Watch the explanation for this question.</p><iframe class="solution-video" src="${esc(embed(q.solution_video_url))}" allowfullscreen></iframe></div>`:""}</div>`;
  }).join("");
}
function toggleStudentAnswerTab(type){
  const box=document.getElementById("student-answer-details"), d=window._studentPreviousWork;if(!box||!d)return;
  const filtered=(d.items||[]).filter(({x,q})=>type==="correct"?(x.is_correct===true||(x.selected_option&&q?.correct_option&&x.selected_option===q.correct_option)):!(x.is_correct===true||(x.selected_option&&q?.correct_option&&x.selected_option===q.correct_option)));
  box.innerHTML=renderStudentAnswerItems(filtered,type);box.style.display="block";jnvstTypesetWhenReady([box]);
}

async function startLesson(id){
  if(studentRefreshTimer){clearInterval(studentRefreshTimer);studentRefreshTimer=null;}
  const {data:a,error}=await sb.from("assignments").select("*").eq("id",id).single();
  if(error)return notify(error.message);

  const {data:link,error:ae}=await sb.from("assignment_students")
    .select("current_attempt_number")
    .eq("assignment_id",id)
    .eq("student_id",current.id)
    .maybeSingle();

  if(ae)return notify("Could not check assignment status: "+ae.message);
  if(!link)return notify("This assignment is no longer assigned to your account.");

  const currentAttemptNumber=Number(link.current_attempt_number||1);
  const {data:existing,error:xe}=await sb.from("attempts")
    .select("id")
    .eq("assignment_id",id)
    .eq("student_id",current.id)
    .eq("attempt_number",currentAttemptNumber)
    .limit(1);

  if(xe)return notify("Could not check submission status: "+xe.message);

  if(existing?.length){
    notify("Already Submitted. You have already submitted this assignment for the current attempt.\n\nIf your score is below 80%, it will become available again automatically after 3 hours. Your teacher can also re-assign it.");
    return studentHome();
  }

  active={...a,currentAttemptNumber};
  videoDone=!a.video_url;
  answers=[];
  window.quizIndex=0;
  window.mockTimerId=null;window.mockDeadline=null;
  const isMock=(a.assignment_type==="MOCK"||a.assignment_type==="mock");

  // Mock tests and no-video assignments go directly to questions.
  if(isMock||!a.video_url){
    const {data:qs,error:qe}=await sb.rpc("student_assignment_questions",{p_assignment_id:a.id});
    if(qe)return notify(qe.message);
    active.questions=qs||[];
    if(isMock){prepareMockQuestions();window.mockDeadline=Date.now()+Math.max(1,Number(a.time_limit||120))*60000;if(window.mockTimerId)clearInterval(window.mockTimerId);window.mockTimerId=setInterval(updateMockTimer,1000);}
    return quiz();
  }

  lesson();
}
async function watchCompletedVideo(id){
  try{
    const {data:a,error}=await sb.from("assignments").select("id,title,subject,video_url").eq("id",id).single();
    if(error||!a)return notify(error?.message||"Assignment not found.");
    if(!a.video_url)return notify("This assignment has no video.");
    render(`<div class="wrap">${header(esc(a.title))}
      <div class="card">
        <p class="muted">${esc(a.subject||"")}</p>
        <iframe class="video" src="${esc(embed(a.video_url))}" allowfullscreen></iframe>
        <div class="actions" style="margin-top:12px"><button onclick="studentHome()">← Back to Assignments</button></div>
      </div>
    </div>`);
  }catch(e){notify("Could not open video: "+(e.message||e));}
}
function lesson(){render(`<div class="wrap">${header(esc(active.title))}<div class="card"><p class="muted">${esc(active.subject||"")}</p>${active.video_url?`<iframe class="video" src="${esc(embed(active.video_url))}" allowfullscreen></iframe>`:""}<div class="notice">Watch the lesson, then continue to the questions.</div><button onclick="videoWatched()">Video watched — Continue to Questions</button></div></div>`)}
async function videoWatched(){videoDone=true;const {data:qs,error}=await sb.rpc("student_assignment_questions",{p_assignment_id:active.id});if(error)return notify(error.message);active.questions=qs||[];quiz()}
function shuffleArray(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prepareMockQuestions(){if(!active.questions)return;let qs=active.questions.map(q=>({...q}));if(active.shuffle_questions)qs=shuffleArray(qs);if(active.shuffle_options)qs=qs.map(q=>{const pairs=[["A",q.option_a],["B",q.option_b],["C",q.option_c],["D",q.option_d]];const shuffled=shuffleArray(pairs);const nq={...q,_optOrig:{}};["A","B","C","D"].forEach((k,i)=>{nq["option_"+k.toLowerCase()]=shuffled[i][1];nq._optOrig[k]=shuffled[i][0]});return nq});active.questions=qs;answers=[];window.quizIndex=0}
function originalOptionLetter(q,shown){if(!shown)return "";return (q&&q._optOrig&&q._optOrig[shown])||shown}
function mockTimeText(){if(!window.mockDeadline)return "";const sec=Math.max(0,Math.ceil((window.mockDeadline-Date.now())/1000));return `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`}
function updateMockTimer(){const el=document.getElementById("mock-timer");if(!el||!window.mockDeadline)return;const left=mockTimeText();el.textContent=`⏱ Time Remaining: ${left}`;if(left==="00:00"){clearInterval(window.mockTimerId);window.mockTimerId=null;submitQuiz(true)}}

async function typesetStudentQuizMath(root){
  // MathJax is loaded with defer, so it may not be ready when the quiz
  // screen is first rendered. Wait for startup and retry briefly.
  try{
    for(let i=0;i<160 && !window.MathJax?.typesetPromise;i++) await new Promise(r=>setTimeout(r,50));
    if(window.MathJax?.startup?.promise) await window.MathJax.startup.promise;
    if(window.MathJax?.typesetPromise && root){
      await window.MathJax.typesetPromise([root]);
    }
  }catch(e){
    console.warn('Student quiz MathJax typesetting failed:',e);
  }
}
function quiz(){
 if(!active.questions?.length)return notify("No questions are available for this assignment.");
 const total=active.questions.length,currentIndex=window.quizIndex||0,q=active.questions[currentIndex],image=q.image_url;
   const optionRows=["A","B","C","D"].map(o=>{const raw=String(q["option_"+o.toLowerCase()]||"Option "+o);return `<button type="button" class="choice-item ${answers[currentIndex]===o?"selected":""}" aria-label="Select option ${o}" aria-pressed="${answers[currentIndex]===o}" onclick="choose(${currentIndex},'${o}')"><span class="option-letter">${o}.</span><span class="choice-text">${jnvstMathPreview(raw)}</span></button>`}).join("");
  render(`<div class="exam-shell">${(active.assignment_type==="MOCK"||active.assignment_type==="mock")?`<div id="mock-timer" class="mock-timer">⏱ Time Remaining: ${mockTimeText()}</div>`:""}<div class="exam-top"><button class="secondary" onclick="studentHome()">← Back</button><h2>Question ${currentIndex+1} of ${total}</h2><span class="tag">${answers.filter(Boolean).length}/${total} Answered</span></div><div class="exam-grid"><main class="exam-main"><div class="card question-card"><div class="question-number">Question ${currentIndex+1}</div>${image?`<div class="question-image-wrap"><img class="question-image" src="${esc(image)}" alt="Question ${currentIndex+1}"></div>`:`<div class="question-text">${jnvstMathPreview(q.question_text||'')}</div>`}${q.hint?.trim()?`<div style="margin:0 0 10px"><button type="button" class="hint-btn" onclick="toggleHint(${currentIndex})">💡 Hints</button></div><div id="hint-${currentIndex}" class="hint-box" style="display:none"><b>Hint:</b> ${jnvstMathPreview(q.hint)}</div>`:""}<div class="answer-heading">Choose Your Answer</div><div class="choice-list" role="radiogroup" aria-label="Choose your answer">${optionRows}</div></div><div class="exam-nav"><button class="secondary" ${currentIndex===0?"disabled":""} onclick="goQuestion(${currentIndex-1})">← Previous</button>${currentIndex<total-1?`<button onclick="goQuestion(${currentIndex+1})">Next →</button>`:`<button id="submit-test-btn" onclick="submitQuiz()">✓ Submit Test</button>`}</div></main><aside class="palette card"><h3>Question Palette</h3><div class="palette-grid">${active.questions.map((_,i)=>`<button class="palette-btn ${i===currentIndex?"current":""} ${answers[i]?"answered":""}" onclick="goQuestion(${i})">${i+1}</button>`).join("")}</div><div class="small muted" style="margin-top:16px"><div>🟩 Answered</div><div>🔵 Current</div><div>⬜ Not Answered</div></div></aside></div></div>`);
  const exam=document.querySelector('.exam-shell');
  if(exam) typesetStudentQuizMath(exam);
}
function toggleHint(i){const box=document.getElementById(`hint-${i}`);if(!box)return;box.style.display=box.style.display==="none"?"block":"none";}
function goQuestion(i){window.quizIndex=Math.max(0,Math.min(i,active.questions.length-1));quiz()}
function choose(i,v){answers[i]=v;quiz()}
async function submitQuiz(autoSubmit=false){
  if(window.quizSubmitting)return;
  if(window.mockTimerId){clearInterval(window.mockTimerId);window.mockTimerId=null;}
  if(answers.length<active.questions.length&&!autoSubmit)return notify("Please answer every question.");
  if(autoSubmit){answers=active.questions.map((q,i)=>answers[i]||"")}

  // Lock the UI immediately so a double-click cannot start two client-side submissions.
  window.quizSubmitting=true;
  const submitBtn=document.getElementById("submit-test-btn");
  if(submitBtn){submitBtn.disabled=true;submitBtn.textContent="Submitting…";}

  try{
    // The database function checks the current attempt number, refuses a
    // second submission and calculates the score (V13).
    const payload=active.questions.map((q,i)=>({question_id:q.id,selected_option:originalOptionLetter(q,answers[i])||null}));
    const {data:res,error}=await sb.rpc("student_submit_assignment",{p_assignment_id:active.id,p_answers:payload,p_video_completed:!!videoDone});
    if(error){
      if(error.code==="23505"||/ALREADY_SUBMITTED/.test(error.message||"")){
        window.quizSubmitting=false;
        notify("Already Submitted. This assignment can only be submitted once for the current attempt. If your score is below 80%, it will become available again automatically after 3 hours. Your teacher can also re-assign it.");
        return studentHome();
      }
      throw error;
    }
    const score=Number(res.score||0), totalQ=Number(res.total_questions||active.questions.length), attempt={id:res.attempt_id};

    const submissionPct=totalQ?Math.round(score*100/totalQ):0;
    window.quizSubmitting=false;
    window.mockExam=null;
    if(submissionPct>=80){
      render(`<div class="wrap">${header("Assignment Submitted")}<div class="card"><h2>${esc(active.title)}</h2><div class="success" style="margin-top:14px"><b>✓ Assignment successfully submitted.</b><br>Your score is ${score}/${totalQ} (${submissionPct}%).</div><div class="actions" style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap"><button onclick="viewPreviousWork('${esc(active.id)}','${esc(attempt.id)}')">View Result &amp; Answers</button><button class="secondary" onclick="studentHome()">← Back to Assignments</button></div></div></div>`);
    }else{
      await viewPreviousWork(active.id,attempt.id);
    }
  }catch(e){
    window.quizSubmitting=false;
    if(submitBtn){submitBtn.disabled=false;submitBtn.textContent="✓ Submit Test";}
    notify("Could not submit test: "+(e.message||e));
  }
}
init().catch(e=>render(`<div class="wrap"><div class="card"><h2>Unable to start</h2><p>${esc(e.message||e)}</p></div></div>`));
</script>
