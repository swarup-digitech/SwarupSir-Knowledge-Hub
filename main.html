  window.readMockQuestionExcel=function(ev){const file=ev.target.files?.[0];if(!file)return;mockReadRows(file,wb=>{const norm=v=>String(v??'').trim(), key=x=>norm(x).toLowerCase().replace(/[_\s-]+/g,' '), get=(row,names)=>{for(const n of names){const k=Object.keys(row).find(k=>key(k)===key(n));if(k!==undefined)return norm(row[k])}return ''};let passages={};const ps=wb.Sheets[wb.SheetNames.find(n=>key(n)==='passages')||'__none__'];if(ps)XLSX.utils.sheet_to_json(ps,{defval:''}).forEach((row,i)=>{const id=get(row,['Passage ID','PassageID','ID'])||`P${i+1}`;passages[id]={id,title:get(row,['Passage Title','Title'])||`Passage ${i+1}`,text:get(row,['Passage','Passage Text','Text'])}});const ws=wb.Sheets[wb.SheetNames.find(n=>key(n)==='questions')||wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{defval:''});mockBankRows=rows.map((row,i)=>{const pid=get(row,['Passage ID','PassageID']),linked=passages[pid],part=mockNormalizePart(get(row,['Part','Part Code']));return {row:i+2,section:get(row,['Section']).toUpperCase(),part,language:(part.startsWith('MAT_')?'COMMON':(document.getElementById('mockUploadLanguage')?.value||'ASSAMESE')),set_id:get(row,['Set ID','Set','Group ID']),passage_id:pid||'',question_order:Number(get(row,['Question Order','Question No','Question Number','Order']))||null,question:get(row,['Question','Question Text']),A:get(row,['A','Option A']),B:get(row,['B','Option B']),C:get(row,['C','Option C']),D:get(row,['D','Option D']),answer:get(row,['Answer','Correct Option']).toUpperCase(),passage:linked?.text||get(row,['Passage','Passage Text']),passage_title:linked?.title||get(row,['Passage Title','Title']),image_url:get(row,['Image URL','Question Image URL'])}}).filter(x=>x.question||x.image_url);const bad=mockBankRows.filter(x=>!mockPlanByPart[x.part]||!['A','B','C','D'].includes(x.answer));document.getElementById('mockExcelPreview').innerHTML=message(`Loaded ${mockBankRows.length} question(s). ${bad.length?'⚠ '+bad.length+' row(s) need correction.':'✓ All parts and answer keys look valid.'}`,!bad.length)+`<div class="small muted">${mockBankRows.slice(0,12).map(x=>`${x.row}. ${esc(mockPartLabel(x.part))} ${x.passage_id?'['+esc(x.passage_id)+'] ':''}${esc((x.question||'[image]').slice(0,70))} — ${esc(x.answer||'MISSING')}`).join('<br>')}${mockBankRows.length>12?'<br>…':''}</div>`})};
  window.readMockArithmeticExcel=function(ev){const file=ev.target.files?.[0];if(!file)return;mockReadRows(file,wb=>{const ws=wb.Sheets[wb.SheetNames.find(n=>String(n).toLowerCase()==='questions')||wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(ws,{defval:''}),get=(row,names)=>{for(const n of names){const k=Object.keys(row).find(k=>String(k).trim().toLowerCase().replace(/[_\s-]+/g,' ')===String(n).trim().toLowerCase().replace(/[_\s-]+/g,' '));if(k!==undefined)return String(row[k]??'').trim()}return ''};const items=rows.map((row,i)=>({row:i+2,section:'ARITHMETIC',part:'ARITHMETIC',set_id:get(row,['Set ID','Set','Group ID']),question_order:Number(get(row,['Question Order','Question No','Question Number','Order']))||i+1,language:(document.getElementById('mockUploadLanguage')?.value||'ASSAMESE'),question:get(row,['Question','Question Text']),A:get(row,['A','Option A']),B:get(row,['B','Option B']),C:get(row,['C','Option C']),D:get(row,['D','Option D']),answer:get(row,['Answer','Correct Option']).toUpperCase(),passage:'',passage_id:'',passage_title:'',image_url:get(row,['Image URL','Question Image URL'])})).filter(x=>x.question||x.image_url);mockBankRows=mockBankRows.concat(items);const box=document.getElementById('mockExcelPreview');if(box)box.innerHTML+=message(`Loaded ${items.length} Arithmetic question(s) from Excel.`,true)})};
  window.mockBulkUpload=function(){mockBankRows=[];mockPdfRows=[];mockAnswerKey={};render(`<div class="wrap">${header('Bulk Upload Mock Test Questions')}<div class="card"><div class="notice"><b>JNVST bulk-upload rules:</b> MAT = 4 per set; EVS MCQ = 15 per set; EVS passage = 5 linked questions; Arithmetic = 20 per set (Excel or PDF); Language = any number of complete 5-question passage groups. PDF questions are cropped to remove unnecessary white space.</div><div class="grid"><div class="card" style="border:2px solid #2563eb"><span class="tag">EXCEL</span><h3>EVS, Language & Arithmetic</h3><p class="small muted">Use the standard Questions + optional Passages sheets. Language is one generic bank: each passage gets a unique Passage ID such as L001, L002… Arithmetic can also be uploaded here.</p><label>Question Language</label><select id="mockUploadLanguage"><option value="ASSAMESE">Assamese</option><option value="ENGLISH">English</option></select><label>Question-bank Excel</label><input type="file" id="mockExcelFile" accept=".xlsx,.xls" onchange="readMockQuestionExcel(event)"><label>Arithmetic Excel (optional separate file)</label><input type="file" id="mockArithmeticExcelFile" accept=".xlsx,.xls" onchange="readMockArithmeticExcel(event)"><div id="mockExcelPreview"></div></div><div class="card" style="border:2px solid #16a34a"><span class="tag" style="background:#dcfce7;color:#166534">PDF + KEY</span><h3>MAT & Image-based Arithmetic</h3><p class="small muted">One question per PDF page. Upload exactly 4, 8, 12… pages for MAT and 20, 40, 60… for Arithmetic. The answer-key Excel follows PDF page number.</p><label>Question Language</label><select id="mockPdfLanguage"><option value="COMMON">Common (MAT)</option><option value="ASSAMESE">Assamese (Arithmetic)</option><option value="ENGLISH">English (Arithmetic)</option></select><label>PDF Part</label><select id="mockPdfPart" onchange="mockPdfPartChanged()">${MOCK_PLAN.filter(x=>x.upload==='pdf'||x.upload==='excel_or_pdf').map(x=>`<option value="${x.part}">${esc(x.label)} — ${x.count} per set</option>`).join('')}</select><label>Questions PDF</label><input id="mockPdfFile" type="file" accept=".pdf" onchange="readMockQuestionPdf(event)"><label>Answer Key Excel</label><input id="mockAnswerFile" type="file" accept=".xlsx,.xls" onchange="readMockAnswerExcel(event)"><div id="mockPdfPreview"></div></div></div><div class="card" style="background:#f8fafc"><h3>Templates</h3><p class="small muted">Questions columns: Section, Part, Set ID, Passage ID, Question Order, Question, A, B, C, D, Answer, Image URL. Passage sheet: Passage ID, Passage Title, Passage.</p><div class="actions"><button class="secondary" onclick="downloadMockExcelTemplate()">Download Excel Template</button><button class="secondary" onclick="downloadMockAnswerTemplate()">Download Answer Key Template</button></div></div><div class="notice small">Before saving, the system validates counts, passage groups, answer keys and active duplicates. Complete sets are assigned stable Set IDs so later tests can reuse them safely.</div><div class="actions"><button onclick="saveMockBulkUploads()">Validate & Save</button><button class="secondary" onclick="mockTestManagement()">← Back</button><button class="secondary" onclick="teacherHome()">Dashboard</button></div></div></div>`)};
  window.downloadMockExcelTemplate=function(){const wb=XLSX.utils.book_new();const q=XLSX.utils.aoa_to_sheet([['Section','Part','Language','Set ID','Passage ID','Question Order','Question','A','B','C','D','Answer','Image URL'],['EVS','EVS_MCQ','ASSAMESE','EVS-MCQ-001','','1','Sample question','Option A','Option B','Option C','Option D','A',''],['EVS','EVS_PASSAGE','ASSAMESE','','EVS-P001','1','Question 1','Option A','Option B','Option C','Option D','B',''],['LANGUAGE','LANGUAGE_PASSAGE','ASSAMESE','','L001','1','Question 1','Option A','Option B','Option C','Option D','C',''],['ARITHMETIC','ARITHMETIC','ASSAMESE','AR-001','','1','Sample arithmetic question','Option A','Option B','Option C','Option D','D','']]);const p=XLSX.utils.aoa_to_sheet([['Passage ID','Passage Title','Passage'],['EVS-P001','EVS Passage 1','Paste the full EVS passage here.'],['L001','Language Passage 1','Paste the full language passage here.']]);XLSX.utils.book_append_sheet(wb,q,'Questions');XLSX.utils.book_append_sheet(wb,p,'Passages');XLSX.writeFile(wb,'mock_question_bank_template.xlsx')};
  window.downloadMockAnswerTemplate=function(){const ws=XLSX.utils.aoa_to_sheet([['Question No','Correct Option'],[1,'A'],[2,'B'],[3,'C'],[4,'D']]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Answer Key');XLSX.writeFile(wb,'mock_answer_key_template.xlsx')};
  window.saveMockBulkUploads=async function(){try{let savedExcel=0,savedPdf=0;const cleanPart=mockNormalizePart;const excelByPart={};mockBankRows.forEach(x=>{const part=cleanPart(x.part);(excelByPart[part] ||= []).push(x)});for(const [part,items] of Object.entries(excelByPart)){const plan=mockPlanByPart[part];if(!plan||!['excel','excel_or_pdf'].includes(plan.upload))throw new Error(`${part} is not a valid Excel-upload part.`);if(items.some(x=>!['A','B','C','D'].includes(x.answer)))throw new Error(`${plan.label}: every question needs A/B/C/D answer key.`);if(plan.unit==='questions'&&items.length%plan.count!==0)throw new Error(`${plan.label}: ${items.length} questions uploaded; required multiple is ${plan.count}.`);if(plan.unit==='passage'){const groups={};items.forEach(x=>{if(!x.passage_id)throw new Error(`${plan.label}: every question needs a Passage ID.`);(groups[x.passage_id] ||= []).push(x)});const bad=Object.entries(groups).filter(([,g])=>g.length!==plan.count);if(bad.length)throw new Error(`${plan.label}: each passage must have exactly ${plan.count} questions. Problem groups: ${bad.map(([id,g])=>id+'='+g.length).join(', ')}`)}}if(mockBankRows.length){const rows=mockBankRows.map(x=>{const part=cleanPart(x.part),plan=mockPlanByPart[part];return {teacher_id:current.id,section_code:plan.section,part_code:part,language:(part.startsWith('MAT_')?'COMMON':(x.language||document.getElementById('mockUploadLanguage')?.value||'ASSAMESE')),set_id:x.set_id||null,question_text:x.question||null,option_a:x.A||null,option_b:x.B||null,option_c:x.C||null,option_d:x.D||null,correct_option:x.answer,passage_text:x.passage||null,passage_id:x.passage_id||null,passage_title:x.passage_title||null,image_url:x.image_url||null,source_type:'excel',question_order:x.question_order||null}});const {data:old,error:oe}=await sb.from('mock_question_bank').select('question_text,option_a,option_b,option_c,option_d,part_code').eq('teacher_id',current.id).eq('active',true);if(oe)throw oe;const seen=new Set((old||[]).map(q=>[q.part_code,q.question_text,q.option_a,q.option_b,q.option_c,q.option_d].map(v=>String(v||'').trim().toLowerCase()).join('¦')));const fresh=rows.filter(r=>{const k=[r.part_code,r.question_text,r.option_a,r.option_b,r.option_c,r.option_d].map(v=>String(v||'').trim().toLowerCase()).join('¦');if(seen.has(k))return false;seen.add(k);return true});if(fresh.length){const {error}=await sb.from('mock_question_bank').insert(fresh);if(error)throw error;savedExcel=fresh.length}else if(rows.length)alert('All Excel questions are duplicates of active bank questions; they will be skipped.')}if(mockPdfRows.length){const part=cleanPart(document.getElementById('mockPdfPart').value),plan=mockPlanByPart[part];if(!plan||!['pdf','excel_or_pdf'].includes(plan.upload))throw new Error('PDF upload is available only for MAT and Arithmetic.');if(mockPdfRows.length%plan.count!==0)throw new Error(`${plan.label}: PDF has ${mockPdfRows.length} pages; required multiple is ${plan.count}.`);const missing=mockPdfRows.map(x=>x.page).filter(n=>!mockAnswerKey[n]);if(missing.length)throw new Error('Missing answer key for PDF page(s): '+missing.join(', '));const extra=Object.keys(mockAnswerKey).map(Number).filter(n=>n>mockPdfRows.length);if(extra.length)throw new Error('Answer key has page number(s) beyond the PDF: '+extra.join(', '));for(let i=0;i<mockPdfRows.length;i++){const x=mockPdfRows[i],setNo=Math.floor(i/plan.count)+1,path=`${current.id}/${crypto.randomUUID()}.jpg`,url=await uploadMockImage(x.image_data,path);const {error}=await sb.from('mock_question_bank').insert({teacher_id:current.id,section_code:plan.section,part_code:part,language:(plan.section==='MAT'?'COMMON':(document.getElementById('mockPdfLanguage')?.value||'ASSAMESE')),set_id:`${part}-${String(setNo).padStart(3,'0')}`,question_order:(i%plan.count)+1,correct_option:mockAnswerKey[x.page],image_url:url,source_type:'pdf',source_question_no:x.page});if(error)throw error;savedPdf++}}alert(`Upload complete: ${savedExcel+savedPdf} new question(s). Excel ${savedExcel}; PDF ${savedPdf}.`);mockTestManagement()}catch(e){alert('Upload validation failed: '+(e.message||e))}};
  window.mockBuildSets=function(qs,plan){if(plan.unit==='passage'){const groups=new Map();(qs||[]).forEach(q=>{const pid=String(q.passage_id||'').trim();if(pid){if(!groups.has(pid))groups.set(pid,[]);groups.get(pid).push(q)}});return [...groups.entries()].filter(([,g])=>g.length===plan.count).sort((a,b)=>String(a[0]).localeCompare(String(b[0]))).map(([pid,g],i)=>({number:i+1,label:`Passage ${pid}`,set_id:g[0].set_id||pid,questions:[...g].sort(mockSortQuestions)}))}const bySet=new Map();(qs||[]).forEach(q=>{const sid=String(q.set_id||'').trim();if(sid){if(!bySet.has(sid))bySet.set(sid,[]);bySet.get(sid).push(q)}});const explicit=[...bySet.entries()].filter(([,g])=>g.length===plan.count).sort((a,b)=>String(a[0]).localeCompare(String(b[0])));if(explicit.length)return explicit.map(([sid,g],i)=>({number:i+1,label:`Set ${sid}`,set_id:sid,questions:[...g].sort(mockSortQuestions)}));const sorted=[...(qs||[])].sort(mockSortQuestions),sets=[];for(let i=0;i<sorted.length;i+=plan.count){const group=sorted.slice(i,i+plan.count);if(group.length===plan.count)sets.push({number:sets.length+1,label:`Set ${sets.length+1}`,set_id:`AUTO-${plan.part}-${sets.length+1}`,questions:group})}return sets};
})();
