<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Teacher Dashboard — Swarup Sir's Knowledge Hub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.wrap{max-width:1200px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 5px 22px #0000000d;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{width:auto;margin:0}.btn,button{border:0;border-radius:10px;padding:10px 14px;background:#2563eb;color:#fff;font-size:15px;cursor:pointer}.secondary{background:#e8eef8;color:#172033}.danger{background:#dc2626!important;color:#fff}.muted{color:#64748b}.stat{font-size:28px;font-weight:800}label{font-weight:700;display:block;margin:9px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #ccd5e2;border-radius:9px;font:inherit}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#eaf1ff;color:#1d4ed8;font-size:12px;font-weight:700}.notice{padding:11px;border-radius:10px;background:#fff7ed;color:#9a3412}.success{padding:11px;border-radius:10px;background:#ecfdf5;color:#166534}.student-card{border:1px solid #dbe3ee;border-radius:12px;padding:13px;margin-top:9px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button.active{background:#2563eb;color:#fff}.searchgrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}@media(max-width:700px){.searchgrid{grid-template-columns:1fr}.wrap{padding:10px}table{min-width:850px}}</style></head><body><div class="wrap"><div id="app"><div class="card">Loading…</div></div></div><script>
const SUPABASE_URL='https://jupefjdquakqsizapzbv.supabase.co',SUPABASE_KEY='sb_publishable_eUcdkv0kFJjkifHQwQBUwg_VcY_lgTP',CREATE_STUDENT_FN='create-students';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let teacher=null,students=[],classes=[],groups=[],assessments=[],bulkRows=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function msg(t,ok=false){return `<div class="${ok?'success':'notice'}">${esc(t)}</div>`}
async function fn(body){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('Please login again.');const r=await fetch(`${SUPABASE_URL}/functions/v1/${CREATE_STUDENT_FN}`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`,'apikey':SUPABASE_KEY},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw Error(j.error||'Request failed');return j}
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session)return location.replace('teacher-login.html');const {data:p,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();if(error||p?.role!=='teacher'){await sb.auth.signOut();return location.replace('teacher-login.html')}teacher=p;await load();home()}
async function load(){const [{data:s},{data:c},{data:g},{data:a}]=await Promise.all([sb.from('profiles').select('id,full_name,roll_no,username,course,school_group_id').eq('role','student').eq('course','SCHOOL').order('full_name'),sb.from('classes').select('id,name,description,course').eq('teacher_id',teacher.id).eq('course','SCHOOL').order('name'),sb.from('school_course_groups').select('*').eq('teacher_id',teacher.id).order('name'),sb.from('school_assessments').select('*').eq('created_by',teacher.id).order('created_at',{ascending:false})]);students=s||[];classes=c||[];groups=g||[];assessments=a||[];const ids=students.map(x=>x.id);if(ids.length){const {data:m}=await sb.from('class_students').select('student_id,class_id').in('student_id',ids);const cm=new Map((m||[]).map(x=>[x.student_id,x.class_id]));students.forEach(s=>s.class_id=cm.get(s.id)||'')}students.forEach(s=>s.className=classes.find(c=>c.id===s.class_id)?.name||'—')}
function header(title){return `<div class="top"><div><div class="tag">🏫 SCHOOL COURSE</div><h1 style="margin:7px 0">${title}</h1><div class="muted">Teacher: ${esc(teacher.full_name||'Teacher')}</div></div><div class="actions"><button class="secondary" onclick="location.href='main.html'">JNVST Dashboard</button><button class="secondary" onclick="location.href='index.html'">Course Home</button><button onclick="logout()">Logout</button></div></div>`}
function home(){document.getElementById('app').innerHTML=`${header('School Teacher Dashboard')}<div class="grid"><div class="card"><div class="muted">School Students</div><div class="stat">${students.length}</div></div><div class="card"><div class="muted">School Classes</div><div class="stat">${classes.filter(c=>students.some(s=>s.class_id===c.id)).length}</div></div><div class="card"><div class="muted">Sub-divisions</div><div class="stat">${groups.length}</div></div><div class="card"><div class="muted">Assessments</div><div class="stat">${assessments.length}</div></div></div><div class="card"><h2>👨‍🏫 Teacher Tools</h2><div class="actions"><button onclick="location.href='main.html?mode=teacher&portal=SCHOOL&action=newAssignment'">+ Create Assignment</button><button onclick="location.href='main.html?mode=teacher&portal=SCHOOL&action=mockTestManagement'">🎯 Create / Manage Mock Test</button><button onclick="location.href='main.html?mode=teacher&portal=SCHOOL&action=teacherResultsDashboard'">📊 Assignment Results</button><button onclick="addStudent()">+ Add Student</button><button onclick="bulkImport()">↑ Bulk Students (Excel)</button><button onclick="manageStudents()">👥 Edit / Manage Students</button><button onclick="manageClasses()">🏫 Manage Classes</button><button onclick="manageGroups()">▣ School Course Sub-divisions</button><button onclick="location.href='main.html?mode=teacher&portal=SCHOOL&action=downloadAllResultsExcel'">⬇ All Results (Excel)</button></div></div><div class="card"><h2>📝 School Assessments</h2>${assessments.length?assessments.map(a=>`<div class="student-card"><h3>${esc(a.title)}</h3><div class="muted">${esc(a.subject||'')} ${a.total_marks?`• ${a.total_marks} marks`:''}</div><div class="actions" style="margin-top:9px"><button onclick="editQuestions('${a.id}')">✎ Questions</button><button onclick="reviewAssessment('${a.id}')">📊 Review Submissions</button><button class="secondary" onclick="deleteAssessment('${a.id}')">Delete</button></div></div>`).join(''):'<p class="muted">No School assessments yet.</p>'}<div class="actions" style="margin-top:12px"><button onclick="newAssessment()">+ New School Assessment</button></div></div>`}
function addStudent(){if(!classes.length)return alert('Create a School class first.');document.getElementById('app').innerHTML=`${header('Add School Student')}<div class="card"><label>Student Name</label><input id="sn"><label>Roll No</label><input id="sr"><label>Password</label><input id="sp" type="text" placeholder="At least 6 characters"><label>Class</label><select id="sc" onchange="refreshSchoolStudentGroups()">${classes.map((c,i)=>`<option value="${c.id}" ${i===0?'selected':''}>${esc(c.name)}</option>`).join('')}</select><label>School Course Sub-division</label><select id="sg"></select><div id="sm"></div><div class="actions" style="margin-top:12px"><button onclick="saveStudent()">Create Student</button><button class="secondary" onclick="home()">Cancel</button></div></div>`;refreshSchoolStudentGroups()}
function refreshSchoolStudentGroups(){const classId=document.getElementById('sc')?.value,sel=document.getElementById('sg');if(!sel)return;const opts=groups.filter(g=>g.class_id===classId).map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('');sel.innerHTML='<option value="">No subdivision</option>'+opts}
async function saveStudent(){try{const j=await fn({action:'createStudents',students:[{name:sn.value.trim(),roll_no:sr.value.trim(),password:sp.value,class_id:sc.value,course:'SCHOOL',school_group_id:sg.value||null}]});const r=j.results?.[0];if(!r?.success)throw Error(r?.error||'Could not create student');alert('Student created successfully.');await load();home()}catch(e){sm.innerHTML=msg(e.message)}}
function bulkImport(){bulkRows=[];document.getElementById('app').innerHTML=`${header('Bulk School Students — Excel')}<div class="card"><p><b>Columns:</b> Name | Roll No | Class | Password | Subdivision (optional)</p><div class="notice">Course is automatically set to <b>SCHOOL</b>. Email is not required.</div><label>Excel file</label><input type="file" accept=".xlsx,.xls" onchange="readBulk(event)"><div id="bulkPreview"></div><div class="actions"><button onclick="uploadBulk()">Create All Students</button><button class="secondary" onclick="home()">Cancel</button></div></div>`}
function readBulk(ev){const f=ev.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});const h=raw[0].map(x=>String(x).trim().toLowerCase().replace(/[_\s]+/g,' ')),idx=(...a)=>a.map(x=>h.indexOf(x)).find(x=>x>=0);const ni=idx('name','student name'),ri=idx('roll no','roll number'),ci=idx('class','class name'),pi=idx('password'),gi=idx('subdivision','school subdivision','school course subdivision');if([ni,ri,ci,pi].some(x=>x<0))throw Error('Required columns: Name, Roll No, Class, Password.');bulkRows=raw.slice(1).map((row,i)=>({row:i+2,name:String(row[ni]||'').trim(),roll_no:String(row[ri]||'').trim(),className:String(row[ci]||'').trim(),password:String(row[pi]||''),groupName:gi>=0?String(row[gi]||'').trim():''})).filter(x=>x.name||x.roll_no||x.className||x.password);const errs=[];bulkRows.forEach(x=>{if(!x.name)errs.push(`Row ${x.row}: Name missing`);if(!x.roll_no)errs.push(`Row ${x.row}: Roll No missing`);if(!x.className)errs.push(`Row ${x.row}: Class missing`);if(!x.password||x.password.length<6)errs.push(`Row ${x.row}: Password must contain at least 6 characters`)});if(errs.length){bulkPreview.innerHTML=msg(errs.join(' | '));return}bulkPreview.innerHTML=`<div class="success">Loaded ${bulkRows.length} rows.</div><div style="overflow:auto"><table><tr><th>Name</th><th>Roll</th><th>Class</th><th>Password</th><th>Subdivision</th></tr>${bulkRows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.roll_no)}</td><td>${esc(x.className)}</td><td>${esc(x.password)}</td><td>${esc(x.groupName)}</td></tr>`).join('')}</table></div>`}catch(e){bulkPreview.innerHTML=msg('Could not read Excel: '+e.message)}};r.readAsArrayBuffer(f)}
async function uploadBulk(){if(!bulkRows.length)return alert('Upload an Excel file first.');const cmap=new Map(classes.map(c=>[c.name.trim().toLowerCase(),c.id])),gmap=new Map(groups.map(g=>[g.name.trim().toLowerCase(),g.id]));const bad=bulkRows.filter(x=>!cmap.has(x.className.toLowerCase())|| (x.groupName&&!gmap.has(x.groupName.toLowerCase())));if(bad.length)return alert('Class or subdivision not found: '+bad.map(x=>x.name).join(', '));const payload=bulkRows.map(x=>({name:x.name,roll_no:x.roll_no,password:x.password,class_id:cmap.get(x.className.toLowerCase()),course:'SCHOOL',school_group_id:x.groupName?gmap.get(x.groupName.toLowerCase()):null}));try{const j=await fn({action:'createStudents',students:payload});const ok=(j.results||[]).filter(x=>x.success),fail=(j.results||[]).filter(x=>!x.success);document.getElementById('app').innerHTML=`${header('Bulk Import Result')}<div class="card"><div class="success">${ok.length} student(s) created.</div>${fail.length?msg(fail.map(x=>`${x.name||''} — Roll ${x.roll_no||''}: ${x.error}`).join('\n')):''}<div class="actions"><button onclick="load().then(home)">Dashboard</button><button class="secondary" onclick="bulkImport()">Add More</button></div></div>`}catch(e){alert(e.message)}}
function manageStudents(){const classOptions=classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join(''),groupOptions=`<option value="">No subdivision</option>${groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}`;document.getElementById('app').innerHTML=`${header('School Students')}<div class="card"><div class="searchgrid"><input id="ss" placeholder="Search name / roll" oninput="renderStudentTable()"><select id="sf" onchange="renderStudentTable()"><option value="all">All Classes</option>${classOptions}</select><select id="sgf" onchange="renderStudentTable()"><option value="all">All Sub-divisions</option>${groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div><div id="studentTable" style="overflow:auto;margin-top:12px"></div><button class="secondary" onclick="home()" style="margin-top:12px">← Dashboard</button></div>`;renderStudentTable()}
function renderStudentTable(){const q=(document.getElementById('ss')?.value||'').toLowerCase(),cf=document.getElementById('sf')?.value||'all',gf=document.getElementById('sgf')?.value||'all';const rows=students.filter(s=>(!q||`${s.full_name} ${s.roll_no}`.toLowerCase().includes(q))&&(cf==='all'||s.class_id===cf)&&(gf==='all'||s.school_group_id===gf));studentTable.innerHTML=`<table><thead><tr><th>Student</th><th>Roll No</th><th>Class</th><th>Subdivision</th><th>Actions</th></tr></thead><tbody>${rows.map(s=>`<tr><td><b>${esc(s.full_name)}</b></td><td>${esc(s.roll_no||'—')}</td><td>${esc(s.className)}</td><td>${esc(groups.find(g=>g.id===s.school_group_id)?.name||'—')}</td><td><div class="actions"><button onclick="editStudent('${s.id}')">✎ Edit</button><button class="secondary" onclick="changeClass('${s.id}')">Change Class</button><button class="secondary" onclick="changeGroup('${s.id}')">Subdivision</button><button class="danger" onclick="deleteStudent('${s.id}')">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="5">No School students found.</td></tr>'}</tbody></table>`}
async function editStudent(id){const s=students.find(x=>x.id===id);if(!s)return;const name=prompt('Student Name:',s.full_name||'');if(name===null)return;const pass=prompt('New Password (leave blank to keep current):','');try{await fn({action:'setStudentName',student_id:id,full_name:name.trim()});if(pass!==null&&pass!=='')await fn({action:'setStudentPassword',student_id:id,password:pass});await load();manageStudents()}catch(e){alert(e.message)}}
async function changeClass(id){const s=students.find(x=>x.id===id);const choice=prompt(`Change class for ${s.full_name}.\n\n${classes.map((c,i)=>`${i+1}. ${c.name}`).join('\n')}\n\nEnter class number:`);if(choice===null)return;const n=Number(choice)-1;if(!classes[n])return alert('Invalid class.');try{await fn({action:'setStudentClass',student_id:id,class_id:classes[n].id});await load();manageStudents()}catch(e){alert(e.message)}}
async function changeGroup(id){const s=students.find(x=>x.id===id);const text=`${groups.map((g,i)=>`${i+1}. ${g.name}`).join('\n')}\n\nEnter number, or 0 for no subdivision.`;const v=prompt(text,groups.findIndex(g=>g.id===s.school_group_id)>=0?String(groups.findIndex(g=>g.id===s.school_group_id)+1):'0');if(v===null)return;const n=Number(v);if(n!==0&&!groups[n-1])return alert('Invalid subdivision.');try{await fn({action:'setStudentSchoolGroup',student_id:id,school_group_id:n===0?null:groups[n-1].id});await load();manageStudents()}catch(e){alert(e.message)}}
async function deleteStudent(id){const s=students.find(x=>x.id===id);if(!confirm(`Delete ${s.full_name}? This removes the login account and related records.`))return;try{await fn({action:'deleteStudent',student_id:id});await load();manageStudents()}catch(e){alert(e.message)}}
function manageClasses(){document.getElementById('app').innerHTML=`${header('School Classes')}<div class="card"><h2>Create Class</h2><label>Class Name</label><input id="cn" placeholder="Class VIII"><label>Description</label><textarea id="cd"></textarea><button onclick="saveClass()">+ Create Class</button></div><div class="card"><h2>Existing Classes</h2>${classes.map(c=>`<div class="student-card"><b>${esc(c.name)}</b><div class="muted">${esc(c.description||'')}</div><div class="small">${students.filter(s=>s.class_id===c.id).length} School student(s)</div></div>`).join('')||'<p class="muted">No classes.</p>'}<button class="secondary" onclick="home()">← Dashboard</button></div>`}
async function saveClass(){if(!cn.value.trim())return alert('Enter class name.');const {error}=await sb.from('classes').insert({name:cn.value.trim(),description:cd.value.trim(),teacher_id:teacher.id,course:'SCHOOL'});if(error)return alert(error.message);await load();manageClasses()}
function manageGroups(){document.getElementById('app').innerHTML=`${header('School Course Sub-divisions')}<div class="card"><h2>▣ Create Sub-division</h2><p class="muted">Create subdivisions under a specific School Class. Example: Class VIII → Section A, Section B.</p><label>Class</label><select id="gclass">${classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><label>Sub-division Name</label><input id="gn" placeholder="Section A"><label>Description</label><textarea id="gd"></textarea><button onclick="saveGroup()">+ Create Sub-division</button></div><div class="card"><h2>Existing Sub-divisions</h2>${groups.map(g=>`<div class="student-card"><b>${esc(g.name)}</b><div class="muted">Class: ${esc(classes.find(c=>c.id===g.class_id)?.name||'Unassigned')}</div><div class="muted">${esc(g.description||'')}</div><div class="small">${students.filter(s=>s.school_group_id===g.id).length} student(s)</div><div class="actions" style="margin-top:8px"><button class="secondary" onclick="renameGroup('${g.id}')">✎ Rename</button><button class="danger" onclick="deleteGroup('${g.id}')">Delete</button></div></div>`).join('')||'<p class="muted">No subdivisions created yet.</p>'}<button class="secondary" onclick="home()">← Dashboard</button></div>`}
async function saveGroup(){if(!gn.value.trim())return alert('Enter subdivision name.');if(!gclass.value)return alert('Select a Class.');const {error}=await sb.from('school_course_groups').insert({name:gn.value.trim(),description:gd.value.trim(),teacher_id:teacher.id,class_id:gclass.value});if(error)return alert(error.message);await load();manageGroups()}
async function renameGroup(id){const g=groups.find(x=>x.id===id);const n=prompt('Subdivision name:',g.name);if(n===null||!n.trim())return;const {error}=await sb.from('school_course_groups').update({name:n.trim()}).eq('id',id).eq('teacher_id',teacher.id);if(error)return alert(error.message);await load();manageGroups()}
async function deleteGroup(id){if(students.some(s=>s.school_group_id===id))return alert('Move students out of this subdivision before deleting it.');if(!confirm('Delete this subdivision?'))return;const {error}=await sb.from('school_course_groups').delete().eq('id',id).eq('teacher_id',teacher.id);if(error)return alert(error.message);await load();manageGroups()}
async function newAssessment(){
 document.getElementById('app').innerHTML=`${header('New School Assessment')}<div class="card">
 <label>Assessment Name</label><input id="at" placeholder="Mathematics Unit Test 1">
 <label>Subject</label><input id="as" placeholder="Mathematics">
 <label>Class</label><select id="ac" onchange="refreshAssessmentGroups()">${classes.map((c,i)=>`<option value="${c.id}" ${i===0?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
 <label>Sub-division (optional)</label><select id="ag"><option value="">Entire class</option></select>
 <div class="notice small">If a sub-division is selected, only students in that sub-division can see the assessment. Otherwise all students in the selected class can see it.</div>
 <label>Deadline</label><input id="ad" type="datetime-local">
 <div class="actions"><button onclick="saveAssessment()">Save & Add Questions</button><button class="secondary" onclick="home()">Cancel</button></div>
 </div></div>`;
 refreshAssessmentGroups();
}
function refreshAssessmentGroups(){const classId=document.getElementById('ac')?.value||'',sel=document.getElementById('ag');if(!sel)return;const gs=groups.filter(g=>g.class_id===classId);sel.innerHTML='<option value="">Entire class</option>'+gs.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}
async function saveAssessment(){if(!at.value.trim())return alert('Enter assessment name.');if(!ac.value)return alert('Select a class.');const payload={title:at.value.trim(),subject:as.value.trim(),class_id:ac.value,school_group_id:ag.value||null,deadline:ad.value?new Date(ad.value).toISOString():null,created_by:teacher.id};const {data,error}=await sb.from('school_assessments').insert(payload).select().single();if(error)return alert(error.message);editQuestions(data.id)}
async function editQuestions(id){const {data:a,error:ae}=await sb.from('school_assessments').select('*').eq('id',id).eq('created_by',teacher.id).single();if(ae)return alert(ae.message);const {data:q,error:qe}=await sb.from('school_questions').select('*').eq('assessment_id',id).order('question_order');if(qe)return alert(qe.message);const group=groups.find(g=>g.id===a.school_group_id);const total=(q||[]).reduce((n,x)=>n+Number(x.marks||0),0);document.getElementById('app').innerHTML=`${header('Questions — '+esc(a.title))}<div class="card"><div class="notice">Class: <b>${esc(classes.find(c=>c.id===a.class_id)?.name||'—')}</b> &nbsp; | &nbsp; Sub-division: <b>${esc(group?.name||'Entire class')}</b> &nbsp; | &nbsp; Total Marks: <b>${total}</b></div><div id="qbox">${(q||[]).map(x=>`<div class="student-card"><label>Question ${x.question_order}</label><textarea id="qt_${x.id}">${esc(x.question_text)}</textarea><label>Marks</label><input id="qm_${x.id}" type="number" min="0" step="0.5" value="${x.marks}"><div class="actions"><button onclick="saveQ('${x.id}','${id}')">Save</button><button class="danger" onclick="delQ('${x.id}','${id}')">Delete</button></div></div>`).join('')}</div><div class="actions"><button onclick="addQ('${id}')">+ Add Question</button><button onclick="reviewAssessment('${id}')">📊 Review Submissions</button><button class="secondary" onclick="home()">Back</button></div></div>`}
async function addQ(id){const {data:q}=await sb.from('school_questions').select('question_order').eq('assessment_id',id).order('question_order',{ascending:false}).limit(1);const n=(q?.[0]?.question_order||0)+1;const {error}=await sb.from('school_questions').insert({assessment_id:id,question_order:n,question_text:'New question',marks:1});if(error)return alert(error.message);editQuestions(id)}
async function saveQ(qid,aid){const t=document.getElementById('qt_'+qid),m=document.getElementById('qm_'+qid);const value=Number(m.value);if(!t?.value.trim())return alert('Question text is required.');if(!Number.isFinite(value)||value<0)return alert('Marks must be 0 or more.');const {error}=await sb.from('school_questions').update({question_text:t.value.trim(),marks:value}).eq('id',qid);if(error)return alert(error.message);editQuestions(aid)}
async function delQ(qid,aid){if(!confirm('Delete question?'))return;const {error}=await sb.from('school_questions').delete().eq('id',qid);if(error)return alert(error.message);editQuestions(aid)}
async function reviewAssessment(id){
 const {data:a,error:ae}=await sb.from('school_assessments').select('*').eq('id',id).eq('created_by',teacher.id).single();
 if(ae)return alert(ae.message);
 const {data:q,error:qe}=await sb.from('school_questions').select('*').eq('assessment_id',id).order('question_order');
 if(qe)return alert(qe.message);
 const {data:subs,error:se}=await sb.from('school_answer_submissions').select('id,assessment_id,question_id,student_id,submission_no,is_current,status,awarded_marks,teacher_comment,submitted_at,reviewed_at').eq('assessment_id',id).eq('is_current',true).order('submitted_at',{ascending:false});
 if(se)return alert(se.message);
 const sids=[...new Set((subs||[]).map(x=>x.student_id))];
 const {data:ps,error:pe}=sids.length?await sb.from('profiles').select('id,full_name,roll_no').in('id',sids):{data:[],error:null};
 if(pe)return alert(pe.message);
 const subids=(subs||[]).map(x=>x.id);
 const {data:files,error:fe}=subids.length?await sb.from('school_answer_files').select('id,submission_id,page_no,file_name,drive_url,mime_type,file_size_bytes').in('submission_id',subids).order('page_no'):{data:[],error:null};
 if(fe)return alert(fe.message);
 const pmap=new Map((ps||[]).map(x=>[x.id,x]));
 const qmap=new Map((q||[]).map(x=>[x.id,x]));
 const fmap=new Map();
 for(const f of(files||[])){if(!fmap.has(f.submission_id))fmap.set(f.submission_id,[]);fmap.get(f.submission_id).push(f)}
 const grouped=new Map();
 for(const x of(subs||[])){if(!grouped.has(x.student_id))grouped.set(x.student_id,{student:pmap.get(x.student_id)||{},items:[]});grouped.get(x.student_id).items.push(x)}
 let html='';
 html+=header('Review — '+esc(a.title));
 html+='<div class="card"><div class="notice">Open each submitted file in Google Drive, enter marks, add feedback, then save the review.</div>';
 if(!grouped.size) html+='<p class="muted">No students have submitted answers yet.</p>';
 for(const g of grouped.values()){
   html+='<div class="student-card"><div class="question-head"><div><h3 style="margin:0">'+esc(g.student.full_name||'Student')+'</h3><div class="muted">Roll No: '+esc(g.student.roll_no||'—')+'</div></div></div>';
   for(const qq of(q||[])){
     const x=g.items.find(i=>i.question_id===qq.id); const fs=x?(fmap.get(x.id)||[]):[];
     html+='<div class="assignment"><div class="question-head"><div><b>Q'+qq.question_order+'</b><div class="small muted" style="white-space:pre-wrap;margin-top:4px">'+esc(qq.question_text)+'</div></div><span class="tag">Max '+esc(qq.marks)+' Marks</span></div>';
     if(!x){html+='<div class="muted small" style="margin-top:9px">Not submitted yet.</div>';}
     else{
       html+='<div class="small" style="margin-top:9px"><b>Submitted:</b> '+new Date(x.submitted_at).toLocaleString()+' &nbsp; <b>Status:</b> '+esc(x.status)+'</div>';
       html+='<div class="actions" style="margin-top:9px">';
       for(const f of fs){html+='<a class="btn" target="_blank" rel="noopener" href="'+esc(f.drive_url||'#')+'">📄 Page '+esc(f.page_no)+'</a>'}
       if(!fs.length)html+='<span class="muted small">No files.</span>';
       html+='</div>';
       html+='<div class="grid" style="margin-top:10px"><div><label>Awarded Marks / '+esc(qq.marks)+'</label><input id="rm_'+x.id+'" type="number" min="0" max="'+esc(qq.marks)+'" step="0.5" value="'+esc(x.awarded_marks??'')+'"></div><div><label>Teacher Comment</label><input id="rc_'+x.id+'" value="'+esc(x.teacher_comment||'')+'"></div></div>';
       html+='<div class="actions" style="margin-top:9px"><button onclick="saveReview(\''+x.id+'\',\''+qq.marks+'\',\''+id+'\')">Save Review</button></div>';
     }
     html+='</div>';
   }
   html+='</div>';
 }
 html+='<div class="actions" style="margin-top:15px"><button class="secondary" onclick="home()">← Dashboard</button><button class="secondary" onclick="editQuestions(\''+id+'\')">← Questions</button></div></div>';
 document.getElementById('app').innerHTML=html;
}
async function saveReview(submissionId,maxMarks,assessmentId){const marks=Number(document.getElementById('rm_'+submissionId)?.value);const comment=document.getElementById('rc_'+submissionId)?.value||'';if(!Number.isFinite(marks)||marks<0||marks>Number(maxMarks))return alert('Marks must be between 0 and '+maxMarks+'.');const {error}=await sb.from('school_answer_submissions').update({awarded_marks:marks,teacher_comment:comment,status:'reviewed',reviewed_at:new Date().toISOString(),reviewed_by:teacher.id}).eq('id',submissionId);if(error)return alert(error.message);reviewAssessment(assessmentId)}
async function deleteAssessment(id){if(!confirm('Delete this assessment? All questions and answer submissions for it will also be removed.'))return;const {error}=await sb.from('school_assessments').delete().eq('id',id).eq('created_by',teacher.id);if(error)return alert(error.message);await load();home()}
async function logout(){await sb.auth.signOut();location.replace('teacher-login.html')}
init();
</script></body></html>
