body><div class="wrap"><div id="app"><div class="card">Loading…</div></div></div><script>
const SUPABASE_URL='https://jupefjdquakqsizapzbv.supabase.co',SUPABASE_KEY='sb_publishable_eUcdkv0kFJjkifHQwQBUwg_VcY_lgTP',CREATE_STUDENT_FN='create-students';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let teacher=null,students=[],classes=[],groups=[],assessments=[],bulkRows=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function msg(t,ok=false){return `<div class="${ok?'success':'notice'}">${esc(t)}</div>`}
async function fn(body){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('Please login again.');const r=await fetch(`${SUPABASE_URL}/functions/v1/${CREATE_STUDENT_FN}`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`,'apikey':SUPABASE_KEY},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw Error(j.error||'Request failed');return j}
async function init(){
  try{
    const {data:{session},error:sessionError}=await sb.auth.getSession();
    if(sessionError)throw sessionError;
    if(!session)return location.replace('teacher-login.html');
    const {data:p,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
    if(error)throw error;
    if(p?.role!=='teacher'){await sb.auth.signOut();return location.replace('teacher-login.html')}
    teacher=p;
    await load();
    home();
  }catch(e){
    console.error('Teacher dashboard initialization failed:',e);
    const app=document.getElementById('app');
    if(app)app.innerHTML='<div class="card"><h2>Teacher Dashboard could not be loaded</h2><p>'+esc(e?.message||String(e))+'</p><p>Please refresh the page. If the problem continues, check the browser console and Supabase connection.</p><button onclick="location.reload()">Refresh</button></div>';
  }
}
async function load(){
  const results=await Promise.allSettled([
    fn({action:'listSchoolStudents'}),
    sb.from('classes').select('id,name,description,course').eq('teacher_id',teacher.id).eq('course','SCHOOL').order('name'),
    sb.from('school_course_groups').select('*').eq('teacher_id',teacher.id).order('name'),
    sb.from('school_assessments').select('*').eq('created_by',teacher.id).order('created_at',{ascending:false})
  ]);
  const schoolStudents=results[0].status==='fulfilled'?results[0].value:null;
  const c=results[1].status==='fulfilled'?results[1].value.data:null;
  const g=results[2].status==='fulfilled'?results[2].value.data:null;
  const a=results[3].status==='fulfilled'?results[3].value.data:null;
  students=schoolStudents?.students||[];
  classes=c||[];
  groups=g||[];
  assessments=a||[];
  students.forEach(s=>{s.className=s.className||classes.find(c=>c.id===s.class_id)?.name||'—'});
  window.__schoolDashboardLoadErrors=results.map((r,i)=>r.status==='rejected'?{source:i,error:r.reason?.message||String(r.reason)}:null).filter(Boolean);
}
function header(title){return `<div class="top"><div><div class="tag">🏫 SCHOOL COURSE</div><h1 style="margin:7px 0">${title}</h1><div class="muted">Teacher: ${esc(teacher.full_name||'Teacher')}</div></div><div class="actions"><button class="secondary" onclick="home()">🏠 Home</button><button class="secondary" onclick="location.href='main.html?mode=teacher&portal=JNVST'">JNVST Dashboard</button><button onclick="logout()">Logout</button></div></div>`}
function home(){document.getElementById('app').innerHTML=`${header('School Teacher Dashboard')}<div class="grid"><div class="card"><div class="muted">School Students</div><div class="stat">${students.length}</div></div><div class="card"><div class="muted">School Classes</div><div class="stat">${classes.filter(c=>students.some(s=>s.class_id===c.id)).length}</div></div><div class="card"><div class="muted">Sub-divisions</div><div class="stat">${groups.length}</div></div><div class="card"><div class="muted">Assessments</div><div class="stat">${assessments.length}</div></div></div><div class="card">
<h2>👨‍🏫 Teacher Tools</h2>
<div class="actions">
<button onclick="newAssessment()">📝 New School Assessment</button>
<button onclick="bulkQuestionUpload()">📥 Bulk Questions Upload</button><button onclick="questionBankHome()">📚 Question Bank</button><button onclick="generateBankPaper()">📄 Generate Paper</button>
<button onclick="location.href='main.html?mode=teacher&portal=SCHOOL&action=newAssignment'">+ Create Assignment</button>
<button onclick="location.href='main.html?mode=teacher&portal=SCHOOL&action=manageAssignments'">✎ Manage Assignments</button>
<button onclick="manageSchoolAssessments()">📝 Manage School Assessments</button>

<button onclick="manageClasses()">🏫 Manage Classes</button>
<button onclick="manageGroups()">▣ School Course Sub-divisions</button>
<button onclick="location.href='main.html?mode=teacher&portal=SCHOOL&action=downloadAllResultsExcel'">⬇ All Results (Excel)</button>
</div>
</div><div class="card" style="border:2px solid #2563eb;background:#fbfdff"><h2>📝 School Assessments</h2><p class="muted">Create assessments, add questions, upload questions, review submissions, and manage recipients.</p><div class="actions" style="margin-top:12px"><button onclick="newAssessment()">+ New School Assessment</button><button onclick="manageSchoolAssessments()">📝 Manage School Assessments</button></div></div>`}
function addStudent(){if(!classes.length)return alert('Create a School class first.');document.getElementById('app').innerHTML=`${header('Add School Student')}<div class="card"><label>Student Name</label><input id="sn"><label>Roll No</label><input id="sr"><label>Password</label><input id="sp" type="text" placeholder="At least 6 characters"><label>Class</label><select id="sc" onchange="refreshSchoolStudentGroups()">${classes.map((c,i)=>`<option value="${c.id}" ${i===0?'selected':''}>${esc(c.name)}</option>`).join('')}</select><label>School Course Sub-division</label><select id="sg"></select><div id="sm"></div><div class="actions" style="margin-top:12px"><button onclick="saveStudent()">Create Student</button><button class="secondary" onclick="home()">Cancel</button></div></div>`;refreshSchoolStudentGroups()}
function refreshSchoolStudentGroups(){const classId=document.getElementById('sc')?.value,sel=document.getElementById('sg');if(!sel)return;const opts=groups.filter(g=>g.class_id===classId).map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('');sel.innerHTML='<option value="">No subdivision</option>'+opts}
async function saveStudent(){try{const j=await fn({action:'createStudents',students:[{name:sn.value.trim(),roll_no:sr.value.trim(),password:sp.value,class_id:sc.value,course:'SCHOOL',school_group_id:sg.value||null}]});const r=j.results?.[0];if(!r?.success)throw Error(r?.error||'Could not create student');alert('Student created successfully.');await load();home()}catch(e){sm.innerHTML=msg(e.message)}}
function bulkImport(){bulkRows=[];document.getElementById('app').innerHTML=`${header('Bulk School Students — Excel')}<div class="card"><p><b>Columns:</b> Name | Roll No | Class | Password | Subdivision (optional)</p><div class="notice">Course is automatically set to <b>SCHOOL</b>. Email is not required.</div><label>Excel file</label><input type="file" accept=".xlsx,.xls" onchange="readBulk(event)"><div id="bulkPreview"></div><div class="actions"><button onclick="uploadBulk()">Create All Students</button><button class="secondary" onclick="home()">Cancel</button></div></div>`}
function readBulk(ev){const f=ev.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});const h=raw[0].map(x=>String(x).trim().toLowerCase().replace(/[_\s]+/g,' ')),idx=(...a)=>a.map(x=>h.indexOf(x)).find(x=>x>=0);const ni=idx('name','student name'),ri=idx('roll no','roll number'),ci=idx('class','class name'),pi=idx('password'),gi=idx('subdivision','school subdivision','school course subdivision');if([ni,ri,ci,pi].some(x=>x<0))throw Error('Required columns: Name, Roll No, Class, Password.');bulkRows=raw.slice(1).map((row,i)=>({row:i+2,name:String(row[ni]||'').trim(),roll_no:String(row[ri]||'').trim(),className:String(row[ci]||'').trim(),password:String(row[pi]||''),groupName:gi>=0?String(row[gi]||'').trim():''})).filter(x=>x.name||x.roll_no||x.className||x.password);const errs=[];bulkRows.forEach(x=>{if(!x.name)errs.push(`Row ${x.row}: Name missing`);if(!x.roll_no)errs.push(`Row ${x.row}: Roll No missing`);if(!x.className)errs.push(`Row ${x.row}: Class missing`);if(!x.password||x.password.length<6)errs.push(`Row ${x.row}: Password must contain at least 6 characters`)});if(errs.length){bulkPreview.innerHTML=msg(errs.join(' | '));return}bulkPreview.innerHTML=`<div class="success">Loaded ${bulkRows.length} rows.</div><div style="overflow:auto"><table><tr><th>Name</th><th>Roll</th><th>Class</th><th>Password</th><th>Subdivision</th></tr>${bulkRows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.roll_no)}</td><td>${esc(x.className)}</td><td>${esc(x.password)}</td><td>${esc(x.groupName)}</td></tr>`).join('')}</table></div>`}catch(e){bulkPreview.innerHTML=msg('Could not read Excel: '+e.message)}};r.readAsArrayBuffer(f)}
async function uploadBulk(){if(!bulkRows.length)return alert('Upload an Excel file first.');const cmap=new Map(classes.map(c=>[c.name.trim().toLowerCase(),c.id])),gmap=new Map(groups.map(g=>[g.name.trim().toLowerCase(),g.id]));const bad=bulkRows.filter(x=>!cmap.has(x.className.toLowerCase())|| (x.groupName&&!gmap.has(x.groupName.toLowerCase())));if(bad.length)return alert('Class or subdivision not found: '+bad.map(x=>x.name).join(', '));const payload=bulkRows.map(x=>({name:x.name,roll_no:x.roll_no,password:x.password,class_id:cmap.get(x.className.toLowerCase()),course:'SCHOOL',school_group_id:x.groupName?gmap.get(x.groupName.toLowerCase()):null}));try{const j=await fn({action:'createStudents',students:payload});const ok=(j.results||[]).filter(x=>x.success),fail=(j.results||[]).filter(x=>!x.success);document.getElementById('app').innerHTML=`${header('Bulk Import Result')}<div class="card"><div class="success">${ok.length} student(s) created.</div>${fail.length?msg(fail.map(x=>`${x.name||''} — Roll ${x.roll_no||''}: ${x.error}`).join('\n')):''}<div class="actions"><button onclick="load().then(home)">Dashboard</button><button class="secondary" onclick="bulkImport()">Add More</button></div></div>`}catch(e){alert(e.message)}}
function manageStudents(){const classOptions=classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');document.getElementById('app').innerHTML=`${header('School Students')}<div class="card"><div class="searchgrid"><input id="ss" placeholder="Search name / roll" oninput="renderStudentTable()"><select id="sf" onchange="renderStudentTable()"><option value="all">All Classes</option>${classOptions}</select><select id="sgf" onchange="renderStudentTable()"><option value="all">All Sub-divisions</option>${groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div><div id="studentTable" style="overflow:auto;margin-top:12px"></div><button class="secondary" onclick="home()" style="margin-top:12px">← Dashboard</button></div>`;renderStudentTable()}
function renderStudentTable(){const q=(document.getElementById('ss')?.value||'').toLowerCase(),cf=document.getElementById('sf')?.value||'all',gf=document.getElementById('sgf')?.value||'all';const rows=students.filter(s=>(!q||`${s.full_name} ${s.roll_no}`.toLowerCase().includes(q))&&(cf==='all'||s.class_id===cf)&&(gf==='all'||s.school_group_id===gf));document.getElementById('studentTable').innerHTML=`<table><thead><tr><th>Student</th><th>Roll No</th><th>Password</th><th>Class</th><th>Subdivision</th><th>Actions</th></tr></thead><tbody>${rows.map(s=>`<tr><td><b>${esc(s.full_name)}</b></td><td>${esc(s.roll_no||'—')}</td><td><code>${esc(s.password||'—')}</code></td><td>${esc(s.className)}</td><td>${esc(groups.find(g=>g.id===s.school_group_id)?.name||'—')}</td><td><div class="actions"><button onclick="editStudent('${s.id}')">✎ Edit All</button><button class="secondary" onclick="changeClass('${s.id}')">Change Class</button><button class="secondary" onclick="changeGroup('${s.id}')">Subdivision</button><button class="danger" onclick="deleteStudent('${s.id}')">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="6">No School students found.</td></tr>'}</tbody></table>`}
function studentEditForm(s){const classOptions=classes.map(c=>`<option value="${c.id}" ${c.id===s.class_id?'selected':''}>${esc(c.name)}</option>`).join('');const classGroups=groups.filter(g=>g.class_id===s.class_id);const groupOptions=`<option value="">No subdivision</option>${classGroups.map(g=>`<option value="${g.id}" ${g.id===s.school_group_id?'selected':''}>${esc(g.name)}</option>`).join('')}`;document.getElementById('app').innerHTML=`${header('Edit School Student')}<div class="card"><div class="notice">You can edit <b>Name, Roll No, Password, Class and Subdivision</b>. Leave Password blank to keep the current password.</div><div class="grid"><div><label>Student Name</label><input id="esName" value="${esc(s.full_name||'')}"></div><div><label>Roll No</label><input id="esRoll" value="${esc(s.roll_no||'')}"></div><div><label>Password</label><input id="esPassword" value="" placeholder="Leave blank to keep current"></div><div><label>Class</label><select id="esClass" onchange="refreshEditStudentGroups()">${classOptions}</select></div><div><label>Subdivision</label><select id="esGroup">${groupOptions}</select></div></div><div id="esMsg"></div><div class="actions"><button onclick="saveStudentEdit('${s.id}')">💾 Save All Changes</button><button class="secondary" onclick="manageStudents()">Cancel</button></div></div>`}
function refreshEditStudentGroups(){const classId=document.getElementById('esClass')?.value,sel=document.getElementById('esGroup');if(!sel)return;const opts=groups.filter(g=>g.class_id===classId).map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('');sel.innerHTML='<option value="">No subdivision</option>'+opts}
async function editStudent(id){const s=students.find(x=>x.id===id);if(!s)return;studentEditForm(s)}

function normalizeBulkHeader(v){
  return String(v??'').trim().toLowerCase().replace(/[_\s]+/g,' ');
}
function bulkCol(headers,...names){
  for(const n of names){
    const i=headers.indexOf(normalizeBulkHeader(n));
    if(i>=0)return i;
  }
  return -1;
}
function showBulkStatus(t,ok=false){
  const el=document.getElementById('bqStatus');
  if(el)el.innerHTML=msg(t,ok);
}
function readBulkAssessmentExcel(ev){
  const f=ev.target.files?.[0]; if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(!raw.length)throw Error('The Excel file is empty.');
      const h=raw[0].map(normalizeBulkHeader);
      const ni=bulkCol(h,'question no','question number','no','#');
      const qi=bulkCol(h,'question','question text');
      const mi=bulkCol(h,'marks','mark');
      const hi=bulkCol(h,'hint','hints');
      if(qi<0||mi<0)throw Error('Required columns: Question and Marks. Question No and Hint are optional.');
      bulkAssessmentRows=raw.slice(1).map((row,i)=>({
        row:i+2,
        no:ni>=0?String(row[ni]||i+1).trim():String(i+1),
        question:String(row[qi]||'').trim(),
        marks:Number(row[mi]),
        hint:hi>=0?String(row[hi]||'').trim():''
      })).filter(x=>x.question);
      const bad=bulkAssessmentRows.filter(x=>!Number.isFinite(x.marks)||x.marks<0);
      if(bad.length)throw Error('Invalid marks in row(s): '+bad.map(x=>x.row).join(', '));
      document.getElementById('bqExcelPreview').innerHTML=
        `<div class="success">Loaded ${bulkAssessmentRows.length} question(s).</div>
         <div style="overflow:auto;max-height:280px"><table><thead><tr><th>#</th><th>Question</th><th>Marks</th><th>Hint</th></tr></thead>
         <tbody>${bulkAssessmentRows.map(x=>`<tr><td>${esc(x.no)}</td><td style="white-space:pre-wrap">${esc(x.question)}</td><td>${esc(x.marks)}</td><td>${esc(x.hint||'—')}</td></tr>`).join('')}</tbody></table></div>`;
      showBulkStatus(`${bulkAssessmentRows.length} Excel question(s) ready to import.`,true);
    }catch(e){
      bulkAssessmentRows=[];
      document.getElementById('bqExcelPreview').innerHTML=msg('Could not read Excel: '+e.message);
    }
  };
  r.readAsArrayBuffer(f);
}

let bulkAssessmentPdfMeta={};
function readBulkAssessmentKey(ev){
  const f=ev.target.files?.[0]; if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(!raw.length)throw Error('The Excel file is empty.');
      const h=raw[0].map(normalizeBulkHeader);
      const ni=bulkCol(h,'question no','question number','no','#');
      const mi=bulkCol(h,'marks','mark');
      const hi=bulkCol(h,'hint','hints');
      if(mi<0)throw Error('Required column: Marks.');
      bulkAssessmentPdfMeta={};
      raw.slice(1).forEach((row,i)=>{
        const no=ni>=0?String(row[ni]||i+1).trim():String(i+1);
        const marks=Number(row[mi]);
        if(Number.isFinite(marks))bulkAssessmentPdfMeta[no]={marks,hint:hi>=0?String(row[hi]||'').trim():''};
      });
      const count=Object.keys(bulkAssessmentPdfMeta).length;
      document.getElementById('bqPdfPreview').innerHTML=`<div class="success">${count} marks row(s) loaded.</div>`;
      showBulkStatus('PDF marks/hints are ready. Now upload the PDF if you have not already done so.',true);
    }catch(e){
      bulkAssessmentPdfMeta={};
      document.getElementById('bqPdfPreview').innerHTML=msg('Could not read marks Excel: '+e.message);
    }
  };
  r.readAsArrayBuffer(f);
}

async function readBulkAssessmentSolutionPdf(ev){
  const f=ev.target.files?.[0]; if(!f)return;
  const box=document.getElementById('bqSolutionPdfPreview');
  if(!box)return;
  box.innerHTML=msg('Rendering solution PDF pages as images — OCR is not used…',true);
  try{
    const mod=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');
    mod.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
    const pdf=await mod.getDocument({data:await f.arrayBuffer()}).promise;
    const pages=[];
    for(let p=1;p<=pdf.numPages;p++){
      const page=await pdf.getPage(p);
      const base=page.getViewport({scale:1});
      const maxWidth=1800;
      const scale=Math.min(2.5,Math.max(1.6,maxWidth/base.width));
      const viewport=page.getViewport({scale});
      const canvas=document.createElement('canvas');
      const ctx=canvas.getContext('2d',{alpha:false});
      canvas.width=Math.ceil(viewport.width);
      canvas.height=Math.ceil(viewport.height);
      ctx.fillStyle='#fff';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      await page.render({canvasContext:ctx,viewport}).promise;
      const cropped=cropSchoolQuestionWhiteMargins(canvas);
      pages.push({no:String(p),image_data:cropped.toDataURL('image/jpeg',0.93)});
    }
    bulkAssessmentSolutionPdfPages=pages;
    const questionCount=bulkAssessmentPdfPages.length;
    const mismatch=questionCount&&questionCount!==pages.length;
    box.innerHTML=`<div class="${mismatch?'notice':'success'}">Prepared <b>${pages.length}</b> solution page(s) as cropped images.${mismatch?` <b>Warning:</b> Questions PDF has ${questionCount} page(s), so the counts do not match.`:''}</div>
      <div class="small muted" style="margin-top:8px">Solutions are mapped in order: Solution page 1 → first newly uploaded question, page 2 → second, and so on.</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px">
        ${pages.slice(0,12).map(x=>`<div style="border:1px solid #dbe3ee;border-radius:10px;padding:6px;background:#fff"><img src="${x.image_data}" style="width:100%;display:block;border-radius:7px" alt="Solution page ${x.no}"><div class="small muted" style="margin-top:4px;text-align:center">Solution ${x.no}</div></div>`).join('')}
      </div>
      ${pages.length>12?`<div class="small muted" style="margin-top:8px">Showing first 12 previews.</div>`:''}`;
    showBulkStatus(`${pages.length} solution PDF page(s) converted to cropped images.`,true);
  }catch(e){
    bulkAssessmentSolutionPdfPages=[];
    box.innerHTML=msg('Could not convert solution PDF to images: '+e.message);
  }
}

function cropSchoolQuestionWhiteMargins(sourceCanvas){
  const ctx=sourceCanvas.getContext('2d',{willReadFrequently:true});
  const w=sourceCanvas.width, h=sourceCanvas.height;
  const data=ctx.getImageData(0,0,w,h).data;
  const threshold=248;
  let minX=w,minY=h,maxX=-1,maxY=-1;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const i=(y*w+x)*4;
      const r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
      if(a>10 && (r<threshold || g<threshold || b<threshold)){
        if(x<minX)minX=x;
        if(x>maxX)maxX=x;
        if(y<minY)minY=y;
        if(y>maxY)maxY=y;
      }
    }
  }
  if(maxX<0)return sourceCanvas;
  const pad=Math.max(12,Math.round(Math.min(w,h)*0.018));
  minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad);
  maxX=Math.min(w-1,maxX+pad); maxY=Math.min(h-1,maxY+pad);
  const out=document.createElement('canvas');
  out.width=maxX-minX+1; out.height=maxY-minY+1;
  out.getContext('2d').drawImage(
    sourceCanvas,minX,minY,out.width,out.height,0,0,out.width,out.height
  );
  return out;
}

async function readBulkAssessmentPdf(ev){
  const f=ev.target.files?.[0]; if(!f)return;
  const box=document.getElementById('bqPdfPreview');
  box.innerHTML=msg('Rendering PDF pages as images — OCR is not used…',true);
  try{
    const mod=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');
    mod.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
    const pdf=await mod.getDocument({data:await f.arrayBuffer()}).promise;
    const pages=[];
    for(let p=1;p<=pdf.numPages;p++){
      const page=await pdf.getPage(p);
      const base=page.getViewport({scale:1});
      const maxWidth=1800;
      const scale=Math.min(2.5,Math.max(1.6,maxWidth/base.width));
      const viewport=page.getViewport({scale});
      const canvas=document.createElement('canvas');
      const ctx=canvas.getContext('2d',{alpha:false});
      canvas.width=Math.ceil(viewport.width);
      canvas.height=Math.ceil(viewport.height);
      ctx.fillStyle='#fff';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      await page.render({canvasContext:ctx,viewport}).promise;

      // IMPORTANT: use rendered pixels only. Do not call getTextContent().
      const cropped=cropSchoolQuestionWhiteMargins(canvas);
      pages.push({
        no:String(p),
        image_data:cropped.toDataURL('image/jpeg',0.93),
        question:''
      });
    }
    bulkAssessmentPdfPages=pages;

    box.innerHTML=`<div class="success">
      Prepared <b>${pages.length}</b> PDF page(s) as question images. No OCR was performed.
      </div>
      <div class="small muted" style="margin-top:8px">
        Each page is stored as an image. Large white margins are trimmed automatically, while the Assamese text, fonts, symbols and page layout are preserved visually.
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px">
        ${pages.slice(0,12).map(x=>`<div style="border:1px solid #dbe3ee;border-radius:10px;padding:6px;background:#fff">
          <img src="${x.image_data}" style="width:100%;display:block;border-radius:7px" alt="PDF page ${x.no}">
          <div class="small muted" style="margin-top:4px;text-align:center">Question ${x.no}</div>
        </div>`).join('')}
      </div>
      ${pages.length>12?`<div class="small muted" style="margin-top:8px">Showing first 12 previews.</div>`:''}`;
    showBulkStatus(`${pages.length} PDF page(s) converted to cropped question images. No OCR used.`,true);
  }catch(e){
    bulkAssessmentPdfPages=[];
    box.innerHTML=msg('Could not convert PDF to images: '+e.message);
  }
}

async function saveBulkAssessmentQuestions(){
  const aid=document.getElementById('bqaAssessment')?.value;
  if(!aid)return alert('Select an assessment.');
  let rows=[];
  if(bulkAssessmentRows.length){
    rows=bulkAssessmentRows.map(x=>({
      assessment_id:aid,
      question_order:0,
      question_text:x.question,
      marks:x.marks,
      hint:x.hint||''
    }));
  }else if(bulkAssessmentPdfPages.length){
    if(!Object.keys(bulkAssessmentPdfMeta).length)return alert('Upload the Marks / Hint Excel for the PDF first.');
    const missing=bulkAssessmentPdfPages.filter(x=>!bulkAssessmentPdfMeta[x.no]||!Number.isFinite(bulkAssessmentPdfMeta[x.no].marks));
    if(missing.length)return alert('Marks are missing for PDF question/page: '+missing.map(x=>x.no).join(', '));
    rows=bulkAssessmentPdfPages.map(x=>{
      const meta=bulkAssessmentPdfMeta[x.no];
      return {
        assessment_id:aid,
        question_order:0,
        question_text:'',
        question_image_data:x.image_data,
        marks:meta.marks,
        hint:meta.hint||''
      };
    });
  }else{
    return alert('Upload an Excel file or a PDF + Marks Excel file first.');
  }

  if(bulkAssessmentSolutionPdfPages.length && bulkAssessmentSolutionPdfPages.length!==rows.length){
    return alert(`Solution PDF page count (${bulkAssessmentSolutionPdfPages.length}) must exactly match the number of newly uploaded questions (${rows.length}).\n\nSolution page 1 maps to the first uploaded question, page 2 to the second, and so on.`);
  }

  try{
    const {data:last,error:le}=await sb.from('school_questions')
      .select('question_order').eq('assessment_id',aid)
      .order('question_order',{ascending:false}).limit(1);
    if(le)throw le;
    let next=(last?.[0]?.question_order||0)+1;
    rows.forEach(x=>x.question_order=next++);
    // PDF questions are stored as real images in Supabase Storage.
    // Keep text as an empty string because school_questions.question_text is NOT NULL.\n    // The PDF/Assamese content itself remains an image; no OCR is used.
    const dbRows=[];
    for(const x of rows){
      let imageUrl=null;
      if(x.question_image_data){
        const path=`${teacher.id}/${aid}/q${x.question_order}-${crypto.randomUUID()}.jpg`;
        const blob=await (await fetch(x.question_image_data)).blob();
        const {error:ue}=await sb.storage.from('school-question-images').upload(
          path,blob,{contentType:'image/jpeg',upsert:false}
        );
        if(ue)throw ue;
        const {data:pu}=sb.storage.from('school-question-images').getPublicUrl(path);
        imageUrl=pu.publicUrl;
      }
      dbRows.push({
        assessment_id:aid,
        question_order:x.question_order,
        question_text:x.question_text||'',
        question_image_url:imageUrl,
        marks:Number(x.marks)||0,
        hint:(x.hint||'').trim()||null
      });
    }
    const {data:insertedQuestions,error}=await sb.from('school_questions').insert(dbRows).select('id,question_order');
    if(error)throw error;

    // Optional Method 2 solution PDF: one cropped image per page, mapped in upload order.
    if(bulkAssessmentSolutionPdfPages.length){
      const insertedByOrder=new Map((insertedQuestions||[]).map(q=>[Number(q.question_order),q]));
      const createdSolutionPaths=[];
      try{
        const solutionRows=[];
        for(let i=0;i<bulkAssessmentSolutionPdfPages.length;i++){
          const page=bulkAssessmentSolutionPdfPages[i];
          const q=insertedByOrder.get(Number(dbRows[i].question_order));
          if(!q)throw Error(`Could not find the newly inserted question for solution page ${i+1}.`);
          const path=`${teacher.id}/${aid}/q${q.question_order}-solution-${crypto.randomUUID()}.jpg`;
          const blob=await (await fetch(page.image_data)).blob();
          const {error:ue}=await sb.storage.from('school-question-solutions').upload(path,blob,{contentType:'image/jpeg',upsert:false});
          if(ue)throw ue;
          createdSolutionPaths.push(path);
          const {data:pu}=sb.storage.from('school-question-solutions').getPublicUrl(path);
          solutionRows.push({
            question_id:q.id,
            solution_type:'file',
            title:`Solution Image ${i+1}`,
            file_name:`solution-page-${i+1}.jpg`,

/* ===================== SCHOOL QUESTION BANK =====================
   Question Bank v1:
   - Chapters
   - bilingual English/Assamese question content
   - ordered TEXT/IMAGE blocks
   - MCQ/SHORT/LONG
   - marks + cognitive level + difficulty
   - bilingual MCQ options, optional option images
   - blueprint paper generation with best-fit cognitive distribution
   - browser-print PDF (Unicode-safe for Assamese)
================================================================= */
let qbChapters=[], qbQuestions=[], qbBlocks=[], qbOptions=[];
const QB_LEVELS=['Knowledge','Understanding','Application','HOTS'];
const QB_TYPES=['MCQ','Short','Long'];
const QB_MARKS=[1,2,3,4,5,6,10];
let gpFixedIds=new Set(), gpSelectedChapterIds=new Set(), gpChapterRangeValues={};
function gpRootChapters(){return qbChapters.filter(c=>!c.parent_chapter_id).sort((a,b)=>qbChapterCode(a).localeCompare(qbChapterCode(b),undefined,{numeric:true}));}
function gpChapterRuleRows(){return gpRootChapters().map(c=>`<tr><td><b>${qbEsc(qbChapterCode(c))}. ${qbEsc(c.chapter_name)}</b><div class="small muted">Includes its subchapters</div></td><td><input id="gpMin_${c.id}" type="number" min="0" step="1" value="0" style="width:90px"></td><td><input id="gpMax_${c.id}" type="number" min="0" step="1" placeholder="No limit" style="width:100px"></td></tr>`).join('')}
function gpSelectedAllowedIds(){
  if(!gpSelectedChapterIds||gpSelectedChapterIds.size===0)return null;
  const allowed=new Set();
  gpSelectedChapterIds.forEach(id=>{
    const c=qbChapters.find(x=>x.id===id);if(!c)return;
    if(!c.parent_chapter_id) qbDescendantIds(id).forEach(x=>allowed.add(x));
    else allowed.add(id);
  });
  return allowed;
}
function gpChapterFilterIntersectsRoot(rootId){
  const allowed=gpSelectedAllowedIds();
  if(!allowed)return true;
  const descendants=qbDescendantIds(rootId);
  return [...allowed].some(id=>descendants.has(id));
}
function gpRenderChapterFilter(){
  const box=document.getElementById('gpChapterFilterList');if(!box)return;
  const roots=gpRootChapters(),selected=gpSelectedChapterIds||new Set(),children=new Map();
  qbChapters.filter(c=>c.parent_chapter_id).forEach(c=>{if(!children.has(c.parent_chapter_id))children.set(c.parent_chapter_id,[]);children.get(c.parent_chapter_id).push(c)});
  const add=(c,depth=0)=>{
    const kids=(children.get(c.id)||[]).sort((a,b)=>qbChapterCode(a).localeCompare(qbChapterCode(b),undefined,{numeric:true}));
    return `<label style="display:flex;align-items:flex-start;gap:8px;margin:5px 0;padding:7px 9px;border:1px solid #e2e8f0;border-radius:8px;background:${depth?'#fafcff':'#fff'};margin-left:${depth*22}px"><input type="checkbox" style="width:auto;margin-top:3px" ${selected.has(c.id)?'checked':''} onchange="gpChapterFilterChanged('${c.id}',this.checked)"><span><b>${qbEsc(qbChapterCode(c))}. ${qbEsc(c.chapter_name)}</b><span class="small muted"> — ${c.parent_chapter_id?'subchapter only':'main chapter includes all its subchapters'}</span></span></label>${kids.map(x=>add(x,depth+1)).join('')}`;
  };
  box.innerHTML=roots.length?roots.map(c=>add(c)).join(''):'<div class="muted">No chapters found.</div>';
  const summary=document.getElementById('gpChapterFilterSummary');
  if(summary)summary.textContent=selected.size?`${selected.size} chapter/subchapter selection(s) active. Questions will be taken only from the selected chapter scope.`:'No chapter filter selected — all chapters are eligible.';
}
function gpChapterFilterChanged(id,checked){
  gpSelectedChapterIds=gpSelectedChapterIds||new Set();
  if(checked)gpSelectedChapterIds.add(id);else{
    gpSelectedChapterIds.delete(id);
    const c=qbChapters.find(x=>x.id===id);if(c&&!c.parent_chapter_id)qbDescendantIds(id).forEach(x=>gpSelectedChapterIds.delete(x));
  }
  gpRenderChapterFilter();gpRenderChapterRules();gpRecalc();gpRefreshFixedList();
}
function gpSelectAllChapters(){gpSelectedChapterIds=new Set(gpRootChapters().map(c=>c.id));gpRenderChapterFilter();gpRenderChapterRules();gpRecalc();gpRefreshFixedList();}
function gpClearChapterFilter(){gpSelectedChapterIds=new Set();gpRenderChapterFilter();gpRenderChapterRules();gpRecalc();gpRefreshFixedList();}
function gpChapterRules(){return gpRootChapters().filter(c=>gpChapterFilterIntersectsRoot(c.id)).map(c=>{const min=Math.max(0,Number(document.getElementById('gpMin_'+c.id)?.value||0));const raw=document.getElementById('gpMax_'+c.id)?.value;const max=raw===''||raw==null?Number(document.getElementById('gpTotal')?.value||0):Math.max(0,Number(raw));return {id:c.id,code:qbChapterCode(c),name:c.chapter_name,min,max,ids:qbDescendantIds(c.id)}})}
function gpQuestionBlocks(q){return (qbBlocks||[]).filter(b=>b.question_id===q.id).sort((a,b)=>Number(a.block_order||0)-Number(b.block_order||0))}
function gpQuestionSearchText(q){const bs=gpQuestionBlocks(q);return `${q.question_text_en||''} ${q.question_text_as||''} ${bs.filter(b=>b.block_type==='TEXT').map(b=>`${b.text_en||''} ${b.text_as||''}`).join(' ')} ${qbChapterCode(qbChapters.find(x=>x.id===q.chapter_id))} ${qbChapters.find(x=>x.id===q.chapter_id)?.chapter_name||''}`.toLowerCase()}
function gpOpenQuestionImage(src){if(!src)return;let m=document.getElementById('gpQuestionImageModal');if(!m){m=document.createElement('div');m.id='gpQuestionImageModal';m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out';m.onclick=()=>m.remove();document.body.appendChild(m)}m.innerHTML=`<div style="max-width:95vw;max-height:95vh;position:relative;cursor:default" onclick="event.stopPropagation()"><button type="button" onclick="document.getElementById('gpQuestionImageModal').remove()" style="position:absolute;right:-8px;top:-8px;width:36px;height:36px;border:0;border-radius:50%;font-size:22px;cursor:pointer;background:#fff">×</button><img src="${qbEsc(src)}" alt="Question image" style="max-width:95vw;max-height:90vh;object-fit:contain;background:#fff;border-radius:10px;padding:8px;box-shadow:0 10px 40px rgba(0,0,0,.35)"></div>`}
function gpQuestionPreviewHtml(q){const bs=gpQuestionBlocks(q);const textBlocks=bs.filter(b=>b.block_type==='TEXT').map(b=>b.text_en||b.text_as||'').filter(Boolean);const imageBlocks=bs.filter(b=>b.block_type==='IMAGE'&&b.image_url);const text=(textBlocks.join('\n\n')||q.question_text_en||q.question_text_as||'').trim();return `<div style="margin-top:8px;padding:9px;border:1px solid #dbe3ee;border-radius:9px;background:#f8fafc">${imageBlocks.length?imageBlocks.map(b=>`<img src="${qbEsc(b.image_url)}" alt="Question image" loading="lazy" onclick="event.stopPropagation();gpOpenQuestionImage(this.src)" style="display:block;max-width:100%;width:${Math.min(100,Math.max(30,Number(b.image_width||70)))}%;max-height:220px;object-fit:contain;margin:5px auto;border:1px solid #cbd5e1;border-radius:7px;padding:3px;background:#fff;cursor:zoom-in" title="Click to enlarge">`).join(''):''}${text?`<div class="gp-fixed-preview-text" style="margin-top:${imageBlocks.length?'7px':'0'}">${qbMathHtml(text)}</div>`:''}${!text&&!imageBlocks.length?'<div class="small muted">Question preview is not available.</div>':''}</div>`}
async function gpRefreshFixedList(){
  const box=document.getElementById('gpFixedList');if(!box)return;
  const s=(document.getElementById('gpFixedSearch')?.value||'').toLowerCase().trim();
  const lang=document.getElementById('gpLang')?.value||'EN';
  const rows=qbQuestions.filter(q=>qbLanguageAvailable(q,lang)).filter(q=>{const text=gpQuestionSearchText(q);return !s||text.includes(s)}).slice(0,250);
  box.innerHTML=rows.length?rows.map(q=>{
    const c=qbChapters.find(x=>x.id===q.chapter_id);
    const preview=gpQuestionPreviewHtml(q).replace('style="margin-top:8px;padding:9px;border:1px solid #dbe3ee;border-radius:9px;background:#f8fafc"','class="gp-fixed-preview"');
    return `<label class="student-card gp-fixed-item">
      <input class="gp-fixed-check" type="checkbox" ${gpFixedIds.has(q.id)?'checked':''} onchange="gpToggleFixed('${q.id}',this.checked)">
      <div class="gp-fixed-main">${preview}</div>
      <div class="gp-fixed-meta">
        <b>Chapter ${qbEsc(qbChapterCode(c)||'—')}</b>
        <div style="margin-top:7px"><b style="display:inline;font-size:15px">${Number(q.marks)} marks</b></div>
        <div style="margin-top:5px">${qbEsc(q.cognitive_level||'—')}</div>
        ${q.variation_group?`<span class="tag">Variation: ${qbEsc(q.variation_group)}</span>`:''}
      </div>
    </label>`;
  }).join(''):'<div class="muted">No questions found.</div>';
  // Fixed-question cards are inserted dynamically, so MathJax must be
  // explicitly typeset after the HTML is placed in the DOM. Without this,
  // expressions such as \(x_1,y_1\) remain visible as raw LaTeX.
  const root=document.getElementById('gpFixedList');
  if(root){
    await new Promise(r=>requestAnimationFrame(r));
    try{await qbTypeset(root);}catch(e){console.warn('Fixed-question MathJax:',e);}
  }
}

async function qbFetchAll(buildQuery){
  const out=[],size=1000;
  for(let from=0;;from+=size){
    const {data,error}=await buildQuery().range(from,from+size-1);
    if(error)throw error;
    out.push(...(data||[]));
    if(!data||data.length<size)break;
  }
  return out;
}
async function qbFetchByQuestionIds(table,orderCol,ids){
  const out=[],chunk=100;
  for(let i=0;i<ids.length;i+=chunk){
    const part=ids.slice(i,i+chunk);
    out.push(...await qbFetchAll(()=>sb.from(table).select('*').in('question_id',part).order(orderCol).order('id')));
  }
  return out;
}
async function loadQuestionBank(){

  // the URL limit, so chapters/questions are paged and blocks/options are chunked.

    qbFetchAll(()=>sb.from('school_question_bank_chapters').select('*').eq('teacher_id',teacher.id).order('chapter_code').order('chapter_name').order('id')),
    qbFetchAll(()=>sb.from('school_question_bank_questions').select('*').eq('teacher_id',teacher.id).eq('course_type','SCHOOL').order('created_at',{ascending:false}).order('id'))
  ]);
  qbChapters=ch||[];qbQuestions=q||[];qbJnvstSubjects=[];qbJnvstLessons=[];qbBlocks=[];qbOptions=[];
  const ids=qbQuestions.map(x=>x.id).filter(Boolean);
  if(ids.length){
    const [blocks,opts]=await Promise.all([
      qbFetchByQuestionIds('school_question_bank_blocks','block_order',ids),
      qbFetchByQuestionIds('school_question_bank_options','display_order',ids)
    ]);
    qbBlocks=blocks;qbOptions=opts;
  }
}

function qbChapterOptions(selectedId='', includeBlank=true){
  const roots=qbChapters.filter(c=>!c.parent_chapter_id).sort((a,b)=>qbChapterCode(a).localeCompare(qbChapterCode(b),undefined,{numeric:true}));
  const children=new Map(); qbChapters.filter(c=>c.parent_chapter_id).forEach(c=>{if(!children.has(c.parent_chapter_id))children.set(c.parent_chapter_id,[]);children.get(c.parent_chapter_id).push(c)});

function qbQuestionLanguage(q){
  const en=String(q?.question_text_en||'').trim().length>0;
  const as=String(q?.question_text_as||'').trim().length>0;
  if(en&&as)return 'BOTH';
  if(en)return 'ENGLISH';
  if(as)return 'ASSAMESE';
  return String(q?.medium||'').trim().toUpperCase()||'';
}
function qbLanguageAvailable(q,lang){
  // Image-only questions (no text in either language) are usable in any medium.
  const hasEn=String(q?.question_text_en||'').trim().length>0,hasAs=String(q?.question_text_as||'').trim().length>0;
  if(!hasEn&&!hasAs&&q?.has_images)return true;
  if(lang==='EN')return String(q?.question_text_en||'').trim().length>0;
  if(lang==='AS')return String(q?.question_text_as||'').trim().length>0;
  if(lang==='BOTH')return String(q?.question_text_en||'').trim().length>0&&String(q?.question_text_as||'').trim().length>0;
  return true;
}
function qbQuestionTextForMedium(q,med){
  if(med==='ENGLISH')return String(q?.question_text_en||'').trim() || String(q?.question_text_as||'').trim();
  if(med==='ASSAMESE')return String(q?.question_text_as||'').trim() || String(q?.question_text_en||'').trim();
  if(med==='BOTH'){
    const en=String(q?.question_text_en||'').trim(), as=String(q?.question_text_as||'').trim();
    return en && as ? `${en}\n${as}` : (en || as);
  }
  return String(q?.question_text_en||q?.question_text_as||'').trim();
}
function qbVariationGroups(){

async function qbImportChapterExcel(){
  if(!qbBulkChapterRows.length)return alert('Upload the Chapter/Subchapter Excel file first.');
  const invalid=qbBulkChapterRows.filter(x=>!/^(\d+)(\.\d+)*$/.test(x.chapterNo)||!x.chapterName||(x.parentNo&&!/^\d+(\.\d+)*$/.test(x.parentNo)));if(invalid.length)return alert('Invalid row(s): '+invalid.map(x=>x.row).join(', '));
  const action=document.getElementById('qbChapterDuplicateAction')?.value||'skip',status=document.getElementById('qbChapterBulkStatus');let created=0,updated=0,skipped=0;
  try{
    const {data:existing,error}=await sb.from('school_question_bank_chapters').select('*').eq('teacher_id',teacher.id);if(error)throw error;
    const byCode=new Map((existing||[]).map(c=>[qbChapterCode(c),c]));
    // Parents first so subchapters can reference them.
    const ordered=[...qbBulkChapterRows].sort((a,b)=>a.chapterNo.split('.').length-b.chapterNo.split('.').length||a.chapterNo.localeCompare(b.chapterNo,undefined,{numeric:true}));
    const seen=new Set();
    for(const r of ordered){
      const code=r.chapterNo, parentCode=r.parentNo|| (code.includes('.')?code.split('.').slice(0,-1).join('.'):null);
      if(parentCode && !code.startsWith(parentCode+'.'))throw Error(`Row ${r.row}: Parent Chapter No ${parentCode} does not match ${code}.`);
      if(seen.has(code)){if(action==='stop')throw Error(`Duplicate Chapter No ${code} appears more than once in the Excel file.`);if(action==='skip'){skipped++;continue;}} seen.add(code);
      let parentId=null;if(parentCode){const par=byCode.get(parentCode);if(!par)throw Error(`Row ${r.row}: Parent Chapter ${parentCode} was not found. Add the parent first or include it in the same file.`);parentId=par.id;}
      const old=byCode.get(code);
      if(old){if(action==='stop')throw Error(`Chapter/Subchapter ${code} already exists.`);if(action==='skip'){skipped++;continue;} const {error:e}=await sb.from('school_question_bank_chapters').update({chapter_number:Number(code.split('.')[0]),chapter_code:code,parent_chapter_id:parentId,chapter_name:r.chapterName,description:r.description||null}).eq('id',old.id).eq('teacher_id',teacher.id);if(e)throw e;updated++;byCode.set(code,{...old,chapter_code:code,parent_chapter_id:parentId,chapter_name:r.chapterName,description:r.description||null});}
      else {const {data,error:e}=await sb.from('school_question_bank_chapters').insert({teacher_id:teacher.id,chapter_number:Number(code.split('.')[0]),chapter_code:code,parent_chapter_id:parentId,chapter_name:r.chapterName,description:r.description||null}).select().single();if(e)throw e;created++;byCode.set(code,data);}
    }
    await loadQuestionBank();status.innerHTML=`<div class="success"><b>Chapter/subchapter import completed.</b> Created: ${created} &nbsp; Updated: ${updated} &nbsp; Skipped: ${skipped}</div><button onclick="qbChapterManager()">Open Chapter Manager</button>`;
  }catch(e){status.innerHTML=msg('Import stopped: '+e.message)}
}

function qbExcelLatex(v){
  let s=String(v??''); if(!s)return '';

  s=s.replace(/\$\$(.*?)\$\$/gs,'\\[$1\\]');
  s=s.replace(/(?<!\\)\$(?!\$)(.*?)(?<!\\)\$/gs,'\\($1\\)');
  s=s.replace(/\\\((.*?)\\\)/gs,'\\($1\\)');
  s=s.replace(/\\\[(.*?)\\\]/gs,'\\[$1\\]');
  // Raw LaTeX command/expression in normal prose: wrap from the first math command to sentence punctuation.
  const cmd=/\\(?:frac|dfrac|tfrac|sqrt|root|times|div|cdot|pm|mp|leq|geq|neq|approx|equiv|in|notin|subset|subseteq|pi|theta|alpha|beta|gamma|delta|Delta|lambda|mu|sigma|omega|sum|prod|int|infty|angle|circ|degree|mathrm|mathbf|text|left|right)\b/;
  if(!/\\\(|\\\[/.test(s) && cmd.test(s)){
    s=s.replace(/(\\(?:frac|dfrac|tfrac|sqrt|root|times|div|cdot|pm|mp|leq|geq|neq|approx|equiv|in|notin|subset|subseteq|pi|theta|alpha|beta|gamma|delta|Delta|lambda|mu|sigma|omega|sum|prod|int|infty|angle|circ|degree|mathrm|mathbf|text|left|right)\b[^.!?\n]*)([.!?]|$)/g,'\\($1\\)$2');
  }
  // Simple equations such as x^2 = 25 or 3/4 + 1/2 = 5/4.
  if(!/\\\(|\\\[/.test(s)){
    s=s.replace(/\b([A-Za-z0-9][A-Za-z0-9_{}^\.]*\s*(?:\^\s*\{?[^\s=+\-*/]+\}?\s*)?(?:=|≤|≥|≠|<|>)\s*[A-Za-z0-9\.{}^+\-*/]+)\b/g,'\\($1\\)');

  if(!/\\\(|\\\[/.test(s)){
    s=s.replace(/\b([A-Za-z]\s*\^\s*(?:\{[^}]+\}|[A-Za-z0-9]+))\b/g,'\\($1\\)');
    s=s.replace(/\b(\d+\s*\/\s*\d+)\b/g,'\\($1\\)');
  }
  return s;
}

      const r={chapterNo:'',subchapterNo:'',chapterName:'',questionType:q.question_type,marks:q.marks,cognitiveLevel:q.cognitive_level,difficulty:q.difficulty,english:q.question_text_en||'',assamese:q.question_text_as||'',correctAnswer:q.correct_answer||'',textBook:!!q.text_book,textbookReference:q.textbook_reference||'',image:''};

  s=s.replace(/\\sqrt\s*(\w)/g,'√$1').replace(/\\(left|right|,|;|!|quad|qquad)/g,m=>m==='\\quad'||m==='\\qquad'?' ':'').replace(/\\([A-Za-z]+)/g,(m,n)=>map[n]||n);
  s=s.replace(/\^\s*\{([^{}]*)\}/g,(m,x)=>[...x].every(c=>sup[c])?[...x].map(c=>sup[c]).join(''):'^('+x+')').replace(/\^\s*([0-9n])/g,(m,x)=>sup[x]).replace(/_\s*\{([^{}]*)\}/g,(m,x)=>[...x].every(c=>sub[c])?[...x].map(c=>sub[c]).join(''):'_'+x).replace(/_\s*([0-9])/g,(m,x)=>sub[x]);
  return s.replace(/[{}]/g,'');
}
function qbMathFallback(root){
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),nodes=[];
  while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    const v=n.nodeValue;if(!v||v.indexOf('\\')<0)return;
    const out=v.replace(/\\\((.*?)\\\)/gs,(m,x)=>qbLatexToText(x)).replace(/\\\[(.*?)\\\]/gs,(m,x)=>qbLatexToText(x));
    if(out!==v)n.nodeValue=out;
  });
}
async function qbTypeset(root){
  // School Question Bank: typeset dynamically-created question HTML.
  const target=root||document.body;
  // Wait for the loader (local copy -> CDN fallbacks) to finish.
  let ok=false;
  try{ok=await Promise.race([window.__mjReady||Promise.resolve(false),new Promise(r=>setTimeout(()=>r(false),20000))]);}catch(_){}
  if(!ok||!window.MathJax?.typesetPromise){
    console.warn('MathJax could not be loaded; using plain-text math fallback.');
    qbMathFallback(target);
    return;
  }
  if(window.MathJax.startup?.promise) await window.MathJax.startup.promise;
  try{window.MathJax.typesetClear?.([target]);}catch(_){}
  await new Promise(r=>setTimeout(r,0));
  await window.MathJax.typesetPromise([target]);
}

function qbMathFieldCommand(name){
  const mf=document.getElementById('qbMathField');
  if(!mf)return;
  const commands={
    frac:['insert','\\frac{#0}{#?}'],
    sqrt:['insert','\\sqrt{#0}'],
    power:['insert','^{#?}'],
    subscript:['insert','_{#?}'],
    angle:['insert','\\angle '],
    sin:['insert','\\sin '],
    cos:['insert','\\cos '],
    tan:['insert','\\tan '],
    log:['insert','\\log '],
    pi:['insert','\\pi'],
    theta:['insert','\\theta'],
    degree:['insert','^{\\circ}'],
    pm:['insert','\\pm'],
    sum:['insert','\\sum_{i=1}^{n}'],
    integral:['insert','\\int_{a}^{b}'],
    matrix:['insert','\\begin{pmatrix}#0&#?\\\\#?&#?\\end{pmatrix}']
  };
  const cmd=commands[name];
  try{if(cmd)mf.executeCommand(cmd);else mf.focus();}catch(e){try{mf.focus();}catch(_) {}}
}
function qbConfirmMathEditor(){
  const mf=document.getElementById('qbMathField');
  const state=qbMathEditorState||{};
  const target=state.target;
  if(!mf||!target){alert('Question text box is no longer available. Please close the editor and try again.');return;}
  const latex=(mf.value||'').trim();
  if(!latex){alert('Please enter a mathematical expression first.');try{mf.focus()}catch(e){};return;}
  const start=Math.max(0,Math.min(Number(state.start)||0,target.value.length));
  const end=Math.max(start,Math.min(Number(state.end)||start,target.value.length));
  const insertion='\\('+latex+'\\)';
  target.focus();
  if(typeof target.setRangeText==='function') target.setRangeText(insertion,start,end,'end');
  else target.value=target.value.slice(0,start)+insertion+target.value.slice(end);
  target.dispatchEvent(new Event('input',{bubbles:true}));
  target.dispatchEvent(new Event('change',{bubbles:true}));
  qbCloseMathEditor();
  target.focus();
}

async function getPreviousSchoolPaper(id){

    opts:Array.isArray(cfg.opts)?cfg.opts:[],
    lang:cfg.lang||p.medium||'EN',
    total:Number(cfg.total??p.total_marks??0),
    report:Array.isArray(cfg.report)?cfg.report:[],
    chapterRules:Array.isArray(cfg.chapterRules)?cfg.chapterRules:[],
    chapterMarks:cfg.chapterMarks||{},
    fixedIds:Array.isArray(cfg.fixedIds)?cfg.fixedIds:[],
    title:cfg.title||p.title||'School Question Paper',
    className:cfg.className||p.class_name||'',
    subject:cfg.subject||p.subject||'',

async function viewPreviousSchoolPaper(id){

async function duplicatePreviousSchoolPaper(id){
  try{
    const p=await getPreviousSchoolPaper(id);

    const payload={
      teacher_id:teacher.id,
      course_type:'SCHOOL',
      title:'Copy of '+(p.title||'School Question Paper'),
      subject:p.subject||null,
      class_name:p.class_name||null,
      medium:p.medium||'EN',

async function deletePreviousSchoolPaper(id){
  if(!confirm('Delete this generated question paper?\n\nThe questions in the School Question Bank will NOT be deleted.'))return;
  try{
    const {error}=await sb.from('school_generated_question_papers').delete().eq('id',id).eq('teacher_id',teacher.id).eq('course_type','SCHOOL');

    await loadPreviousSchoolGeneratedPapers();
  }catch(e){alert('Could not delete the question paper: '+e.message);}

function bankBlockHtml(b,lang){
  if(b.block_type==='IMAGE')return `<div style="text-align:center;margin:8px 0"><img src="${qbEsc(b.image_url)}" alt="${qbEsc(b.alt_text||'')}" style="max-width:100%;width:${Number(b.image_width||70)}%;height:auto;display:inline-block"></div>`;
  const text=lang==='AS'?b.text_as:(lang==='BOTH'?`${b.text_en||''}${b.text_en&&b.text_as?'\n':''}${b.text_as||''}`:b.text_en);
  return text?`<div style="margin:5px 0;white-space:pre-wrap">${qbEsc(text)}</div>`:'';
}
function qbPaperChapterCode(q){
  const c=qbChapters.find(x=>x.id===q.chapter_id);
  return qbChapterCode(c)||'';
}
function qbPaperSortQuestions(questions){
  const mcq=questions.filter(q=>String(q.question_type||'').toUpperCase()==='MCQ');
  const non=questions.filter(q=>String(q.question_type||'').toUpperCase()!=='MCQ');
  const codeCmp=(a,b)=>String(a||'').localeCompare(String(b||''),undefined,{numeric:true,sensitivity:'base'});
  mcq.sort((a,b)=>codeCmp(qbPaperChapterCode(a),qbPaperChapterCode(b))||Number(a.marks||0)-Number(b.marks||0));
  non.sort((a,b)=>Number(a.marks||0)-Number(b.marks||0)||codeCmp(qbPaperChapterCode(a),qbPaperChapterCode(b))||String(a.id).localeCompare(String(b.id)));
  return mcq.concat(non);
}
function qbSameBilingualText(en,as){
  // True when the English and Assamese texts are identical (ignoring spacing/case),
  // e.g. numbers, expressions and formulas such as "a = 5, b = -1" or "\\frac{5}{6}".
  const n=v=>String(v??'').replace(/\s+/g,' ').trim().toLowerCase();
  return n(en)!==''&&n(en)===n(as);
}
function qbPaperMedium(lang){return lang==='BOTH'?'Both':lang==='AS'?'Assamese':'English'}
function qbPaperText(label,lang){
  if(lang==='AS') return label.as||'';
  if(lang==='BOTH') return `${label.en||''}${label.en&&label.as?'<br>':''}${label.as||''}`;
  return label.en||'';
}
function qbModelAnswerHtml(q,idx,opts,lang){
  if(String(q.question_type||'').toUpperCase()==='MCQ'){
    const o=opts.find(x=>x.question_id===q.id&&x.is_correct);
    const ans=o?.option_label||q.correct_answer||'—';
    const answerText=o?(lang==='AS'?qbMathHtml(o.option_text_as||''):lang==='BOTH'?(qbSameBilingualText(o.option_text_en,o.option_text_as)?qbMathHtml(o.option_text_en||''):`${qbMathHtml(o.option_text_en||'')}${o.option_text_en&&o.option_text_as?'<br>':''}${qbMathHtml(o.option_text_as||'')}`):qbMathHtml(o.option_text_en||'')):'';
    return `<div class="key-q"><div class="key-num">${idx}.</div><div><b>Answer: ${qbEsc(ans)}</b>${answerText?`<div class="key-answer-text">${answerText}</div>`:''}</div><div class="key-marks">${Number(q.marks||0)}</div></div>`;
  }
  const notes=q.explanation||q.model_answers||'';
  return `<div class="key-q"><div class="key-num">${idx}.</div><div><b>Model Answer / Marking Notes</b><div class="key-answer-text">${notes?qbMathHtml(typeof notes==='string'?notes:JSON.stringify(notes)): '<span class="muted">Model answer not provided.</span>'}</div></div><div class="key-marks">${Number(q.marks||0)}</div></div>`;
}

async function previewQuestionPaper(){
  const p=window._generatedBankPaper;if(!p)return;
  const selected=qbPaperSortQuestions(p.selected);
  const mcqs=selected.filter(q=>String(q.question_type||'').toUpperCase()==='MCQ');
  const others=selected.filter(q=>String(q.question_type||'').toUpperCase()!=='MCQ');
  const mcqMarks=mcqs.reduce((a,q)=>a+Number(q.marks||0),0);
  const mcqUniform=mcqs.length>0&&mcqs.every(q=>Number(q.marks||0)===Number(mcqs[0].marks||0));
  const mcqMarkLine=mcqUniform?`${Number(mcqs[0].marks||0)} × ${mcqs.length} = ${mcqMarks}`:`Total = ${mcqMarks}`;

  // Render database/Excel text through the same MathJax preparation used
  // throughout the School Question Bank.  Do not use qbEsc() directly here,
  // because that would leave \( ... \), \[ ... \], fractions, roots, etc.
  // as literal text in the generated paper.  qbMathHtml() safely escapes HTML
  // while preserving MathJax delimiters.
  const paperTextHtml=(value)=>qbMathHtml(String(value??''))
    .replace(/&lt;br\s*\/?&gt;/gi,'<br>');
  const bilingualHtml=(en,as)=>{
    const e=paperTextHtml(en),a=paperTextHtml(as);
    if(e&&a)return `${e}<br>${a}`;
    return e||a;
  };

  const qHtml=(q,num,sectionA=false)=>{
    const bs=p.blocks.filter(b=>b.question_id===q.id).sort((a,b)=>a.block_order-b.block_order);
    const os=p.opts.filter(o=>o.question_id===q.id).sort((a,b)=>a.display_order-b.display_order);
    // IMPORTANT: the Question Bank's canonical question_text_en/question_text_as
    // fields are the source of truth for paper text. Older block snapshots may
    // contain text without the mathematical LaTeX even when the Question Bank
    // itself displays the formula correctly. Use TEXT blocks only as a fallback
    // when the canonical question text is empty; always preserve IMAGE blocks.
    const canonicalText = p.lang==='AS'
      ? (q.question_text_as||q.question_text_en||'')
      : p.lang==='BOTH'
        ? bilingualHtml(q.question_text_en||'',q.question_text_as||'')
        : (q.question_text_en||q.question_text_as||'');
    const fallbackText = bs.filter(b=>b.block_type==='TEXT').map(b=>p.lang==='AS'?(b.text_as||b.text_en||''):p.lang==='BOTH'?bilingualHtml(b.text_en||'',b.text_as||''):(b.text_en||b.text_as||'')).filter(Boolean).join('<br>');
    const textHtml = canonicalText ? (p.lang==='BOTH' ? canonicalText : paperTextHtml(canonicalText)) : fallbackText;
    const imageBlocks=bs.filter(b=>b.block_type==='IMAGE').map(b=>`<div class="q-image"><img src="${qbEsc(b.image_url)}" alt="${qbEsc(b.alt_text||'') }" style="width:${Math.min(100,Number(b.image_width||70))}%"></div>`).join('');
    const blocks=(textHtml?`<div class="q-block">${textHtml}</div>`:'')+imageBlocks;
    const isMcq=String(q.question_type||'').trim().toUpperCase()==='MCQ';
    const optionText=(o)=>p.lang==='AS'?paperTextHtml(o.option_text_as||o.option_text_en||''):p.lang==='BOTH'?(qbSameBilingualText(o.option_text_en,o.option_text_as)?paperTextHtml(o.option_text_en):bilingualHtml(o.option_text_en,o.option_text_as)):paperTextHtml(o.option_text_en||o.option_text_as||'');
    const options=isMcq?`<div class="opts">${os.map((o,i)=>`<div class="option"><b>${qbEsc(o.option_label||String.fromCharCode(65+i))}.</b>${optionText(o)?` ${optionText(o)}`:''}${o.image_url?`<br><img src="${qbEsc(o.image_url)}" alt="Option ${qbEsc(o.option_label||String.fromCharCode(65+i))}" style="max-width:100%;height:auto;max-height:180px;margin-top:3px;object-fit:contain">`:''}</div>`).join('')}</div>`:'';
    return `<div class="q ${sectionA?'section-a-q':''}"><div class="q-num">${num}.</div><div class="q-body">${blocks}${options}</div><div class="q-marks">${sectionA?'':`<b>${Number(q.marks||0)}</b>`}</div></div>`;
  };
  let num=1;
  const sectionA=mcqs.map(q=>qHtml(q,num++,true)).join('');
  const sectionB=others.map(q=>qHtml(q,num++,false)).join('');
  const body=`<div class="paper"><div class="header"><div class="brand">SWARUP SIR'S KNOWLEDGE HUB</div>${p.title?`<div style="font-size:18px;font-weight:700;margin:-4px 0 10px">${qbEsc(p.title)}</div>`:''}<div class="meta-row"><div><b>Subject:</b> ${qbEsc(p.subject||'')}</div><div><b>Class:</b> ${qbEsc(p.className||'')}</div><div><b>Medium:</b> ${qbEsc(qbPaperMedium(p.lang))}</div></div><div class="meta-row bottom"><div><b>Time:</b> ${qbEsc(p.duration||'')}</div><div style="text-align:right"><b>Full Marks:</b> ${Number(p.total||0)}</div></div></div>${mcqs.length?`<div class="section">SECTION A</div><div class="section-line"><span>Choose the correct answer.</span><span class="total">${mcqMarkLine}</span></div>${sectionA}`:''}${others.length?`<div class="section">${mcqs.length?'SECTION B':'QUESTIONS'}</div><div class="instruction">Answer the following questions.</div>${sectionB}`:''}<div class="end">--- End of Question Paper ---</div><div class="footer"><span>(c) Swarup Sir's Knowledge Hub</span><span></span></div></div>`;
  await qbOpenPrintWindow('Question Paper',body);
}
async function previewModelAnswerKey(){
  const p=window._generatedBankPaper;if(!p)return;
  const selected=qbPaperSortQuestions(p.selected);
  const mcqs=selected.filter(q=>String(q.question_type||'').toUpperCase()==='MCQ');
  const others=selected.filter(q=>String(q.question_type||'').toUpperCase()!=='MCQ');
  const keyRows=(arr,start)=>arr.map((q,i)=>qbModelAnswerHtml(q,start+i,p.opts,p.lang)).join('');
  let num=1;
  const mcqRows=keyRows(mcqs,num);num+=mcqs.length;
  const otherRows=keyRows(others,num);
  const body=`<div class="paper"><div class="header"><div class="brand">SWARUP SIR'S KNOWLEDGE HUB</div>${p.title?`<div style="font-size:18px;font-weight:700;margin:-4px 0 10px">${qbEsc(p.title)}</div>`:''}<div class="meta-row"><div><b>Subject:</b> ${qbEsc(p.subject||'')}</div><div><b>Class:</b> ${qbEsc(p.className||'')}</div><div><b>Medium:</b> ${qbEsc(qbPaperMedium(p.lang))}</div></div><div class="meta-row bottom"><div><b>Time:</b> ${qbEsc(p.duration||'')}</div><div style="text-align:right"><b>Full Marks:</b> ${Number(p.total||0)}</div></div></div><div class="section">MODEL ANSWER KEY</div><div class="key-header-note">Question numbering follows the generated question paper. MCQ answers are shown first; model answers/marking notes are shown for non-MCQ questions where available.</div>${mcqs.length?`<div class="key-section">SECTION A — MCQ</div>${mcqRows}`:''}${others.length?`<div class="key-section">SECTION B</div>${otherRows}`:''}<div class="end">--- End of Model Answer Key ---</div><div class="footer"><span>(c) Swarup Sir's Knowledge Hub</span><span>Model Answer Key</span></div></div>`;
  await qbOpenPrintWindow('Model Answer Key',body);
}
function previewBankPaper(){
  const p=window._generatedBankPaper;if(!p)return;
  if(document.getElementById('gpPdfOutputCard'))return;
  const selected=qbPaperSortQuestions(p.selected);
  document.getElementById('gpResult').insertAdjacentHTML('beforeend',`<div class="card" id="gpPdfOutputCard" style="margin-top:12px"><b>PDF Output</b><div class="actions" style="margin-top:8px"><button onclick="previewQuestionPaper()">📝 Question Paper PDF</button><button class="secondary" onclick="previewModelAnswerKey()">🔑 Model Answer Key PDF</button></div><div class="small muted" style="margin-top:7px">The two documents are generated separately. Use Print / Save as PDF in each preview.</div></div>`);
}
