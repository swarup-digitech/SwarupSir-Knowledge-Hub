<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Teacher Dashboard — Swarup Sir's Knowledge Hub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

const SUPABASE_URL='https://jupefjdquakqsizapzbv.supabase.co',SUPABASE_KEY='sb_publishable_eUcdkv0kFJjkifHQwQBUwg_VcY_lgTP',CREATE_STUDENT_FN='create-students';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let teacher=null,students=[],classes=[],groups=[],assessments=[],bulkRows=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function msg(t,ok=false){return `<div class="${ok?'success':'notice'}">${esc(t)}</div>`}
async function fn(body){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error('Please login again.');const r=await fetch(`${SUPABASE_URL}/functions/v1/${CREATE_STUDENT_FN}`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`,'apikey':SUPABASE_KEY},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw Error(j.error||'Request failed');return j}
async function init(){
  try{
    const {data:{session},error:sessionError}=await sb.auth.getSession();
    if(sessionError)throw sessionError;
    if(!session)return location.replace('teacher-login.html');
    const {data:p,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
    if(error)throw error;
    if(p?.role!=='teacher'){await sb.auth.signOut();return location.replace('teacher-login.html')}
    teacher=p;
    await load();
    home();
  }catch(e){
    console.error('Teacher dashboard initialization failed:',e);
    const app=document.getElementById('app');
    if(app)app.innerHTML='<div class="card"><h2>Teacher Dashboard could not be loaded</h2><p>'+esc(e?.message||String(e))+'</p><p>Please refresh the page. If the problem continues, check the browser console and Supabase connection.</p><button onclick="location.reload()">Refresh</button></div>';
  }
}
async function load(){
  const results=await Promise.allSettled([
    fn({action:'listSchoolStudents'}),
    sb.from('classes').select('id,name,description,course').eq('teacher_id',teacher.id).eq('course','SCHOOL').order('name'),
    sb.from('school_course_groups').select('*').eq('teacher_id',teacher.id).order('name'),
    sb.from('school_assessments').select('*').eq('created_by',teacher.id).order('created_at',{ascending:false})
  ]);
  const schoolStudents=results[0].status==='fulfilled'?results[0].value:null;
  const c=results[1].status==='fulfilled'?results[1].value.data:null;
  const g=results[2].status==='fulfilled'?results[2].value.data:null;
  const a=results[3].status==='fulfilled'?results[3].value.data:null;
  students=schoolStudents?.students||[];
  classes=c||[];
  groups=g||[];
  assessments=a||[];
  students.forEach(s=>{s.className=s.className||classes.find(c=>c.id===s.class_id)?.name||'—'});
  window.__schoolDashboardLoadErrors=results.map((r,i)=>r.status==='rejected'?{source:i,error:r.reason?.message||String(r.reason)}:null).filter(Boolean);
}
function header(title){return `<div class="top"><div><div class="tag">🏫 SCHOOL COURSE</div><h1 style="margin:7px 0">${title}</h1><div class="muted">Teacher: ${esc(teacher.full_name||'Teacher')}</div></div><div class="actions"><button class="secondary" onclick="location.href='main.html'">JNVST Dashboard</button><button class="secondary" onclick="location.href='index.html'">Course Home</button><button onclick="logout()">Logout</button></div></div>`}
function home(){document.getElementById('app').innerHTML=`${header('School Teacher Dashboard')}<div class="grid"><div class="card"><div class="muted">School Students</div><div class="stat">${students.length}</div></div><div class="card"><div class="muted">School Classes</div><div class="stat">${classes.filter(c=>students.some(s=>s.class_id===c.id)).length}</div></div><div class="card"><div class="muted">Sub-divisions</div><div class="stat">${groups.length}</div></div><div class="card"><div class="muted">Assessments</div><div class="stat">${assessments.length}</div></div></div><div class="card">
<h2>👨‍🏫 Teacher Tools</h2>
<div class="actions">

function addStudent(){if(!classes.length)return alert('Create a School class first.');document.getElementById('app').innerHTML=`${header('Add School Student')}<div class="card"><label>Student Name</label><input id="sn"><label>Roll No</label><input id="sr"><label>Password</label><input id="sp" type="text" placeholder="At least 6 characters"><label>Class</label><select id="sc" onchange="refreshSchoolStudentGroups()">${classes.map((c,i)=>`<option value="${c.id}" ${i===0?'selected':''}>${esc(c.name)}</option>`).join('')}</select><label>School Course Sub-division</label><select id="sg"></select><div id="sm"></div><div class="actions" style="margin-top:12px"><button onclick="saveStudent()">Create Student</button><button class="secondary" onclick="home()">Cancel</button></div></div>`;refreshSchoolStudentGroups()}
function refreshSchoolStudentGroups(){const classId=document.getElementById('sc')?.value,sel=document.getElementById('sg');if(!sel)return;const opts=groups.filter(g=>g.class_id===classId).map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('');sel.innerHTML='<option value="">No subdivision</option>'+opts}
async function saveStudent(){try{const j=await fn({action:'createStudents',students:[{name:sn.value.trim(),roll_no:sr.value.trim(),password:sp.value,class_id:sc.value,course:'SCHOOL',school_group_id:sg.value||null}]});const r=j.results?.[0];if(!r?.success)throw Error(r?.error||'Could not create student');alert('Student created successfully.');await load();home()}catch(e){sm.innerHTML=msg(e.message)}}
function bulkImport(){bulkRows=[];document.getElementById('app').innerHTML=`${header('Bulk School Students — Excel')}<div class="card"><p><b>Columns:</b> Name | Roll No | Class | Password | Subdivision (optional)</p><div class="notice">Course is automatically set to <b>SCHOOL</b>. Email is not required.</div><label>Excel file</label><input type="file" accept=".xlsx,.xls" onchange="readBulk(event)"><div id="bulkPreview"></div><div class="actions"><button onclick="uploadBulk()">Create All Students</button><button class="secondary" onclick="home()">Cancel</button></div></div>`}
function readBulk(ev){const f=ev.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});const h=raw[0].map(x=>String(x).trim().toLowerCase().replace(/[_\s]+/g,' ')),idx=(...a)=>a.map(x=>h.indexOf(x)).find(x=>x>=0);const ni=idx('name','student name'),ri=idx('roll no','roll number'),ci=idx('class','class name'),pi=idx('password'),gi=idx('subdivision','school subdivision','school course subdivision');if([ni,ri,ci,pi].some(x=>x<0))throw Error('Required columns: Name, Roll No, Class, Password.');bulkRows=raw.slice(1).map((row,i)=>({row:i+2,name:String(row[ni]||'').trim(),roll_no:String(row[ri]||'').trim(),className:String(row[ci]||'').trim(),password:String(row[pi]||''),groupName:gi>=0?String(row[gi]||'').trim():''})).filter(x=>x.name||x.roll_no||x.className||x.password);const errs=[];bulkRows.forEach(x=>{if(!x.name)errs.push(`Row ${x.row}: Name missing`);if(!x.roll_no)errs.push(`Row ${x.row}: Roll No missing`);if(!x.className)errs.push(`Row ${x.row}: Class missing`);if(!x.password||x.password.length<6)errs.push(`Row ${x.row}: Password must contain at least 6 characters`)});if(errs.length){bulkPreview.innerHTML=msg(errs.join(' | '));return}bulkPreview.innerHTML=`<div class="success">Loaded ${bulkRows.length} rows.</div><div style="overflow:auto"><table><tr><th>Name</th><th>Roll</th><th>Class</th><th>Password</th><th>Subdivision</th></tr>${bulkRows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.roll_no)}</td><td>${esc(x.className)}</td><td>${esc(x.password)}</td><td>${esc(x.groupName)}</td></tr>`).join('')}</table></div>`}catch(e){bulkPreview.innerHTML=msg('Could not read Excel: '+e.message)}};r.readAsArrayBuffer(f)}
async function uploadBulk(){if(!bulkRows.length)return alert('Upload an Excel file first.');const cmap=new Map(classes.map(c=>[c.name.trim().toLowerCase(),c.id])),gmap=new Map(groups.map(g=>[g.name.trim().toLowerCase(),g.id]));const bad=bulkRows.filter(x=>!cmap.has(x.className.toLowerCase())|| (x.groupName&&!gmap.has(x.groupName.toLowerCase())));if(bad.length)return alert('Class or subdivision not found: '+bad.map(x=>x.name).join(', '));const payload=bulkRows.map(x=>({name:x.name,roll_no:x.roll_no,password:x.password,class_id:cmap.get(x.className.toLowerCase()),course:'SCHOOL',school_group_id:x.groupName?gmap.get(x.groupName.toLowerCase()):null}));try{const j=await fn({action:'createStudents',students:payload});const ok=(j.results||[]).filter(x=>x.success),fail=(j.results||[]).filter(x=>!x.success);document.getElementById('app').innerHTML=`${header('Bulk Import Result')}<div class="card"><div class="success">${ok.length} student(s) created.</div>${fail.length?msg(fail.map(x=>`${x.name||''} — Roll ${x.roll_no||''}: ${x.error}`).join('\n')):''}<div class="actions"><button onclick="load().then(home)">Dashboard</button><button class="secondary" onclick="bulkImport()">Add More</button></div></div>`}catch(e){alert(e.message)}}
function manageStudents(){const classOptions=classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');document.getElementById('app').innerHTML=`${header('School Students')}<div class="card"><div class="searchgrid"><input id="ss" placeholder="Search name / roll" oninput="renderStudentTable()"><select id="sf" onchange="renderStudentTable()"><option value="all">All Classes</option>${classOptions}</select><select id="sgf" onchange="renderStudentTable()"><option value="all">All Sub-divisions</option>${groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></div><div id="studentTable" style="overflow:auto;margin-top:12px"></div><button class="secondary" onclick="home()" style="margin-top:12px">← Dashboard</button></div>`;renderStudentTable()}
function renderStudentTable(){const q=(document.getElementById('ss')?.value||'').toLowerCase(),cf=document.getElementById('sf')?.value||'all',gf=document.getElementById('sgf')?.value||'all';const rows=students.filter(s=>(!q||`${s.full_name} ${s.roll_no}`.toLowerCase().includes(q))&&(cf==='all'||s.class_id===cf)&&(gf==='all'||s.school_group_id===gf));document.getElementById('studentTable').innerHTML=`<table><thead><tr><th>Student</th><th>Roll No</th><th>Password</th><th>Class</th><th>Subdivision</th><th>Actions</th></tr></thead><tbody>${rows.map(s=>`<tr><td><b>${esc(s.full_name)}</b></td><td>${esc(s.roll_no||'—')}</td><td><code>${esc(s.password||'—')}</code></td><td>${esc(s.className)}</td><td>${esc(groups.find(g=>g.id===s.school_group_id)?.name||'—')}</td><td><div class="actions"><button onclick="editStudent('${s.id}')">✎ Edit All</button><button class="secondary" onclick="changeClass('${s.id}')">Change Class</button><button class="secondary" onclick="changeGroup('${s.id}')">Subdivision</button><button class="danger" onclick="deleteStudent('${s.id}')">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="6">No School students found.</td></tr>'}</tbody></table>`}
function studentEditForm(s){const classOptions=classes.map(c=>`<option value="${c.id}" ${c.id===s.class_id?'selected':''}>${esc(c.name)}</option>`).join('');const classGroups=groups.filter(g=>g.class_id===s.class_id);const groupOptions=`<option value="">No subdivision</option>${classGroups.map(g=>`<option value="${g.id}" ${g.id===s.school_group_id?'selected':''}>${esc(g.name)}</option>`).join('')}`;document.getElementById('app').innerHTML=`${header('Edit School Student')}<div class="card"><div class="notice">You can edit <b>Name, Roll No, Password, Class and Subdivision</b>. Leave Password blank to keep the current password.</div><div class="grid"><div><label>Student Name</label><input id="esName" value="${esc(s.full_name||'')}"></div><div><label>Roll No</label><input id="esRoll" value="${esc(s.roll_no||'')}"></div><div><label>Password</label><input id="esPassword" value="" placeholder="Leave blank to keep current"></div><div><label>Class</label><select id="esClass" onchange="refreshEditStudentGroups()">${classOptions}</select></div><div><label>Subdivision</label><select id="esGroup">${groupOptions}</select></div></div><div id="esMsg"></div><div class="actions"><button onclick="saveStudentEdit('${s.id}')">💾 Save All Changes</button><button class="secondary" onclick="manageStudents()">Cancel</button></div></div>`}
function refreshEditStudentGroups(){const classId=document.getElementById('esClass')?.value,sel=document.getElementById('esGroup');if(!sel)return;const opts=groups.filter(g=>g.class_id===classId).map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('');sel.innerHTML='<option value="">No subdivision</option>'+opts}
async function editStudent(id){const s=students.find(x=>x.id===id);if(!s)return;studentEditForm(s)}
async function saveStudentEdit(id){const s=students.find(x=>x.id===id);if(!s)return;const name=document.getElementById('esName').value.trim(),roll=document.getElementById('esRoll').value.trim(),password=document.getElementById('esPassword').value,cls=document.getElementById('esClass').value,group=document.getElementById('esGroup').value||null;if(!name||!roll||!cls)return alert('Name, Roll No and Class are required.');if(password&&password.length<6)return alert('Password must contain at least 6 characters.');try{if(name!==String(s.full_name||''))await fn({action:'setStudentName',student_id:id,full_name:name});if(roll!==String(s.roll_no||''))await fn({action:'setStudentRollNo',student_id:id,roll_no:roll});if(cls!==String(s.class_id||''))await fn({action:'setStudentClass',student_id:id,class_id:cls});const currentGroupAfterClass=cls===String(s.class_id||'')?String(s.school_group_id||''):'';if(group!==currentGroupAfterClass)await fn({action:'setStudentSchoolGroup',student_id:id,school_group_id:group});if(password)await fn({action:'setStudentPassword',student_id:id,password});alert('Student details updated successfully.');await load();manageStudents()}catch(e){alert('Could not update student.\n\n'+(e.message||String(e)))}}
async function changeClass(id){const s=students.find(x=>x.id===id);if(!s)return;const choice=prompt(`Change class for ${s.full_name}.\n\n${classes.map((c,i)=>`${i+1}. ${c.name}`).join('\n')}\n\nEnter class number:`);if(choice===null)return;const n=Number(choice)-1;if(!classes[n])return alert('Invalid class.');try{await fn({action:'setStudentClass',student_id:id,class_id:classes[n].id});alert('Class changed successfully.');await load();manageStudents()}catch(e){alert(e.message||String(e))}}
async function changeGroup(id){const s=students.find(x=>x.id===id);if(!s)return;const available=groups.filter(g=>g.class_id===s.class_id);const text=`${available.map((g,i)=>`${i+1}. ${g.name}`).join('\n')}\n\nEnter number, or 0 for no subdivision.`;const currentIndex=available.findIndex(g=>g.id===s.school_group_id);const v=prompt(available.length?text:'No subdivisions exist for this class. Enter 0 for no subdivision.',''+(currentIndex>=0?currentIndex+1:0));if(v===null)return;const n=Number(v);if(!Number.isInteger(n)||n<0||n>available.length)return alert('Invalid subdivision.');try{await fn({action:'setStudentSchoolGroup',student_id:id,school_group_id:n===0?null:available[n-1].id});alert('Subdivision updated successfully.');await load();manageStudents()}catch(e){alert(e.message||String(e))}}
async function deleteStudent(id){const s=students.find(x=>x.id===id);if(!s)return;if(!confirm(`Delete ${s.full_name}? This removes the login account and related records.`))return;try{await fn({action:'deleteStudent',student_id:id});alert('Student deleted successfully.');await load();manageStudents()}catch(e){alert(e.message||String(e))}}

function manageClasses(){document.getElementById('app').innerHTML=`${header('School Classes')}<div class="card"><h2>Create Class</h2><label>Class Name</label><input id="cn" placeholder="Class VIII"><label>Description</label><textarea id="cd"></textarea><button onclick="saveClass()">+ Create Class</button></div><div class="card"><h2>Existing Classes</h2>${classes.map(c=>`<div class="student-card"><b>${esc(c.name)}</b><div class="muted">${esc(c.description||'')}</div><div class="small">${students.filter(s=>s.class_id===c.id).length} School student(s)</div></div>`).join('')||'<p class="muted">No classes.</p>'}<button class="secondary" onclick="home()">← Dashboard</button></div>`}
async function saveClass(){if(!cn.value.trim())return alert('Enter class name.');const {error}=await sb.from('classes').insert({name:cn.value.trim(),description:cd.value.trim(),teacher_id:teacher.id,course:'SCHOOL'});if(error)return alert(error.message);await load();manageClasses()}
function manageGroups(){document.getElementById('app').innerHTML=`${header('School Course Sub-divisions')}<div class="card"><h2>▣ Create Sub-division</h2><p class="muted">Create subdivisions under a specific School Class. Example: Class VIII → Section A, Section B.</p><label>Class</label><select id="gclass">${classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><label>Sub-division Name</label><input id="gn" placeholder="Section A"><label>Description</label><textarea id="gd"></textarea><button onclick="saveGroup()">+ Create Sub-division</button></div><div class="card"><h2>Existing Sub-divisions</h2>${groups.map(g=>`<div class="student-card"><b>${esc(g.name)}</b><div class="muted">Class: ${esc(classes.find(c=>c.id===g.class_id)?.name||'Unassigned')}</div><div class="muted">${esc(g.description||'')}</div><div class="small">${students.filter(s=>s.school_group_id===g.id).length} student(s)</div><div class="actions" style="margin-top:8px"><button class="secondary" onclick="renameGroup('${g.id}')">✎ Rename</button><button class="danger" onclick="deleteGroup('${g.id}')">Delete</button></div></div>`).join('')||'<p class="muted">No subdivisions created yet.</p>'}<button class="secondary" onclick="home()">← Dashboard</button></div>`}
async function saveGroup(){if(!gn.value.trim())return alert('Enter subdivision name.');if(!gclass.value)return alert('Select a Class.');const {error}=await sb.from('school_course_groups').insert({name:gn.value.trim(),description:gd.value.trim(),teacher_id:teacher.id,class_id:gclass.value});if(error)return alert(error.message);await load();manageGroups()}
async function renameGroup(id){const g=groups.find(x=>x.id===id);const n=prompt('Subdivision name:',g.name);if(n===null||!n.trim())return;const {error}=await sb.from('school_course_groups').update({name:n.trim()}).eq('id',id).eq('teacher_id',teacher.id);if(error)return alert(error.message);await load();manageGroups()}
async function deleteGroup(id){if(students.some(s=>s.school_group_id===id))return alert('Move students out of this subdivision before deleting it.');if(!confirm('Delete this subdivision?'))return;const {error}=await sb.from('school_course_groups').delete().eq('id',id).eq('teacher_id',teacher.id);if(error)return alert(error.message);await load();manageGroups()}

let bulkAssessmentRows=[], bulkAssessmentPdfPages=[];

async function bulkQuestionUpload(preselectId=''){
  if(!assessments.length){
    return alert('Create a School Assessment first, then upload questions to it.');
  }
  bulkAssessmentRows=[]; bulkAssessmentPdfPages=[];
  document.getElementById('app').innerHTML=`${header('Bulk Questions Upload')}<div class="card">
    <div class="notice"><b>School Assessment Question Uploader</b><br>
    Select an existing assessment, then upload questions either from Excel or from a PDF with a separate Excel marks/hints file.
    Existing questions are not deleted; uploaded questions are added after the current last question.</div>

    <label>Assessment</label>
    <select id="bqaAssessment">
      ${assessments.map(a=>`<option value="${a.id}" ${preselectId===a.id?'selected':''}>${esc(a.title)} — ${esc(a.subject||'')}</option>`).join('')}
    </select>

    <div class="grid" style="margin-top:14px">
      <div class="card" style="border:2px solid #2563eb;background:#f8fbff;margin:0">
        <span class="tag">METHOD 1</span>
        <h3>Excel — Complete Questions</h3>
        <p class="small muted">Columns: <b>Question No, Question, Marks, Hint</b>. Hint is optional.</p>

function normalizeBulkHeader(v){
  return String(v??'').trim().toLowerCase().replace(/[_\s]+/g,' ');
}
function bulkCol(headers,...names){
  for(const n of names){
    const i=headers.indexOf(normalizeBulkHeader(n));
    if(i>=0)return i;
  }
  return -1;
}
function showBulkStatus(t,ok=false){
  const el=document.getElementById('bqStatus');
  if(el)el.innerHTML=msg(t,ok);
}
function readBulkAssessmentExcel(ev){
  const f=ev.target.files?.[0]; if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(!raw.length)throw Error('The Excel file is empty.');
      const h=raw[0].map(normalizeBulkHeader);
      const ni=bulkCol(h,'question no','question number','no','#');
      const qi=bulkCol(h,'question','question text');
      const mi=bulkCol(h,'marks','mark');
      const hi=bulkCol(h,'hint','hints');
      if(qi<0||mi<0)throw Error('Required columns: Question and Marks. Question No and Hint are optional.');
      bulkAssessmentRows=raw.slice(1).map((row,i)=>({
        row:i+2,
        no:ni>=0?String(row[ni]||i+1).trim():String(i+1),
        question:String(row[qi]||'').trim(),
        marks:Number(row[mi]),
        hint:hi>=0?String(row[hi]||'').trim():''
      })).filter(x=>x.question);
      const bad=bulkAssessmentRows.filter(x=>!Number.isFinite(x.marks)||x.marks<0);
      if(bad.length)throw Error('Invalid marks in row(s): '+bad.map(x=>x.row).join(', '));
      document.getElementById('bqExcelPreview').innerHTML=
        `<div class="success">Loaded ${bulkAssessmentRows.length} question(s).</div>
         <div style="overflow:auto;max-height:280px"><table><thead><tr><th>#</th><th>Question</th><th>Marks</th><th>Hint</th></tr></thead>
         <tbody>${bulkAssessmentRows.map(x=>`<tr><td>${esc(x.no)}</td><td style="white-space:pre-wrap">${esc(x.question)}</td><td>${esc(x.marks)}</td><td>${esc(x.hint||'—')}</td></tr>`).join('')}</tbody></table></div>`;
      showBulkStatus(`${bulkAssessmentRows.length} Excel question(s) ready to import.`,true);
    }catch(e){
      bulkAssessmentRows=[];
      document.getElementById('bqExcelPreview').innerHTML=msg('Could not read Excel: '+e.message);
    }
  };
  r.readAsArrayBuffer(f);
}

let bulkAssessmentPdfMeta={};
function readBulkAssessmentKey(ev){
  const f=ev.target.files?.[0]; if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(!raw.length)throw Error('The Excel file is empty.');
      const h=raw[0].map(normalizeBulkHeader);
      const ni=bulkCol(h,'question no','question number','no','#');
      const mi=bulkCol(h,'marks','mark');
      const hi=bulkCol(h,'hint','hints');
      if(mi<0)throw Error('Required column: Marks.');
      bulkAssessmentPdfMeta={};
      raw.slice(1).forEach((row,i)=>{
        const no=ni>=0?String(row[ni]||i+1).trim():String(i+1);
        const marks=Number(row[mi]);
        if(Number.isFinite(marks))bulkAssessmentPdfMeta[no]={marks,hint:hi>=0?String(row[hi]||'').trim():''};
      });
      const count=Object.keys(bulkAssessmentPdfMeta).length;
      document.getElementById('bqPdfPreview').innerHTML=`<div class="success">${count} marks row(s) loaded.</div>`;
      showBulkStatus('PDF marks/hints are ready. Now upload the PDF if you have not already done so.',true);
    }catch(e){
      bulkAssessmentPdfMeta={};
      document.getElementById('bqPdfPreview').innerHTML=msg('Could not read marks Excel: '+e.message);
    }
  };
  r.readAsArrayBuffer(f);
}

function cropSchoolQuestionWhiteMargins(sourceCanvas){
  const ctx=sourceCanvas.getContext('2d',{willReadFrequently:true});
  const w=sourceCanvas.width, h=sourceCanvas.height;
  const data=ctx.getImageData(0,0,w,h).data;
  const threshold=248;
  let minX=w,minY=h,maxX=-1,maxY=-1;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const i=(y*w+x)*4;
      const r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
      if(a>10 && (r<threshold || g<threshold || b<threshold)){
        if(x<minX)minX=x;
        if(x>maxX)maxX=x;
        if(y<minY)minY=y;
        if(y>maxY)maxY=y;
      }
    }
  }
  if(maxX<0)return sourceCanvas;
  const pad=Math.max(12,Math.round(Math.min(w,h)*0.018));
  minX=Math.max(0,minX-pad); minY=Math.max(0,minY-pad);
  maxX=Math.min(w-1,maxX+pad); maxY=Math.min(h-1,maxY+pad);
  const out=document.createElement('canvas');
  out.width=maxX-minX+1; out.height=maxY-minY+1;
  out.getContext('2d').drawImage(
    sourceCanvas,minX,minY,out.width,out.height,0,0,out.width,out.height
  );
  return out;
}

async function readBulkAssessmentPdf(ev){
  const f=ev.target.files?.[0]; if(!f)return;
  const box=document.getElementById('bqPdfPreview');
  box.innerHTML=msg('Rendering PDF pages as images — OCR is not used…',true);
  try{
    const mod=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');
    mod.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
    const pdf=await mod.getDocument({data:await f.arrayBuffer()}).promise;
    const pages=[];
    for(let p=1;p<=pdf.numPages;p++){
      const page=await pdf.getPage(p);
      const base=page.getViewport({scale:1});
      const maxWidth=1800;
      const scale=Math.min(2.5,Math.max(1.6,maxWidth/base.width));
      const viewport=page.getViewport({scale});
      const canvas=document.createElement('canvas');
      const ctx=canvas.getContext('2d',{alpha:false});
      canvas.width=Math.ceil(viewport.width);
      canvas.height=Math.ceil(viewport.height);
      ctx.fillStyle='#fff';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      await page.render({canvasContext:ctx,viewport}).promise;

      // IMPORTANT: use rendered pixels only. Do not call getTextContent().
      const cropped=cropSchoolQuestionWhiteMargins(canvas);
      pages.push({
        no:String(p),
        image_data:cropped.toDataURL('image/jpeg',0.93),
        question:''
      });
    }
    bulkAssessmentPdfPages=pages;

    box.innerHTML=`<div class="success">
      Prepared <b>${pages.length}</b> PDF page(s) as question images. No OCR was performed.
      </div>
      <div class="small muted" style="margin-top:8px">
        Each page is stored as an image. Large white margins are trimmed automatically, while the Assamese text, fonts, symbols and page layout are preserved visually.
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px">
        ${pages.slice(0,12).map(x=>`<div style="border:1px solid #dbe3ee;border-radius:10px;padding:6px;background:#fff">
          <img src="${x.image_data}" style="width:100%;display:block;border-radius:7px" alt="PDF page ${x.no}">
          <div class="small muted" style="margin-top:4px;text-align:center">Question ${x.no}</div>
        </div>`).join('')}
      </div>
      ${pages.length>12?`<div class="small muted" style="margin-top:8px">Showing first 12 previews.</div>`:''}`;
    showBulkStatus(`${pages.length} PDF page(s) converted to cropped question images. No OCR used.`,true);
  }catch(e){
    bulkAssessmentPdfPages=[];
    box.innerHTML=msg('Could not convert PDF to images: '+e.message);
  }
}

async function saveBulkAssessmentQuestions(){
  const aid=document.getElementById('bqaAssessment')?.value;
  if(!aid)return alert('Select an assessment.');
  let rows=[];
  if(bulkAssessmentRows.length){
    rows=bulkAssessmentRows.map(x=>({
      assessment_id:aid,
      question_order:0,
      question_text:x.question,
      marks:x.marks,
      hint:x.hint||''
    }));
  }else if(bulkAssessmentPdfPages.length){
    if(!Object.keys(bulkAssessmentPdfMeta).length)return alert('Upload the Marks / Hint Excel for the PDF first.');
    const missing=bulkAssessmentPdfPages.filter(x=>!bulkAssessmentPdfMeta[x.no]||!Number.isFinite(bulkAssessmentPdfMeta[x.no].marks));
    if(missing.length)return alert('Marks are missing for PDF question/page: '+missing.map(x=>x.no).join(', '));
    rows=bulkAssessmentPdfPages.map(x=>{
      const meta=bulkAssessmentPdfMeta[x.no];
      return {
        assessment_id:aid,
        question_order:0,
        question_text:'',
        question_image_data:x.image_data,
        marks:meta.marks,
        hint:meta.hint||''
      };
    });
  }else{
    return alert('Upload an Excel file or a PDF + Marks Excel file first.');
  }

  try{
    const {data:last,error:le}=await sb.from('school_questions')
      .select('question_order').eq('assessment_id',aid)
      .order('question_order',{ascending:false}).limit(1);
    if(le)throw le;
    let next=(last?.[0]?.question_order||0)+1;
    rows.forEach(x=>x.question_order=next++);
    // PDF questions are stored as real images in Supabase Storage.
    // Keep text as an empty string because school_questions.question_text is NOT NULL.\n    // The PDF/Assamese content itself remains an image; no OCR is used.
    const dbRows=[];
    for(const x of rows){
      let imageUrl=null;
      if(x.question_image_data){
        const path=`${teacher.id}/${aid}/q${x.question_order}-${crypto.randomUUID()}.jpg`;
        const blob=await (await fetch(x.question_image_data)).blob();
        const {error:ue}=await sb.storage.from('school-question-images').upload(
          path,blob,{contentType:'image/jpeg',upsert:false}
        );
        if(ue)throw ue;
        const {data:pu}=sb.storage.from('school-question-images').getPublicUrl(path);
        imageUrl=pu.publicUrl;
      }
      dbRows.push({
        assessment_id:aid,
        question_order:x.question_order,
        question_text:x.question_text||'',
        question_image_url:imageUrl,
        marks:Number(x.marks)||0,
        hint:(x.hint||'').trim()||null
      });
    }
    const {error}=await sb.from('school_questions').insert(dbRows);
    if(error)throw error;
    alert(`${dbRows.length} question(s) added successfully.`);
    bulkAssessmentRows=[];bulkAssessmentPdfPages=[];bulkAssessmentPdfMeta={};
    await load(); editQuestions(aid);
  }catch(e){
    alert('Could not add questions: '+e.message);
  }
}

let qbBulkChapterRows=[];
function qbReadChapterExcel(ev){
  const f=ev.target.files?.[0]; if(!f)return;
  const r=new FileReader();
  r.onload=e=>{try{
    const wb=XLSX.read(e.target.result,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    if(raw.length<2)throw Error('Excel template contains no chapter rows.');
    const h=raw[0].map(qbBulkHeader),get=(row,...names)=>{const i=qbBulkFind(h,...names);return i>=0?qbBulkNormalize(row[i]):''};
    qbBulkChapterRows=raw.slice(1).map((row,i)=>({row:i+2,chapterNo:get(row,'Chapter No','Chapter Number'),chapterName:get(row,'Chapter Name'),description:get(row,'Description')})).filter(x=>x.chapterNo||x.chapterName||x.description);
    const bad=qbBulkChapterRows.filter(x=>!/^\d+$/.test(x.chapterNo)||Number(x.chapterNo)<1||!x.chapterName);
    const duplicateRows=[]; const seen=new Set();
    qbBulkChapterRows.forEach(x=>{const k=String(x.chapterNo)+'|'+x.chapterName.toLowerCase();if(seen.has(k))duplicateRows.push(x.row);seen.add(k)});
    qbBulkSetPreview('qbChapterBulkPreview',`<div class="${bad.length?'notice':'success'}">Loaded <b>${qbBulkChapterRows.length}</b> chapter row(s). ${bad.length?`<span style="color:#b91c1c">${bad.length} invalid row(s).</span>`:'Basic validation passed.'}${duplicateRows.length?` <span style="color:#b91c1c">Duplicate rows inside file: ${duplicateRows.join(', ')}.</span>`:''}</div><div style="overflow:auto;max-height:350px"><table><thead><tr><th>Row</th><th>Chapter No</th><th>Chapter Name</th><th>Description</th><th>Status</th></tr></thead><tbody>${qbBulkChapterRows.map(x=>{const ok=/^\d+$/.test(x.chapterNo)&&Number(x.chapterNo)>0&&x.chapterName;return `<tr><td>${x.row}</td><td>${qbEsc(x.chapterNo)}</td><td>${qbEsc(x.chapterName)}</td><td>${qbEsc(x.description||'')}</td><td>${ok?'✓':'Invalid'}</td></tr>`}).join('')}</tbody></table></div>`);
  }catch(e){qbBulkChapterRows=[];qbBulkSetPreview('qbChapterBulkPreview',msg('Could not read Chapter Excel: '+e.message))}};
  r.readAsArrayBuffer(f);
}
async function qbImportChapterExcel(){
  if(!qbBulkChapterRows.length)return alert('Upload the Chapter Excel file first.');
  const invalid=qbBulkChapterRows.filter(x=>!/^\d+$/.test(x.chapterNo)||Number(x.chapterNo)<1||!x.chapterName);
  if(invalid.length)return alert('Invalid row(s): '+invalid.map(x=>x.row).join(', '));
  const action=document.getElementById('qbChapterDuplicateAction')?.value||'skip';
  const status=document.getElementById('qbChapterBulkStatus'); let created=0,updated=0,skipped=0;
  try{
    const {data:existing,error}=await sb.from('school_question_bank_chapters').select('*').eq('teacher_id',teacher.id);
    if(error)throw error;
    const byNo=new Map((existing||[]).map(c=>[String(c.chapter_number),c]));
    const seen=new Set();
    for(const r of qbBulkChapterRows){
      const no=String(Number(r.chapterNo));
      if(seen.has(no)){if(action==='stop')throw Error(`Duplicate Chapter No ${no} appears more than once in the Excel file.`);if(action==='skip'){skipped++;continue;}}
      seen.add(no);
      const old=byNo.get(no);
      if(old){
        if(action==='stop')throw Error(`Chapter No ${no} already exists (${old.chapter_name}).`);
        if(action==='skip'){skipped++;continue;}
        const {error:e}=await sb.from('school_question_bank_chapters').update({chapter_name:r.chapterName,description:r.description||null}).eq('id',old.id).eq('teacher_id',teacher.id);if(e)throw e;updated++;byNo.set(no,{...old,chapter_name:r.chapterName,description:r.description||null});
      }else{
        const {data,error:e}=await sb.from('school_question_bank_chapters').insert({teacher_id:teacher.id,chapter_number:Number(r.chapterNo),chapter_name:r.chapterName,description:r.description||null}).select().single();if(e)throw e;created++;byNo.set(no,data);
      }
    }
    await loadQuestionBank();
    status.innerHTML=`<div class="success"><b>Chapter import completed.</b> Created: ${created} &nbsp; Updated: ${updated} &nbsp; Skipped: ${skipped}</div><button onclick="qbChapterManager()">Open Chapter Manager</button>`;
  }catch(e){status.innerHTML=msg('Import stopped: '+e.message)}
}

function qbBulkSetPreview(id,html){const e=document.getElementById(id);if(e)e.innerHTML=html}
function qbBulkNormalize(v){return String(v??'').trim()}
function qbBulkHeader(v){return qbBulkNormalize(v).toLowerCase().replace(/[_\s]+/g,' ')}
function qbBulkFind(h,...names){for(const n of names){const i=h.indexOf(qbBulkHeader(n));if(i>=0)return i}return -1}
function qbBulkNumber(v,def=0){const n=Number(v);return Number.isFinite(n)?n:def}
function qbBulkValid(r,i,source='structured'){const e=[];if(source!=='pdf'&&!r.chapterNo) e.push('Chapter');if(!r.questionType||!QB_TYPES.includes(r.questionType))e.push('Question Type');if(!r.marks||r.marks<=0)e.push('Marks');if(!QB_LEVELS.includes(r.cognitiveLevel))e.push('Cognitive Level');if(!['Easy','Medium','Hard'].includes(r.difficulty))e.push('Difficulty');if(!r.english&&!r.assamese)e.push('English/Assamese question');if(source!=='pdf'&&r.questionType==='MCQ'&&(!r.correctAnswer||!r.optionAEn&&!r.optionAAs))e.push('MCQ options/correct answer');if(source==='pdf'&&r.questionType==='MCQ'&&!r.correctAnswer)e.push('Correct Answer');return e}
function qbReadBulkExcel(ev){const f=ev.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});if(raw.length<2)throw Error('Excel template contains no question rows.');const h=raw[0].map(qbBulkHeader),get=(row,...n)=>{const i=qbBulkFind(h,...n);return i>=0?qbBulkNormalize(row[i]):''};qbBulkExcelRows=raw.slice(1).map((row,i)=>({row:i+2,chapterNo:get(row,'Chapter No','Chapter Number'),chapterName:get(row,'Chapter Name'),questionType:get(row,'Question Type')||'MCQ',marks:qbBulkNumber(get(row,'Marks')),cognitiveLevel:get(row,'Cognitive Level')||'Knowledge',difficulty:get(row,'Difficulty')||'Medium',english:get(row,'English Question','Question English'),assamese:get(row,'Assamese Question','Question Assamese'),optionAEn:get(row,'Option A English'),optionAAs:get(row,'Option A Assamese'),optionBEn:get(row,'Option B English'),optionBAs:get(row,'Option B Assamese'),optionCEn:get(row,'Option C English'),optionCAs:get(row,'Option C Assamese'),optionDEn:get(row,'Option D English'),optionDAs:get(row,'Option D Assamese'),correctAnswer:get(row,'Correct Answer'),explanation:get(row,'Explanation','Answer / Explanation'),imageUrl:get(row,'Image URL')})).filter(x=>x.english||x.assamese);const bad=qbBulkExcelRows.map((x,i)=>({x,i})).filter(z=>qbBulkValid(z.x,z.i,'excel').length);qbBulkSetPreview('qbBulkExcelPreview',`<div class="success">Loaded <b>${qbBulkExcelRows.length}</b> row(s). ${bad.length?`<span style="color:#b91c1c">${bad.length} row(s) need correction.</span>`:'All rows pass basic validation.'}</div><div style="overflow:auto;max-height:300px"><table><thead><tr><th>Row</th><th>Chapter</th><th>Type</th><th>Marks</th><th>Cognitive</th><th>English</th><th>Assamese</th><th>Correct</th></tr></thead><tbody>${qbBulkExcelRows.map(x=>`<tr><td>${x.row}</td><td>${qbEsc(x.chapterNo||'Default')}</td><td>${qbEsc(x.questionType)}</td><td>${x.marks}</td><td>${qbEsc(x.cognitiveLevel)}</td><td>${qbEsc(x.english.slice(0,80))}</td><td>${qbEsc(x.assamese.slice(0,80))}</td><td>${qbEsc(x.correctAnswer||'')}</td></tr>`).join('')}</tbody></table></div>`)}catch(e){qbBulkExcelRows=[];qbBulkSetPreview('qbBulkExcelPreview',msg('Could not read Excel: '+e.message))}};r.readAsArrayBuffer(f)}
function qbWordLinesFromHtml(html){const d=document.createElement('div');d.innerHTML=html;return Array.from(d.querySelectorAll('p,li,h1,h2,h3,h4')).map(x=>x.textContent.replace(/\u00a0/g,' ').trim()).filter(Boolean)}
function qbParseWordBlock(lines){const rows=[];let cur=null,lastKey='';for(const line of lines){if(/^\[QUESTION\]$/i.test(line)){if(cur)rows.push(cur);cur={};lastKey='';continue}if(/^\[\/QUESTION\]$/i.test(line)){if(cur)rows.push(cur);cur=null;lastKey='';continue}if(!cur)continue;const m=line.match(/^([^:]+):\s*(.*)$/);if(m){lastKey=qbBulkHeader(m[1]);cur[lastKey]=m[2].trim()}else if(lastKey){cur[lastKey]=(cur[lastKey]?cur[lastKey]+'\n':'')+line}}if(cur)rows.push(cur);return rows.map((x,i)=>({row:i+1,chapterNo:x['chapter no']||x['chapter number']||'',chapterName:x['chapter name']||'',questionType:x['question type']||'MCQ',marks:qbBulkNumber(x['marks']),cognitiveLevel:x['cognitive level']||'Knowledge',difficulty:x['difficulty']||'Medium',english:x['english question']||'',assamese:x['assamese question']||'',optionAEn:x['option a english']||'',optionAAs:x['option a assamese']||'',optionBEn:x['option b english']||'',optionBAs:x['option b assamese']||'',optionCEn:x['option c english']||'',optionCAs:x['option c assamese']||'',optionDEn:x['option d english']||'',optionDAs:x['option d assamese']||'',correctAnswer:x['correct answer']||'',explanation:x['explanation']||x['answer / explanation']||''}))}
async function qbReadBulkWord(ev){const f=ev.target.files?.[0];if(!f)return;try{if(!window.mammoth)throw Error('Word reader library did not load. Refresh the page and try again.');const a=await f.arrayBuffer(),res=await mammoth.convertToHtml({arrayBuffer:a});qbBulkWordRows=qbParseWordBlock(qbWordLinesFromHtml(res.value));qbBulkSetPreview('qbBulkWordPreview',`<div class="success">Read <b>${qbBulkWordRows.length}</b> question(s) from Word.</div><div style="overflow:auto;max-height:300px"><table><thead><tr><th>#</th><th>Chapter</th><th>Type</th><th>Marks</th><th>English</th><th>Assamese</th></tr></thead><tbody>${qbBulkWordRows.map(x=>`<tr><td>${x.row}</td><td>${qbEsc(x.chapterNo||'Default')}</td><td>${qbEsc(x.questionType)}</td><td>${x.marks}</td><td>${qbEsc(x.english.slice(0,90))}</td><td>${qbEsc(x.assamese.slice(0,90))}</td></tr>`).join('')}</tbody></table></div>`)}catch(e){qbBulkWordRows=[];qbBulkSetPreview('qbBulkWordPreview',msg('Could not read Word: '+e.message))}}
function qbReadBulkPdfMeta(ev){const f=ev.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});if(raw.length<2)throw Error('Metadata Excel contains no rows.');const h=raw[0].map(qbBulkHeader),get=(row,...n)=>{const i=qbBulkFind(h,...n);return i>=0?qbBulkNormalize(row[i]):''};qbBulkPdfMeta={};raw.slice(1).forEach((row,i)=>{const page=get(row,'Page No','Question No')||String(i+1);qbBulkPdfMeta[page]={chapterNo:get(row,'Chapter No','Chapter Number'),chapterName:get(row,'Chapter Name'),questionType:get(row,'Question Type')||'MCQ',marks:qbBulkNumber(get(row,'Marks')),cognitiveLevel:get(row,'Cognitive Level')||'Knowledge',difficulty:get(row,'Difficulty')||'Medium',correctAnswer:get(row,'Correct Answer'),explanation:get(row,'Explanation','Answer / Explanation')};});qbBulkSetPreview('qbBulkPdfPreview',`<div class="success">Loaded metadata for <b>${Object.keys(qbBulkPdfMeta).length}</b> page(s).</div>`)}catch(e){qbBulkPdfMeta={};qbBulkSetPreview('qbBulkPdfPreview',msg('Could not read metadata Excel: '+e.message))}};r.readAsArrayBuffer(f)}
function qbCropCanvas(sourceCanvas){const ctx=sourceCanvas.getContext('2d',{willReadFrequently:true}),w=sourceCanvas.width,h=sourceCanvas.height,data=ctx.getImageData(0,0,w,h).data,threshold=248;let minX=w,minY=h,maxX=-1,maxY=-1;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;if(data[i+3]>10&&(data[i]<threshold||data[i+1]<threshold||data[i+2]<threshold)){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}}if(maxX<0)return sourceCanvas;const pad=Math.max(12,Math.round(Math.min(w,h)*.018));minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);maxX=Math.min(w-1,maxX+pad);maxY=Math.min(h-1,maxY+pad);const out=document.createElement('canvas');out.width=maxX-minX+1;out.height=maxY-minY+1;out.getContext('2d').drawImage(sourceCanvas,minX,minY,out.width,out.height,0,0,out.width,out.height);return out}
async function qbReadBulkPdf(ev){const f=ev.target.files?.[0];if(!f)return;const box=document.getElementById('qbBulkPdfPreview');box.innerHTML=msg('Rendering PDF pages as images — no OCR is used…',true);try{const mod=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');mod.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';const pdf=await mod.getDocument({data:await f.arrayBuffer()}).promise;qbBulkPdfPages=[];for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p),base=page.getViewport({scale:1}),scale=Math.min(2.5,Math.max(1.6,1800/base.width)),vp=page.getViewport({scale}),canvas=document.createElement('canvas');canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);const ctx=canvas.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);await page.render({canvasContext:ctx,viewport:vp}).promise;const cropped=qbCropCanvas(canvas);qbBulkPdfPages.push({page:String(p),image:cropped.toDataURL('image/jpeg',.93)})}box.innerHTML=`<div class="success">Prepared <b>${qbBulkPdfPages.length}</b> page image(s). No OCR used.</div><div class="small muted">Each PDF page becomes one Question Bank question. Metadata comes from the PDF Metadata Excel.</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px">${qbBulkPdfPages.slice(0,12).map(x=>`<div class="student-card"><img src="${x.image}" style="width:100%"><div class="small muted">Page ${x.page}</div></div>`).join('')}</div>`}catch(e){qbBulkPdfPages=[];box.innerHTML=msg('Could not convert PDF: '+e.message)}}
function qbFindChapter(row,defaultId){let c=null;if(row.chapterNo)c=qbChapters.find(c=>String(c.chapter_number)===String(row.chapterNo));if(!c&&row.chapterName)c=qbChapters.find(c=>c.chapter_name.trim().toLowerCase()===row.chapterName.trim().toLowerCase());if(c)return c;if(!row.chapterNo&&!row.chapterName&&defaultId)return qbChapters.find(c=>c.id===defaultId)||null;return null}

async function qbInsertBulkRow(r,chapter,blocksToUpload=[]){const q={teacher_id:teacher.id,chapter_id:chapter.id,question_text_en:r.english||'',question_text_as:r.assamese||'',question_type:r.questionType,marks:r.marks,cognitive_level:r.cognitiveLevel,difficulty:r.difficulty,explanation:r.explanation||'',correct_answer:r.correctAnswer||null,has_images:!!r.image};const {data,error}=await sb.from('school_question_bank_questions').insert(q).select().single();if(error)throw error;const blocks=[];if(r.image){const path=`${teacher.id}/${crypto.randomUUID()}-bulk.jpg`;const blob=await (await fetch(r.image)).blob();const up=await sb.storage.from('school-question-bank-images').upload(path,blob,{contentType:'image/jpeg'});if(up.error)throw up.error;const {data:u}=sb.storage.from('school-question-bank-images').getPublicUrl(path);blocks.push({question_id:data.id,block_order:1,block_type:'IMAGE',image_url:u.publicUrl,image_width:100,alt_text:'Bulk PDF question'});}else{blocks.push({question_id:data.id,block_order:1,block_type:'TEXT',text_en:r.english||'',text_as:r.assamese||''})}const bi=await sb.from('school_question_bank_blocks').insert(blocks);if(bi.error)throw bi.error;const os=qbBulkOptionObjects(r);if(r.questionType==='MCQ'&&os.length){const oi=await sb.from('school_question_bank_options').insert(os.map((o,i)=>({question_id:data.id,display_order:i,option_label:o.label,option_text_en:o.en||'',option_text_as:o.as||'',is_correct:String(r.correctAnswer||'').trim().toUpperCase()===o.label})));if(oi.error)throw oi.error}return data}

async function qbSave(){
  if(!qbChapters.length)return alert('Create at least one chapter first.');
  if(!qbEditorBlocks.length)return alert('Add at least one text or image block.');
  const type=document.getElementById('qbType').value;
  if(type==='MCQ'&&(qbEditorOptions.length<2||qbEditorOptions.filter(o=>o.is_correct).length!==1))return alert('MCQ needs at least 2 options and exactly one correct answer.');
  const payload={teacher_id:teacher.id,chapter_id:document.getElementById('qbChapter').value,question_type:type,marks:Number(document.getElementById('qbMarks').value),cognitive_level:document.getElementById('qbLevel').value,difficulty:document.getElementById('qbDifficulty').value,explanation:document.getElementById('qbExplanation').value.trim()||null,correct_answer:type==='MCQ'?(qbEditorOptions.find(o=>o.is_correct)?.option_label||null):null,question_text_en:qbEditorBlocks.filter(b=>b.block_type==='TEXT').map(b=>b.text_en||'').join('\n').trim(),question_text_as:qbEditorBlocks.filter(b=>b.block_type==='TEXT').map(b=>b.text_as||'').join('\n').trim(),has_images:qbEditorBlocks.some(b=>b.block_type==='IMAGE')};
  try{
    let qid=qbEditingId;
    if(qid){const {error}=await sb.from('school_question_bank_questions').update(payload).eq('id',qid).eq('teacher_id',teacher.id);if(error)throw error;await sb.from('school_question_bank_blocks').delete().eq('question_id',qid);await sb.from('school_question_bank_options').delete().eq('question_id',qid);}
    else {const {data,error}=await sb.from('school_question_bank_questions').insert(payload).select().single();if(error)throw error;qid=data.id;}
    const blocks=qbEditorBlocks.map((b,i)=>({question_id:qid,block_order:i+1,block_type:b.block_type,text_en:b.text_en||null,text_as:b.text_as||null,image_url:b.image_url||null,image_width:Number(b.image_width||70),alt_text:b.alt_text||null}));
    const {error:be}=await sb.from('school_question_bank_blocks').insert(blocks);if(be)throw be;
    if(type==='MCQ'){const opts=qbEditorOptions.map((o,i)=>({question_id:qid,display_order:i+1,option_label:o.option_label||String.fromCharCode(65+i),option_text_en:o.option_text_en||null,option_text_as:o.option_text_as||null,is_correct:!!o.is_correct,image_url:o.image_url||null}));const {error:oe}=await sb.from('school_question_bank_options').insert(opts);if(oe)throw oe;}
    alert('Question saved successfully.');questionBankHome();
  }catch(e){alert('Could not save question: '+e.message)}
}

function qbQuestionForPaper(q,blocks,opts,lang){
  const bs=blocks.filter(b=>b.question_id===q.id).sort((a,b)=>a.block_order-b.block_order);
  const os=opts.filter(o=>o.question_id===q.id).sort((a,b)=>a.display_order-b.display_order);
  const useAs=lang==='AS' || lang==='BOTH';
  const useEn=lang==='EN' || lang==='BOTH';
  return {q,bs,os,useAs,useEn};
}

function gpSubsetClosest(items,target){

  const scale=1, T=Math.round(target);
  let states=new Map([[0,[]]]);
  for(let i=0;i<items.length;i++){
    const m=Number(items[i].marks); if(!Number.isFinite(m)||m<=0)continue;
    const next=new Map(states);
    for(const [sum,arr] of states){
      const ns=sum+m;if(ns>T+10)continue;
      if(!next.has(ns))next.set(ns,arr.concat(i));
    }
    states=next;
  }
  let best=0,bestArr=[];
  for(const [sum,arr] of states){if(Math.abs(target-sum)<Math.abs(target-best)){best=sum;bestArr=arr}else if(sum===target){best=sum;bestArr=arr;break}}
  return {sum:best,indices:bestArr};
}
async function gpGenerate(){
  const total=Number(document.getElementById('gpTotal').value||0),p=QB_LEVELS.map((_,i)=>Number(document.getElementById('gpPct'+i).value||0));
  if(!total||p.reduce((a,b)=>a+b,0)!==100)return alert('Total marks must be set and cognitive percentages must total 100%.');
  const lang=document.getElementById('gpLang').value,ch=document.getElementById('gpChapter').value;
  const typeP=QB_TYPES.map((_,i)=>Number(document.getElementById('gpTypePct'+i).value||0));
  const candidates=qbQuestions.filter(q=>!ch||q.chapter_id===ch);
  const blocks=(await sb.from('school_question_bank_blocks').select('*').in('question_id',candidates.map(q=>q.id)).order('block_order')).data||[];
  const opts=(await sb.from('school_question_bank_options').select('*').in('question_id',candidates.map(q=>q.id)).order('display_order')).data||[];
  const selected=[],used=new Set(),report=[];
  for(let li=0;li<QB_LEVELS.length;li++){
    const level=QB_LEVELS[li],target=total*p[li]/100;
    let pool=candidates.filter(q=>q.cognitive_level===level&&!used.has(q.id));
    const typeWanted=typeP.findIndex(x=>x>0);
    if(typeWanted>=0 && typeP.filter(x=>x>0).length===1)pool=pool.filter(q=>q.question_type===QB_TYPES[typeWanted]);
    const r=gpSubsetClosest(pool,target);
    r.indices.forEach(i=>{const q=pool[i];if(!used.has(q.id)){used.add(q.id);selected.push(q)}});
    report.push({level,target,actual:r.sum,diff:r.sum-target});
  }
  let sum=selected.reduce((a,q)=>a+Number(q.marks),0);
  // Fill remaining marks from unused questions, preferring smallest positive difference.
  if(sum<total){
    const remain=candidates.filter(q=>!used.has(q.id)).sort((a,b)=>Math.abs((total-sum)-a.marks)-Math.abs((total-sum)-b.marks));
    for(const q of remain){if(sum>=total)break;if(sum+Number(q.marks)<=total){used.add(q.id);selected.push(q);sum+=Number(q.marks)}}
  }
  if(!selected.length)return alert('No suitable questions found for the selected blueprint.');
  window._generatedBankPaper={selected,blocks,opts,lang,total,report,className:document.getElementById('gpClass').value||'',subject:document.getElementById('gpSubject').value||'',duration:document.getElementById('gpDuration').value||''};
  const exact=selected.reduce((a,q)=>a+Number(q.marks),0)===total;
  document.getElementById('gpResult').innerHTML=`<div class="${exact?'success':'notice'}"><b>${exact?'Paper generated successfully.':'Best-fit paper generated.'}</b> Selected ${selected.length} questions = ${sum} marks. ${report.map(r=>`${r.level}: ${r.actual}/${r.target.toFixed(0)}`).join(' | ')}</div><button onclick="previewBankPaper()">👁 Preview / Print PDF</button>`;
}
function bankBlockHtml(b,lang){
  if(b.block_type==='IMAGE')return `<div style="text-align:center;margin:8px 0"><img src="${qbEsc(b.image_url)}" alt="${qbEsc(b.alt_text||'')}" style="max-width:100%;width:${Number(b.image_width||70)}%;height:auto;display:inline-block"></div>`;
  const text=lang==='AS'?b.text_as:(lang==='BOTH'?`${b.text_en||''}${b.text_en&&b.text_as?'<br>':''}${b.text_as||''}`:b.text_en);
  return text?`<div style="margin:5px 0;white-space:pre-wrap">${text}</div>`:'';
}
function previewBankPaper(){
  const p=window._generatedBankPaper;if(!p)return;
  const qs=p.selected.map((q,i)=>{const bs=p.blocks.filter(b=>b.question_id===q.id),os=p.opts.filter(o=>o.question_id===q.id);return `<div class="bank-print-q"><div><b>${i+1}. [${q.marks} marks]</b></div>${bs.map(b=>bankBlockHtml(b,p.lang)).join('')}${q.question_type==='MCQ'?`<div style="margin-top:6px">${os.map(o=>`<div style="margin:4px 0;padding-left:18px"><b>${qbEsc(o.option_label)}.</b> ${p.lang==='AS'?qbEsc(o.option_text_as||''):p.lang==='BOTH'?`${qbEsc(o.option_text_en||'')}${o.option_text_en&&o.option_text_as?'<br>':''}${qbEsc(o.option_text_as||'')}`:qbEsc(o.option_text_en||'')}${o.image_url?`<br><img src="${qbEsc(o.image_url)}" style="max-width:55%;height:auto">`:''}</div>`).join('')}</div>`:''}</div>`}).join('');
  const answer=p.selected.map((q,i)=>{const o=p.opts.find(o=>o.question_id===q.id&&o.is_correct);return `<tr><td>${i+1}</td><td>${q.question_type==='MCQ'?qbEsc(o?.option_label||q.correct_answer||'—'):'See expected answer / marking notes'}</td><td>${q.marks}</td></tr>`}).join('');
  const w=window.open('','_blank','width=1000,height=800');if(!w)return alert('Allow pop-ups for the print preview.');
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Question Paper</title><style>
  @page{size:A4;margin:15mm}body{font-family:Arial,"Noto Sans Assamese","Nirmala UI",sans-serif;color:#111;line-height:1.4}.header{text-align:center;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:12px}.meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin:5px 0}.bank-print-q{break-inside:avoid;margin:0 0 12px}.opts{margin-left:15px}.ans{page-break-before:always}table{border-collapse:collapse;width:100%}th,td{border:1px solid #888;padding:6px}.no-print{margin-bottom:12px}@media print{.no-print{display:none}}</style></head><body><div class="no-print"><button onclick="window.print()">Print / Save as PDF</button></div><div class="header"><h2 style="margin:0">SWARUP SIR'S KNOWLEDGE HUB</h2><h3>${qbEsc(p.subject||'Question Paper')}</h3><div class="meta"><span>Class: ${qbEsc(p.className)}</span><span>Language: ${p.lang==='BOTH'?'English + Assamese':p.lang==='AS'?'Assamese':'English'}</span><span>Marks: ${p.total}</span><span>Time: ${qbEsc(p.duration)}</span></div></div>${qs}<div class="ans"><h2>ANSWER KEY</h2><table><thead><tr><th>Q.No.</th><th>Answer</th><th>Marks</th></tr></thead><tbody>${answer}</tbody></table></div></body></html>`);w.document.close();
}
