<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Teacher Dashboard — Swarup Sir's Knowledge Hub</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f8fc;color:#172033}.wrap{max-width:1180px;margin:auto;padding:20px}.top{background:linear-gradient(135deg,#087ed7,#2563eb);color:#fff;border-radius:18px;padding:22px;margin-bottom:18px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 5px 20px #0000000d;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{font-size:30px;font-weight:700;margin-top:6px}.muted{color:#64748b}.small{font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:11px 15px;background:#2563eb;color:#fff;cursor:pointer;font-size:15px}.secondary{background:#e8eef8;color:#172033}.danger{background:#dc2626}.assignment{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-top:10px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccd5e2;border-radius:9px;margin:6px 0 12px;font-size:15px}label{font-weight:600}.notice{padding:12px;border-radius:10px;background:#eff6ff;color:#1e40af;margin:10px 0}.success{padding:12px;border-radius:10px;background:#ecfdf5;color:#166534}.err{padding:12px;border-radius:10px;background:#fef2f2;color:#991b1b}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div id="app"><div class="card">Loading…</div></div></div>
<script>
const SUPABASE_URL="https://jupefjdquakqsizapzbv.supabase.co", SUPABASE_KEY="sb_publishable_eUcdkv0kFJjkifHQwQBUwg_VcY_lgTP";const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let teacher=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('teacher-login.html');return}const {data:p,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();if(error||p?.role!=='teacher'){await sb.auth.signOut();location.replace('teacher-login.html');return}teacher=p;await home()}
async function home(){const [{data:classes},{data:students},{data:assessments}]=await Promise.all([sb.from('classes').select('id,name').eq('teacher_id',teacher.id).order('name'),sb.from('profiles').select('id,full_name,roll_no').eq('role','student').order('full_name'),sb.from('school_assessments').select('*').eq('created_by',teacher.id).order('created_at',{ascending:false})]);
 document.getElementById('app').innerHTML=`<div class="top"><div><div class="small">🏫 SCHOOL TEACHER PORTAL</div><h1 style="margin:6px 0">Teacher Dashboard</h1><div>${esc(teacher.full_name||'Teacher')}</div></div><div class="actions"><button class="secondary" onclick="location.href='index.html'">Course Home</button><button onclick="logout()">Logout</button></div></div><div class="grid"><div class="card"><div class="muted">Classes</div><div class="stat">${classes?.length||0}</div></div><div class="card"><div class="muted">Students</div><div class="stat">${students?.length||0}</div></div><div class="card"><div class="muted">Assessments</div><div class="stat">${assessments?.length||0}</div></div></div><div class="card"><div class="actions"><button onclick="newAssessment()">+ New Assessment</button><button class="secondary" onclick="manageStudents()">👥 Students</button><button class="secondary" onclick="manageClasses()">🏫 Classes</button></div></div><div class="card"><h2>📝 School Assessments</h2>${(assessments||[]).map(a=>`<div class="assignment"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h3>${esc(a.title)}</h3><div class="muted">${esc(a.subject||'')} ${a.total_marks?`• ${a.total_marks} marks`:''}</div></div><span class="small">${a.deadline?`Due ${new Date(a.deadline).toLocaleString()}`:'No deadline'}</span></div><div class="actions" style="margin-top:10px"><button onclick="editQuestions('${a.id}')">✎ Questions</button><button class="secondary" onclick="deleteAssessment('${a.id}')">Delete</button></div></div>`).join('')||'<p class="muted">No school assessments yet.</p>'}</div>`}
function newAssessment(){document.getElementById('app').innerHTML=`<div class="card"><h2>+ New School Assessment</h2><label>Assessment Name</label><input id="title" placeholder="e.g. Mathematics Unit Test 1"><label>Subject</label><input id="subject" placeholder="Mathematics"><label>Class</label><select id="classId"></select><label>Deadline (optional)</label><input id="deadline" type="datetime-local"><div class="actions"><button onclick="saveAssessment()">Save & Add Questions</button><button class="secondary" onclick="home()">Cancel</button></div></div>`;loadClasses()}
async function loadClasses(){const {data}=await sb.from('classes').select('id,name').eq('teacher_id',teacher.id).order('name');classId.innerHTML=(data||[]).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')||'<option value="">Create a class first</option>'}
async function saveAssessment(){if(!title.value.trim())return alert('Enter assessment name.');const {data,error}=await sb.from('school_assessments').insert({title:title.value.trim(),subject:subject.value.trim(),class_id:classId.value||null,deadline:deadline.value?new Date(deadline.value).toISOString():null,created_by:teacher.id}).select().single();if(error)return alert(error.message);editQuestions(data.id)}
async function editQuestions(id){const {data:a,error:ae}=await sb.from('school_assessments').select('*').eq('id',id).eq('created_by',teacher.id).single();if(ae)return alert(ae.message);const {data:q}=await sb.from('school_questions').select('*').eq('assessment_id',id).order('question_order');document.getElementById('app').innerHTML=`<div class="card"><h2>📝 ${esc(a.title)}</h2><p class="muted">Add questions and marks. Student answer-upload will be connected in the next stage.</p><div id="qbox">${(q||[]).map(x=>questionEditor(x)).join('')}</div><div class="actions" style="margin-top:14px"><button onclick="addQuestionForm('${id}')">+ Add Question</button><button class="secondary" onclick="home()">Back</button></div></div>`}
function questionEditor(q){return `<div class="assignment"><label>Question ${q?.question_order||''}</label><textarea id="qt_${q?.id||'new'}" rows="3">${esc(q?.question_text||'')}</textarea><label>Marks</label><input id="qm_${q?.id||'new'}" type="number" min="0" step="0.5" value="${q?.marks??''}"><div class="actions"><button onclick="saveQuestion('${q?.id||''}','${q?.assessment_id||window.currentAssessment||''}')">Save Question</button>${q?.id?`<button class="danger" onclick="deleteQuestion('${q.id}')">Delete</button>`:''}</div></div>`}
let currentAssessment='';function addQuestionForm(id){currentAssessment=id;const box=document.getElementById('qbox');const n=box.querySelectorAll('.assignment').length+1;const div=document.createElement('div');div.className='assignment';div.innerHTML=questionEditor({question_order:n,assessment_id:id});box.appendChild(div)}
async function saveQuestion(id,aid){aid=aid||currentAssessment;if(!aid)return alert('Assessment not found.');const ta=document.getElementById('qt_'+(id||'new')),mi=document.getElementById('qm_'+(id||'new'));if(!ta?.value.trim())return alert('Enter the question.');if(id){const {error}=await sb.from('school_questions').update({question_text:ta.value.trim(),marks:Number(mi.value||0)}).eq('id',id);if(error)return alert(error.message)}else{const {data}=await sb.from('school_questions').select('question_order').eq('assessment_id',aid).order('question_order',{ascending:false}).limit(1);const order=(data?.[0]?.question_order||0)+1;const {error}=await sb.from('school_questions').insert({assessment_id:aid,question_order:order,question_text:ta.value.trim(),marks:Number(mi.value||0)});if(error)return alert(error.message)}await refreshQuestions(aid)}
async function refreshQuestions(id){currentAssessment=id;editQuestions(id)}
async function deleteQuestion(id){if(!confirm('Delete this question?'))return;const {error}=await sb.from('school_questions').delete().eq('id',id);if(error)return alert(error.message);location.reload()}
async function deleteAssessment(id){if(!confirm('Delete this assessment and its questions?'))return;const {error}=await sb.from('school_assessments').delete().eq('id',id).eq('created_by',teacher.id);if(error)return alert(error.message);home()}
async function manageStudents(){const {data}=await sb.from('profiles').select('full_name,roll_no,course').eq('role','student').order('full_name');document.getElementById('app').innerHTML=`<div class="card"><h2>👥 Students</h2><div class="notice">School students should have <b>SCHOOL</b> as their course. Students with JNVST-6/JNVST-9 will not be allowed into the School portal.</div>${(data||[]).map(s=>`<div class="assignment"><b>${esc(s.full_name)}</b><br><span class="muted">Roll No: ${esc(s.roll_no||'')} • Course: ${esc(s.course||'Not set')}</span></div>`).join('')||'<p>No students.</p>'}<button class="secondary" onclick="home()" style="margin-top:12px">Back</button></div>`}
async function manageClasses(){const {data}=await sb.from('classes').select('name,description').eq('teacher_id',teacher.id).order('name');document.getElementById('app').innerHTML=`<div class="card"><h2>🏫 My Classes</h2>${(data||[]).map(c=>`<div class="assignment"><b>${esc(c.name)}</b><div class="muted">${esc(c.description||'')}</div></div>`).join('')||'<p class="muted">No classes.</p>'}<button class="secondary" onclick="home()">Back</button></div>`}
async function logout(){await sb.auth.signOut();location.replace('teacher-login.html')}init();
</script></body></html>
